<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Lab - Levelup</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#f1f3f7; --border:#e1e4ea; --text:#1a1e27; --muted:#667085;
  --accent:#4f46e5; --accent-h:#4338ca; --accent-soft:#eceeff; --on-accent:#ffffff;
  --good:#137a4b; --good-bg:#e5f6ed; --bad:#c0362c; --bad-bg:#fdecea; --warn:#9a5b06; --warn-bg:#fff3de;
  --code-bg:#fbfbfd; --gutter:#f1f3f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
    --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
    --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
    --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
  --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
  --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
  --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
code{font-family:var(--mono);font-size:.9em;background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px;overflow-wrap:anywhere}
.sr-only{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---- header (same as bigo.html) ---- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px 16px;min-height:56px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.spacer{flex:1}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:thin;margin-left:8px}
.nav a{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

/* ---- shared controls (same as index.html) ---- */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.success{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--panel-2)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.kbd{font-family:var(--mono);font-size:10px;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}
.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 10px;min-height:34px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--panel-2);color:var(--muted)}
.pill.react{background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.tab:hover{background:var(--panel-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .count{font-size:11px;background:var(--panel-2);color:var(--muted);border-radius:99px;padding:0 6px}
.tab[aria-selected="true"] .count{background:var(--panel);color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.log{display:flex;gap:8px;padding:6px 10px;border-radius:8px;font:12.5px/1.5 var(--mono);border:1px solid transparent;margin-bottom:4px}
.log pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.log-log,.log-info,.log-debug{background:var(--panel-2)}
.log-warn{background:var(--warn-bg);color:var(--warn)}
.log-error{background:var(--bad-bg);color:var(--bad)}
.log-result{background:var(--accent-soft);color:var(--accent);font-weight:600}
.log-meta{color:var(--muted);padding-left:2px}
.spinner{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- layout ---- */
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);height:calc(100dvh - 56px);overflow:auto;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column}
.side-top{padding:14px 14px 10px;display:grid;gap:8px}
.side-top h2{margin:0;font-size:14px}
.progress-row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.lessons{list-style:none;margin:0;padding:4px 8px 8px;display:grid;gap:2px}
.litem{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:transparent;transition:background .12s}
.litem:hover{background:var(--panel-2)}
.litem[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.lnum{flex:none;display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);font-size:11px;font-weight:700;color:var(--muted)}
.lnum.done{background:var(--good);border-color:var(--good);color:#fff}
.lmain{display:grid;gap:1px;min-width:0}
.ltitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lmeta{font-size:11.5px;color:var(--text);opacity:.8}
.side-foot{margin-top:auto;padding:10px 14px 14px}
.content{min-width:0;padding:16px;display:grid;gap:16px;max-width:1320px;width:100%;margin:0 auto}
.content:focus{outline:none}
.content>*{min-width:0}
.sec{padding:18px 20px}
.sec h2{margin:0 0 8px;font-size:16px;letter-spacing:-.01em}
.sec p{margin:0 0 10px}
.lesson-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lesson-h h1{margin:0;font-size:22px;line-height:1.25;letter-spacing:-.01em}
.lesson-h .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.lesson-h .pager{margin-left:auto;display:flex;gap:6px}
.lesson-h .pill:not(.react){color:var(--text)}
.analogy{display:flex;gap:10px;margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--text)}
.analogy b{color:var(--accent);white-space:nowrap}

/* ---- lab ---- */
.lab{padding:0;overflow:hidden}
.lab-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.lab-head h2{margin:0;font-size:16px}
.lab-desc{padding:12px 16px;border-bottom:1px solid var(--border);display:grid;gap:8px;background:var(--panel)}
.lab-desc p{margin:0}
.lab-desc .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.symptom{display:flex;gap:8px;padding:8px 10px;border-radius:8px;background:var(--bad-bg);color:var(--text)}
.symptom b{color:var(--bad);white-space:nowrap}
.hintbox{padding:8px 10px;border-radius:8px;background:var(--warn-bg)}
.hintbox b{color:var(--warn)}
.solbox{border:1px solid var(--border);border-radius:10px;overflow:hidden}
.solbox-h{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel-2);border-bottom:1px solid var(--border);font-weight:600;font-size:12px}
.codeblock{margin:0;padding:10px 12px;background:var(--code-bg);font:12.5px/1.6 var(--mono);overflow:auto;white-space:pre;tab-size:2;max-height:280px}
.lab-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.ed-pane,.out-pane{min-width:0;display:flex;flex-direction:column}
.ed-pane{border-right:1px solid var(--border)}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);min-height:48px;flex-wrap:wrap}
.file{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.editor{--fs:13px;display:flex;height:470px;background:var(--code-bg);overflow:hidden;font:var(--fs)/1.6 var(--mono)}
.gutter{margin:0;flex:none;min-width:46px;padding:12px 10px 24px 8px;text-align:right;color:var(--muted);background:var(--gutter);border-right:1px solid var(--border);overflow:hidden;user-select:none;font:inherit;opacity:.9}
.code{flex:1;min-width:0;border:0;outline:none;resize:none;background:transparent;color:var(--text);padding:12px 14px;white-space:pre;overflow:auto;tab-size:2;font:inherit}
.editor:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.ed-hint{margin:0;padding:6px 12px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
.opts{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border)}
.switch{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px;cursor:pointer}
.switch input{width:16px;height:16px;accent-color:var(--accent);margin:0}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.preview{position:relative;height:210px;background:#fff;border-bottom:1px solid var(--border)}
.preview iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#fff}
.pv-state{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:16px;background:var(--panel);color:var(--muted)}
.pv-state strong{display:block;color:var(--text);margin-bottom:4px}
.pv-state.bad strong{color:var(--bad)}
.pv-state .btn{margin-top:10px}
.out-tabs{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border)}
.panels{position:relative;height:250px}
.panel{position:absolute;inset:0;overflow:auto;padding:10px 12px}
.note{margin:0 0 8px;padding:8px 10px;border-radius:8px;background:var(--panel-2);font-size:12.5px;color:var(--text)}
.note b{color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px}
.chip{display:inline-flex;gap:5px;align-items:center;padding:1px 8px;border-radius:99px;border:1px solid var(--border);background:var(--panel);font-size:12px}
.chip b{font-family:var(--mono);font-weight:600}
.chip i{font-style:normal;font-weight:700;color:var(--accent)}
.commit{margin:0 0 8px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.commit-h{padding:3px 10px;background:var(--panel-2);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text)}
.rl{display:flex;gap:8px;align-items:baseline;padding:4px 10px;font-size:12.5px;border-top:1px solid var(--border)}
.rl:first-of-type{border-top:0}
.rl b{font-family:var(--mono);font-weight:600;white-space:nowrap}
.rl .cnt{font-family:var(--mono);color:var(--accent);font-weight:700;white-space:nowrap}
.rl .why{color:var(--muted);min-width:0;overflow-wrap:anywhere}
.tag{display:inline-block;padding:0 6px;border-radius:99px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;background:var(--panel-2);color:var(--text)}
.tag.mount{background:var(--good-bg);color:var(--good)}
.tag.state{background:var(--accent-soft);color:var(--accent)}
.tag.context{background:var(--warn-bg);color:var(--warn)}
.tag.props,.tag.parent{background:var(--panel-2);color:var(--text)}
.ev{display:flex;gap:8px;align-items:baseline;padding:3px 6px;font:12.5px/1.5 var(--mono);border-radius:6px}
.ev:nth-child(odd){background:var(--panel-2)}
.ev .n{color:var(--text);min-width:2.2em;text-align:right}
.ev .k{font-weight:700;min-width:6.5em}
.ev.setup .k{color:var(--good)}
.ev.cleanup .k{color:var(--warn)}
.ev.mount .k{color:var(--accent)}
.ev.unmount .k{color:var(--bad)}
.ev.render{color:var(--text)}
.ev.render .k{font-weight:400}
.ev>span{min-width:0;overflow-wrap:anywhere}
.ev .d{color:var(--text)}
.summary{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:10px;border:1px solid var(--border);background:var(--panel-2)}
.summary.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
.summary.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.summary strong{font-size:14px;white-space:nowrap}
.summary .bar{flex:1;background:rgba(127,127,127,.2)}
.summary.bad .bar>i{background:var(--bad)}
.tcase{border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:8px;background:var(--panel)}
.tcase.pass{border-left:4px solid var(--good)}
.tcase.fail{border-left:4px solid var(--bad)}
.tcase.running{border-left:4px solid var(--accent)}
.tcase-h{display:flex;align-items:center;gap:8px}
.tname{font-weight:600}
.tbadge{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin-left:auto}
.tbadge.pass{background:var(--good-bg);color:var(--good)}
.tbadge.fail{background:var(--bad-bg);color:var(--bad)}
.tbadge.running{background:var(--accent-soft);color:var(--accent)}
.terr{margin:6px 0 0;font:12.5px/1.5 var(--mono);color:var(--bad);white-space:pre-wrap;word-break:break-word}
.placeholder{padding:18px;text-align:center;color:var(--muted)}
.placeholder strong{display:block;color:var(--text);margin-bottom:4px}

/* ---- recap + quiz ---- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.two h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.two ul{margin:0;padding-left:20px}
.two li{margin:4px 0}
.mistake{border:1px solid var(--border);border-left:4px solid var(--bad);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.mistake p{margin:4px 0 0!important;color:var(--muted)}
.quiz-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.quiz-h h2{margin:0}
.score{font-weight:700}
.q{margin:0 0 16px;padding:0;border:0;min-width:0}
.q legend{padding:0;font-weight:600;margin-bottom:8px}
.qopts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.qopt{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--panel);font-weight:500}
.qopt:hover:not([aria-disabled="true"]){background:var(--panel-2)}
.qopt[aria-disabled="true"]{cursor:default}
.qopt.right{border-color:var(--good);background:var(--good-bg);color:var(--good)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
.qopt .mark{font-size:11px;font-weight:700;white-space:nowrap}
.q-fb{margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--panel-2);font-size:13px}
.q-fb:empty{display:none}
.q-fb b{margin-right:4px}

/* ---- dialog + toast (same as index.html) ---- */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(720px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.dialog.narrow{width:min(420px,100%)}
.dialog-h{display:flex;align-items:center;padding:14px 16px 14px 20px;border-bottom:1px solid var(--border)}
.dialog-h h2{margin:0;font-size:16px}
.dialog-b{padding:16px 20px;overflow:auto}
.dialog-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px;border-top:1px solid var(--border);background:var(--panel-2)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:13px;animation:fade .2s;max-width:340px}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:1000px){
  .lab-grid{grid-template-columns:minmax(0,1fr)}
  .ed-pane{border-right:0;border-bottom:1px solid var(--border)}
  .editor{height:340px}
  .btn .kbd{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);overflow:visible}
  .side-top{padding:10px 16px 6px}
  .lessons{display:flex;overflow-x:auto;padding:4px 12px 10px;gap:6px;scrollbar-width:thin}
  .litem{width:auto;flex:none;border-color:var(--border);padding:6px 10px}
  .lmeta{display:none}
  .lessons>li{flex:none}
  .side-foot{margin-top:0;padding:0 16px 10px}
}
@media (max-width:720px){
  .topbar{flex-wrap:wrap;padding:8px 16px 6px}
  .nav{order:5;width:100%;margin-left:0;padding-bottom:2px}
}
@media (max-width:560px){
  .content{padding:16px}
  .sec{padding:14px}
  .lab-head,.lab-desc{padding:10px 12px}

  id:'useeffect', title:'useEffect', tag:'Effects',
  intro:'`useEffect` runs code **after** React has updated the screen. Use it to synchronise with things outside React: timers, subscriptions, network requests. The dependency array says when to re-run: `[]` means once after mount, `[id]` means after mount and whenever `id` changes, and no array means after every render. The function you return is the **cleanup**; React runs it before the next run of the effect and when the component unmounts. In development, `<StrictMode>` deliberately mounts, unmounts and mounts again to prove your cleanup works, so effects appear to fire twice.',
  analogy:'An effect is a magazine subscription. When you move house (the dependencies change) you must cancel the old delivery (cleanup) before signing up at the new address (setup). Forget to cancel and the magazines pile up at two addresses.',
  variants:[
    {id:'timer', label:'Timer with cleanup', tab:'effects', note:'Unmount the clock and watch the timeline: cleanup runs before the unmount finishes. Turn on StrictMode and re-run to see setup, cleanup, setup on mount.', code:`function Clock() {
  const [seconds, setSeconds] = useState(0);

  useEffect(() => {
    console.log('start timer');
    const id = setInterval(() => setSeconds(s => s + 1), 1000);
    return () => {
      console.log('stop timer'); // cleanup
      clearInterval(id);
    };
  }, [], 'timer'); // [] = set up once after mount

  return <p>Seconds: {seconds}</p>;
}

function App() {
  const [show, setShow] = useState(true);
  return (
    <div>
      <button onClick={() => setShow(!show)}>{show ? 'Unmount' : 'Mount'} clock</button>
      {show && <Clock />}
    </div>
  );
}
`},
    {id:'deps', label:'Dependencies', tab:'effects', note:'Click the count button, then type in the name box. Watch which effects run: no array = every render, [] = once, [name] = only when name changes.', code:`function App() {

  const [name, setName] = useState('Ada');

  useEffect(() => { console.log('A: every render'); }, undefined, 'A every render');
  useEffect(() => { console.log('B: once'); }, [], 'B once');
  useEffect(() => { console.log('C: name = ' + name); }, [name], 'C [name]');

  return (
    <div>
      <button onClick={() => setCount(count + 1)}>count {count}</button>{' '}

    {id:'fetch', label:'Fetch pattern', tab:'effects', note:'Click User 1 then quickly User 2. User 1 is slow, but the "ignore" flag set by the cleanup stops its late answer from overwriting User 2.', code:`const USERS = { 1: 'Ada Lovelace', 2: 'Grace Hopper', 3: 'Alan Turing' };

function fakeFetchUser(id) {
  // pretend network: user 1 is slow
  return new Promise(resolve =>
    setTimeout(() => resolve({ id, name: USERS[id] }), id === 1 ? 900 : 200)
  );
}

function Profile({ id }) {
  const [user, setUser] = useState(null);

  useEffect(() => {
    let ignore = false; // guards against out-of-order answers
    setUser(null);
    fakeFetchUser(id).then(u => { if (!ignore) setUser(u); });
    return () => { ignore = true; }; // runs before the next effect
  }, [id], 'fetch user');

  return <p>{user ? user.name : 'Loading...'}</p>;
}

function App() {

}
`}

LESSONS.push({
  id:'useref', title:'useRef', tag:'Refs',
  intro:'A ref is a box, `{ current: ... }`, that React keeps for the whole life of the component. Changing `ref.current` does **not** cause a re-render, which makes it ideal for values the screen does not display: timer ids, the previous value of something, "has this already happened?" flags. The other classic use is a **DOM ref**: write `ref={inputRef}` and after the component mounts, `inputRef.current` is the real DOM element, so you can call `.focus()`. Read and write `ref.current` inside event handlers and effects, not while rendering.',
  analogy:'A ref is a sticky note on your desk, while state is the whiteboard on the wall. Scribbling on the sticky note does not make the whole office look up; the whiteboard is what everyone sees. Use the note for private bookkeeping and the whiteboard for anything people must see.',
  variants:[
    {id:'dom', label:'DOM ref', tab:'preview', note:'The button reaches the real <input> through the ref. No state and no re-render is involved.', code:`function App() {
  const inputRef = useRef(null);

  return (
    <div>
      <input ref={inputRef} placeholder="Type here" aria-label="Demo input" />{' '}
      <button onClick={() => inputRef.current.focus()}>Focus the input</button>
    </div>
  );
}
`},
    {id:'instance', label:'Timer id & render count', tab:'renders', note:'Start and Stop use a ref for the interval id. The render count is also a ref: changing it never re-renders by itself.', code:`function App() {
  const [seconds, setSeconds] = useState(0);
  const timerId = useRef(null);
  const renders = useRef(0);
  renders.current += 1; // changing a ref never triggers a render

  function start() {

  }
  function stop() {
    clearInterval(timerId.current);
    timerId.current = null;
  }
  useEffect(() => stop, []); // stop on unmount

  return (
    <div>
      <p>Seconds: {seconds} (this component has rendered {renders.current} times)</p>
      <button onClick={start}>Start</button>{' '}
      <button onClick={stop}>Stop</button>

LESSONS.push({
  id:'usememo', title:'useMemo & useCallback', tag:'Performance',
  intro:'`useMemo` remembers the **result** of a calculation between renders and only recomputes when its dependencies change; `useCallback` remembers a **function** (it is `useMemo(() => fn)`). React creates every object and function literal again on each render, so a fresh `{}` or `() => {}` is never `===` the previous one. That only matters when something compares by reference: a `React.memo` child, a hook dependency array, or a context value. Treat both hooks as optimisations rather than correctness tools: use them when a calculation is really expensive or a stable reference is needed.',
  analogy:'`useMemo` is keeping a photocopy of a finished form: if none of the inputs changed, take the copy from the drawer instead of filling it in again. `useCallback` is keeping the same rubber stamp instead of carving a new one each morning, so the guard at the door recognises it.',

  );
}

LESSONS.push({
  id:'usereducer', title:'useReducer', tag:'State machines',
  intro:'`useReducer` is `useState` for state that changes in several related ways. You write a **pure** function, `reducer(state, action)`, that returns the next state, and components only describe what happened with `dispatch({ type: "add" })`. Because every transition lives in one place, it is easy to test and to refuse impossible moves, which is how you build small state machines such as idle, loading, done. A reducer must never mutate `state`: return a new object for a change, and return the same object when nothing should change.',

  console.log('reducer got', action.type);
  switch (action.type) {
    case 'inc': return { count: state.count + state.step };
    case 'dec': return { count: state.count - state.step };
    case 'step': return { ...state, step: action.step };
    case 'reset': return { count: 0, step: 1 };
    default: return state;
  }

function App() {

  intro:'Context lets a value skip the props relay race. A Provider high in the tree makes a value available, and any descendant can read it with `useContext`, however deep it sits. It is perfect for things many components need (theme, current user, language) and avoids "prop drilling" through components that do not care. The catch: every component that reads a context re-renders whenever the Provider\'s `value` changes (compared with `Object.is`). An inline `value={{ a, b }}` is a brand-new object on every render of the provider, so memoise it or split the context.',
  analogy:'Context is the PA system in a building. Instead of whispering a message down a chain of people (props), an announcement is heard in every room that is tuned in. The downside is that every listener is interrupted by every announcement, even one they do not care about.',
  variants:[
    {id:'theme', label:'Theme context', tab:'renders', note:'Toggle the theme: only the components that call useContext re-render (plus the provider\'s owner). Layout in the middle is skipped.', code:`const ThemeContext = createContext('light');

function Label() {
  const theme = useContext(ThemeContext);
  return <p>The current theme is <strong>{theme}</strong></p>;
}

const Layout = memo(function Layout({ children }) {
  return <section style={{ padding: 8, border: '1px dashed #999' }}>{children}</section>;
});

function App() {

function Greeting({ name }) { return <p>Hello, {name}!</p>; }
function Panel({ name }) { return <div><Greeting name={name} /></div>; }   // only relays the prop

function ContextGreeting() {
  const name = useContext(NameContext);
  return <p>Hello from context, {name}!</p>;

    '`createContext(default)` makes the context, `<Ctx.Provider value>` supplies it, `useContext(Ctx)` reads it.',

LESSONS.push({
  id:'customhooks', title:'Custom hooks', tag:'Reuse',
  intro:'A custom hook is just a function whose name starts with `use` and that calls other hooks. It lets you extract stateful **logic** (not UI) and reuse it: `useToggle`, `useDebounce` and `useFetch` hide the state, effects and cleanup behind a tiny API. Every component that calls a hook gets its own private copy of the state; two components using `useToggle` do not share a switch. The rules of hooks still apply, so call hooks at the top level, never inside conditions or loops.',
  analogy:'A custom hook is a recipe card. The card is shared by everyone in the building, but each cook (component) makes their own dish with their own ingredients. Two cooks using the same card do not share a pot.',
  variants:[
    {id:'toggle', label:'useToggle', tab:'renders', note:'Two Switch components call the same hook but each gets its own state.', code:`function useToggle(initial = false) {
  const [on, setOn] = useState(initial);
  const toggle = useCallback(() => setOn(v => !v), []);
  return [on, toggle];
}

function Switch({ label, startOn }) {
  const [on, toggle] = useToggle(startOn);
  return <button onClick={toggle}>{label}: {on ? 'ON' : 'OFF'}</button>;
}

function App() {
  return (
    <div>
      <Switch label="Wi-Fi" />{' '}
      <Switch label="Bluetooth" startOn={true} />
    </div>
  );
}
`},
    {id:'stored', label:'useStoredState', tab:'effects', note:'A useLocalStorage-style hook backed by a plain object (the sandbox has no storage). Type a name, click Remount and the value comes back.', code:`const memoryStore = {}; // stands in for localStorage inside the sandbox

function useStoredState(key, initial) {
  const [value, setValue] = useState(() => (key in memoryStore ? memoryStore[key] : initial));
  useEffect(() => { memoryStore[key] = value; }, [key, value], 'save ' + key);
  return [value, setValue];
}

function NameBox() {
  const [name, setName] = useStoredState('name', 'Ada');
  return <input aria-label="Name" value={name} onChange={e => setName(e.target.value)} />;
}

function App() {
  const [round, setRound] = useState(0);
  return (
    <div>
      <NameBox key={round} />{' '}
      <button onClick={() => setRound(round + 1)}>Remount (round {round})</button>
    </div>
  );
}
`},
    {id:'debounce', label:'useDebounce + useFetch', tab:'effects', note:'Type quickly: the search only starts 300 ms after you stop. The Effects tab shows the timer being cancelled and restarted.', code:`function useDebounce(value, delay) {
  const [debounced, setDebounced] = useState(value);
  useEffect(() => {
    const id = setTimeout(() => setDebounced(value), delay);
    return () => clearTimeout(id);
  }, [value, delay], 'debounce');
  return debounced;
}

const FRUIT = ['apple', 'apricot', 'banana', 'blueberry', 'cherry'];
function fakeSearch(q) {
  return new Promise(resolve =>
    setTimeout(() => resolve(FRUIT.filter(w => w.startsWith(q))), 150)
  );
}

function useFetch(fetcher, arg) {
  const [state, setState] = useState({ loading: true, data: null });
  useEffect(() => {
    let ignore = false;
    setState({ loading: true, data: null });
    fetcher(arg).then(data => { if (!ignore) setState({ loading: false, data }); });
    return () => { ignore = true; };
  }, [fetcher, arg], 'fetch');
  return state;
}

function App() {
  const [text, setText] = useState('a');
  const query = useDebounce(text, 300);
  const { loading, data } = useFetch(fakeSearch, query);
  return (
    <div>
      <input aria-label="Search" value={text} onChange={e => setText(e.target.value)} />
      <p>Searching for "{query}"</p>
      {loading ? <p>Loading...</p> : <ul>{data.map(w => <li key={w}>{w}</li>)}</ul>}
    </div>
  );
}
`}
  ],
  takeaways:[
    'A custom hook is a function named `useSomething` that calls other hooks.',
    'Hooks share logic, not state: each call site gets its own independent state.',
    'Put the effect, the cleanup and any refs inside the hook so callers cannot forget them.',
    'Return the smallest useful API (a pair, an object) and keep returned functions stable with `useCallback`.',
    'Everything from the rules of hooks still applies inside a custom hook: top level only, same order every render.'
  ],
  mistakes:[

    {bad:'Using an object created inside the hook as an effect dependency.', why:'A new object each render re-runs the effect each render, and if it also sets state you get an infinite loop.'}
  ],
  quiz:[
    {q:'Two components both call `useToggle()`. Do they share the same on/off value?', opts:['Yes, hooks are global','Only inside the same file','Only if they have the same name','No, each call has its own state'], a:3, why:'State belongs to the component instance that called the hook, not to the hook function.'},
    {q:'Why must a custom hook\'s name start with "use"?', opts:['React would not run it otherwise','Tools and lint rules can check the rules of hooks','It makes the hook faster','It is required by JavaScript'], a:1, why:'The prefix is a convention that lets linters (and readers) know the function follows the rules of hooks.'},

LESSONS.push({
  id:'rerender', title:'Why did it re-render?', tag:'Rendering',
  intro:'A component re-renders for a small set of reasons: its **own state** changed, a **context** it reads changed, or its **parent** re-rendered. Props are not an independent reason, because they only change when a parent renders. By default when a parent renders, all of its children render too, even with identical props. `React.memo` lets a child skip that when its props are shallow-equal. Re-rendering is usually cheap and is not a bug; the skill is being able to name the reason, and this lab\'s Render highlighter helps by flashing components and explaining the cause.',
  analogy:'Think of a classroom. If the teacher (parent) says "everyone redo the worksheet", every student redoes it, even if the worksheet is unchanged, unless a student (memo) checks "is this the same worksheet as last time?" and keeps the old answer. A student may also redo their own work (own state) or react when the school bell (context) rings.',

/* ==========================================================================
   Runner: owns the sandbox iframe lifecycle, the load timeout and the
   run / test watchdogs. Pure logic (no DOM) so it can be unit tested with a
   fake frame and fake timers.
   ========================================================================== */
/*@@RUNNER-START*/
function makeRunner(env){
  var frame=null, state='idle', waiters=[], loadT=null, job=null, seq=0;
  var LOAD_MS=env.loadMs||15000, RUN_MS=env.runMs||3000, TEST_MS=env.testMs||10000;
  function setState(s){ state=s; if(env.onState) env.onState(s); }
  function clr(t){ if(t!=null) env.clearTimeout(t); }
  function destroy(){
    clr(loadT); loadT=null;
    if(job) clr(job.timer);
    if(frame){ try{ frame.destroy(); }catch(e){} frame=null; }
  }
  function rejectWaiters(kind){ var w=waiters; waiters=[]; w.forEach(function(x){ x.rej({kind:kind}); }); }
  function fail(kind){ destroy(); setState(kind==='offline'?'offline':'stuck'); rejectWaiters(kind); }
  function ensure(){
    if(state==='ready'&&frame) return Promise.resolve();
    return new Promise(function(res,rej){
      waiters.push({res:res,rej:rej});
      if(state==='loading') return;
      destroy();
      setState('loading');
      frame=env.createFrame();
      loadT=env.setTimeout(function(){ loadT=null; fail('offline'); },LOAD_MS);
    });
  }
  function stuck(my){
    destroy();
    setState('stuck');
    if(job===my) job=null;
    my.cb.onDone({stuck:true,index:my.cur});
  }
  function cancel(){ if(job){ clr(job.timer); job=null; } }
  function armTest(my){ clr(my.timer); my.timer=env.setTimeout(function(){ if(job===my) stuck(my); },TEST_MS); }
  function run(payload,cb){
    cancel();
    var my=job={id:++seq,mode:'run',cb:cb,timer:null,cur:-1};
    ensure().then(function(){
      if(job!==my) return;
      frame.post(Object.assign({t:'run',id:my.id},payload));
      my.timer=env.setTimeout(function(){ if(job===my) stuck(my); },RUN_MS);
    },function(err){ if(job===my){ job=null; cb.onDone({offline:true,kind:err&&err.kind}); } });
    return my.id;
  }
  function test(payload,cb){
    cancel();
    var my=job={id:++seq,mode:'test',cb:cb,timer:null,cur:-1};
    ensure().then(function(){
      if(job!==my) return;
      frame.post(Object.assign({t:'test'},payload));
      armTest(my);
    },function(err){ if(job===my){ job=null; cb.onDone({offline:true,kind:err&&err.kind}); } });
    return my.id;
  }
  function deliver(m){
    if(!m||typeof m!=='object') return;
    if(m.t==='ready'){
      if(state==='loading'){ clr(loadT); loadT=null; setState('ready'); var w=waiters; waiters=[]; w.forEach(function(x){ x.res(); }); }
      if(env.onReady) env.onReady(m);
      return;
    }
    if(m.t==='loadfail'){ if(state==='loading') fail('offline'); return; }
    if(m.t==='log'){ if(env.onLog) env.onLog(m.level,m.text); return; }
    if(m.t==='instr'){ if(env.onInstr) env.onInstr(m); return; }
    var my=job;
    if(!my) return;
    if(my.mode==='run'){
      if(m.t==='rendered'&&m.id===my.id){ clr(my.timer); job=null; my.cb.onDone({ok:true}); }
      else if(m.t==='error'&&m.id===my.id){ clr(my.timer); job=null; my.cb.onDone({error:m.message}); }
    }else{
      if(m.t==='start'){ my.cur=m.i; armTest(my); if(my.cb.onStart) my.cb.onStart(m.i); }
      else if(m.t==='result'){ armTest(my); my.cb.onResult(m); }
      else if(m.t==='done'){ clr(my.timer); job=null; my.cb.onDone({ok:true}); }
      else if(m.t==='fatal'){ clr(my.timer); job=null; my.cb.onDone({fatal:m.message}); }
    }
  }
  return {
    run:run, test:test, deliver:deliver, cancel:cancel,
    retry:function(){ return ensure().then(function(){},function(){}); },
    frame:function(){ return frame; },
    state:function(){ return state; }
  };
}

/* Cheap pre-check for the most obvious never-ending loops. A same-process sandbox iframe cannot be
   interrupted by the parent, so we refuse to run these instead of freezing the tab. Everything else is
   caught by the 3 second watchdog above. */
function looksInfinite(code){
  var src=String(code), out='', i=0, n=src.length, c, d, q;
  while(i<n){
    c=src[i]; d=src[i+1];
    if(c==='/'&&d==='/'){ while(i<n&&src[i]!=='\n') i++; out+=' '; continue; }
    if(c==='/'&&d==='*'){ i+=2; while(i<n&&!(src[i]==='*'&&src[i+1]==='/')) i++; i+=2; out+=' '; continue; }
    if(c==='"'||c==="'"||c==='`'){
      q=c; i++;
      while(i<n&&src[i]!==q){ if(src[i]==='\\') i++; i++; }
      i++; out+='""'; continue;
    }
    out+=c; i++;
  }
  var re=/\b(?:while\s*\(\s*(?:true|1|!0)\s*\)|for\s*\(\s*;\s*;\s*\))\s*(\{|;)/g, m;
  while((m=re.exec(out))){
    if(m[1]===';') return true;
    var start=m.index+m[0].length, depth=1, j=start;
    while(j<out.length&&depth>0){ if(out[j]==='{') depth++; else if(out[j]==='}') depth--; j++; }
    var body=out.slice(start,depth===0?j-1:out.length);
    if(!/\b(?:break|return|throw)\b/.test(body)) return true;
  }
  return false;
}
/*@@RUNNER-END*/

const KEY_SHARED='code-playground:v1', KEY='code-playground:react:v1';
const memStore={};
function lsGet(k){
  if(Object.prototype.hasOwnProperty.call(memStore,k)) return memStore[k];

function lsSet(k,v){

  const obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};
  return {

    current:lessonById(o.current)?o.current:LESSONS[0].id,
    variant:obj(o.variant), code:obj(o.code), solved:obj(o.solved), quiz:obj(o.quiz),

  };
}

function quizAnswers(L){ const q=S.quiz[L.id]; return Array.isArray(q&&q.a)?q.a:[]; }
function lessonStats(L){
  const a=quizAnswers(L);

    solved:L.challenges.filter(c=>S.solved[c.id]).length,
    answered:L.quiz.filter((q,i)=>a[i]!=null).length,
    correct:L.quiz.filter((q,i)=>a[i]===q.a).length

let FRAME_SRC_CACHE=null;

function scheduleRender(name){

/* ==========================================================================
   Actions
   ========================================================================== */
function clearOutputs(){
  R.logs=[]; R.logsFull=false; R.commits=[]; R.totals={}; R.events=[];
}
function resetTests(){ R.tests={}; R.testCount=0; R.testState='idle'; R.testMsg=''; }
function runPayload(){ return {code:$('#code').value,name:'App',strict:S.strict,flash:S.renders}; }

function refuseLoop(){
  runner.cancel();
  setPv('stuck'); setStatus('Stuck');
  addLog('error','Your code seems stuck (infinite loop?). It has a loop with no way out (no break or return), so it was not run.');
  announce('Your code seems stuck. It has a loop that never ends, so it was not run.');
}
function doRun(){
  clearOutputs(); resetTests();
  if(looksInfinite($('#code').value)){ renderConsole(); renderTabs(); refuseLoop(); return; }
  setStatus('Running...');
  if(runner.state()==='ready') setPv('live');
  renderConsole(); renderRenders(); renderEffects(); renderTabs(); renderTests();
  const t0=performance.now();
  runner.run(runPayload(),{onDone(info){
    const ms=Math.round(performance.now()-t0);
    if(info.offline){ setPv('offline'); setStatus('React failed to load'); announce('React failed to load. Check your connection and press Retry.'); return; }
    if(info.stuck){
      setPv('stuck'); setStatus('Stuck');
      addLog('error','Your code seems stuck (infinite loop?). The preview was restarted; fix the loop and press Run again.');
      announce('Your code seems stuck. The preview was restarted.'); return;
    }
    setPv('live');
    if(info.error){ addLog('error',info.error); setStatus('Error'); announce('Render error: '+info.error.split('\n')[0]); return; }
    setStatus('Rendered in '+ms+' ms'); announce('Rendered.');
  }});
}

function doTests(){
  if(isEx()) return;
  const c=challenge();
  if(looksInfinite($('#code').value)){ resetTests(); R.testState='done'; R.testMsg='Your code seems stuck (infinite loop?)'; renderTests(); refuseLoop(); return; }
  resetTests(); R.testState='running'; R.testCount=c.tests.length; R.testBusy=true;
  setTab('tests'); setStatus('Running tests...'); renderTests();
  const finish=(state,msg)=>{ R.testBusy=false; R.testState=state; R.testMsg=msg||''; renderTests(); renderTabs(); };
  runner.test({code:$('#code').value,name:'App',tests:c.tests.map(t=>({name:t.name,script:t.script,strict:!!t.strict}))},{
    onStart(i){ R.tests[i]={running:true}; renderTests(); },
    onResult(r){ R.tests[r.i]={pass:!!r.pass,error:r.error,ms:r.ms}; renderTests(); renderTabs(); },
    onDone(info){
      if(info.offline){ finish('done','Could not run tests: React failed to load (offline?)'); setPv('offline'); setStatus('React failed to load'); announce('Tests could not run because React failed to load.'); return; }
      if(info.stuck){
        if(info.index>=0&&R.tests[info.index]) R.tests[info.index]={pass:false,error:'This test never finished: your code seems stuck (infinite loop?). The sandbox was restarted.'};
        finish('done','Your code seems stuck (infinite loop?)'); setPv('stuck'); setStatus('Stuck'); announce('Your code seems stuck. The sandbox was restarted.'); return;
      }
      if(info.fatal){ finish('done',info.fatal); setStatus('Could not run tests'); announce('Could not run tests: '+info.fatal); return; }
      const pass=Object.values(R.tests).filter(t=>t.pass).length, total=c.tests.length;
      finish('done');
      setPv('cleared'); setStatus(pass===total?'All tests passed':pass+'/'+total+' passed');
      if(pass===total){
        const first=!S.solved[c.id];
        S.solved[c.id]=true; save(); renderSidebar(); renderModes();
        if(first){ toast('Bug fixed! Nice work.'); }
        announce('All '+total+' tests passed. Bug solved.');
      }else announce(pass+' of '+total+' tests passed.');
    }
  });
}

function selectLesson(id,mode){
  if(!lessonById(id)) return;
  runner.cancel();
  S.current=id; save();
  R.mode=mode==null?'ex':mode; R.hint=false; R.solution=false; R.tab='console';
  clearOutputs(); resetTests(); setStatus('');
  renderAll();
  setTimeout(doRun,0);
}
function selectMode(mode){
  if(mode===R.mode) return;
  runner.cancel();
  R.mode=mode; R.hint=false; R.solution=false;
  if(mode==='ex'&&R.tab==='tests') R.tab='console';
  clearOutputs(); resetTests(); setStatus('');
  renderModes(); renderDesc(); renderEditor(); renderTabs(); renderConsole(); renderRenders(); renderEffects(); renderTests();
  setTimeout(doRun,0);
}
function selectVariant(id){
  const L=lesson();
  S.variant[L.id]=id; save();
  const v=variant(); if(v.tab&&v.tab!=='preview') R.tab=v.tab;
  runner.cancel(); clearOutputs(); setStatus('');
  renderDesc(); renderEditor(); renderTabs(); renderConsole(); renderRenders(); renderEffects();
  setTimeout(doRun,0);
}

/* --- modal dialogs (same look as index.html) --- */
function modal(html,{narrow=false}={}){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="dialog${narrow?' narrow':''}" role="dialog" aria-modal="true" aria-labelledby="dlg-title">${html}</div>`;
  const prev=document.activeElement;
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',onKey,true); if(prev&&prev.focus) prev.focus(); };
  const onKey=e=>{
    if(e.key==='Escape'){ e.stopPropagation(); close(); }
    else if(e.key==='Tab'){
      const f=$$('button,input,select,textarea,[href]',ov).filter(x=>!x.disabled&&!x.hidden);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  };
  document.addEventListener('keydown',onKey,true);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  ov.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) close(); });
  $('#modal-root').appendChild(ov);
  const first=$('button.btn.primary',ov)||$('button',ov); if(first) first.focus();
  return {el:ov,close};
}
const modalOpen=()=>!!$('#modal-root .overlay');
function confirmDialog(title,message,okLabel){
  return new Promise(res=>{
    const m=modal(`<div class="dialog-h"><h2 id="dlg-title">${esc(title)}</h2></div><div class="dialog-b"><p style="margin:0">${esc(message)}</p></div>
      <div class="dialog-f"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok-btn">${esc(okLabel||'OK')}</button></div>`,{narrow:true});
    let done=false;
    $('#ok-btn',m.el).addEventListener('click',()=>{ done=true; m.close(); res(true); });
    const obs=new MutationObserver(()=>{ if(!document.body.contains(m.el)){ obs.disconnect(); if(!done) res(false); } });
    obs.observe($('#modal-root'),{childList:true});
  });
}

/* --- editor key handling: Tab indent, Esc then Tab leaves, Enter keeps indentation --- */
function insertText(ta,text){
  ta.focus();
  let ok=false;
  try{ ok=document.execCommand('insertText',false,text); }catch(e){}
  if(!ok){ ta.setRangeText(text,ta.selectionStart,ta.selectionEnd,'end'); ta.dispatchEvent(new Event('input',{bubbles:true})); }
}
const lineStart=(v,i)=>i===0?0:v.lastIndexOf('\n',i-1)+1;
let escArmed=false;
function onEditorKey(e){
  if(e.key==='Escape'){ escArmed=true; announce('Editor focus released: press Tab to move to the next control.'); return; }
  if(e.key==='Shift'||e.key==='Control'||e.key==='Alt'||e.key==='Meta') return;
  if(e.key==='Tab'&&escArmed){ escArmed=false; return; }
  escArmed=false;
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing) return;
  const ta=e.target, s=ta.selectionStart, en=ta.selectionEnd, v=ta.value, k=e.key;
  if(k==='Tab'){
    e.preventDefault();
    if(s===en&&!e.shiftKey){ insertText(ta,'  '); return; }
    const ls=lineStart(v,s); let le=v.indexOf('\n',en); if(le<0) le=v.length;
    const block=v.slice(ls,le);
    const out=e.shiftKey?block.replace(/^( {1,2}|\t)/gm,''):block.replace(/^/gm,'  ');
    ta.setSelectionRange(ls,le); insertText(ta,out); ta.setSelectionRange(ls,ls+out.length);
    return;
  }
  if(k==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const indent=v.slice(lineStart(v,s),s).match(/^\s*/)[0], before=v[s-1];
    insertText(ta,'\n'+indent+(before&&'{[('.includes(before)?'  ':''));
  }
}

/* ==========================================================================
   Wire up
   ========================================================================== */
function init(){
  $('#logo').innerHTML=ic('code',18);
  applyTheme();
  $('#theme-btn').addEventListener('click',toggleTheme);
  try{ if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!theme) applyTheme(); }); }catch(e){}

  $('#lessons').addEventListener('click',e=>{ const b=e.target.closest('.litem'); if(b) selectLesson(b.dataset.id); });
  $('#lesson-head').addEventListener('click',e=>{
    const i=LESSONS.indexOf(lesson());
    if(e.target.closest('#prev-l')&&i>0) selectLesson(LESSONS[i-1].id);
    if(e.target.closest('#next-l')&&i<LESSONS.length-1) selectLesson(LESSONS[i+1].id);
  });
  $('#modes').addEventListener('click',e=>{ const b=e.target.closest('[data-mode]'); if(b) selectMode(b.dataset.mode==='ex'?'ex':+b.dataset.mode); });
  $('#lab-desc').addEventListener('click',async e=>{
    const v=e.target.closest('[data-variant]'); if(v){ selectVariant(v.dataset.variant); return; }
    if(e.target.closest('#hint-btn')){ R.hint=!R.hint; renderDesc(); return; }
    if(e.target.closest('#sol-btn')){
      if(R.solution){ R.solution=false; renderDesc(); return; }
      if(await confirmDialog('Show the solution?','Try the hint first: you learn more from fixing it yourself. Showing the solution does not mark the bug as solved.','Show solution')){ R.solution=true; renderDesc(); }
      return;
    }
    if(e.target.closest('#sol-copy')){ const ta=$('#code'); ta.value=challenge().solution; S.code[codeKey()]=ta.value; save(); updateGutter(true); toast('Solution copied into the editor'); }
  });
  $('#preview').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='retry'||b.dataset.act==='rerun') doRun();
  });

  const ta=$('#code');
  ta.addEventListener('keydown',onEditorKey);
  ta.addEventListener('blur',()=>{ escArmed=false; });
  let editT;
  ta.addEventListener('input',()=>{
    updateGutter();
    clearTimeout(editT);
    editT=setTimeout(()=>{ S.code[codeKey()]=ta.value; save(); },250);
  });
  ta.addEventListener('scroll',()=>{ $('#gutter').scrollTop=ta.scrollTop; });
  $('#run-btn').addEventListener('click',doRun);
  $('#test-btn').addEventListener('click',doTests);
  $('#reset-code').addEventListener('click',async()=>{
    if($('#code').value===starterCode()){ toast('Code is already the starter'); return; }
    if(await confirmDialog('Reset code?','Your edits to this code will be replaced with the original.','Reset')){
      delete S.code[codeKey()]; save(); renderEditor(); doRun();
    }
  });
  $('#opt-renders').addEventListener('change',e=>{
    S.renders=e.target.checked; save();
    const fr=runner.frame(); if(fr&&runner.state()==='ready') fr.post({t:'flash',on:S.renders});
    scheduleRender('renders');
    announce('Render flashes '+(S.renders?'on':'off'));
  });
  $('#opt-strict').addEventListener('change',e=>{
    S.strict=e.target.checked; save(); scheduleRender('effects'); announce('StrictMode '+(S.strict?'on':'off')+'. Re-running.'); doRun();
  });
  $('#tabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab); });
  $('#tabs').addEventListener('keydown',e=>{
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
    const t=$$('[data-tab]',$('#tabs')), i=t.findIndex(x=>x.dataset.tab===R.tab), n=(i+(e.key==='ArrowRight'?1:t.length-1))%t.length;
    setTab(t[n].dataset.tab); $('#tab-'+t[n].dataset.tab).focus(); e.preventDefault();
  });
  $('#panel-effects').addEventListener('click',e=>{
    const b=e.target.closest('[data-act]'); if(!b) return;
    if(b.dataset.act==='clear-events'){ R.events=[]; renderEffects(); renderTabs(); }
  });
  $('#panel-effects').addEventListener('change',e=>{
    if(e.target.dataset.act==='fx-renders'){ R.fxRenders=e.target.checked; renderEffects(); }
  });
  $('#panel-renders').addEventListener('click',e=>{
    if(e.target.closest('[data-act="clear-renders"]')){ R.commits=[]; renderRenders(); }
  });

  $('#quiz').addEventListener('click',e=>{
    if(e.target.closest('#quiz-reset')){ delete S.quiz[lesson().id]; save(); renderQuiz(); renderSidebar(); announce('Quiz reset.'); return; }
    const b=e.target.closest('.qopt'); if(!b||b.getAttribute('aria-disabled')==='true') return;
    const L=lesson(), qi=+b.dataset.q, oi=+b.dataset.o;
    const q=S.quiz[L.id]=S.quiz[L.id]||{a:[]};
    if(!Array.isArray(q.a)) q.a=[];
    while(q.a.length<L.quiz.length) q.a.push(null);
    q.a[qi]=oi; save();
    renderQuiz(); renderSidebar();
    const s=lessonStats(L), right=oi===L.quiz[qi].a;
    announce((right?'Correct. ':'Not quite. ')+L.quiz[qi].why.replace(/`/g,'')+(s.answered===L.quiz.length?' Quiz finished: '+s.correct+' out of '+L.quiz.length+'.':''));
  });
  $('#reset-progress').addEventListener('click',async()=>{
    if(await confirmDialog('Reset progress?','Solved bugs and quiz answers will be cleared. Your code edits are kept.','Reset progress')){
      S.solved={}; S.quiz={}; save(); renderSidebar(); renderModes(); renderDesc(); renderQuiz(); toast('Progress reset');
    }
  });
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!modalOpen()){ e.preventDefault(); if(e.shiftKey&&!isEx()) doTests(); else doRun(); }
  });

  setPv('idle');
  renderAll();
  setTimeout(doRun,0);
}
init();

</script>
