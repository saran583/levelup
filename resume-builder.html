<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Builder - Levelup</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#f1f3f7; --border:#e1e4ea; --text:#1a1e27; --muted:#667085;
  --accent:#4f46e5; --accent-h:#4338ca; --accent-soft:#eceeff; --on-accent:#ffffff;
  --good:#137a4b; --good-bg:#e5f6ed; --bad:#c0362c; --bad-bg:#fdecea; --warn:#9a5b06; --warn-bg:#fff3de;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);
  --paper-shadow:0 2px 6px rgba(16,24,40,.12),0 18px 40px rgba(16,24,40,.14);
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
    --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
    --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
    --paper-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
  --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
  --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  --paper-shadow:0 2px 6px rgba(0,0,0,.5),0 18px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

/* ---------- App chrome ---------- */
.app{display:grid;grid-template-rows:56px minmax(0,1fr);grid-template-columns:minmax(0,1fr);height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-sub{color:var(--muted);font-size:12px;padding-left:10px;border-left:1px solid var(--border);white-space:nowrap}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;margin-left:8px}
.nav a{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--panel-2)}
.btn.danger{color:var(--bad)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover:not(:disabled){background:var(--panel-2);color:var(--text)}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
.icon-btn.sm{width:26px;height:26px}

.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--border);border-radius:9px;padding:2px}
.seg button{height:28px;padding:0 12px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}

.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 10px;min-height:34px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{resize:vertical;min-height:72px;line-height:1.45}
.select{appearance:auto}
label.field{display:grid;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
label.field .input,label.field .textarea{font-weight:400;font-size:13px;color:var(--text)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}

/* ---------- Body ---------- */
.body{display:grid;grid-template-columns:minmax(360px,440px) minmax(0,1fr);min-height:0;min-width:0}
.form-pane{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-right:1px solid var(--border)}
.form-top{padding:12px 14px;border-bottom:1px solid var(--border);display:grid;gap:10px}
.form-top-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.form-scroll{overflow:auto;min-height:0;padding:10px 14px 40px}

.meter{display:grid;gap:6px}
.meter-head{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted)}
.meter-bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.meter-bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.tips{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.tips li{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.tips li::before{content:'';flex:0 0 6px;width:6px;height:6px;border-radius:50%;background:var(--warn);margin-top:6px}
.tips li.ok::before{background:var(--good)}

.section{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;background:var(--panel)}
.section-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;cursor:pointer;user-select:none}
.section-head h3{margin:0;font-size:13px;font-weight:700;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.section-head .count{font-size:11px;font-weight:600;color:var(--muted);background:var(--panel-2);border-radius:99px;padding:1px 7px}
.section-head .chev{transition:transform .15s;color:var(--muted)}
.section.open .section-head .chev{transform:rotate(180deg)}
.section-body{display:none;padding:4px 12px 12px;border-top:1px solid var(--border)}
.section.open .section-body{display:grid;gap:10px}
.hide-toggle{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
.hide-toggle input{margin:0}
.section.hidden-sec .section-head h3{color:var(--muted);text-decoration:line-through}

.form-scroll .entry{border:1px solid var(--border);border-radius:8px;background:var(--panel-2);padding:10px}
.form-scroll .entry-bar{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.form-scroll .entry-bar .name{flex:1;min-width:0;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.form-scroll .entry .grid .input,.form-scroll .entry .grid .textarea{background:var(--panel)}
.hint{font-size:11px;color:var(--muted);margin-top:-4px}

/* ---------- Preview ---------- */
.preview-pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.preview-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--panel);flex-wrap:wrap}
.preview-bar .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.tpl-list{display:flex;gap:6px;flex-wrap:wrap}
.tpl{display:grid;gap:4px;justify-items:center;padding:6px 8px 5px;border:1px solid var(--border);border-radius:8px;background:var(--panel);font-size:11px;font-weight:600;color:var(--muted);min-width:64px}
.tpl:hover{background:var(--panel-2)}
.tpl[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tpl .thumb{width:36px;height:46px;border-radius:3px;background:#fff;border:1px solid #d0d4dc;position:relative;overflow:hidden}
.thumb i{position:absolute;background:#c8ccd4;border-radius:1px}
.thumb.classic i:nth-child(1){left:8px;right:8px;top:5px;height:4px;background:#333}
.thumb.classic i:nth-child(2){left:5px;right:5px;top:12px;height:1px;background:#333}
.thumb.classic i:nth-child(3){left:5px;right:12px;top:18px;height:2px}
.thumb.classic i:nth-child(4){left:5px;right:8px;top:23px;height:2px}
.thumb.classic i:nth-child(5){left:5px;right:14px;top:30px;height:2px}
.thumb.classic i:nth-child(6){left:5px;right:9px;top:35px;height:2px}
.thumb.modern i:nth-child(1){left:0;right:0;top:0;height:12px;background:var(--tc,#2f4f7f)}
.thumb.modern i:nth-child(2){left:5px;right:14px;top:17px;height:2px;background:var(--tc,#2f4f7f)}
.thumb.modern i:nth-child(3){left:5px;right:8px;top:22px;height:2px}
.thumb.modern i:nth-child(4){left:5px;right:12px;top:27px;height:2px}
.thumb.modern i:nth-child(5){left:5px;right:14px;top:34px;height:2px;background:var(--tc,#2f4f7f)}
.thumb.modern i:nth-child(6){left:5px;right:9px;top:39px;height:2px}
.thumb.sidebar i:nth-child(1){left:0;top:0;bottom:0;width:12px;background:color-mix(in srgb,var(--tc,#2f4f7f) 18%,#fff)}
.thumb.sidebar i:nth-child(2){left:2px;right:2px;top:6px;height:2px;width:8px;background:var(--tc,#2f4f7f)}
.thumb.sidebar i:nth-child(3){left:16px;right:6px;top:6px;height:4px;background:#333}
.thumb.sidebar i:nth-child(4){left:16px;right:8px;top:15px;height:2px}
.thumb.sidebar i:nth-child(5){left:16px;right:12px;top:20px;height:2px}
.thumb.sidebar i:nth-child(6){left:16px;right:9px;top:28px;height:2px}
.thumb.minimal i:nth-child(1){left:5px;right:14px;top:6px;height:3px;background:#333}
.thumb.minimal i:nth-child(2){left:5px;right:20px;top:16px;height:1px;background:#e0e0e0}
.thumb.minimal i:nth-child(3){left:5px;right:8px;top:21px;height:2px;background:#ddd}
.thumb.minimal i:nth-child(4){left:5px;right:12px;top:26px;height:2px;background:#ddd}
.thumb.minimal i:nth-child(5){left:5px;right:20px;top:33px;height:1px;background:#e0e0e0}
.thumb.minimal i:nth-child(6){left:5px;right:9px;top:38px;height:2px;background:#ddd}
.thumb.compact i:nth-child(1){left:4px;right:18px;top:4px;height:3px;background:#333}
.thumb.compact i:nth-child(2){left:4px;right:4px;top:9px;height:1px;background:var(--tc,#2f4f7f)}
.thumb.compact i:nth-child(3){left:4px;right:6px;top:13px;height:2px}
.thumb.compact i:nth-child(4){left:4px;right:9px;top:17px;height:2px}
.thumb.compact i:nth-child(5){left:4px;right:6px;top:21px;height:2px}
.thumb.compact i:nth-child(6){left:4px;right:12px;top:25px;height:2px}

.style-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.swatches{display:flex;gap:5px;align-items:center}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--c)}
.swatch[aria-pressed="true"]{border-color:var(--text);box-shadow:0 0 0 2px var(--panel)}
.swatch.custom{position:relative;overflow:hidden;background:conic-gradient(#f66,#fc6,#6f9,#6cf,#c6f,#f66)}
.swatch.custom input{position:absolute;inset:-6px;opacity:0;cursor:pointer;width:200%;height:200%}
.range{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.range input{width:80px;accent-color:var(--accent)}

.preview-scroll{overflow:auto;min-height:0;padding:24px;display:flex;justify-content:center;align-items:flex-start}
.paper-wrap{position:relative;flex:0 0 auto}
.paper{transform-origin:top left;box-shadow:var(--paper-shadow)}

/* ---------- Resume (shared DOM, template = CSS) ---------- */
.resume{
  --rc:#2f4f7f; --rc-soft:#2f4f7f1a; --rfs:10.5pt; --rscale:1; --rsp:1;
  --rpad:14mm; /* top/bottom page margin, repeated on every printed page via thead/tfoot */
  --rpx:16mm;  /* left/right page margin */
  --rfont:Inter,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  width:210mm;min-height:297mm;background:#fff;color:#1c1c1c;position:relative;
  font-family:var(--rfont);font-size:calc(var(--rfs)*var(--rscale));line-height:1.4;
  padding:0;display:block
}
.resume *{box-sizing:border-box}
.resume a{color:inherit;text-decoration:none}
/* Page-margin table: thead/tfoot spacer rows repeat on every printed page */
.resume .page{width:100%;border-collapse:collapse;border-spacing:0}
.resume .page td{padding:0;vertical-align:top}
.resume .page thead{display:table-header-group}
.resume .page tfoot{display:table-footer-group}
.resume .pad{height:calc(var(--rpad)*var(--rsp))}
.resume .page td.content{padding:0 var(--rpx)}
.resume header{margin-bottom:calc(1.2em*var(--rsp));break-inside:avoid;break-after:avoid}
.resume h1{font-size:2.2em;line-height:1.1;margin:0 0 .15em;font-weight:700;letter-spacing:-.01em}
.resume .rtitle{font-size:1.15em;color:var(--rc);font-weight:600;margin:0 0 .5em}
.resume .contact{display:flex;flex-wrap:wrap;gap:.25em 1.1em;font-size:.92em;color:#444}
.resume .contact span{display:inline-flex;align-items:center;gap:.35em}
.resume .contact svg{width:.95em;height:.95em;flex:none;color:var(--rc)}
.resume .rbody{display:block}
.resume section{margin-bottom:calc(1.1em*var(--rsp))}
.resume section:last-child{margin-bottom:0}
.resume section.keep{break-inside:avoid}
.resume section h2{font-size:1.05em;text-transform:uppercase;letter-spacing:.08em;color:var(--rc);margin:0 0 .5em;padding-bottom:.25em;border-bottom:1.5px solid var(--rc);font-weight:700;break-after:avoid;break-inside:avoid}
.resume p{margin:0}
.resume .entry{margin-bottom:calc(.7em*var(--rsp));break-inside:avoid}
.resume .entry:last-child{margin-bottom:0}
.resume .ehead{display:flex;justify-content:space-between;gap:1em;align-items:baseline}
.resume .etitle{font-weight:700}
.resume .esub{color:#444}
.resume .esub a{color:var(--rc)}
.resume .edate{white-space:nowrap;color:#555;font-size:.92em}
.resume .emeta{font-size:.92em;color:#555;margin-top:.1em}
.resume ul{margin:.3em 0 0;padding-left:1.2em}
.resume li{margin:.15em 0;break-inside:avoid}
.resume .skill-row{display:flex;gap:.6em;margin:.2em 0;align-items:baseline;break-inside:avoid}
.resume .skill-row b{flex:0 0 10.5em;font-weight:700}
.resume .skill-row span{flex:1}
.resume .pill-list{display:flex;flex-wrap:wrap;gap:.35em}
.resume .pill{border:1px solid var(--rc);color:var(--rc);border-radius:99px;padding:.05em .6em;font-size:.9em}
.resume .empty{color:#98a2b3;text-align:center;padding:130mm 20mm;font-size:1.1em}

/* Classic — serif, centered header */
.resume[data-template="classic"]{--rfont:Georgia,"Times New Roman",Times,serif}
.resume[data-template="classic"] header{text-align:center;border-bottom:2px solid #222;padding-bottom:.7em}
.resume[data-template="classic"] h1{font-weight:700;letter-spacing:.01em}
.resume[data-template="classic"] .rtitle{color:#333;font-weight:600;font-style:italic}
.resume[data-template="classic"] .contact{justify-content:center;color:#333}
.resume[data-template="classic"] .contact svg{display:none}
.resume[data-template="classic"] section h2{color:#222;border-bottom:1px solid #222;letter-spacing:.12em;font-size:1em}
.resume[data-template="classic"] .esub a{color:#222;text-decoration:underline}
.resume[data-template="classic"] .pill{border-color:#222;color:#222;border-radius:2px}

/* Modern — accent header band (the repeating top spacer is also accent, so every page gets a slim band) */
.resume[data-template="modern"]{--rpad:8mm}
.resume[data-template="modern"] .page thead .pad{background:var(--rc)}
.resume[data-template="modern"] header{background:var(--rc);color:#fff;margin:0 calc(-1*var(--rpx)) calc(1.3em*var(--rsp));padding:calc(3mm*var(--rsp)) var(--rpx) 1.3em}
.resume[data-template="modern"] .rtitle{color:rgba(255,255,255,.9)}
.resume[data-template="modern"] .contact{color:rgba(255,255,255,.88)}
.resume[data-template="modern"] .contact svg{color:rgba(255,255,255,.88)}
.resume[data-template="modern"] section h2{border:0;padding:0 0 0 .75em;position:relative;font-size:1em}
.resume[data-template="modern"] section h2::before{content:'';position:absolute;left:0;top:.12em;width:.32em;height:.85em;background:var(--rc);border-radius:2px}
.resume[data-template="modern"] .edate{color:var(--rc);font-weight:600}

/* Sidebar — two columns; the tint is painted on the paper itself so it reaches every page edge */
.resume[data-template="sidebar"]{--rpx:0;--rpad:12mm;background:linear-gradient(90deg,var(--rc-soft) 0 64mm,#fff 64mm)}
.resume[data-template="sidebar"] header{padding:0 14mm 1em;margin:0}
.resume[data-template="sidebar"] .rbody{display:grid;grid-template-columns:64mm minmax(0,1fr);gap:0}
.resume[data-template="sidebar"] .rside{padding:1.2em 8mm 0 14mm}
.resume[data-template="sidebar"] .rmain{padding:1.2em 14mm 0 9mm}
.resume[data-template="sidebar"] .rside section h2{font-size:.95em}
.resume[data-template="sidebar"] .skill-row{flex-direction:column;gap:.05em}
.resume[data-template="sidebar"] .skill-row b{flex:none}
.resume[data-template="sidebar"] .rside .entry{margin-bottom:.6em}
.resume[data-template="sidebar"] .rside .ehead{flex-direction:column;gap:0}

/* Minimal — whitespace, ATS-safe */
.resume[data-template="minimal"]{--rfont:"Helvetica Neue",Helvetica,Arial,sans-serif;color:#222;--rpad:18mm;--rpx:18mm}
.resume[data-template="minimal"] h1{font-weight:600;font-size:2em}
.resume[data-template="minimal"] .rtitle{color:#555;font-weight:500}
.resume[data-template="minimal"] .contact{color:#666}
.resume[data-template="minimal"] .contact svg{display:none}
.resume[data-template="minimal"] section{margin-bottom:calc(1.5em*var(--rsp))}
.resume[data-template="minimal"] section h2{color:#111;border-bottom:1px solid #ddd;font-size:.82em;letter-spacing:.16em;font-weight:600;padding-bottom:.4em;margin-bottom:.7em}
.resume[data-template="minimal"] .edate,.resume[data-template="minimal"] .esub{color:#666}
.resume[data-template="minimal"] .pill{border-color:#ccc;color:#333}
.resume[data-template="minimal"] .esub a{color:#333}

/* Compact — dense for long careers */
.resume[data-template="compact"]{--rfs:9.6pt;--rpad:10mm;--rpx:12mm;line-height:1.32}
.resume[data-template="compact"] header{display:flex;justify-content:space-between;align-items:flex-end;gap:1em;border-bottom:2px solid var(--rc);padding-bottom:.45em;margin-bottom:.9em}
.resume[data-template="compact"] h1{font-size:1.9em;margin:0}
.resume[data-template="compact"] .rtitle{margin:0;font-size:1.05em}
.resume[data-template="compact"] .contact{flex-direction:column;align-items:flex-end;gap:.05em;text-align:right;flex:none}
.resume[data-template="compact"] section{margin-bottom:calc(.75em*var(--rsp))}
.resume[data-template="compact"] section h2{font-size:.92em;margin-bottom:.3em;padding-bottom:.15em;border-bottom-width:1px}
.resume[data-template="compact"] .entry{margin-bottom:calc(.45em*var(--rsp))}
.resume[data-template="compact"] ul{margin-top:.15em}
.resume[data-template="compact"] li{margin:.05em 0}
.resume[data-template="compact"] .skill-row{margin:.05em 0}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;top:68px;transform:translateX(-50%);z-index:50;max-width:min(560px,calc(100vw - 32px));background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;gap:12px;align-items:flex-start;font-size:13px;line-height:1.45}
.toast[hidden]{display:none}
.toast .txt{flex:1}
.toast .txt b{display:block;margin-bottom:2px}
.toast .actions{display:flex;gap:6px;flex:none}

/* ---------- Mobile ---------- */
.mobile-tabs{display:none}
@media screen and (max-width:900px){
  .app{grid-template-rows:56px 40px minmax(0,1fr)}
  .brand-name,.brand-sub,.nav{display:none}
  .mobile-tabs{display:flex;gap:2px;padding:4px 8px;background:var(--panel);border-bottom:1px solid var(--border)}
  .mobile-tabs button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600}
  .mobile-tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
  .body{grid-template-columns:minmax(0,1fr)}
  .form-pane{border-right:0}
  .body[data-view="preview"] .form-pane{display:none}
  .body[data-view="form"] .preview-pane{display:none}
  .grid{grid-template-columns:1fr}
  .preview-scroll{padding:16px}
  .topbar{padding:0 12px;gap:6px}
  .btn .txt{display:none}
  .btn{padding:0 10px}
}

/* ---------- Print ---------- */
@page{size:A4;margin:0}
@media print{
  html,body{background:#fff;height:auto}
  .app{display:block;height:auto}
  .topbar,.mobile-tabs,.form-pane,.preview-bar,.toast{display:none!important}
  .body,.body[data-view]{display:block}
  .preview-pane,.body[data-view] .preview-pane{display:block!important}
  .preview-scroll{padding:0;display:block;overflow:visible}
  .paper-wrap{height:auto!important;width:auto!important}
  .paper{transform:none!important;box-shadow:none}
  .resume{min-height:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .resume .page thead{display:table-header-group}
  .resume .page tfoot{display:table-footer-group}
  /* Sidebar tint: a fixed-position strip is repeated by the browser on every printed page and, unlike the
     page canvas, honours print-color-adjust even when "Background graphics" is off in the print dialog.
     It sits at z-index 0 with the content table lifted to z-index 1, so it paints above the paper box but
     below the text. */
  .resume[data-template="sidebar"]{background:transparent}
  .resume[data-template="sidebar"]::before{content:"";position:fixed;left:0;top:0;bottom:0;width:64mm;background:var(--rc-soft);z-index:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .resume[data-template="sidebar"] .page{position:relative;z-index:1}
}

/* Opaque 12% tint of a hex colour over white (opaque so stacked layers don't darken) */
function soften(hex){
  const m=/^#?([0-9a-f]{6})$/i.exec(hex||''); if(!m) return '#e8ecf3';
  const n=parseInt(m[1],16), ch=s=>Math.round(((n>>s)&255)*0.12+255*0.88).toString(16).padStart(2,'0');
  return '#'+ch(16)+ch(8)+ch(0);
}

/* ---------- Path helpers ---------- */
function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?a:a[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); let cur=o; ks.slice(0,-1).forEach(k=>{ if(cur[k]==null) cur[k]={}; cur=cur[k]; }); cur[ks.at(-1)]=v; }

/* ---------- Form rendering ---------- */
function fieldHtml(path,f,val){
  const id='f_'+path.replace(/\W/g,'_');
  const cls=f.full?'field full':'field';
  if(f.type==='textarea') return `<label class="${cls}" for="${id}">${esc(f.l)}<textarea class="textarea" id="${id}" data-path="${path}" placeholder="${esc(f.ph||'')}" rows="${f.rows||3}">${esc(val)}</textarea></label>`;
  return `<label class="${cls}" for="${id}">${esc(f.l)}<input class="input" id="${id}" data-path="${path}" type="${f.type||'text'}" placeholder="${esc(f.ph||'')}" value="${esc(val)}"></label>`;
}
function sectionShell(key,title,inner,{count,hideable=true}={}){
  const open=!S.collapsed[key];
  const hidden=!!S.hidden[key];
  return `<div class="section${open?' open':''}${hidden?' hidden-sec':''}" data-sec="${key}">
    <div class="section-head" role="button" tabindex="0" aria-expanded="${open}">
      <h3>${esc(title)}${count!=null?`<span class="count">${count}</span>`:''}</h3>
      ${hideable?`<label class="hide-toggle" title="Hide this section on the resume" onclick="event.stopPropagation()"><input type="checkbox" data-hide="${key}" ${hidden?'checked':''}> Hide</label>`:''}
      <span class="chev">${ic('chev',16)}</span>
    </div>
    <div class="section-body">${inner}</div>
  </div>`;
}
function renderForm(){
  const P=S.personal;
  const personalFields=[
    {k:'name',l:'Full name',ph:'Ananya Reddy'},{k:'title',l:'Headline / target role',ph:S.mode==='fresher'?'Software Engineer (Fresher)':'Senior Full-Stack Engineer'},
    {k:'email',l:'Email',ph:'you@example.com',type:'email'},{k:'phone',l:'Phone',ph:'+91 98765 43210'},
    {k:'location',l:'Location',ph:'Hyderabad, India'},{k:'website',l:'Portfolio / website',ph:'yourname.dev'},
    {k:'linkedin',l:'LinkedIn',ph:'linkedin.com/in/you'},{k:'github',l:'GitHub',ph:'github.com/you'},
  ];
  let html=sectionShell('personal','Personal details',`<div class="grid">${personalFields.map(f=>fieldHtml('personal.'+f.k,f,P[f.k])).join('')}</div>`,{hideable:false});

  for(const key of ORDER[S.mode]){
    if(TEXT_SECTIONS[key]){
      const t=TEXT_SECTIONS[key];
      const inner=`<p class="hint">${esc(t[S.mode])}</p>`+fieldHtml(key,{l:label(key),type:'textarea',ph:t.ph[S.mode],rows:key==='summary'?4:3,full:true},S[key]);
      html+=sectionShell(key,label(key),inner,{count:key==='summary'?null:lines(S[key]).length||null});
      continue;
    }
    const def=LISTS[key]; const arr=S[key];
    const entries=arr.map((e,i)=>`<div class="entry" data-idx="${i}">
      <div class="entry-bar">
        <span class="name">${esc(def.name(e))}</span>
        <button class="icon-btn sm" data-act="up" data-key="${key}" data-idx="${i}" title="Move up" ${i===0?'disabled':''}>${ic('up',14)}</button>
        <button class="icon-btn sm" data-act="down" data-key="${key}" data-idx="${i}" title="Move down" ${i===arr.length-1?'disabled':''}>${ic('down',14)}</button>
        <button class="icon-btn sm" data-act="del" data-key="${key}" data-idx="${i}" title="Remove">${ic('trash',14)}</button>
      </div>
      <div class="grid">${def.fields.map(f=>fieldHtml(`${key}.${i}.${f.k}`,f,e[f.k]??'')).join('')}</div>
    </div>`).join('');
    const inner=(def.hint?`<p class="hint">${esc(def.hint)}</p>`:'')+entries+`<button class="btn sm" data-act="add" data-key="${key}">${ic('plus',14)} Add ${esc(label(key).replace(/^(Key |Technical )/,'').toLowerCase().replace(/s$/,''))}</button>`;
    html+=sectionShell(key,label(key),inner,{count:arr.length||null});
  }
  $('#form').innerHTML=html;
}

/* ---------- Resume rendering ---------- */
function linkHref(u){ if(!u) return ''; return /^https?:\/\//i.test(u)?u:'https://'+u; }
function linkText(u){ return String(u||'').replace(/^https?:\/\//i,'').replace(/\/$/,''); }
function dateRange(a,b){ return [a,b].filter(Boolean).join(' – '); }
function bulletsHtml(s){ const l=lines(s); return l.length?`<ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''; }

function renderSection(key){
  if(S.hidden[key]) return '';
  const h=`<h2>${esc(label(key))}</h2>`;
  switch(key){
    case 'summary': return S.summary.trim()?`<section data-sec="summary">${h}<p>${esc(S.summary)}</p></section>`:'';
    case 'experience':{
      const a=S.experience.filter(e=>e.role||e.company); if(!a.length) return '';
      return `<section>${h}${a.map(e=>`<div class="entry">
        <div class="ehead"><div><span class="etitle">${esc(e.role)}</span>${e.company?`<span class="esub"> — ${esc(e.company)}</span>`:''}</div><span class="edate">${esc(dateRange(e.start,e.end))}</span></div>
        ${e.location?`<div class="emeta">${esc(e.location)}</div>`:''}${bulletsHtml(e.bullets)}</div>`).join('')}</section>`;
    }
    case 'education':{
      const a=S.education.filter(e=>e.degree||e.school); if(!a.length) return '';
      return `<section>${h}${a.map(e=>`<div class="entry">
        <div class="ehead"><div><span class="etitle">${esc(e.degree)}</span>${e.school?`<span class="esub"> — ${esc(e.school)}</span>`:''}</div><span class="edate">${esc(dateRange(e.start,e.end))}</span></div>
        ${(e.location||e.grade)?`<div class="emeta">${[e.location,e.grade].filter(Boolean).map(esc).join(' · ')}</div>`:''}${bulletsHtml(e.details)}</div>`).join('')}</section>`;
    }
    case 'projects':{
      const a=S.projects.filter(e=>e.name); if(!a.length) return '';
      return `<section>${h}${a.map(e=>`<div class="entry">
        <div class="ehead"><div><span class="etitle">${esc(e.name)}</span>${e.link?`<span class="esub"> — <a href="${esc(linkHref(e.link))}">${esc(linkText(e.link))}</a></span>`:''}</div><span class="edate">${esc(dateRange(e.start,e.end))}</span></div>
        ${e.tech?`<div class="emeta">${esc(e.tech)}</div>`:''}${bulletsHtml(e.bullets)}</div>`).join('')}</section>`;
    }
    case 'skills':{
      const a=S.skills.filter(e=>csv(e.items).length); if(!a.length) return '';
      return `<section>${h}${a.map(e=>`<div class="skill-row">${e.group?`<b>${esc(e.group)}</b>`:''}<span>${csv(e.items).map(esc).join(', ')}</span></div>`).join('')}</section>`;
    }
    case 'certifications':{
      const a=S.certifications.filter(e=>e.name); if(!a.length) return '';
      return `<section>${h}${a.map(e=>`<div class="entry">
        <div class="ehead"><div><span class="etitle">${e.link?`<a href="${esc(linkHref(e.link))}">${esc(e.name)}</a>`:esc(e.name)}</span>${e.issuer?`<span class="esub"> — ${esc(e.issuer)}</span>`:''}</div><span class="edate">${esc(e.year)}</span></div></div>`).join('')}</section>`;
    }
    case 'languages':{
      const l=lines(S.languages); if(!l.length) return '';
      return `<section>${h}<div class="pill-list">${l.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div></section>`;
    }
    case 'achievements': case 'extracurricular':{
      const l=lines(S[key]); if(!l.length) return '';
      return `<section>${h}<ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`;
    }
  }
  return '';
}
function renderResume(){
  const R=$('#resume'); const P=S.personal;
  R.dataset.template=S.template;
  document.documentElement.dataset.rtpl=S.template;
  R.style.setProperty('--rc',S.accent);
  R.style.setProperty('--rc-soft',soften(S.accent));
  R.style.setProperty('--rscale',String(S.fs/100));
  R.style.setProperty('--rsp',String(S.sp/100));
  $$('.thumb').forEach(t=>t.style.setProperty('--tc',S.accent));

  const contact=[
    P.email&&`<span>${ic('mail')}<a href="mailto:${esc(P.email)}">${esc(P.email)}</a></span>`,
    P.phone&&`<span>${ic('phone')}${esc(P.phone)}</span>`,
    P.location&&`<span>${ic('pin')}${esc(P.location)}</span>`,
    P.website&&`<span>${ic('link')}<a href="${esc(linkHref(P.website))}">${esc(linkText(P.website))}</a></span>`,
    P.linkedin&&`<span>${ic('linkedin')}<a href="${esc(linkHref(P.linkedin))}">${esc(linkText(P.linkedin))}</a></span>`,
    P.github&&`<span>${ic('github')}<a href="${esc(linkHref(P.github))}">${esc(linkText(P.github))}</a></span>`,
  ].filter(Boolean).join('');

  const hasAny=P.name||P.title||contact||ORDER[S.mode].some(k=>renderSection(k));
  if(!hasAny){ R.innerHTML=`<p class="empty">Fill in the form or click <b>Load sample</b> to see your resume here.</p>`; fitPaper(); updateMeter(); return; }

  // Sections in DOM order (block flow fragments cleanly across printed pages).
  // Short sections (skills, certifications, languages) are marked .keep so they never split.
  const main=[],side=[];
  for(const k of ORDER[S.mode]){
    let html=renderSection(k); if(!html) continue;
    if(SIDE.has(k)) html=html.replace('<section','<section class="keep"');
    (S.template==='sidebar'&&SIDE.has(k)?side:main).push(html);
  }
  const body=S.template==='sidebar'
    ?`<div class="rbody"><div class="rside">${side.join('')}</div><div class="rmain">${main.join('')}</div></div>`
    :`<div class="rbody">${main.join('')}</div>`;

  R.innerHTML=`<table class="page"><thead><tr><td class="pad"></td></tr></thead><tbody><tr><td class="content">
    <header>
      <div><h1>${esc(P.name)||'&nbsp;'}</h1>${P.title?`<p class="rtitle">${esc(P.title)}</p>`:''}</div>
      <div class="contact">${contact}</div>
    </header>
    ${body}
    </td></tr></tbody><tfoot><tr><td class="pad"></td></tr></tfoot></table>`;
  fitPaper(); updateMeter();
}

/* ---------- Strength meter ---------- */
function updateMeter(){
  const P=S.personal, checks=[];
  const add=(ok,msg)=>checks.push({ok,msg});
  add(!!P.name&&!!P.email&&!!P.phone,'Name, email and phone are filled in');
  add(!!(P.linkedin||P.github||P.website),'Add a LinkedIn, GitHub or portfolio link');
  add(S.summary.trim().split(/\s+/).filter(Boolean).length>=25,S.mode==='fresher'?'Write a 2–3 line career objective':'Write a 3–4 line professional summary');
  if(S.mode==='experienced'){
    add(S.experience.some(e=>e.role&&lines(e.bullets).length>=2),'Add work experience with at least 2 highlights each');
  }else{
    add(S.education.some(e=>e.degree&&e.school),'Add your degree and institution');
    add(S.projects.filter(e=>e.name).length>=2,'Add at least 2 projects — they stand in for experience');
  }
  add(S.skills.some(e=>csv(e.items).length>=3),'List skills grouped by category');
  const allBullets=[...S.experience,...S.projects].flatMap(e=>lines(e.bullets));
  const quantified=allBullets.filter(b=>/\d/.test(b)).length;
  add(allBullets.length>0&&quantified/allBullets.length>=0.4,allBullets.length?`Quantify impact — ${quantified} of ${allBullets.length} highlights include a number`:'Add highlights with numbers (%, users, time saved)');
  const verbs=/^(built|led|designed|developed|created|implemented|improved|reduced|increased|delivered|owned|shipped|migrated|automated|optimi[sz]ed|launched|mentored|architected|drove|cut|wrote|fixed|introduced|solved|won|organi[sz]ed|converted|added|maintained|analy[sz]ed|managed|coordinated|integrated|refactored|deployed|tested)\b/i;
  add(allBullets.length>0&&allBullets.filter(b=>verbs.test(b)).length/allBullets.length>=0.6,'Start highlights with an action verb (Built, Led, Reduced…)');
  const totalBullets=allBullets.length+lines(S.achievements).length+lines(S.extracurricular).length;
  add(totalBullets<=28,'Keep it tight — aim for one page (two for 8+ years)');

  const pct=Math.round(checks.filter(c=>c.ok).length/checks.length*100);
  $('#meter-pct').textContent=pct+'%';
  $('#meter-fill').style.width=pct+'%';
  $('#meter-fill').style.background=pct>=80?'var(--good)':pct>=50?'var(--accent)':'var(--warn)';
  $('#tips').innerHTML=checks.filter(c=>!c.ok).slice(0,4).map(c=>`<li>${esc(c.msg)}</li>`).join('')||`<li class="ok">Looks strong. Proofread once, then download.</li>`;
}

/* ---------- Preview fit ---------- */
function fitPaper(){
  const wrap=$('#paper-wrap'), paper=$('#resume'), scroll=$('#preview-scroll');
  const avail=scroll.clientWidth-parseFloat(getComputedStyle(scroll).paddingLeft)*2;
  const w=paper.offsetWidth||794;
  const scale=Math.min(1,avail/w);
  paper.style.transform=`scale(${scale})`;
  wrap.style.width=(w*scale)+'px';
  wrap.style.height=(paper.offsetHeight*scale)+'px';
}

/* ---------- Toolbar rendering ---------- */
function renderTemplates(){
  $('#tpl-list').innerHTML=TEMPLATES.map(t=>`<button class="tpl" data-tpl="${t.id}" aria-pressed="${S.template===t.id}"><span class="thumb ${t.id}"><i></i><i></i><i></i><i></i><i></i><i></i></span>${t.name}</button>`).join('');
  $('#swatches').innerHTML=ACCENTS.map(c=>`<button class="swatch" data-accent="${c}" style="--c:${c}" aria-pressed="${S.accent===c}" title="${c}"></button>`).join('')+
    `<span class="swatch custom" title="Custom colour"><input type="color" id="custom-accent" value="${ACCENTS.includes(S.accent)?ACCENTS[0]:S.accent}"></span>`;
  $('#fs').value=S.fs; $('#sp').value=S.sp;
  $$('.seg [data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.mode)));
}

/* ---------- Theme ---------- */
const isDark=()=>S.theme?S.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
function applyTheme(){
  if(S.theme) document.documentElement.dataset.theme=S.theme; else delete document.documentElement.dataset.theme;
  $('#theme-btn').innerHTML=ic(isDark()?'sun':'moon',18);
  $('#theme-btn').title=isDark()?'Switch to light theme':'Switch to dark theme';
}

/* ---------- Actions ---------- */
let toastT;
function toast(html,{open=false,ms=9000}={}){
  $('#toast-txt').innerHTML=html; $('#toast-open').hidden=!open; $('#toast').hidden=false;
  clearTimeout(toastT); if(ms) toastT=setTimeout(()=>{ $('#toast').hidden=true; },ms);
}
function rerenderAll(){ renderForm(); renderTemplates(); renderResume(); save(); }
function download(name,text,type='application/json'){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

function bind(){
  // Form: live text binding (no re-render → keeps focus)
  $('#form').addEventListener('input',e=>{
    const p=e.target.dataset.path; if(!p) return;
    setPath(S,p,e.target.value);
    // Keep entry title in sync
    const entry=e.target.closest('.entry'); if(entry){ const key=entry.closest('.section').dataset.sec; const def=LISTS[key]; if(def) $('.name',entry).textContent=def.name(S[key][+entry.dataset.idx]); }
    if(p==='personal.name') fitPaper();
    save(); renderResume();
  });
  $('#form').addEventListener('change',e=>{
    const h=e.target.dataset.hide; if(h==null) return;
    S.hidden[h]=e.target.checked; e.target.closest('.section').classList.toggle('hidden-sec',e.target.checked); save(); renderResume();
  });
  $('#form').addEventListener('click',e=>{
    const head=e.target.closest('.section-head');
    if(head&&!e.target.closest('.hide-toggle')){ const sec=head.parentElement, key=sec.dataset.sec; S.collapsed[key]=!S.collapsed[key]; sec.classList.toggle('open',!S.collapsed[key]); head.setAttribute('aria-expanded',String(!S.collapsed[key])); save(); return; }
    const btn=e.target.closest('[data-act]'); if(!btn) return;
    const {act,key}=btn.dataset, i=+btn.dataset.idx, arr=S[key];
    if(act==='add'){ arr.push({...LISTS[key].empty}); S.collapsed[key]=false; }
    else if(act==='del'){ arr.splice(i,1); }
    else if(act==='up'&&i>0){ [arr[i-1],arr[i]]=[arr[i],arr[i-1]]; }
    else if(act==='down'&&i<arr.length-1){ [arr[i+1],arr[i]]=[arr[i],arr[i+1]]; }
    renderForm(); save(); renderResume();
    if(act==='add'){ const last=$(`.section[data-sec="${key}"] .entry:last-of-type input`); last?.focus(); }
  });
  $('#form').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('section-head')){ e.preventDefault(); e.target.click(); } });

  // Mode
  $$('.seg [data-mode]').forEach(b=>b.addEventListener('click',()=>{ S.mode=b.dataset.mode; rerenderAll(); }));

  // Templates / style
  $('#tpl-list').addEventListener('click',e=>{ const b=e.target.closest('[data-tpl]'); if(!b) return; S.template=b.dataset.tpl; $$('.tpl').forEach(t=>t.setAttribute('aria-pressed',String(t===b))); save(); renderResume(); });
  $('#swatches').addEventListener('click',e=>{ const b=e.target.closest('[data-accent]'); if(!b) return; S.accent=b.dataset.accent; $$('.swatch[data-accent]').forEach(s=>s.setAttribute('aria-pressed',String(s===b))); save(); renderResume(); });
  $('#swatches').addEventListener('input',e=>{ if(e.target.id!=='custom-accent') return; S.accent=e.target.value; $$('.swatch[data-accent]').forEach(s=>s.setAttribute('aria-pressed','false')); save(); renderResume(); });
  $('#fs').addEventListener('input',e=>{ S.fs=+e.target.value; save(); renderResume(); });
  $('#sp').addEventListener('input',e=>{ S.sp=+e.target.value; save(); renderResume(); });

  // Sample / clear
  $('#sample-btn').addEventListener('click',()=>{
    const hasData=S.personal.name||S.experience.length||S.projects.length||S.education.length;
    if(hasData&&!confirm('Replace your current content with sample data?')) return;
    const smp=JSON.parse(JSON.stringify(SAMPLE[S.mode]));
    S={...S,...smp,hidden:{},collapsed:{}}; rerenderAll();
  });
  $('#clear-btn').addEventListener('click',()=>{ if(!confirm('Clear all resume content? Template and colour settings are kept.')) return; const {mode,template,accent,fs,sp,theme}=S; S={...blank(),mode,template,accent,fs,sp,theme}; rerenderAll(); });

  // Import / export / print
  $('#export-btn').addEventListener('click',()=>{ const {theme,collapsed,...data}=S; download(`${(S.personal.name||'resume').replace(/\s+/g,'-').toLowerCase()}-resume.json`,JSON.stringify(data,null,2)); });
  $('#import-btn').addEventListener('click',()=>$('#import-file').click());
  $('#import-file').addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{ const d=JSON.parse(await f.text()); if(!d||typeof d!=='object'||!d.personal) throw new Error('Not a resume file'); S={...blank(),...d,theme:S.theme,personal:{...blank().personal,...d.personal},hidden:d.hidden||{},collapsed:{}}; rerenderAll(); }
    catch(err){ alert('Could not import: '+err.message); }
    e.target.value='';
  });
  $('#print-btn').addEventListener('click',()=>{
    // Embedded browsers (VS Code Simple Browser, some webviews) silently ignore window.print().
    if(window.top!==window.self){
      toast('<b>Open this page in a full browser to save as PDF</b>Embedded previews can\'t show the print dialog. Your data is saved locally and will follow you to the new tab.',{open:true});
      return;
    }
    // Show the margins hint for 5 seconds, then open the print dialog.
    const btn=$('#print-btn'); btn.disabled=true;
    const msg=n=>`If you see spaces on both sides of the page, go to <b>More settings</b> and set <b>Margins</b> to <b>None</b>.<br><span class="muted">Opening print dialog in ${n}s…</span>`;
    let n=5; toast(msg(n),{ms:0});
    const tick=setInterval(()=>{ n--; if(n>0){ toast(msg(n),{ms:0}); return; }
      clearInterval(tick); $('#toast').hidden=true; btn.disabled=false;
      const t=document.title; document.title=`${S.personal.name||'Resume'} - Resume`;
      let fired=false; const onBefore=()=>{ fired=true; };
      window.addEventListener('beforeprint',onBefore,{once:true});
      try{ window.print(); }catch{}
      setTimeout(()=>{
        document.title=t;
        window.removeEventListener('beforeprint',onBefore);
        if(!fired) toast('<b>The print dialog didn\'t open</b>Your browser blocked it. Press <b>Ctrl/Cmd&nbsp;+&nbsp;P</b> on this page, or open it in Chrome or Edge and try again.',{open:true});
      },1500);
    },1000);
  });
  $('#toast-close').addEventListener('click',()=>{ $('#toast').hidden=true; });
  $('#toast-open').addEventListener('click',()=>{ window.open(location.href,'_blank','noopener'); $('#toast').hidden=true; });

  // Theme
  $('#theme-btn').addEventListener('click',()=>{ S.theme=isDark()?'light':'dark'; save(); applyTheme(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!S.theme) applyTheme(); });

  // Mobile tabs
  $$('.mobile-tabs [data-view]').forEach(b=>b.addEventListener('click',()=>{ $('#body').dataset.view=b.dataset.view; $$('.mobile-tabs [data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); requestAnimationFrame(fitPaper); }));

  new ResizeObserver(()=>fitPaper()).observe($('#preview-scroll'));
  window.addEventListener('beforeprint',()=>{ $('#resume').style.transform='none'; });
  window.addEventListener('afterprint',fitPaper);
}

/* ---------- Boot ---------- */
load();
$$('.ic').forEach(el=>{ el.innerHTML=ic(el.dataset.ic,16); });
applyTheme();
bind();
renderForm(); renderTemplates(); renderResume();
</script>
<script src="levelup-nav.js"></script>
</body>
