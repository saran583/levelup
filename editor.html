<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor - Levelup</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#f1f3f7; --border:#e1e4ea; --text:#1a1e27; --muted:#667085;
  --accent:#4f46e5; --accent-h:#4338ca; --accent-soft:#eceeff; --on-accent:#ffffff;
  --good:#137a4b; --good-bg:#e5f6ed; --bad:#c0362c; --bad-bg:#fdecea; --warn:#9a5b06; --warn-bg:#fff3de;
  --code-bg:#fbfbfd; --gutter:#f1f3f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  /* editor syntax palette (GitHub-like) */
  --syn-keyword:#cf222e; --syn-string:#0a3069; --syn-string2:#116329; --syn-number:#0550ae; --syn-comment:#5d6670;
  --syn-def:#8250df; --syn-var2:#953800; --syn-prop:#0550ae; --syn-atom:#0550ae; --syn-op:#cf222e; --syn-tag:#116329;
  --syn-attr:#0550ae; --syn-builtin:#8250df; --syn-meta:#5d6670; --syn-error:#cf222e; --syn-link:#0969da;
  --sel:#e3edff; --active-line:#f0f3fa; --caret:#1a1e27;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
    --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
    --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
    --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
    --syn-keyword:#ff7b72; --syn-string:#a5d6ff; --syn-string2:#7ee787; --syn-number:#79c0ff; --syn-comment:#8b949e;
    --syn-def:#d2a8ff; --syn-var2:#ffa657; --syn-prop:#79c0ff; --syn-atom:#79c0ff; --syn-op:#ff7b72; --syn-tag:#7ee787;
    --syn-attr:#79c0ff; --syn-builtin:#d2a8ff; --syn-meta:#8b949e; --syn-error:#ff7b72; --syn-link:#58a6ff;
    --sel:#182b47; --active-line:#182029; --caret:#e6e9ee;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
  --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
  --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
  --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  --syn-keyword:#ff7b72; --syn-string:#a5d6ff; --syn-string2:#7ee787; --syn-number:#79c0ff; --syn-comment:#8b949e;
  --syn-def:#d2a8ff; --syn-var2:#ffa657; --syn-prop:#79c0ff; --syn-atom:#79c0ff; --syn-op:#ff7b72; --syn-tag:#7ee787;
  --syn-attr:#79c0ff; --syn-builtin:#d2a8ff; --syn-meta:#8b949e; --syn-error:#ff7b72; --syn-link:#58a6ff;
  --sel:#182b47; --active-line:#182029; --caret:#e6e9ee;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code{font-family:var(--mono);font-size:.9em;background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}

/* ---------- header ---------- */
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:56px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.nav{display:flex;align-items:center;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;margin-left:6px}
.nav::-webkit-scrollbar{display:none}
.navlink{display:inline-flex;align-items:center;height:32px;padding:0 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
.navlink:hover{background:var(--panel-2);color:var(--text)}
.navlink[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navlink:focus-visible{outline-offset:-2px}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--panel-2)}
.btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.kbd{font-family:var(--mono);font-size:10px;opacity:.8;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}

.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 10px;min-height:34px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.pill{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--panel-2);color:var(--muted)}
.pill.react{background:var(--accent-soft);color:var(--accent)}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:12px;padding:12px;min-height:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.files-bar{display:flex;align-items:center;gap:6px;padding:8px 10px 0 10px;border-bottom:1px solid var(--border);background:var(--panel)}
.files{display:flex;gap:2px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin;padding-bottom:6px}
.ftab{display:inline-flex;align-items:center;flex:none;height:32px;border-radius:8px;color:var(--muted)}
.ftab:hover{background:var(--panel-2);color:var(--text)}
.ftab[data-active="true"]{background:var(--accent-soft);color:var(--accent)}
.ftab .fname{border:0;background:transparent;height:32px;padding:0 4px 0 12px;font-weight:600;font-size:13px;border-radius:8px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftab .fclose{display:grid;place-items:center;width:22px;height:22px;margin-right:5px;border:0;border-radius:6px;background:transparent;color:inherit;opacity:.7}
.ftab .fclose:hover{background:var(--panel);opacity:1}
.ftab input{width:150px;height:26px;margin:0 5px;padding:0 8px;border:1px solid var(--accent);border-radius:6px;background:var(--panel);font-weight:600;font-size:13px}
.ftab.nx .fname{padding-right:12px}
.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--panel)}
.toolbar .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.toolbar .grow{flex:1}
.menu-wrap{position:relative}
.menu{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:230px;max-width:calc(100vw - 32px);max-height:340px;max-height:min(340px,60dvh);overflow:auto;padding:6px;background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.menu button{display:flex;width:100%;text-align:left;padding:7px 10px;border:0;background:transparent;border-radius:7px;font-size:13px;font-weight:500}
.menu button:hover,.menu button:focus{background:var(--accent-soft);color:var(--accent);outline:none}
.menu button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.editor-wrap{flex:1;min-height:120px;position:relative;background:var(--code-bg);--fs:13px}
.editor-wrap:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.editor-host{position:absolute;inset:0}
.editor-foot{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;padding:6px 12px;border-top:1px solid var(--border);background:var(--panel);font-size:12px;color:var(--muted)}
.editor-foot .grow{flex:1}
.editor-foot .note{color:var(--warn);font-weight:600}
.editor-foot .note.ok{color:var(--muted);font-weight:400}

/* textarea fallback */
.ta-wrap{position:absolute;inset:0;display:flex;font:var(--fs)/1.6 var(--mono)}
.ta-gutter{margin:0;flex:none;min-width:46px;padding:12px 10px 24px 8px;text-align:right;color:var(--syn-comment);background:var(--gutter);border-right:1px solid var(--border);overflow:hidden;user-select:none;font:inherit}
.ta-boxes{flex:1;min-width:0;position:relative}
.ta-code{position:absolute;inset:0;width:100%;height:100%;border:0;outline:none;resize:none;background:transparent;color:var(--text);padding:12px 14px;white-space:pre;overflow:auto;tab-size:2;font:inherit;caret-color:var(--caret)}

/* CodeMirror theming */
.editor-host .CodeMirror{height:100%;font:var(--fs)/1.6 var(--mono);background:transparent;color:var(--text)}
.editor-host .CodeMirror-gutters{background:var(--gutter);border-right:1px solid var(--border)}
.editor-host .CodeMirror-linenumber{color:var(--syn-comment);padding:0 8px 0 6px}
.editor-host .CodeMirror-cursor{border-left:2px solid var(--caret)}
.editor-host .CodeMirror-activeline-background{background:var(--active-line)}
.editor-host .CodeMirror-selected{background:var(--sel)}
.editor-host .CodeMirror-focused .CodeMirror-selected{background:var(--sel)}
.editor-host .CodeMirror-line::selection,.editor-host .CodeMirror-line>span::selection,.editor-host .CodeMirror-line>span>span::selection{background:var(--sel)}
.editor-host .CodeMirror-matchingbracket{color:var(--text)!important;background:var(--accent-soft);outline:1px solid var(--accent);text-decoration:none!important}
.editor-host .CodeMirror-nonmatchingbracket{color:var(--bad)!important;text-decoration:underline}
.editor-host .CodeMirror-scroll{padding-bottom:12px}
.editor-host .cm-s-default .cm-keyword{color:var(--syn-keyword)}
.editor-host .cm-s-default .cm-atom{color:var(--syn-atom)}
.editor-host .cm-s-default .cm-number{color:var(--syn-number)}
.editor-host .cm-s-default .cm-def{color:var(--syn-def)}
.editor-host .cm-s-default .cm-variable{color:var(--text)}
.editor-host .cm-s-default .cm-variable-2{color:var(--syn-var2)}
.editor-host .cm-s-default .cm-variable-3,.editor-host .cm-s-default .cm-type{color:var(--syn-builtin)}
.editor-host .cm-s-default .cm-property{color:var(--syn-prop)}
.editor-host .cm-s-default .cm-operator{color:var(--syn-op)}
.editor-host .cm-s-default .cm-comment{color:var(--syn-comment);font-style:italic}
.editor-host .cm-s-default .cm-string{color:var(--syn-string)}
.editor-host .cm-s-default .cm-string-2{color:var(--syn-string2)}
.editor-host .cm-s-default .cm-meta{color:var(--syn-meta)}
.editor-host .cm-s-default .cm-qualifier{color:var(--syn-attr)}
.editor-host .cm-s-default .cm-builtin{color:var(--syn-builtin)}
.editor-host .cm-s-default .cm-bracket{color:var(--muted)}
.editor-host .cm-s-default .cm-tag{color:var(--syn-tag)}
.editor-host .cm-s-default .cm-attribute{color:var(--syn-attr)}
.editor-host .cm-s-default .cm-header{color:var(--syn-def);font-weight:700}
.editor-host .cm-s-default .cm-link{color:var(--syn-link)}
.editor-host .cm-s-default .cm-error{color:var(--syn-error)}
.editor-host .cp-err{text-decoration:underline wavy var(--bad);text-decoration-thickness:1.5px;text-underline-offset:3px}
.editor-host .cp-warn{text-decoration:underline wavy var(--warn);text-decoration-thickness:1.5px;text-underline-offset:3px}
body .CodeMirror-hints{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.28);font:12.5px/1.5 var(--mono);z-index:70;padding:4px}
body .CodeMirror-hint{color:var(--text);padding:2px 8px;border-radius:6px}
body li.CodeMirror-hint-active{background:var(--accent);color:var(--on-accent)}

/* ---------- output ---------- */
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 10px;border-bottom:1px solid var(--border);background:var(--panel);min-height:48px;flex-wrap:wrap}
.tabs{display:flex;gap:2px}
.tab{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.tab:hover{background:var(--panel-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .count{font-size:11px;background:var(--panel-2);color:var(--muted);border-radius:99px;padding:0 6px;min-width:18px;text-align:center}
.tab[aria-selected="true"] .count{background:var(--panel);color:var(--accent)}
.tab .count.bad{background:var(--bad-bg);color:var(--bad)}
.tab .count.warn{background:var(--warn-bg);color:var(--warn)}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--border)}
.status[data-k="running"] .dot{background:var(--accent)}
.status[data-k="ok"] .dot{background:var(--good)}
.status[data-k="bad"] .dot{background:var(--bad)}
.status[data-k="warn"] .dot{background:var(--warn)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.chk input{width:15px;height:15px;accent-color:var(--accent)}
.rbody{flex:1;min-height:0;position:relative;background:var(--panel)}
.panel{position:absolute;inset:0;overflow:auto;padding:10px 12px}
.panel.flush{padding:0}
.placeholder{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);padding:24px}
.placeholder strong{display:block;color:var(--text);margin-bottom:4px}
#preview{width:100%;height:100%;border:0;display:block;background:#fff}
#preview-empty{position:absolute;inset:0;background:var(--panel)}

.log{display:block;padding:6px 10px;border-radius:8px;font:12.5px/1.5 var(--mono);border:1px solid transparent;margin-bottom:4px;overflow-wrap:anywhere}
.log .args{white-space:pre-wrap;word-break:break-word}
.log-log,.log-info,.log-debug{background:var(--panel-2)}
.log-warn{background:var(--warn-bg);color:var(--warn)}
.log-error{background:var(--bad-bg);color:var(--bad)}
.log-meta{color:var(--muted);padding-left:2px;background:transparent}
.log-meta.ok{color:var(--good)} .log-meta.warn{color:var(--warn)} .log-meta.bad{color:var(--bad)}
.log .stack{margin:4px 0 0;white-space:pre-wrap;font:11.5px/1.5 var(--mono);opacity:.85}
.linkbtn{border:0;background:transparent;color:inherit;text-decoration:underline;font:inherit;padding:0;margin-left:6px;cursor:pointer}
.linkbtn:hover{color:var(--accent)}
.v-str{color:var(--syn-string)} .v-num{color:var(--syn-number)} .v-kw{color:var(--syn-keyword)} .v-fn{color:var(--syn-def)} .v-key{color:var(--syn-prop)} .v-dim{color:var(--muted)}
.log-error .v-str,.log-error .v-num,.log-error .v-kw,.log-error .v-fn,.log-error .v-key,.log-warn .v-str,.log-warn .v-num,.log-warn .v-kw,.log-warn .v-fn,.log-warn .v-key{color:inherit}
.tree{display:inline-block;vertical-align:top;max-width:100%}
.tree>summary{cursor:pointer;list-style:none;display:inline;border-radius:4px}
.tree>summary::-webkit-details-marker{display:none}
.tree>summary::before{content:"\25B8";display:inline-block;width:1em;color:var(--muted)}
.tree[open]>summary::before{content:"\25BE"}
.tree>summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.t-kids{margin-left:.6em;border-left:1px dotted var(--border);padding-left:10px}
.t-row{white-space:pre-wrap}

.plist{display:grid;gap:4px}
.prob{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;text-align:left;width:100%;padding:8px 10px;border:1px solid var(--border);border-left-width:4px;border-radius:8px;background:var(--panel);font-size:13px}
.prob:hover{background:var(--panel-2)}
.prob.error{border-left-color:var(--bad)} .prob.warn{border-left-color:var(--warn)} .prob.info{border-left-color:var(--accent)}
.prob .sev{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.prob.error .sev{color:var(--bad)} .prob.warn .sev{color:var(--warn)} .prob.info .sev{color:var(--accent)}
.prob .loc{font:12px var(--mono);color:var(--muted)}
.pnote{margin:8px 2px 0;font-size:12.5px;color:var(--muted)}
.okbox{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--good-bg);color:var(--good);font-weight:600}

/* dialogs / toasts */
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(640px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.dialog.narrow{width:min(420px,100%)}
.dialog-h{display:flex;align-items:center;padding:12px 12px 12px 20px;border-bottom:1px solid var(--border)}
.dialog-h h2{margin:0;font-size:16px}
.dialog-h .icon-btn{margin-left:auto}
.dialog-b{padding:16px 20px;overflow:auto}
.dialog-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 20px;border-top:1px solid var(--border);background:var(--panel-2)}
.dialog-f .form-error{margin-right:auto;color:var(--bad);font-size:12.5px}
.fld{display:grid;gap:4px;margin-bottom:12px}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.kvs{display:grid;grid-template-columns:90px minmax(0,1fr);gap:4px 10px;font-size:13px;margin:0 0 12px}
.kvs dt{color:var(--muted);font-weight:600} .kvs dd{margin:0;overflow-wrap:anywhere}
.codeblock{margin:0;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--code-bg);font:12.5px/1.6 var(--mono);overflow:auto;white-space:pre;tab-size:2;max-height:240px}
.callout{padding:9px 12px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:13px;margin:0 0 12px}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.linkrow{display:flex;gap:8px}
.linkrow .input{font-family:var(--mono);font-size:12px}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:80}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:13px;animation:fade .2s;max-width:340px}
.toast.bad{background:var(--bad);color:#fff}
.spinner{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width:900px){
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto}
  .topbar{flex-wrap:wrap;padding:8px 16px;row-gap:6px}
  .nav{order:3;flex:1 0 100%;margin-left:0}
  .spacer{flex:1}
  .ws{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;padding:12px 16px}
  .ws>.pane:first-child{height:min(74vh,640px);height:min(74dvh,640px)}
  .ws>.pane:last-child{height:min(66vh,560px);height:min(66dvh,560px)}
  .toolbar .lbl{display:none}
  .toolbar .btn.sm{padding:0 9px}
  #hint-long{display:none}
}
@media (max-width:560px){
  #toasts{left:16px;right:16px}
  .toast{max-width:none}
  .status{margin-left:0;width:100%}
}

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" id="logo"></span>
      <span class="brand-name">Levelup</span>
    </div>
    <nav class="nav" aria-label="Levelup pages" data-levelup-nav></nav>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme-btn" aria-label="Toggle light/dark theme"></button>
  </header>

  <main class="ws">
    <section class="pane card" aria-label="Editor">
      <div class="files-bar">
        <div class="files" id="files" role="tablist" aria-label="Files"></div>
        <button class="btn sm" id="new-file" title="Create a new scratch file"></button>
      </div>
      <div class="toolbar" role="toolbar" aria-label="Editor tools">
        <button class="btn primary sm" id="run-btn" title="Run (Ctrl/Cmd + Enter)"></button>
        <button class="btn sm" id="stop-btn" title="Stop" disabled></button>
        <span class="sep"></span>
        <button class="icon-btn" id="font-dec" aria-label="Smaller font" title="Smaller font"><span style="font-size:11px;font-weight:700">A</span></button>
        <button class="icon-btn" id="font-inc" aria-label="Larger font" title="Larger font"><span style="font-size:15px;font-weight:700">A</span></button>
        <button class="icon-btn" id="wrap-btn" aria-pressed="false" aria-label="Word wrap" title="Word wrap"></button>
        <div class="menu-wrap">
          <button class="btn sm" id="snip-btn" aria-haspopup="menu" aria-expanded="false" title="Insert a snippet"></button>
          <div class="menu" id="snip-menu" role="menu" aria-label="Snippets" hidden></div>
        </div>
        <button class="btn sm" id="fmt-btn" title="Re-indent selection or whole file"></button>
        <span class="grow"></span>
        <button class="btn sm ghost" id="share-btn" title="Copy a link to this file"></button>
        <button class="btn sm ghost" id="dl-btn" title="Download this file"></button>
        <button class="btn sm ghost" id="ul-btn" title="Open a file from disk"></button>
        <button class="btn sm ghost danger" id="reset-btn" title="Reset the editor"></button>
        <input type="file" id="upload" hidden accept=".js,.mjs,.jsx,.ts,.tsx,.html,.htm,.css,.txt,text/*">
      </div>
      <div class="editor-wrap" id="editor-wrap">
        <div class="editor-host" id="editor-host"></div>
      </div>
      <div class="editor-foot">
        <span id="pos" aria-hidden="true">Ln 1, Col 1</span>
        <span id="lang-label"></span>
        <span class="note" id="ed-note" role="status"></span>
        <span class="grow"></span>
        <span id="hint-short">Esc then Tab leaves the editor.</span>
        <span id="hint-long"></span>
      </div>
    </section>

    <section class="pane card" aria-label="Output">
      <div class="pane-h">
        <div class="tabs" id="otabs" role="tablist" aria-label="Output">
          <button class="tab" role="tab" id="tab-console" data-tab="console" aria-selected="true" aria-controls="panel-console">Console</button>
          <button class="tab" role="tab" id="tab-preview" data-tab="preview" aria-selected="false" aria-controls="panel-preview" tabindex="-1">Preview</button>
          <button class="tab" role="tab" id="tab-problems" data-tab="problems" aria-selected="false" aria-controls="panel-problems" tabindex="-1">Problems <span class="count" id="prob-count" hidden>0</span></button>
        </div>
        <label class="chk" id="live-wrap" hidden><input type="checkbox" id="live"> Live</label>
        <button class="btn sm ghost" id="clear-btn" title="Clear console"></button>
        <div class="status" id="status" data-k="idle"><span class="dot"></span><span id="status-text">Ready</span></div>
      </div>
      <div class="rbody">
        <div class="panel" id="panel-console" role="tabpanel" aria-labelledby="tab-console" tabindex="0"></div>
        <div class="panel flush" id="panel-preview" role="tabpanel" aria-labelledby="tab-preview" hidden>
          <iframe id="preview" title="Preview" sandbox="allow-scripts"></iframe>
          <div id="preview-empty" class="placeholder"><div><strong>Preview</strong><span id="preview-empty-text">Run a React or HTML file to see it here.</span></div></div>
        </div>
        <div class="panel" id="panel-problems" role="tabpanel" aria-labelledby="tab-problems" hidden tabindex="0"></div>
      </div>
    </section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>

}

function extFor(lang){ return (LANGS[lang]||LANGS.js).ext; }
function langFromName(name){
  const m=/\.([a-z0-9]+)$/i.exec(name||''); const e=m?m[1].toLowerCase():'';
  if(e==='jsx'||e==='tsx') return 'jsx';
  if(e==='html'||e==='htm') return 'html';
  return 'js';
}
function uniqueName(name,files,exceptId){
  const taken=new Set(files.filter(function(f){return f.id!==exceptId;}).map(function(f){return f.name.toLowerCase();}));
  if(!taken.has(name.toLowerCase())) return name;
  const m=/^(.*?)(\.[^.]*)?$/.exec(name); const base=m[1], ext=m[2]||'';
  for(let i=2;i<1000;i++){ const c=base+' ('+i+')'+ext; if(!taken.has(c.toLowerCase())) return c; }

}
function defaultNameFor(lang,files){
  const ext=extFor(lang); const base=lang==='jsx'?'component':lang==='html'?'page':'scratch';
  return uniqueName(base+'.'+ext,files);
}
function fileNameWithExt(name,lang){ return /\.[a-z0-9]{1,5}$/i.test(name)?name:name+'.'+extFor(lang); }

/* ---- code scanner: blanks strings, comments, regex literals and template text ---- */

/* simple re-indent by bracket depth (used by the plain-textarea fallback) */
function reindentText(text,unit){
  const sc=scanCode(text), lines=text.split('\n'), ml=sc.mask.split('\n'); let depth=0, off=0; const out=[];

    const ln=lines[i], m=ml[i]||'';

function findUserLine(stack){
  const m=/user-code\.js:(\d+):(\d+)/.exec(String(stack||''));

function fmtElapsed(ms){ return ms<1000?Math.max(0,Math.round(ms))+' ms':(ms/1000).toFixed(2)+' s'; }

function modal(opts){
  const opener=document.activeElement;
  const ov=el('div','overlay'), dlg=el('div','dialog'+(opts.narrow?' narrow':''));
  const tid='dlg-'+Math.random().toString(36).slice(2,7);
  dlg.setAttribute('role','dialog'); dlg.setAttribute('aria-modal','true'); dlg.setAttribute('aria-labelledby',tid);
  const head=el('div','dialog-h'); head.innerHTML=`<h2 id="${tid}">${esc(opts.title)}</h2>`;
  const xb=el('button','icon-btn'); xb.type='button'; xb.setAttribute('aria-label','Close'); xb.innerHTML=ic('x',16); head.appendChild(xb);
  const body=el('div','dialog-b'), foot=el('div','dialog-f');
  dlg.append(head,body,foot); ov.appendChild(dlg);
  let resolveFn; const promise=new Promise(r=>{ resolveFn=r; });
  let closed=false;
  function close(result){
    if(closed) return; closed=true;
    const ae=document.activeElement, keepFocus=ae&&ae!==document.body&&!ov.contains(ae);
    ov.remove();
    try{ if(!keepFocus&&opener&&opener.focus&&document.contains(opener)) opener.focus(); }catch(e){}
    resolveFn(result);
  }
  const api={el:dlg,body:body,foot:foot,close:close,promise:promise};
  if(opts.build) opts.build(body,api);
  (opts.buttons||[]).forEach(b=>{
    const btn=el('button','btn'+(b.primary?' primary':'')+(b.danger?' danger':'')); btn.type='button'; btn.textContent=b.label;
    btn.addEventListener('click',()=>{ if(b.onClick){ const r=b.onClick(api); if(r===false) return; } close(b.result); });
    foot.appendChild(btn); if(b.primary) api.primary=btn;
  });
  xb.addEventListener('click',()=>close(opts.cancelResult));
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(opts.cancelResult); });
  ov.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ e.stopPropagation(); close(opts.cancelResult); return; }
    if(e.key==='Tab'){
      const f=$$('button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])',dlg).filter(x=>!x.hidden);
      if(!f.length) return;
      const first=f[0], last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
      else if(!dlg.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    }
  });
  $('#modal-root').appendChild(ov);
  const focusEl=(opts.focus&&$(opts.focus,dlg))||api.primary||xb;
  setTimeout(()=>{ try{ focusEl.focus(); }catch(e){} },0);
  return api;
}
const confirmDlg=(title,message,okLabel,danger)=>modal({title:title,narrow:true,cancelResult:false,

  buttons:[{label:'Cancel',result:false},{label:okLabel||'OK',primary:true,danger:!!danger,result:true}]}).promise;

function readTheme(){ try{ const o=JSON.parse(localStorage.getItem(THEME_KEY)); const t=o&&o.theme; return t==='light'||t==='dark'?t:null; }catch(e){ return null; } }
function writeTheme(t){
  let o={}; try{ const x=JSON.parse(localStorage.getItem(THEME_KEY)); if(x&&typeof x==='object'&&!Array.isArray(x)) o=x; }catch(e){}
  o.theme=t; try{ localStorage.setItem(THEME_KEY,JSON.stringify(o)); }catch(e){}
}
let theme=readTheme();
const sysDark=()=>{ try{ return matchMedia('(prefers-color-scheme: dark)').matches; }catch(e){ return false; } };

/* ==========================================================================
   Lazy asset loading (cdnjs only) with timeout
   ========================================================================== */
const assetCache={};
function loadAsset(key,ms){
  if(assetCache[key]) return assetCache[key];
  const a=ASSETS[key], url=CDN+a.p, isCss=/\.css$/.test(a.p);
  assetCache[key]=new Promise((resolve,reject)=>{
    const node=document.createElement(isCss?'link':'script');
    let done=false;
    const t=setTimeout(()=>{ if(done) return; done=true; node.remove(); reject(new Error('timeout: '+url)); },ms||8000);
    node.onload=()=>{ if(done) return; done=true; clearTimeout(t); resolve(); };
    node.onerror=()=>{ if(done) return; done=true; clearTimeout(t); node.remove(); reject(new Error('failed: '+url)); };
    if(isCss){ node.rel='stylesheet'; node.href=url; } else { node.async=true; node.src=url; }
    node.integrity=a.h; node.crossOrigin='anonymous';
    document.head.appendChild(node);
  });
  return assetCache[key];
}
async function loadCodeMirror(){
  if(window.CodeMirror&&window.CodeMirror.hint) return;
  await Promise.all([loadAsset('cmcss'),loadAsset('hintcss'),loadAsset('cm')]);
  await Promise.all(['js','xml','jsx','css','htmlmixed','closebrackets','matchbrackets','activeline','showhint','jshint','comment'].map(k=>loadAsset(k)));
}
const raceTimeout=(p,ms)=>{ let t; return Promise.race([p,new Promise((_,rej)=>{ t=setTimeout(()=>rej(new Error('timeout')),ms); })]).finally(()=>clearTimeout(t)); };

function snippetBody(text,indentStr){
  const at=text.indexOf('$0');

  const c=lines.indexOf('\u0000');
  return {text:lines.replace('\u0000',''),caret:c>=0?c:lines.length};
}
function lineStartOf(v,i){ return i<=0?0:v.lastIndexOf('\n',i-1)+1; }

function makeCMEd(host,cb){
  host.innerHTML='';

    const seen=new Set(list), extra=[], re=/[A-Za-z_$][\w$]*/g, text=cm.getValue(); let m,n=0;
    while((m=re.exec(text))&&n++<20000){ const w=m[0]; if(w!==prefix&&w.startsWith(prefix)&&!seen.has(w)){ seen.add(w); extra.push(w); } }
    extra.sort();

  }

  const toggle=c=>{ const lang=curFile?curFile.lang:'js'; c.toggleComment(lang==='jsx'?{indent:true,lineComment:'//'}:{indent:true}); };
  const keysNormal={
    Tab:c=>{ if(c.somethingSelected()) c.indentSelection('add'); else c.execCommand('insertSoftTab'); },
    'Shift-Tab':c=>c.indentSelection('subtract'),
    Esc:c=>{ escArmed=true; c.setOption('extraKeys',keysEsc); },
    'Ctrl-Space':showHint,
    'Ctrl-/':toggle,'Cmd-/':toggle
  };
  const keysEsc=Object.assign({},keysNormal,{Tab:false,'Shift-Tab':false});
  const cm=CM(host,{
    value:'',mode:'javascript',lineNumbers:true,styleActiveLine:true,matchBrackets:true,
    autoCloseBrackets:{pairs:'()[]{}\'\'""``',closeBefore:')]}\'":;>',triples:'',explode:'[]{}'},
    indentUnit:2,tabSize:2,indentWithTabs:false,smartIndent:true,lineWrapping:!!S.wrap,
    extraKeys:keysNormal,screenReaderLabel:'Code editor',viewportMargin:20
  });

    const t=ch.text[0]; if(!t||!/^[\w$]$/.test(t)) return;
    const p=c.getCursor(), tok=c.getTokenAt(p);

    const m=c.getModeAt(p).name; if(m!=='javascript'&&m!=='jsx') return;
    const word=c.getLine(p.line).slice(0,p.ch).match(/[\w$]+$/);

    showHint(c);

    kind:'cm',
    open(file){

      cm.swapDoc(d); curFile=file; cm.refresh(); const p=cm.getCursor(); cb.cursor(p.line+1,p.ch+1);
    },
    rename(){},
    forget(id){ docs.delete(id); marksById.delete(id); },
    forgetAll(){ docs.clear(); marksById.clear(); },
    getValue(){ return cm.getValue(); },
    focus(){ cm.focus(); },
    hasFocus(){ return cm.hasFocus(); },
    getOffset(){ return cm.indexFromPos(cm.getCursor()); },
    setOffset(o){ cm.setCursor(cm.posFromIndex(o)); },
    insertSnippet(text){
      cm.focus(); const from=cm.getCursor('from'), ind=/^\s*/.exec(cm.getLine(from.line))[0], sb=snippetBody(text,ind), start=cm.indexFromPos(from);

    setWrap(on){ cm.setOption('lineWrapping',!!on); cm.refresh(); },

      const before=cm.getValue();

      const marks=[], doc=cm.getDoc();

        if(p.sev==='info') return; let ln=p.line-1; if(ln<0) return;

    refresh(){ cm.refresh(); },
    destroy(){ host.innerHTML=''; }
  };
}

function previewOf(v,depth){
  switch(v.k){
    case 'str': return depth?JSON.stringify(v.v.length>40?v.v.slice(0,40)+'…':v.v):v.v;
    case 'num': case 'big': case 'sym': return v.v;
    case 'bool': return String(v.v);
    case 'null': return 'null'; case 'undef': return 'undefined';
    case 'fn': return (v.cls?'class ':'ƒ ')+(v.v||'anonymous')+(v.cls?'':'()');
    case 'circ': return '[Circular]'; case 'deep': return v.v; case 'date': case 're': return v.v;
    case 'err': return v.name+': '+v.msg;
    case 'arr': { const it=v.items.slice(0,depth?3:6).map(x=>previewOf(x,depth+1)); return (v.cls?v.cls+'('+v.n+') ':'')+'['+it.join(', ')+(v.n>it.length?', …':'')+']'; }
    case 'set': { const it=v.items.slice(0,depth?3:6).map(x=>previewOf(x,depth+1)); return 'Set('+v.n+') {'+it.join(', ')+(v.n>it.length?', …':'')+'}'; }
    case 'map': { const it=v.entries.slice(0,depth?2:5).map(e=>previewOf(e[0],depth+1)+' => '+previewOf(e[1],depth+1)); return 'Map('+v.n+') {'+it.join(', ')+(v.n>it.length?', …':'')+'}'; }
    case 'obj': { const it=v.props.slice(0,depth?3:6).map(p=>p[0]+': '+previewOf(p[1],depth+1)); return (v.cls?v.cls+' ':'')+'{'+it.join(', ')+(v.n>it.length?', …':'')+'}'; }
  }
  return '?';
}
function leaf(cls,text){ const s=el('span',cls); s.textContent=text; return s; }
function valNode(v,top){
  switch(v.k){
    case 'str': { const s=leaf(top?'':'v-str',top?v.v:JSON.stringify(v.v)); if(v.cut) s.appendChild(leaf('v-dim','… ('+v.cut+' more characters)')); return s; }
    case 'num': case 'big': return leaf('v-num',v.v);
    case 'bool': case 'null': case 'undef': case 'sym': return leaf('v-kw',v.k==='bool'?String(v.v):v.k==='null'?'null':v.k==='undef'?'undefined':v.v);
    case 'fn': return leaf('v-fn',previewOf(v,0));
    case 'circ': case 'deep': return leaf('v-dim',previewOf(v,0));
    case 'date': case 're': return leaf('v-str',v.v);
    case 'err': { const w=el('span'); w.appendChild(leaf('',v.name+': '+v.msg)); const ln=findUserLine(v.stack); if(ln) w.appendChild(lineLink(ln.line,ln.col)); return w; }
  }
  const d=el('details','tree'), sm=el('summary'); sm.textContent=previewOf(v,0); d.appendChild(sm);
  const kids=el('div','t-kids'); let built=false;
  const build=()=>{
    built=true;
    const row=(k,val,keyCls)=>{ const r=el('div','t-row'); r.appendChild(leaf(keyCls||'v-key',String(k))); r.appendChild(document.createTextNode(': ')); r.appendChild(valNode(val,false)); kids.appendChild(r); };
    if(v.k==='arr') v.items.forEach((x,i)=>row(i,x,'v-dim'));
    else if(v.k==='set') v.items.forEach((x,i)=>row(i,x,'v-dim'));
    else if(v.k==='map') v.entries.forEach(e=>{ const r=el('div','t-row'); r.appendChild(valNode(e[0],false)); r.appendChild(document.createTextNode(' => ')); r.appendChild(valNode(e[1],false)); kids.appendChild(r); });
    else v.props.forEach(p=>row(p[0],p[1]));
    const shown=v.k==='arr'||v.k==='set'?v.items.length:v.k==='map'?v.entries.length:v.props.length;
    if(v.n>shown) kids.appendChild(el('div','t-row v-dim','\u2026 '+(v.n-shown)+' more'));
    if(!shown&&v.k==='obj') kids.appendChild(el('div','t-row v-dim','(no enumerable properties)'));
  };
  d.addEventListener('toggle',()=>{ if(d.open&&!built) build(); });
  d.appendChild(kids);
  return d;
}
function lineLink(line,col){
  const b=el('button','linkbtn'); b.type='button'; b.dataset.line=line; b.dataset.col=col||1; b.textContent='line '+line; b.title='Jump to line '+line; return b;
}
function entryNode(en){
  const lvl=en.kind==='err'?'error':en.kind==='meta'?'meta':en.level==='info'||en.level==='debug'?en.level:en.level;
  const d=el('div','log log-'+lvl+(en.kind==='meta'&&en.tone?' '+en.tone:''));

  if(en.kind==='meta'){ d.textContent=en.text; return d; }

    const prefix=en.noPrefix?'':en.kind2==='promise'?'Uncaught (in promise) ':'Uncaught ';

let renderQueued=false, appendFrom=0, shownDropped=0;

let active=null;   // {fileId, kind:'worker'|'frame', stop(), token?}
let tickT=null;
function startTick(id){

}
function beginRun(f){

function finishRun(id,status,text,metaTone){

function friendly(en){

    const p=probs[0];

    else if(d.t==='main-done'){ mainDone=true; pending=d.pending||0; }
    else if(d.t==='done'){
      ended=true; cleanup();
      const bad=rt(f.id).hadError, el2=performance.now()-rt(f.id).start;
      finishRun(f.id,bad?'bad':'ok',(bad?'Finished with errors in ':'Finished in ')+fmtElapsed(el2),bad?'bad':'ok');
    }
  };
  worker.onerror=ev=>{
    if(ended) return; if(ev&&ev.preventDefault) ev.preventDefault();
    pushLog(f.id,friendly({kind:'err',name:'Error',message:String(ev&&ev.message||'Worker error').replace(/^Uncaught\s*/,''),stack:''}));
    ended=true; cleanup(); finishRun(f.id,'bad','Finished with errors','bad');
  };
  startTick(f.id);
  worker.postMessage({t:'run',code:f.code});
}
/* ---- sandboxed iframe (HTML + JSX) ---- */
function updatePreviewFor(f){
  const empty=$('#preview-empty'), txt=$('#preview-empty-text');
  if(frame.fileId===f.id&&frame.shown){ empty.hidden=true; return; }
  empty.hidden=false;
  txt.textContent=f.lang==='js'?'Preview is available for React (JSX) and HTML/CSS/JS files.':f.lang==='jsx'?'Press Run to render your component here.':'Press Run to render the page here'+(S.live?' (live refresh is on).':'.');
}
const frame={fileId:null,token:null,shown:false,loadT:null};
function resetFrame(){
  const old=$('#preview'); const n=old.cloneNode(false); n.removeAttribute('srcdoc'); old.replaceWith(n);
  frame.shown=false; frame.fileId=null; frame.token=null;
}
function runFrame(f,mkDoc,auto){
  const tok='t'+Math.random().toString(36).slice(2)+Date.now().toString(36);
  beginRun(f);
  frame.fileId=f.id; frame.token=tok; frame.shown=true; $('#preview-empty').hidden=true;
  active={fileId:f.id,kind:'frame',cleanup:()=>{ clearTimeout(frame.loadT); }};
  if(!auto) setTab('preview');
  clearTimeout(frame.loadT);
  frame.loadT=setTimeout(()=>{
    if(active&&active.kind==='frame'&&frame.token===tok){
      pushLog(f.id,friendly({kind:'err',name:'Error',message:'The preview did not finish loading within 20 seconds. Check your network connection (React and Babel load from cdnjs.cloudflare.com).',stack:'',noPrefix:true}));
      finishRun(f.id,'bad','Timed out loading preview','bad');
    }
  },20000);
  startTick(f.id);
  $('#preview').srcdoc=mkDoc(tok);
  updateToolbarState();
}
function renderHtml(f,auto){
  if(auto&&active&&active.kind==='worker') return;
  runFrame(f,tok=>buildHtmlDoc(f.code,tok),auto);
}
function renderJsx(f){
  const errs=rt(f.id).problems.filter(p=>p.sev==='error');
  if(errs.length&&window.Babel){
    beginRun(f); const p=errs[0];
    pushLog(f.id,{kind:'err',name:'SyntaxError',message:p.msg,line:p.line,col:p.col,stack:'',noPrefix:true});
    finishRun(f.id,'bad','Not run: fix the syntax error first','bad'); setTab('console'); return;
  }
  runFrame(f,tok=>buildJsxDoc(f.code,tok),false);
}
const langOf=id=>(S.files.find(f=>f.id===id)||{}).lang;
window.addEventListener('message',ev=>{
  const d=ev.data; if(!d||typeof d!=='object'||!frame.token||d.__cp!==frame.token) return;
  if(ev.source!==$('#preview').contentWindow) return;
  const id=frame.fileId; if(!RT[id]) return;
  if(d.t==='log') pushLog(id,{kind:'log',level:d.level,args:d.args,indent:d.indent||0});
  else if(d.t==='error'){
    pushLog(id,friendly({kind:'err',name:d.name,message:d.message,stack:d.stack||'',line:d.line||0,col:d.col||0,kind2:d.kind}));
    if(ui.tab==='preview'&&id===S.current) toast(d.name+': '+String(d.message).slice(0,90),true);
  }
  else if(d.t==='loaded'||d.t==='rendered'){
    const r=rt(id); if(r.status!=='running') return;
    if(d.t==='loaded'&&langOf(id)==='jsx'&&!r.hadError) return;   // JSX finishes on 'rendered'
    clearTimeout(frame.loadT);
    const bad=r.hadError;
    finishRun(id,bad?'bad':'ok',(bad?'Rendered with errors in ':'Rendered in ')+fmtElapsed(performance.now()-r.start),bad?'bad':'ok');
  }
});
let liveT=null;
function scheduleLive(){
  const f=cur(); if(f.lang!=='html'||!S.live) return;
  clearTimeout(liveT); liveT=setTimeout(()=>{ if(cur().lang==='html'&&S.live) renderHtml(cur(),true); },500);
}
function run(){
  const f=cur(); f.code=ed.getValue(); lintNow();
  if(f.lang==='js'){ setTab('console'); runJS(f); }
  else if(f.lang==='jsx'){ if(!window.Babel) loadBabel(); renderJsx(f); }
  else renderHtml(f,false);
}

/* ==========================================================================
   Share / import / download / upload / reset
   ========================================================================== */
async function shareDialog(){
  const f=cur(); f.code=ed.getValue();
  let data; try{ data=await shareEncode(f); }catch(e){ toast('Could not build a share link.',true); return; }
  const link=location.href.replace(/#.*$/,'')+'#f='+data;
  const long=link.length>SHARE_WARN_LEN;
  modal({title:'Share "'+f.name+'"',focus:'#sh-link',
    build:b=>{
      b.innerHTML=`<p class="muted" style="margin-top:0">Anyone with this link can open a copy of this file. Nothing is uploaded: the code is packed into the link itself.</p>
        ${long?`<p class="callout">This link is ${link.length.toLocaleString()} characters long. Some chat apps and browsers truncate links over about 8,000 characters, so it may not open correctly. Consider sharing a smaller file or use Download.</p>`:`<p class="small muted" style="margin:0 0 8px;font-size:12px">${link.length.toLocaleString()} characters${data.startsWith('b.')?' (uncompressed: this browser cannot compress links)':''}.</p>`}
        <div class="linkrow"><input class="input" id="sh-link" readonly aria-label="Share link"><button class="btn primary" type="button" id="sh-copy">Copy link</button></div>`;
      const inp=$('#sh-link',b); inp.value=link;
      inp.addEventListener('focus',()=>inp.select());
      $('#sh-copy',b).addEventListener('click',async()=>{
        let ok=false;
        try{ await navigator.clipboard.writeText(link); ok=true; }catch(e){}
        if(!ok){ try{ inp.focus(); inp.select(); ok=document.execCommand('copy'); }catch(e){} }
        toast(ok?'Link copied':'Press Ctrl/Cmd+C to copy the selected link');
      });
    },
    buttons:[{label:'Close',primary:false}]});
}
function clearHash(){ try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
async function handleHash(){
  const h=location.hash; if(h.indexOf('#f=')!==0) return;
  let p;
  try{ p=await shareDecode(h.slice(3)); }
  catch(e){
    clearHash();
    modal({title:'Could not open shared file',narrow:true,build:b=>{ b.innerHTML=`<p style="margin:0">${esc(e&&e.code?e.message:'The shared link is not valid.')}</p>`; },buttons:[{label:'OK',primary:true}]});
    return;
  }
  const codeLines=p.code.split('\n'), shown=codeLines.slice(0,40).join('\n');
  modal({title:'Open shared file?',cancelResult:false,
    build:b=>{
      b.innerHTML=`<p class="callout">Shared code is untrusted. It opens in a new tab and never runs until you press Run, so read it first.</p>
        <dl class="kvs"><dt>Name</dt><dd id="im-name"></dd><dt>Language</dt><dd>${esc(LANGS[p.lang].label)}</dd><dt>Size</dt><dd>${p.code.length.toLocaleString()} characters, ${codeLines.length} line${codeLines.length===1?'':'s'}</dd></dl>
        <pre class="codeblock" id="im-code" tabindex="0" aria-label="Preview of the shared code"></pre>`;
      $('#im-name',b).textContent=p.name; $('#im-code',b).textContent=shown+(codeLines.length>40?'\n… ('+(codeLines.length-40)+' more lines)':'');
    },
    buttons:[{label:'Cancel',result:false,onClick:()=>{ clearHash(); }},{label:'Open as new file',primary:true,result:true,onClick:()=>{ clearHash(); addFile(p.name,p.lang,p.code,true); toast('Opened "'+cur().name+'". Nothing has been run.'); }}]});
}
window.addEventListener('hashchange',()=>{ if(location.hash.indexOf('#f=')===0) handleHash(); });

function downloadFile(){
  const f=cur(); f.code=ed.getValue();
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([f.code],{type:'text/plain;charset=utf-8'})); a.download=fileNameWithExt(f.name,f.lang);
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  }catch(e){ toast('Download is not available here.',true); }
}
function uploadFile(file){
  if(!file) return;
  if(file.size>SHARE_MAX_BYTES){ toast('That file is larger than '+Math.round(SHARE_MAX_BYTES/1024)+' KB.',true); return; }
  const rd=new FileReader();
  rd.onerror=()=>toast('Could not read that file.',true);
  rd.onload=()=>{
    const text=String(rd.result||'');
    if(text.indexOf('\u0000')>=0){ toast('That looks like a binary file.',true); return; }
    const f=addFile(cleanName(file.name)||'upload.js',langFromName(file.name),text);
    toast('Opened '+f.name);
  };
  rd.readAsText(file);
}
async function resetEditor(){
  const ok=await confirmDlg('Reset editor?','This closes all files and restores the starter file. Your code will be lost.','Reset',true);
  if(!ok) return;
  if(active) stopRun('stopped');
  const d=defaults(); S.files=d.files; S.current=d.current;
  Object.keys(RT).forEach(k=>delete RT[k]);
  ed.forgetAll(); resetFrame(); ed.open(cur()); saveNow();
  renderFiles(); afterFileSwitch(); toast('Editor reset');
}

/* ==========================================================================
   Snippet menu
   ========================================================================== */
function closeSnip(focusBtn){
  const m=$('#snip-menu'); if(m.hidden) return; m.hidden=true; $('#snip-btn').setAttribute('aria-expanded','false');
  if(focusBtn) $('#snip-btn').focus();
}
function openSnip(){
  const m=$('#snip-menu'); m.hidden=false; m.style.left=''; m.style.right=''; $('#snip-btn').setAttribute('aria-expanded','true');
  try{ const pr=m.closest('.pane').getBoundingClientRect(), mr=m.getBoundingClientRect(); if(pr.width&&mr.right>pr.right-4){ m.style.left='auto'; m.style.right='0'; } }catch(e){}
  const first=$('button',m); if(first) first.focus();
}
function buildSnipMenu(){
  const m=$('#snip-menu'); m.innerHTML='';
  SNIPPETS.forEach((s,i)=>{
    const b=el('button'); b.type='button'; b.setAttribute('role','menuitem'); b.textContent=s.name; b.dataset.i=i; m.appendChild(b);
  });
  m.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    closeSnip(false); ed.insertSnippet(SNIPPETS[+b.dataset.i].code);
  });
  m.addEventListener('keydown',e=>{
    const items=$$('button',m), i=items.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){ e.preventDefault(); items[(i+1)%items.length].focus(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); items[(i-1+items.length)%items.length].focus(); }
    else if(e.key==='Home'){ e.preventDefault(); items[0].focus(); }
    else if(e.key==='End'){ e.preventDefault(); items[items.length-1].focus(); }
    else if(e.key==='Escape'){ e.preventDefault(); e.stopPropagation(); closeSnip(true); }
    else if(e.key==='Tab'){ closeSnip(false); }
  });
  $('#snip-btn').addEventListener('click',()=>{ $('#snip-menu').hidden?openSnip():closeSnip(true); });
  $('#snip-btn').addEventListener('keydown',e=>{ if(e.key==='ArrowDown'&&$('#snip-menu').hidden){ e.preventDefault(); openSnip(); } });
  document.addEventListener('mousedown',e=>{ if(!$('#snip-menu').hidden&&!e.target.closest('.menu-wrap')) closeSnip(false); });
}

/* ==========================================================================
   Wiring
   ========================================================================== */
function initStaticUi(){
  $('#logo').innerHTML=ic('code',18);
  $('#new-file').innerHTML=ic('plus',14)+'<span>New file</span>';
  $('#run-btn').innerHTML=ic('play',14)+'<span>Run</span><span class="kbd">'+MOD+'+↵</span>';
  $('#stop-btn').innerHTML=ic('stop',14)+'<span class="lbl">Stop</span>';
  $('#wrap-btn').innerHTML=ic('wrap',16);
  $('#snip-btn').innerHTML=ic('snip',14)+'<span>Snippets</span>'+ic('chev',12);
  $('#fmt-btn').innerHTML=ic('fmt',14)+'<span class="lbl">Format</span>';
  $('#share-btn').innerHTML=ic('share',14)+'<span class="lbl">Share</span>';
  $('#dl-btn').innerHTML=ic('download',14)+'<span class="lbl">Download</span>';
  $('#ul-btn').innerHTML=ic('upload',14)+'<span class="lbl">Upload</span>';
  $('#reset-btn').innerHTML=ic('reset',14)+'<span class="lbl">Reset</span>';
  $('#clear-btn').innerHTML=ic('trash',14)+'<span>Clear</span>';
  $('#share-btn').setAttribute('aria-label','Share link'); $('#dl-btn').setAttribute('aria-label','Download file'); $('#ul-btn').setAttribute('aria-label','Upload file');
  $('#reset-btn').setAttribute('aria-label','Reset editor'); $('#fmt-btn').setAttribute('aria-label','Format'); $('#stop-btn').setAttribute('aria-label','Stop');
}
function wire(){
  $('#theme-btn').addEventListener('click',()=>{ theme=isDark()?'light':'dark'; writeTheme(theme); applyTheme(); });
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!theme) applyTheme(); }); }catch(e){}
  $('#new-file').addEventListener('click',newFileDialog);
  $('#run-btn').addEventListener('click',run);
  $('#stop-btn').addEventListener('click',()=>stopRun('stopped'));
  $('#font-dec').addEventListener('click',()=>{ S.font=Math.max(10,S.font-1); ed.setFont(S.font); save(); });
  $('#font-inc').addEventListener('click',()=>{ S.font=Math.min(24,S.font+1); ed.setFont(S.font); save(); });
  $('#wrap-btn').addEventListener('click',()=>{ S.wrap=!S.wrap; $('#wrap-btn').setAttribute('aria-pressed',String(S.wrap)); ed.setWrap(S.wrap); save(); });
  $('#fmt-btn').addEventListener('click',()=>{ const ch=ed.format(); toast(ch?'Formatted':'Already tidy'); ed.focus(); });
  $('#share-btn').addEventListener('click',shareDialog);
  $('#dl-btn').addEventListener('click',downloadFile);
  $('#ul-btn').addEventListener('click',()=>$('#upload').click());
  $('#upload').addEventListener('change',e=>{ const f=e.target.files&&e.target.files[0]; e.target.value=''; uploadFile(f); });
  $('#reset-btn').addEventListener('click',resetEditor);
  $('#clear-btn').addEventListener('click',clearConsole);
  $('#live').addEventListener('change',e=>{ S.live=e.target.checked; save(); updatePreviewFor(cur()); if(S.live&&cur().lang==='html') renderHtml(cur(),true); });
  /* file tabs */
  const files=$('#files');
  files.addEventListener('click',e=>{
    const x=e.target.closest('[data-close]'); if(x){ closeFile(x.dataset.close); return; }
    const t=e.target.closest('.fname'); if(t) selectFile(t.dataset.id,false);
  });
  files.addEventListener('dblclick',e=>{ const t=e.target.closest('.fname'); if(t) startRename(t.dataset.id); });
  files.addEventListener('keydown',e=>{
    const inp=e.target.closest('input[data-rename]');
    if(inp){ if(e.key==='Enter'){ e.preventDefault(); commitRename(inp.dataset.rename,inp.value,false); } else if(e.key==='Escape'){ e.preventDefault(); commitRename(inp.dataset.rename,inp.value,true); } return; }
    const t=e.target.closest('.fname'); if(!t) return;
    const ids=S.files.map(f=>f.id), i=ids.indexOf(t.dataset.id);
    if(e.key==='F2'){ e.preventDefault(); startRename(t.dataset.id); }
    else if(e.key==='ArrowRight'||e.key==='ArrowLeft'||e.key==='Home'||e.key==='End'){
      e.preventDefault();
      const ni=e.key==='Home'?0:e.key==='End'?ids.length-1:(i+(e.key==='ArrowRight'?1:-1)+ids.length)%ids.length;
      selectFile(ids[ni],false); const nb=$(`.fname[data-id="${ids[ni]}"]`); if(nb) nb.focus();
    }else if(e.key==='Delete'&&S.files.length>1){ e.preventDefault(); closeFile(t.dataset.id); }
  });
  files.addEventListener('focusout',e=>{ const inp=e.target.closest&&e.target.closest('input[data-rename]'); if(inp) commitRename(inp.dataset.rename,inp.value,false); });
  /* output tabs */
  const tabs=$('#otabs');
  tabs.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(b) setTab(b.dataset.tab,false); });
  tabs.addEventListener('keydown',e=>{
    const order=['console','preview','problems'], i=order.indexOf(ui.tab);
    if(e.key==='ArrowRight'){ e.preventDefault(); setTab(order[(i+1)%3],true); }
    else if(e.key==='ArrowLeft'){ e.preventDefault(); setTab(order[(i+2)%3],true); }
    else if(e.key==='Home'){ e.preventDefault(); setTab(order[0],true); }
    else if(e.key==='End'){ e.preventDefault(); setTab(order[2],true); }
  });
  /* jump-to-line links (console + problems) */
  document.addEventListener('click',e=>{
    const b=e.target.closest('.prob,.linkbtn'); if(!b||!b.dataset.line) return;
    ed.goto(+b.dataset.line,+b.dataset.col||1);
  });
  /* Ctrl/Cmd+Enter anywhere runs the current file */
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!e.shiftKey&&!e.altKey&&!$('#modal-root').firstChild){ e.preventDefault(); e.stopPropagation(); run(); }
  },true);
  window.addEventListener('pagehide',saveNow);
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveNow(); });
  buildSnipMenu();
}

function boot(){
  applyTheme(); initStaticUi(); wire();
  S.files.forEach(f=>rt(f.id));
  ed=makeTextEd($('#editor-host'),edCb); edMode='basic';
  ed.open(cur()); applyEditorPrefs(); setEdNote();
  setTab('console'); renderFiles(); afterFileSwitch();
  upgradeEditor();
  loadAcorn();
  handleHash();
}
boot();
