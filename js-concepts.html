<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Concepts Lab · Levelup</title>
<script>
/* apply the saved theme before first paint (same storage key as index.html) */
(function(){ try{ var o=JSON.parse(localStorage.getItem('code-playground:v1')); if(o&&(o.theme==='light'||o.theme==='dark')) document.documentElement.setAttribute('data-theme',o.theme); }catch(e){} })();
</script>
<style>
:root{
  color-scheme: light;
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#f1f3f7; --border:#e1e4ea; --text:#1a1e27; --muted:#667085;
  --accent:#4f46e5; --accent-h:#4338ca; --accent-soft:#eceeff; --on-accent:#ffffff;
  --good:#137a4b; --good-bg:#e5f6ed; --bad:#c0362c; --bad-bg:#fdecea; --warn:#9a5b06; --warn-bg:#fff3de;
  --code-bg:#fbfbfd; --gutter:#f1f3f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
    --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
    --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
    --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
  --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
  --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
  --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:72px}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.ev-runner{position:absolute;left:-9999px;top:0;width:320px;height:240px;border:0}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
code{font-family:var(--mono);font-size:.9em;background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
a{color:var(--accent)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent);flex:none}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-sub{color:var(--muted);font-size:12px;padding-left:10px;border-left:1px solid var(--border);white-space:nowrap}
.nav{display:flex;align-items:center;gap:2px;margin-left:12px;min-width:0;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;flex:none}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}

/* ---------- controls (shared look) ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.success{background:var(--good);border-color:var(--good);color:#fff}
.btn.success:hover:not(:disabled){filter:brightness(1.08);background:var(--good)}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--panel-2)}
.kbd{font-family:var(--mono);font-size:10px;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}
.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 10px;min-height:34px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--panel-2);color:var(--muted)}
.pill.easy{background:var(--good-bg);color:var(--good)}
.pill.medium{background:var(--warn-bg);color:var(--warn)}
.pill.hard{background:var(--bad-bg);color:var(--bad)}
.pill.react{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:2px}
.tab{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.tab:hover{background:var(--panel-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .count{font-size:11px;background:var(--panel-2);color:var(--muted);border-radius:99px;padding:0 6px}
.tab[aria-selected="true"] .count{background:var(--panel);color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 12px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.spinner{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:13px;animation:fade .2s;max-width:340px}
.toast.bad{background:var(--bad);color:var(--on-accent)}
@keyframes fade{from{opacity:0}}

/* ---------- console lines (same as index.html) ---------- */
.log{display:flex;gap:8px;padding:6px 10px;border-radius:8px;font:12.5px/1.5 var(--mono);border:1px solid transparent;margin-bottom:4px}
.log pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit;flex:1;min-width:0}
.log .ts{flex:none;color:var(--muted);font-size:11px;padding-top:1px}
.log-log,.log-info,.log-debug{background:var(--panel-2)}
.log-warn{background:var(--warn-bg);color:var(--warn)}
.log-error{background:var(--bad-bg);color:var(--bad)}
.log-result{background:var(--accent-soft);color:var(--accent);font-weight:600}
.log-meta{color:var(--muted);padding-left:2px}
.log .lv{flex:none;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding-top:2px;min-width:34px}

/* ---------- layout ---------- */
.body{display:grid;grid-template-columns:276px minmax(0,1fr);align-items:start}
.sidebar{position:sticky;top:56px;height:calc(100vh - 56px);height:calc(100dvh - 56px);display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--border)}
.side-top{padding:14px 14px 6px}
.side-top h2{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.qlist{flex:1;overflow:auto;padding:8px 8px 12px;display:grid;align-content:start;gap:2px}
.qitem{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:transparent;transition:background .12s}
.qitem:hover{background:var(--panel-2)}
.qitem.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.qstatus{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);color:transparent}
.qstatus.pass{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.qmain{display:grid;gap:1px;min-width:0}
.qtitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta{font-size:12px;color:var(--muted)}
.grp{display:grid;gap:2px}
.grp-h{display:flex;justify-content:space-between;gap:8px;padding:10px 10px 3px;font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grp-h .n{font-weight:500;letter-spacing:0;text-transform:none}
.pips{letter-spacing:1px;font-family:var(--mono);margin-right:4px}
.pips .on{color:var(--good);font-weight:700}
.side-foot{padding:10px 14px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.main{padding:16px;min-width:0}
.lesson{max-width:1020px;margin:0 auto;display:grid;gap:14px}
.l-head h1{margin:0 0 2px;font-size:22px;letter-spacing:-.01em;line-height:1.3}
.l-head p{margin:0}
.sec{padding:16px 18px;min-width:0}
.sec>h2{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;letter-spacing:-.005em}
.sec>h2 .num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12px}
.sec p{margin:0 0 10px}
.sec p:last-child{margin-bottom:0}
.explain p{font-size:14.5px;line-height:1.6;max-width:78ch}
.analogy{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--text);margin-top:4px}
.analogy b{color:var(--accent)}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}

/* ---------- editor + console ---------- */
.editor-wrap{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--code-bg)}
.editor-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.code{display:block;width:100%;border:0;outline:none;resize:vertical;background:transparent;color:var(--text);padding:12px 14px;white-space:pre;overflow:auto;tab-size:2;-moz-tab-size:2;font:13px/1.6 var(--mono);min-height:120px}
.console{border:1px solid var(--border);border-radius:10px;background:var(--panel);margin-top:10px;overflow:hidden}
.console-h{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--panel-2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.console-h .st{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;display:flex;align-items:center;gap:6px}
.console-b{padding:8px 10px;max-height:280px;overflow:auto;min-height:44px}
.console-b .empty{color:var(--muted);font-size:13px;padding:4px 2px}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}

/* ---------- visual blocks ---------- */
.viz-note{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.viz-note.warn{background:var(--warn-bg);color:var(--warn);padding:6px 10px;border-radius:8px}
.stepper{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.stepper .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.narr{padding:10px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--border);margin:10px 0;min-height:44px}
.narr b{color:var(--accent)}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:12px}
.codeview{margin:0;padding:8px 0;border:1px solid var(--border);border-radius:10px;background:var(--code-bg);font:12.5px/1.6 var(--mono);overflow:auto;counter-reset:l}
.codeview .ln{display:block;padding:0 12px 0 0;white-space:pre;border-left:3px solid transparent}
.codeview .ln::before{counter-increment:l;content:counter(l);display:inline-block;width:32px;padding-right:10px;text-align:right;color:var(--muted);opacity:.8}
.codeview .ln.on{background:var(--accent-soft);border-left-color:var(--accent)}
.scope{border:2px solid var(--border);border-radius:10px;padding:8px 10px 10px;margin-top:8px;background:color-mix(in srgb,var(--panel) 94%,var(--accent))}
.scope.d0{margin-top:0;border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.scope.d1{border-color:color-mix(in srgb,var(--good) 45%,var(--border))}
.scope.d2{border-color:color-mix(in srgb,var(--warn) 50%,var(--border))}
.scope-h{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);margin-bottom:4px}
.scope-h b{color:var(--text);text-transform:none;letter-spacing:0;font-size:12.5px}
.vars{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:2px 10px;font:12.5px/1.5 var(--mono);margin:2px 0}
.vars .n{color:var(--muted)}
.vars .v{word-break:break-word}
.chg{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:0 5px;font-family:var(--sans);font-size:11px;font-weight:700;margin-left:6px}
.fnbox{margin-top:6px;border:1px dashed var(--border);border-radius:8px;padding:4px 8px;font-size:12px;background:var(--panel)}
.fnbox code{background:none;border:0;padding:0}
.novars{font-size:12px;color:var(--muted);font-style:italic}
.memtable{width:100%;border-collapse:collapse;font:12.5px var(--mono)}
.memtable th{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--border)}
.memtable td{padding:4px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.memtable tr.chg-row td{background:var(--warn-bg)}
.memtable .kind{color:var(--muted)}
.tdz{color:var(--bad);font-weight:700}
.phase{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.phase.exec{background:var(--good-bg);color:var(--good)}

/* event loop */
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lane{border:1px solid var(--border);border-radius:10px;background:var(--panel-2);padding:8px 8px 4px;min-height:170px;display:flex;flex-direction:column}
.lane h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.lane h4 span{font-weight:500;text-transform:none;letter-spacing:0}
.lane-items{display:flex;flex-direction:column;flex:1}
.lane.stack .lane-items{flex-direction:column-reverse;justify-content:flex-start}
.chip{display:block;border:1px solid var(--border);border-left-width:4px;background:var(--panel);border-radius:8px;padding:4px 8px;font:12px/1.4 var(--mono);margin-bottom:6px;word-break:break-word}
.chip.new{animation:pop .28s ease-out}
.chip .k{display:block;font:700 10px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chip.micro{border-left-color:var(--accent)}
.chip.macro{border-left-color:var(--warn);border-left-style:dashed}
.chip.run{border-left-color:var(--good)}
.chip.running{background:var(--good-bg);border-color:var(--good)}
.chip.wait{border-style:dashed;opacity:.9}
.lane-empty{font-size:12px;color:var(--muted);font-style:italic;padding:2px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.waitbox{margin-top:auto;border-top:1px dashed var(--border);padding-top:6px}
.waitbox h5{margin:0 0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.consolebox{margin-top:10px}
.consolebox .console-b{max-height:170px}

/* timeline */
.tl{margin-top:4px;padding-right:14px}
.tl-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center;margin:5px 0}
.tl-name{font:12px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl-track{position:relative;height:24px;background:var(--panel-2);border-radius:6px;background-image:linear-gradient(to right,var(--border) 1px,transparent 1px);background-size:var(--tick,10%) 100%}
.tl-bar{position:absolute;top:3px;bottom:3px;border-radius:5px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;padding:0 6px;overflow:hidden;white-space:nowrap;line-height:18px;min-width:4px}
.tl-bar.fail{background:var(--bad);color:var(--on-accent);background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 4px,transparent 4px 8px)}
.tl-axis{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;margin-top:2px}
.tl-ticks{position:relative;height:16px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-ticks span{position:absolute;transform:translateX(-50%)}
.tl-ticks span:first-child{transform:none}
.tl-total{margin-top:8px;font-size:13px}
.tl-logs{margin:8px 0 0;padding:0;list-style:none;font:12px var(--mono);display:grid;gap:2px}
.tl-logs li{display:flex;gap:8px}
.tl-logs .t{color:var(--muted);min-width:64px;text-align:right}
.tl-mark{position:absolute;top:0;bottom:0;width:2px;background:var(--warn)}

/* this helper */
.fc{display:grid;gap:8px}
.fc-node{border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:var(--panel)}
.fc-node.q{border-left:4px solid var(--accent)}
.fc-node.done{border-left:4px solid var(--good);background:var(--good-bg)}
.fc-node .ans{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.fc-node .picked{font-size:12px;font-weight:700;color:var(--good)}
.fc-arrow{text-align:center;color:var(--muted);line-height:1;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font:700 11px var(--sans);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl pre{margin:0;font:12px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.tbl tr.sel td{background:var(--accent-soft)}
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px}
.tblwrap .tbl{min-width:560px}

/* equality */
.mxwrap{overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:460px}
.mx{border-collapse:separate;border-spacing:0;font:12px var(--mono)}
.mx th{position:sticky;top:0;z-index:2;background:var(--panel-2);padding:4px 6px;font-weight:600;white-space:nowrap;border-bottom:1px solid var(--border)}
.mx th.rh{left:0;top:auto;z-index:1;text-align:right;border-right:1px solid var(--border);border-bottom:0}
.mx th.corner{left:0;z-index:3}
.mx td{padding:0;border:0}
.mx button{display:block;width:34px;height:28px;border:1px solid var(--panel);border-radius:5px;font:700 12px var(--mono);background:var(--panel-2);color:var(--muted)}
.mx button.t{background:var(--good-bg);color:var(--good)}
.mx button.f{background:var(--bad-bg);color:var(--bad)}
.mx button.sel{outline:2px solid var(--accent);outline-offset:-2px}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.vals button{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:3px 9px;font:12.5px var(--mono)}
.vals button:hover{background:var(--panel-2)}
.vals button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.pair{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:10px 0}
.pair div{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--panel)}
.pair .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.pair .r{font:700 18px var(--mono)}
.pair .r.t{color:var(--good)}
.pair .r.f{color:var(--bad)}

/* quiz */
.qz{display:grid;gap:14px}
.qcard{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--panel)}
.qcard.pass{border-left:4px solid var(--good)}
.qcard.fail{border-left:4px solid var(--bad)}
.qcard h3{margin:0 0 8px;font-size:13px;display:flex;gap:8px;align-items:center}
.qcard h3 .badge{font-size:12px;font-weight:700;padding:1px 9px;border-radius:99px}
.badge.pass{background:var(--good-bg);color:var(--good)}
.badge.fail{background:var(--bad-bg);color:var(--bad)}
.badge.todo{background:var(--panel-2);color:var(--muted)}
.codeblock{margin:0 0 10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--code-bg);font:12.5px/1.6 var(--mono);overflow:auto;white-space:pre;tab-size:2}
.opts{display:grid;gap:6px;margin:0 0 10px;padding:0;border:0;min-width:0}
.opts legend{font-size:12px;font-weight:700;color:var(--muted);padding:0;margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:9px;padding:7px 10px;background:var(--panel);cursor:pointer}
.opt:hover{background:var(--panel-2)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt pre{margin:0;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.typed{margin-top:6px}
.typed .textarea{font:12.5px/1.5 var(--mono);min-height:64px;resize:vertical}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.cmp>div{border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--panel)}
.cmp h4{margin:0;padding:4px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel-2);border-bottom:1px solid var(--border)}
.cmp pre{margin:0;padding:8px 10px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;word-break:break-word}
.cmp .ok h4{background:var(--good-bg);color:var(--good)}
.cmp .no h4{background:var(--bad-bg);color:var(--bad)}
.why{font-size:13px;padding:8px 10px;border-radius:9px;background:var(--panel-2)}
.why b{color:var(--accent)}

/* cheat sheet */
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cheat h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cheat ul{margin:0;padding-left:18px}
.cheat li{margin:4px 0}
.cheat .mistakes li::marker{color:var(--bad);content:"✗  "}
.cheat .keys li::marker{color:var(--good);content:"✓  "}

@media (max-width:1240px){
  .brand-sub{display:none}
}
@media (max-width:960px){
  .topbar{position:static;flex-wrap:wrap;padding:8px 16px;row-gap:6px}
  .brand-sub{display:none}
  .nav{order:3;flex:1 0 100%;margin-left:0;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .spacer{display:block}
  .body{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--border)}
  .qlist{display:flex;overflow-x:auto;padding:4px 12px 10px;gap:6px;-webkit-overflow-scrolling:touch}
  .grp{display:flex;align-items:center;gap:6px;flex:none}
  .grp+.grp{border-left:1px solid var(--border);padding-left:8px}
  .grp-h{padding:0 4px;white-space:nowrap}
  .grp-h .n{display:none}
  .qitem{width:auto;flex:none;border-color:var(--border)}
  .qtitle{overflow:visible}
  .side-foot{padding:8px 16px 12px}
  .split{grid-template-columns:minmax(0,1fr)}
  .lanes{grid-template-columns:minmax(0,1fr)}
  .lane{min-height:0}
  .cheat,.cmp{grid-template-columns:minmax(0,1fr)}
  .sec{padding:14px}
}
@media (max-width:560px){
  .btn .lbl-long{display:none}
  .main{padding:12px 16px}
  .l-head h1{font-size:19px}
  .tl-row,.tl-axis{grid-template-columns:70px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

<body>
<header class="topbar">
  <div class="brand">
    <span class="logo" id="logo"></span>
    <span class="brand-name">Levelup</span>
    <span class="brand-sub">JavaScript concepts lab</span>
  </div>
  <nav class="nav" aria-label="Levelup pages" data-levelup-nav></nav>
  <div class="spacer"></div>
  <button class="icon-btn" id="theme-btn" aria-label="Toggle light/dark theme"></button>
</header>

<div class="body">
  <aside class="sidebar" aria-label="Lessons">
    <div class="side-top">
      <h2>JS concepts</h2>
      <div id="progress"></div>
    </div>
    <nav class="qlist" id="topics" aria-label="Topics"></nav>
    <div class="side-foot"><span>Predict-the-output quizzes count toward progress.</span><button class="btn sm ghost" id="reset-progress" title="Clear saved progress">Reset</button></div>
  </aside>
  <main class="main" id="main" tabindex="-1">
    <article class="lesson" id="lesson"></article>
  </main>
</div>
<div id="toasts" aria-live="polite"></div>
<div class="sr-only" id="live" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
'use strict';
/* ==========================================================================
   Web Worker source. Everything the student types runs ONLY in here.
   Modes:
     run    – light instrumentation (console capture + timers so we know when the code is idle)
     trace  – full instrumentation (Promise.then/catch/finally, queueMicrotask, await) -> event trace
     exprs  – evaluate a list of independent snippets, return the completion value of each
     gen-init / gen-op – a live generator session; chain / copy / destruct / timing / memo – lesson visualisations
   ========================================================================== */
/* Value formatter shared by the worker and the iframe runtime (stringified into both). */
function fmtFactory(){
  'use strict';
  var NP=Promise, proxies=new WeakMap();
  function isObj(v){ return v!==null&&(typeof v==='object'||typeof v==='function'); }
  function q(s){ return "'"+String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n')+"'"; }
  function isErr(e){ return e instanceof Error||(isObj(e)&&typeof e.message==='string'&&typeof e.name==='string'); }
  function errStr(e){ var n=e.name||'Error', m=e.message; return (m===undefined||m==='')?String(n):n+': '+m; }
  function keyStr(k){ return /^[A-Za-z_$][\w$]*$/.test(k)?k:q(k); }
  function fmt(v,top){ return fmtv(v,!!top,0,[]); }
  function isView(v){ return typeof ArrayBuffer!=='undefined'&&ArrayBuffer.isView(v); }
  function fmtv(v,top,d,seen){
    var t=typeof v;
    if(t==='string') return top?v:q(v);
    if(t==='number') return Object.is(v,-0)?'-0':String(v);
    if(t==='bigint') return v+'n';
    if(t==='symbol') return v.toString();
    if(t==='undefined') return 'undefined';
    if(v===null) return 'null';
    if(t==='boolean') return String(v);
    if(proxies.has(v)) return 'Proxy '+fmtv(proxies.get(v),false,d,seen);
    if(t==='function'){
      var src=''; try{ src=Function.prototype.toString.call(v); }catch(e){}
      if(/^class[\s{]/.test(src)) return '[class '+(v.name||'(anonymous)')+']';
      return '[Function'+(v.name?': '+v.name:' (anonymous)')+']';
    }
    if(seen.indexOf(v)>=0) return '[Circular]';
    try{
      if(isErr(v)) return errStr(v);
      if(Array.isArray(v)){
        if(d>=3) return '[Array]';
        seen.push(v); var a=[];
        for(var i=0;i<v.length&&i<50;i++) a.push((i in v)?fmtv(v[i],false,d+1,seen):'<empty>');
        if(v.length>50) a.push('… '+(v.length-50)+' more');
        seen.pop(); return '['+a.join(', ')+']';
      }
      if(isView(v)){
        if(typeof DataView!=='undefined'&&v instanceof DataView) return 'DataView('+v.byteLength+')';
        var items=[]; for(var k=0;k<v.length&&k<50;k++) items.push(fmtv(v[k],false,d+1,seen));
        if(v.length>50) items.push('… '+(v.length-50)+' more');
        return v.constructor.name+'('+v.length+') ['+items.join(', ')+']';
      }
      if(typeof ArrayBuffer!=='undefined'&&v instanceof ArrayBuffer) return 'ArrayBuffer('+v.byteLength+')';
      if(typeof Blob!=='undefined'&&v instanceof Blob) return (typeof File!=='undefined'&&v instanceof File?'File {name: '+q(v.name)+', ':'Blob {')+'size: '+v.size+', type: '+q(v.type)+'}';
      if(v instanceof Date) return isNaN(v)?'Invalid Date':v.toISOString();
      if(v instanceof RegExp) return String(v);
      if(v instanceof NP) return 'Promise {…}';
      if(typeof WeakMap!=='undefined'&&v instanceof WeakMap) return 'WeakMap {…}';
      if(typeof WeakSet!=='undefined'&&v instanceof WeakSet) return 'WeakSet {…}';
      if(v instanceof Map){
        if(d>=3) return '[Map]';
        seen.push(v); var m=[]; v.forEach(function(val,key){ m.push(fmtv(key,false,d+1,seen)+' => '+fmtv(val,false,d+1,seen)); }); seen.pop();
        return 'Map('+v.size+') {'+m.join(', ')+'}';
      }
      if(v instanceof Set){
        if(d>=3) return '[Set]';
        seen.push(v); var s=[]; v.forEach(function(val){ s.push(fmtv(val,false,d+1,seen)); }); seen.pop();
        return 'Set('+v.size+') {'+s.join(', ')+'}';
      }
      if(d>=3) return '[Object]';
      var proto=Object.getPrototypeOf(v), cn='';
      if(proto===null) cn='[Object: null prototype] ';
      else { var c=proto.constructor; if(c&&c.name&&c.name!=='Object') cn=c.name+' '; }
      seen.push(v);
      var keys=Object.keys(v), parts=[];
      for(var j=0;j<keys.length&&j<50;j++){
        var val2; try{ val2=fmtv(v[keys[j]],false,d+1,seen); }catch(e){ val2='[Getter error]'; }
        parts.push(keyStr(keys[j])+': '+val2);
      }
      var syms=Object.getOwnPropertySymbols(v);
      for(var y=0;y<syms.length&&y<10;y++){ if(Object.prototype.propertyIsEnumerable.call(v,syms[y])){ var v3; try{ v3=fmtv(v[syms[y]],false,d+1,seen); }catch(e){ v3='[Getter error]'; } parts.push('['+syms[y].toString()+']: '+v3); } }
      seen.pop();
      return cn+'{'+parts.join(', ')+'}';
    }catch(e){ return '[Object]'; }
  }
  return {fmt:fmt,errStr:errStr,isErr:isErr,proxies:proxies};
}

function workerMain(){
  'use strict';
  var G=self;
  var NP=Promise, PP=NP.prototype;
  var origThen=PP.then, origFinally=PP.finally;
  var origQM=(typeof G.queueMicrotask==='function')?G.queueMicrotask.bind(G):function(f){ origThen.call(NP.resolve(),f); };
  var realST=G.setTimeout.bind(G), realCT=G.clearTimeout.bind(G);
  var perf=(typeof performance!=='undefined'&&performance&&performance.now)?performance:Date;
  var T0=perf.now();
  function now(){ return perf.now()-T0; }

  var events=[], seq=0, cid=0, pidc=0, capped=false, MAXEV=900;
  var tracing=false, approx=false, inner=0, hint=null;
  var pendingTimers=0, finished=false, idleTimer=null;
  var logN=0, MAXLOG=400, indent='';
  var awLabels=[], awaitQ=[];

  function isObj(v){ return v!==null&&(typeof v==='object'||typeof v==='function'); }
  function isFn(f){ return typeof f==='function'; }

  /* ---------- formatting: shared with the sandboxed iframe runtime (see fmtFactory) ---------- */
  var fmt=__F.fmt, errStr=__F.errStr, isErr=__F.isErr, proxies=__F.proxies;

  /* ---------- trace recorder ---------- */
  function rec(type,o){
    if(!tracing) return;
    if(events.length>=MAXEV){ capped=true; return; }
    var e=o||{}; e.type=type; e.n=seq++; e.t=Math.round(now()*10)/10;
    events.push(e);
  }
  function clean(s){
    return s.replace(/__lab_ar\(/g,'').replace(/__lab_aw\(/g,'').replace(/,\d+\/\*@\*\/\)\)/g,'').replace(/\s+/g,' ').trim();
  }
  function label(fn){
    var nm=''; try{ nm=fn.name; }catch(e){}
    if(nm&&!/^(anonymous|bound )?$/.test(nm)&&nm!=='__lab_ar') return nm+'()';
    var src=''; try{ src=Function.prototype.toString.call(fn); }catch(e){}
    src=clean(src);
    if(src.length>34) src=src.slice(0,33)+'…';
    return src||'callback';
  }

  /* ---------- console + errors ---------- */
  function out(level,text){
    if(logN>=MAXLOG){ if(logN===MAXLOG){ logN++; G.postMessage({t:'note',text:'Output truncated after '+MAXLOG+' lines.'}); } return; }
    logN++;
    G.postMessage({t:'log',level:level,text:text,ms:now()});
    rec('log',{level:level,text:text});
  }
  function emit(level,args){
    out(level,indent+Array.prototype.map.call(args,function(a){ return fmt(a,true); }).join(' '));
  }
  function report(err,inPromise){
    var s; try{ s=isErr(err)?errStr(err):fmt(err,false); }catch(e){ s='error'; }
    out('error','Uncaught '+(inPromise?'(in promise) ':'')+s);
  }
  function installConsole(){
    var c=G.console||(G.console={});
    ['log','info','debug','dir','trace'].forEach(function(l){ c[l]=function(){ emit('log',arguments); }; });
    c.warn=function(){ emit('warn',arguments); };
    c.error=function(){ emit('error',arguments); };
    c.table=function(d){ emit('log',[d]); };
    c.assert=function(cond){ if(!cond){ var r=Array.prototype.slice.call(arguments,1); emit('error',['Assertion failed'+(r.length?':':'')].concat(r)); } };
    c.group=c.groupCollapsed=function(){ if(arguments.length) emit('log',arguments); indent+='  '; };
    c.groupEnd=function(){ indent=indent.slice(2); };
    c.clear=function(){};
    var counts={};
    c.count=function(l){ l=l===undefined?'default':String(l); counts[l]=(counts[l]||0)+1; emit('log',[l+': '+counts[l]]); };
  }

  /* ---------- timers (needed in both modes: they tell us when the code is idle) ---------- */
  var timers=new Map(), ivs=new Map(), ivCount=0, maxFires=12;
  function idleSoon(){
    if(idleTimer!==null) realCT(idleTimer);
    idleTimer=realST(function(){
      idleTimer=null;
      if(pendingTimers>0||finished) return;
      finished=true; finish();
    },30);
  }
  function installTimers(fires){
    maxFires=fires;
    G.setTimeout=function(fn,delay){
      var args=Array.prototype.slice.call(arguments,2);
      if(!isFn(fn)){ approx=true; return realST.apply(G,arguments); }
      delay=Number(delay); if(!(delay>0)) delay=0;
      var id=++cid, h;
      pendingTimers++;
      rec('sched-macro',{id:id,label:label(fn),delay:delay,kind:'setTimeout'});
      h=realST(function(){
        timers.delete(h); pendingTimers--;
        rec('run-macro',{id:id});
        try{ fn.apply(G,args); }catch(err){ report(err,false); }
        rec('end-macro',{id:id});
        idleSoon();
      },delay);
      timers.set(h,{id:id});
      return h;
    };
    G.setInterval=function(fn,delay){
      var args=Array.prototype.slice.call(arguments,2);
      if(!isFn(fn)){ approx=true; return 0; }
      delay=Number(delay); if(!(delay>0)) delay=0;
      var vh=1000000+(++ivCount), st={fires:0,id:0,h:null,dead:false,armed:false};
      ivs.set(vh,st);
      function arm(){
        st.id=++cid; st.armed=true; pendingTimers++;
        rec('sched-macro',{id:st.id,label:label(fn),delay:delay,kind:'setInterval'});
        st.h=realST(function(){
          st.armed=false; pendingTimers--; st.fires++;
          rec('run-macro',{id:st.id});
          try{ fn.apply(G,args); }catch(err){ report(err,false); }
          rec('end-macro',{id:st.id});
          if(!st.dead){
            if(st.fires>=maxFires){
              st.dead=true; ivs.delete(vh);
              G.postMessage({t:'note',text:maxFires===1?'setInterval was auto-cleared after its first run so the trace stays short.':'setInterval was auto-cleared after '+maxFires+' runs by the lab.'});
            } else arm();
          }
          idleSoon();
        },delay);
      }
      arm();
      return vh;
    };
    function clearAny(h){
      var iv=ivs.get(h);
      if(iv){ if(!iv.dead){ iv.dead=true; if(iv.armed){ iv.armed=false; pendingTimers--; realCT(iv.h); rec('cancel',{id:iv.id}); } } ivs.delete(h); return; }
      var t=timers.get(h);
      if(t){ timers.delete(h); pendingTimers--; rec('cancel',{id:t.id}); }
      realCT(h);
      idleSoon();
    }
    G.clearTimeout=clearAny; G.clearInterval=clearAny;
  }

  /* ---------- await instrumentation (source rewrite, trace mode only) ---------- */
  var KW_BEFORE_RE={'return':1,'typeof':1,'case':1,'do':1,'else':1,'in':1,'of':1,'instanceof':1,'new':1,'delete':1,'void':1,'throw':1,'yield':1,'await':1};
  var P3=['...','===','!==','**=','<<=','>>=','>>>','&&=','||=','??='];
  var P2=['?.','=>','==','!=','<=','>=','&&','||','??','++','--','+=','-=','*=','/=','%=','&=','|=','^=','<<','>>','**'];
  function skipTemplate(s,i){
    var n=s.length; i++;
    while(i<n){
      var c=s[i];
      if(c==='\\'){ i+=2; continue; }
      if(c==='`') return i+1;
      if(c==='$'&&s[i+1]==='{'){ i=skipBraces(s,i+2); continue; }
      i++;
    }
    throw new Error('template');
  }
  function skipBraces(s,i){
    var n=s.length, depth=1;
    while(i<n){
      var c=s[i];
      if(c==='"'||c==="'"){ i++; while(i<n&&s[i]!==c){ if(s[i]==='\\') i++; i++; } i++; continue; }
      if(c==='`'){ i=skipTemplate(s,i); continue; }
      if(c==='/'&&s[i+1]==='/'){ while(i<n&&s[i]!=='\n') i++; continue; }
      if(c==='/'&&s[i+1]==='*'){ var j=s.indexOf('*/',i+2); if(j<0) throw new Error('comment'); i=j+2; continue; }
      if(c==='{') depth++;
      else if(c==='}'){ depth--; if(depth===0) return i+1; }
      i++;
    }
    throw new Error('braces');
  }
  function tokenize(s){
    var toks=[], i=0, n=s.length, prev=null;
    function push(k,st,en){ prev={k:k,s:st,e:en,v:s.slice(st,en)}; toks.push(prev); }
    while(i<n){
      var c=s[i];
      if(/\s/.test(c)){ i++; continue; }
      if(c==='/'&&s[i+1]==='/'){ while(i<n&&s[i]!=='\n') i++; continue; }
      if(c==='/'&&s[i+1]==='*'){ var j=s.indexOf('*/',i+2); if(j<0) throw new Error('comment'); i=j+2; continue; }
      var st=i;
      if(c==='"'||c==="'"){ i++; while(i<n&&s[i]!==c){ if(s[i]==='\\') i++; i++; } if(i>=n) throw new Error('string'); i++; push('str',st,i); continue; }
      if(c==='`'){ i=skipTemplate(s,i); push('tpl',st,i); continue; }
      if(c==='/'){
        var isRe=!prev||(prev.k==='punct'&&prev.v!==')'&&prev.v!==']'&&prev.v!=='}')||(prev.k==='id'&&KW_BEFORE_RE[prev.v]===1);
        if(isRe){
          i++; var cls=false;
          while(i<n){
            var ch=s[i];
            if(ch==='\\'){ i+=2; continue; }
            if(ch==='\n') throw new Error('regex');
            if(cls){ if(ch===']') cls=false; }
            else if(ch==='[') cls=true;
            else if(ch==='/') break;
            i++;
          }
          if(i>=n) throw new Error('regex');
          i++; while(i<n&&/[a-z]/i.test(s[i])) i++;
          push('re',st,i); continue;
        }
      }
      if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
        i++; while(i<n&&/[0-9a-zA-Z_.]/.test(s[i])){ if((s[i]==='e'||s[i]==='E')&&(s[i+1]==='+'||s[i+1]==='-')) i++; i++; }
        push('num',st,i); continue;
      }
      if(/[A-Za-z_$#\u0080-￿]/.test(c)){
        i++; while(i<n&&/[\w$\u0080-￿]/.test(s[i])) i++;
        push('id',st,i); continue;
      }

  /* ---------- prototype chains (lesson 4) ---------- */

  /* ---------- copy graphs (lesson 7) ---------- */
  function typeName(v){

      var p=path?path+(Array.isArray(o)?'['+k+']':'.'+k):k;
      var row={path:p,depth:depth,type:typeName(ov),status:'',note:''};
      if(!has){ row.status='dropped'; row.note='missing in the copy'; }
      else if(isObj(ov)){
        if(cv===ov){ row.status='shared'; row.note='same object in memory: changing one changes the other'; }
        else if(typeName(cv)===typeName(ov)){ row.status='copied'; row.note='independent copy'; }
        else { row.status='converted'; row.note='became '+typeName(cv)+' '+fmt(cv,false); }
      } else {
        if(Object.is(ov,cv)) { row.status='value'; row.note='primitive: copied by value'; }
        else { row.status='changed'; row.note='became '+fmt(cv,false); }

const TOPICS=[
{
  id:'closures',title:'Closures',tag:'Functions remember where they were born',
  explain:[
    'A <b>closure</b> is a function that remembers the variables from the place where it was created, even after that place has finished running. Normally a function\'s local variables disappear when it returns, but if an inner function still needs them, JavaScript keeps them alive for it.',
    'It is the <b>variable</b> that is remembered, not a copy of its value, so later changes are visible to the closure. Every time the outer function runs, it makes a fresh set of variables, so two closures made by two calls never share their state.',
    'That is why closures are the standard tool for counters, private data, callbacks and factories.'
  ],
  analogy:'Think of a <b>backpack</b>. When an inner function leaves the outer function it carries a backpack with the variables it needs. Each call of the outer function packs a new backpack, and the function keeps using the contents whenever it runs.',
  variants:[

    {id:'private',label:'Private variables',code:"function createAccount(initial) {\n  let balance = initial; // private: not a property\n  return {\n    deposit(n) { balance += n; return balance; },\n    getBalance() { return balance; }\n  };\n}\nconst acct = createAccount(100);\nacct.deposit(50);\nconsole.log(acct.getBalance());\nconsole.log(acct.balance);\n",expect:'150\nundefined',scenes:'private'},
    {id:'loopvar',label:'Loop with var',code:"for (var i = 0; i < 3; i++) {\n  setTimeout(function () {\n    console.log(i);\n  }, 0);\n}\n",expect:'3\n3\n3',scenes:'loopvar'},
    {id:'looplet',label:'Loop with let',code:"for (let i = 0; i < 3; i++) {\n  setTimeout(function () {\n    console.log(i);\n  }, 0);\n}\n",expect:'0\n1\n2',scenes:'looplet'}
  ],
  quiz:[
    {id:'c1',code:"function outer() {\n  let n = 0;\n  return () => ++n;\n}\nconst f = outer();\nf();\nf();\nconsole.log(f());",options:['1','3','0','undefined'],why:'<code>n</code> lives in the closure and survives between calls. The third call to <code>f</code> makes it 3.'},
    {id:'c2',code:"function makeAdder(x) {\n  return function (y) {\n    return x + y;\n  };\n}\nconst add5 = makeAdder(5);\nconst add10 = makeAdder(10);\nconsole.log(add5(2), add10(2));",options:['7 7','12 12','7 12','NaN NaN'],why:'Each call to <code>makeAdder</code> creates its own <code>x</code>: 5 for <code>add5</code>, 10 for <code>add10</code>. So 5+2 and 10+2.'},

    {id:'c4',code:"function make() {\n  let c = 0;\n  return { inc: () => ++c, get: () => c };\n}\nconst a = make();\nconst b = make();\na.inc(); a.inc(); b.inc();\nconsole.log(a.get(), b.get());",options:['3 3','2 2','1 1','2 1'],why:'<code>a</code> and <code>b</code> came from two different calls, so they have separate <code>c</code> variables: <code>a</code> counted twice, <code>b</code> once.'}
  ],
  cheat:{
    keys:['A closure = a function + the variables from where it was created.','It keeps the <em>variable</em> alive, not a snapshot of the value.','Each call of the outer function creates a new, independent set of variables.','Use closures for private state, factories, callbacks and partial application.'],
    mistakes:['Using <code>var</code> in a loop with async callbacks: they all share one <code>i</code>. Use <code>let</code>.','Expecting a closure to copy the value: if the variable changes later, the closure sees the new value.']

{
  id:'eventloop',title:'Event loop',tag:'Who runs next: stack, microtasks, tasks',
  explain:[
    'JavaScript runs one thing at a time on the <b>call stack</b>. When the stack is empty, the <b>event loop</b> picks the next job. It always empties the <b>microtask queue</b> first (promise callbacks, <code>queueMicrotask</code>, the code after an <code>await</code>) and only then takes one job from the <b>task queue</b> (timers like <code>setTimeout</code>, events).',
    'So <code>setTimeout(fn, 0)</code> does not mean "now". It means "after the current script and after every pending microtask". Promise callbacks always beat timers.'
  ],
  analogy:'Picture a <b>kitchen with one chef</b> (the call stack). Urgent sticky notes (microtasks) must all be handled before the chef looks at the next customer order (task queue), and the chef never does two things at once.',
  variants:[
    {id:'ex1',label:'Sync vs setTimeout(0)',code:"console.log('1: script start');\n\nsetTimeout(() => console.log('3: timeout (0 ms)'), 0);\n\nconsole.log('2: script end');\n",expect:'1: script start\n2: script end\n3: timeout (0 ms)'},
    {id:'ex2',label:'Promise vs timeout',code:"console.log(1);\nsetTimeout(() => console.log(2), 0);\nPromise.resolve().then(() => console.log(3));\nconsole.log(4);\n",expect:'1\n4\n3\n2'},
    {id:'ex3',label:'async / await order',code:"async function a() {\n  console.log('a start');\n  await b();\n  console.log('a end');\n}\nasync function b() {\n  console.log('b');\n}\nconsole.log('script start');\nsetTimeout(() => console.log('timeout'), 0);\na();\nnew Promise(r => {\n  console.log('p1');\n  r();\n}).then(() => console.log('then'));\nconsole.log('script end');\n",expect:'script start\na start\nb\np1\nscript end\na end\nthen\ntimeout'},
    {id:'ex4',label:'Nested timers & microtasks',code:"setTimeout(() => {\n  console.log('timer 1');\n  Promise.resolve().then(() => console.log('micro in timer 1'));\n}, 0);\nsetTimeout(() => console.log('timer 2'), 0);\nPromise.resolve()\n  .then(() => {\n    console.log('micro 1');\n    queueMicrotask(() => console.log('micro 1b'));\n    setTimeout(() => console.log('timer from micro'), 0);\n  })\n  .then(() => console.log('micro 2'));\nconsole.log('sync');\n",expect:'sync\nmicro 1\nmicro 1b\nmicro 2\ntimer 1\nmicro in timer 1\ntimer 2\ntimer from micro'}
  ],
  quiz:[
    {id:'e1',code:"console.log('A');\nsetTimeout(() => console.log('B'), 0);\nPromise.resolve().then(() => console.log('C'));\nconsole.log('D');",options:['A\nB\nC\nD','A\nD\nB\nC','A\nD\nC\nB','A\nC\nD\nB'],why:'Sync code first (A, D). Then the microtask (C) beats the timer (B).'},
    {id:'e2',code:"setTimeout(() => console.log('timeout'), 0);\nqueueMicrotask(() => console.log('micro'));\n(async () => {\n  console.log('async start');\n  await null;\n  console.log('async end');\n})();\nconsole.log('sync');",options:['async start\nsync\ntimeout\nmicro\nasync end','sync\nasync start\nmicro\nasync end\ntimeout','async start\nsync\nmicro\nasync end\ntimeout','async start\nmicro\nsync\nasync end\ntimeout'],why:'The async function runs synchronously until the first <code>await</code> ("async start"), then the script ends ("sync"). Microtasks run in the order they were queued: the <code>queueMicrotask</code> callback first, then the code after <code>await</code>. The timer goes last.'},
    {id:'e3',code:"Promise.resolve()\n  .then(() => {\n    console.log(1);\n    setTimeout(() => console.log(2), 0);\n  })\n  .then(() => console.log(3));\nsetTimeout(() => console.log(4), 0);\nconsole.log(5);",options:['5\n1\n3\n2\n4','5\n1\n3\n4\n2','5\n1\n2\n3\n4','1\n3\n5\n4\n2'],why:'5 is sync. Then microtasks 1 and 3 run back to back. The timer for 4 was registered before the timer for 2, so 4 goes first.'},
    {id:'e4',code:"setTimeout(() => console.log('t1'), 0);\nsetTimeout(() => {\n  console.log('t2');\n  Promise.resolve().then(() => console.log('micro in t2'));\n}, 0);\nsetTimeout(() => console.log('t3'), 0);",options:['t1\nt2\nt3\nmicro in t2','t1\nt2\nmicro in t2\nt3','micro in t2\nt1\nt2\nt3','t1\nmicro in t2\nt2\nt3'],why:'The event loop runs microtasks after each task. When <code>t2</code> finishes, its promise callback runs before <code>t3</code> starts.'}
  ],
  cheat:{
    keys:['One call stack: JavaScript runs one thing at a time.','Order: current script, then <em>all</em> microtasks, then one task, then microtasks again, and so on.','Microtasks: promise <code>.then/.catch/.finally</code>, <code>queueMicrotask</code>, code after <code>await</code>.','Tasks: <code>setTimeout</code>, <code>setInterval</code>, events. The delay is a minimum, not a promise.','A microtask that queues more microtasks runs them before any task: it can starve the page.'],

{
  id:'promises',title:'Promises & async/await',tag:'Values that arrive later',
  explain:[
    'A <b>promise</b> is an object that stands for a value that is not ready yet. It starts <span class="pill">pending</span> and ends up either <span class="pill easy">fulfilled</span> with a value or <span class="pill hard">rejected</span> with an error, and then it never changes again.',
    'You react with <code>.then()</code> for success, <code>.catch()</code> for errors and <code>.finally()</code> for cleanup. Each of those returns a new promise, so you can chain them. <code>async</code>/<code>await</code> is the same thing with nicer syntax: <code>await</code> pauses only that function, not the whole program.',
    'Independent work should start together: <code>Promise.all</code> waits for everything, <code>Promise.race</code> takes the first result, and <code>Promise.allSettled</code> waits for everything and never rejects.'
  ],
  analogy:'A promise is the <b>pager</b> a restaurant hands you. It buzzes once, either "your food is ready" or "sorry, we ran out", and meanwhile you are free to do other things. Awaiting things one after another is like ordering course by course; <code>Promise.all</code> is ordering everything at once.',
  variants:[
    {id:'seq',label:'Sequential awaits',code:"// task(name, ms) is provided by the lab.\nasync function main() {\n  console.log('start');\n  const a = await task('A', 200);\n  const b = await task('B', 300);\n  const c = await task('C', 100);\n  console.log('finished', a, b, c);\n}\nmain();\n",helpers:true,expect:'start\nfinished A B C'},
    {id:'par',label:'Parallel: Promise.all',code:"async function main() {\n  console.log('start');\n  const results = await Promise.all([\n    task('A', 200),\n    task('B', 300),\n    task('C', 100)\n  ]);\n  console.log('finished', results.join(' '));\n}\nmain();\n",helpers:true,expect:'start\nfinished A B C'},
    {id:'race',label:'race & allSettled',code:"async function main() {\n  const first = await Promise.race([task('slow', 300), task('fast', 100)]);\n  console.log('race winner:', first);\n  const all = await Promise.allSettled([\n    task('ok', 150),\n    task('bad', 250, true) // true = this task fails\n  ]);\n  console.log(all.map(r => r.status).join(', '));\n}\nmain();\n",helpers:true,expect:'race winner: fast\nfulfilled, rejected'},
    {id:'chain',label:'Chain, catch, finally',code:"task('load', 150)\n  .then(v => {\n    console.log('loaded', v);\n    return task('parse', 100, true); // fails\n  })\n  .then(() => console.log('never runs'))\n  .catch(err => console.log('caught:', err.message))\n  .finally(() => console.log('cleanup'));\n",helpers:true,expect:'loaded load\ncaught: parse failed\ncleanup'}
  ],
  quiz:[
    {id:'p1',code:"const p = new Promise((resolve, reject) => {\n  console.log('executor');\n  resolve('done');\n  reject(new Error('too late'));\n});\np.then(v => console.log(v));\nconsole.log('after');",options:['executor\ndone\nafter','after\nexecutor\ndone','executor\nafter\ndone','executor\nafter\ndone\nError: too late'],why:'The executor runs immediately (synchronously). A promise settles only once: the later <code>reject</code> is ignored. The <code>.then</code> callback always runs asynchronously, after "after".'},
    {id:'p2',code:"Promise.resolve(1)\n  .then(x => x + 1)\n  .then(x => { throw new Error('boom ' + x); })\n  .then(() => console.log('skipped'))\n  .catch(e => console.log(e.message))\n  .finally(() => console.log('cleanup'));",options:['boom 2\ncleanup','skipped\nboom 2\ncleanup','boom 1\ncleanup','boom 2'],why:'The error skips every <code>.then</code> until the <code>.catch</code>, which prints <code>boom 2</code> (1 + 1). <code>.finally</code> always runs afterwards.'},
    {id:'p3',code:"const wait = (ms, v) => new Promise(r => setTimeout(() => r(v), ms));\nPromise.race([wait(50, 'slow'), wait(10, 'fast')])\n  .then(v => console.log(v));",options:['slow','fast','slow\nfast','fast\nslow'],why:'<code>Promise.race</code> settles with the first promise that settles: the 10 ms one.'},
    {id:'p4',code:"Promise.allSettled([\n  Promise.resolve('ok'),\n  Promise.reject('no')\n]).then(rs => console.log(rs.map(r => r.status).join(',')));",options:['fulfilled,fulfilled','rejected','fulfilled,rejected','ok,no'],why:'<code>allSettled</code> never rejects. It reports each promise\'s status: the first is <code>fulfilled</code>, the second <code>rejected</code>.'}

  cheat:{
    keys:['A promise is pending, then fulfilled or rejected, once.','<code>.then</code>, <code>.catch</code>, <code>.finally</code> each return a new promise, so you can chain.','<code>await</code> pauses only its own async function, not the program.','Independent tasks: start them together and <code>await Promise.all([...])</code>.','<code>allSettled</code> never rejects; <code>race</code> takes the first to settle.'],

{
  id:'this',title:'this binding',tag:'It depends on how the function is called',
  explain:[
    'Inside a function, <code>this</code> is not decided by where the function is <em>written</em> but by <b>how it is called</b>. There are four rules, checked in this order: <b>new</b> (a fresh object), <b>explicit</b> (<code>call</code>/<code>apply</code>/<code>bind</code> choose it), <b>implicit</b> (<code>obj.method()</code> uses <code>obj</code>) and <b>default</b> (a plain call gets the global object, or <code>undefined</code> in strict mode).',
    'Arrow functions are the exception: they have no <code>this</code> of their own and use the one from the surrounding code, forever.',
    'The classic bug is pulling a method out of its object (<code>const f = obj.method; f()</code>): the dot is gone, so <code>this</code> is gone too.'
  ],
  analogy:'<code>this</code> works like the word <b>"I"</b>. It means whoever is speaking at that moment, not who wrote the sentence. An arrow function is a note written by your boss: "I" always means the boss, no matter who reads it aloud.',
  variants:[
    {id:'rules',label:'The four rules',code:"var who = 'global';\nconst obj = { who: 'obj', hi() { return this.who; } };\nfunction show() { return this.who; }\n\nconsole.log(show());                      // default\nconsole.log(obj.hi());                    // implicit\nconsole.log(show.call({ who: 'call' }));  // explicit\nconsole.log(new (function () { this.who = 'new'; })().who); // new\n",expect:'global\nobj\ncall\nnew'},
    {id:'lost',label:'Losing this',code:"const counter = {\n  count: 0,\n  inc() { this.count++; return this.count; }\n};\nconsole.log(counter.inc());               // 1\nconst lost = counter.inc;\nconsole.log(lost());                      // NaN: this = globalThis\nconsole.log(counter.inc.bind(counter)()); // 2: bind fixes this\n",expect:'1\nNaN\n2'},
    {id:'arrow',label:'Arrow functions',code:"const team = {\n  label: 'Team A',\n  members: ['Ann', 'Bo'],\n  listRegular() {\n    return this.members.map(function (m) { return m + ' @ ' + this.label; });\n  },\n  listArrow() {\n    return this.members.map(m => m + ' @ ' + this.label);\n  }\n};\nconsole.log(team.listRegular().join(' | '));\nconsole.log(team.listArrow().join(' | '));\n",expect:'Ann @ undefined | Bo @ undefined\nAnn @ Team A | Bo @ Team A'}
  ],
  quiz:[
    {id:'t1',code:"const user = {\n  title: 'Ada',\n  hello() { return this.title; }\n};\nconst fn = user.hello;\nconsole.log(user.hello(), fn());",options:['Ada Ada','Ada undefined','undefined undefined','Ada null'],why:'<code>user.hello()</code> has an object before the dot. <code>fn()</code> is a plain call: <code>this</code> is the global object, which has no <code>title</code>.'},
    {id:'t2',code:"function show() { return this.v; }\nconst a = { v: 'A', show };\nconst b = { v: 'B' };\nconsole.log(a.show(), show.call(b), show.bind(a).call(b));",options:['A B B','A B A','A A A','B B A'],why:'Implicit: <code>a.show()</code> gives A. <code>call(b)</code> gives B. A bound function ignores later <code>call</code>, so the third is A.'},
    {id:'t3',code:"const obj = {\n  regular() { return [1].map(function () { return this === obj; })[0]; },\n  arrow() { return [1].map(() => this === obj)[0]; }\n};\nconsole.log(obj.regular(), obj.arrow());",options:['true true','false false','true false','false true'],why:'The regular callback is a plain call, so <code>this</code> is the global object. The arrow reuses <code>this</code> from <code>arrow()</code>, which is <code>obj</code>.'},

{
  id:'hoisting',title:'Hoisting & var / let / const',tag:'Declarations are known before code runs',
  explain:[
    'Before running any line, JavaScript makes a quick <b>creation phase</b> pass over a scope and registers every declaration. Then the <b>execution phase</b> runs the code line by line, which is why some names can be used "before" they appear.',
    '<code>function</code> declarations are hoisted completely, body included. <code>var</code> is hoisted as <code>undefined</code> and only receives its value when its line runs. <code>let</code> and <code>const</code> are hoisted as well, but stay in the <b>temporal dead zone</b>: touching them before their line throws a <code>ReferenceError</code>. Also, <code>var</code> belongs to the whole function while <code>let</code>/<code>const</code> belong to the nearest block.'
  ],
  analogy:'Like a teacher reading the <b>class list</b> before the lesson: every name is on the list from the start (declared). <code>var</code> students are marked "absent" (<code>undefined</code>), <code>let</code>/<code>const</code> students are marked "not arrived, do not talk to them yet", and function declarations arrive already carrying their homework.',
  variants:[
    {id:'hvar',label:'var is hoisted',code:"console.log(score);\nvar score = 10;\nconsole.log(score);\n",expect:'undefined\n10',scenes:'hvar'},
    {id:'hfunc',label:'Function vs expression',code:"console.log(typeof hello);\nconsole.log(typeof shout);\nfunction hello() { return 'hi'; }\nvar shout = function () { return 'HEY'; };\nconsole.log(typeof shout);\n",expect:'function\nundefined\nfunction',scenes:'hfunc'},
    {id:'htdz',label:'let and the dead zone',code:"try {\n  console.log(age);\n} catch (e) {\n  console.log(e.name);\n}\nlet age = 30;\nconsole.log(age);\n",expect:'ReferenceError\n30',scenes:'htdz'},
    {id:'hblock',label:'Block scope',code:"if (true) {\n  var a = 1;\n  let b = 2;\n}\nconsole.log(typeof a);\nconsole.log(typeof b);\n",expect:'number\nundefined',scenes:'hblock'}
  ],
  quiz:[
    {id:'h1',code:"console.log(typeof hi);\nconsole.log(typeof bye);\nfunction hi() {}\nvar bye = function () {};",options:['function\nfunction','undefined\nundefined','function\nundefined','undefined\nfunction'],why:'The function declaration <code>hi</code> is hoisted with its body. <code>bye</code> is a <code>var</code>: hoisted as <code>undefined</code>, and the function is only assigned later.'},
    {id:'h2',code:"var x = 1;\nfunction test() {\n  console.log(x);\n  var x = 2;\n}\ntest();",options:['1','2','undefined','ReferenceError'],why:'Inside <code>test</code>, <code>var x</code> is hoisted to the top of the function as <code>undefined</code>, shadowing the outer <code>x</code>. The log runs before the assignment.'},
    {id:'h3',code:"try {\n  console.log(v);\n} catch (e) {\n  console.log(e.name);\n}\nlet v = 5;",options:['undefined','5','ReferenceError','TypeError'],why:'<code>let v</code> is in the temporal dead zone until its line runs, so reading it throws a <code>ReferenceError</code>.'},
    {id:'h4',code:"for (var i = 0; i < 3; i++) {}\nconsole.log(i);\n{\n  let j = 1;\n}\nconsole.log(typeof j);",options:['undefined\nundefined','3\nundefined','3\nnumber','2\nundefined'],why:'<code>var i</code> is not block scoped, so it is still 3 after the loop. <code>let j</code> only exists inside its block, so <code>typeof j</code> is <code>"undefined"</code>.'}
  ],
  cheat:{
    keys:['Two phases: creation (declarations registered) then execution (line by line).','<code>function</code> declarations: fully hoisted. <code>var</code>: hoisted as <code>undefined</code>.','<code>let</code>/<code>const</code>: hoisted but in the temporal dead zone until declared.','<code>var</code> is function scoped; <code>let</code>/<code>const</code> are block scoped.','Prefer <code>const</code>, then <code>let</code>; avoid <code>var</code>.'],
    mistakes:['Calling a function expression (<code>var f = function(){}</code>) before its line: <code>f</code> is <code>undefined</code>, so you get a TypeError.','Assuming <code>let</code> is not hoisted: it is, which is why the shadowing outer variable does not leak in.']
  }
},
{
  id:'equality',title:'Equality, truthiness & coercion',tag:'When JavaScript converts types for you',
  explain:[
    '<code>===</code> (strict equality) compares type and value with no conversions: different types are never equal. <code>==</code> (loose equality) first converts the operands to a common type using a long list of rules, which is where surprises like <code>0 == ""</code> come from. Use <code>===</code> by default.',
    'In conditions (<code>if</code>, <code>&&</code>, <code>!</code>) values become <b>truthy</b> or <b>falsy</b>, and exactly eight values are falsy: <code>false</code>, <code>0</code>, <code>-0</code>, <code>0n</code>, <code>""</code>, <code>null</code>, <code>undefined</code> and <code>NaN</code>. Everything else, including <code>"0"</code>, <code>[]</code> and <code>{}</code>, is truthy.',
    'Watch for oddities: <code>+</code> joins text as soon as a string is involved, <code>typeof null</code> is <code>"object"</code>, and <code>NaN</code> is not equal to anything, not even itself.'
  ],
  analogy:'<code>===</code> is a <b>passport check</b>: identical documents or no entry. <code>==</code> is a helpful translator who "fixes" your documents until they look alike, which is convenient until it decides that <code>0</code> and <code>""</code> are the same person.',
  variants:[
    {id:'eq',label:'== vs ===',code:"console.log(0 == false, 0 === false);\nconsole.log('' == 0, '' === 0);\nconsole.log(null == undefined, null === undefined);\nconsole.log('1' == 1, '1' === 1);\nconsole.log(NaN == NaN, Object.is(NaN, NaN));\n",expect:'true false\ntrue false\ntrue false\ntrue false\nfalse true'},
    {id:'falsy',label:'Truthy or falsy?',code:"const values = [0, -0, '', ' ', '0', null, undefined, NaN, [], {}, 'false'];\nfor (const v of values) {\n  console.log([v], v ? 'truthy' : 'falsy');\n}\n",expect:"[0] falsy\n[-0] falsy\n[''] falsy\n[' '] truthy\n['0'] truthy\n[null] falsy\n[undefined] falsy\n[NaN] falsy\n[[]] truthy\n[{}] truthy\n['false'] truthy"},
    {id:'coerce',label:'Coercion surprises',code:"console.log(JSON.stringify([] + []));\nconsole.log([] + {});\nconsole.log(1 + '2', '3' - 1, true + true);\nconsole.log(typeof null, typeof NaN, typeof []);\nconsole.log(0.1 + 0.2 === 0.3, 0.1 + 0.2);\n",expect:'""\n[object Object]\n12 2 2\nobject number object\nfalse 0.30000000000000004'}
  ],
  quiz:[
    {id:'q1',code:"console.log(0 == '', null == undefined, null == 0, NaN == NaN);",options:['true true true false','true true false false','false true false false','true false false true'],why:'<code>0 == ""</code>: the string becomes 0, so true. <code>null == undefined</code> is a special true. <code>null</code> only loosely equals <code>undefined</code> (not 0), so false. <code>NaN</code> never equals anything.'},
    {id:'q2',code:"console.log(typeof ([] + []), [] + {}, 1 + '2', '3' - 1);",options:['string [object Object] 12 2','object [object Object] 3 2','string 0 12 2','string [object Object] 3 2'],why:'<code>[] + []</code> becomes <code>"" + ""</code>, a string. An object turns into <code>"[object Object]"</code>. With a string, <code>+</code> concatenates (<code>"12"</code>) but <code>-</code> always does maths (<code>3 - 1</code>).'},
    {id:'q3',code:"console.log(typeof null, typeof undefined, typeof NaN, typeof []);",options:['null undefined NaN array','object undefined number object','object undefined NaN array','null undefined number object'],why:'<code>typeof null</code> is a historic bug that stays <code>"object"</code>. <code>NaN</code> is a number. Arrays are objects.'},
    {id:'q4',code:"const vals = [0, '', '0', [], {}, null, NaN, ' '];\nconsole.log(vals.filter(Boolean).length);",options:['2','3','4','5'],why:'Falsy here: <code>0</code>, <code>""</code>, <code>null</code>, <code>NaN</code>. Truthy: <code>"0"</code>, <code>[]</code>, <code>{}</code> and <code>" "</code>, which makes 4.'}
  ],
  cheat:{
    keys:['Default to <code>===</code> and <code>!==</code>.','Falsy values: <code>false 0 -0 0n "" null undefined NaN</code>. Everything else is truthy.','<code>null == undefined</code> is true, and they equal nothing else loosely.','<code>NaN !== NaN</code>: use <code>Number.isNaN(x)</code> or <code>Object.is</code>.','<code>+</code> concatenates when a string is involved; <code>-</code>, <code>*</code>, <code>/</code> always convert to numbers.'],
    mistakes:['Writing <code>if (arr == false)</code> or <code>if (str)</code> to test for "empty": <code>"0"</code> and <code>[]</code> are truthy.','Using <code>typeof x === "object"</code> to detect objects without excluding <code>null</code>.']
  }
}
