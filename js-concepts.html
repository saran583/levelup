    }
    if(result){
      const R=THIS_RULES[result];
      h+=`<div class="fc-node done"><b>${esc(R.title)}</b><div>${R.res}</div>${target?(target.rule===result?`<div class="picked">✓ Matches the selected example (“${esc(target.title)}”).</div>`:`<div class="picked" style="color:var(--bad)">✗ The selected example (“${esc(target.title)}”) is actually a <b>${esc(THIS_RULES[target.rule].title)}</b> case.</div>`):''}<div class="ans"><button class="btn sm" data-restart="1">${ic('reset',12)}<span>Start over</span></button></div></div>`;
      announce(R.title+'. '+plainText(R.res));
    } else if(path.length){
      h+=`<div class="ans"><button class="btn sm ghost" data-restart="1">${ic('reset',12)}<span>Start over</span></button></div>`;
    }
    q('fc').innerHTML=h;
  }
  host.addEventListener('click',e=>{
    const y=e.target.closest('[data-yes]');
    if(y){
      const cur=path.length?path[path.length-1]:null;
      const qi=cur?cur.next:0, Q=THIS_Q[qi], yes=y.dataset.yes==='1';
      const to=yes?Q.yes:Q.no;
      const nextIdx=THIS_Q.findIndex(x=>x.id===to);
      path.push({i:qi,yes:yes,next:nextIdx,result:nextIdx<0?to:null});
      drawFlow(); return;
    }
    if(e.target.closest('[data-restart]')){ path=[]; drawFlow(); return; }
    const pick=e.target.closest('[data-row]');
    if(pick){
      const row=THIS_ROWS.find(r=>r.id===pick.dataset.row);
      target=target&&target.id===row.id?null:row; path=[]; drawTable(); drawFlow();
      if(target) announce('Selected example: '+target.title+'. Now answer the questions.');
    }
  });
  function drawTable(){
    const rows=THIS_ROWS.map(r=>{
      const res=results[r.id];
      const val=res?(res.ok?`<code>${esc(res.value)}</code>`:`<span class="tdz">${esc(res.error)}</span>`):'<span class="muted">…</span>';
      return `<tr class="${target&&target.id===r.id?'sel':''}"><td><b>${esc(r.title)}</b><pre>${esc(r.code)}</pre></td><td>${esc(THIS_RULES[r.rule].title)}</td><td>${val}</td><td>${r.why}</td><td><button class="btn sm" data-row="${r.id}" aria-pressed="${target&&target.id===r.id}">${target&&target.id===r.id?'Selected':'Check in helper'}</button></td></tr>`;
    }).join('');
    q('tbl').innerHTML=`<div class="tblwrap"><table class="tbl"><caption class="sr-only">Examples of this binding with their computed results</caption><thead><tr><th scope="col">Example</th><th scope="col">Rule</th><th scope="col">Result</th><th scope="col">Why</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const job=startWorker({mode:'exprs',items:THIS_ROWS.map(r=>({id:r.id,code:r.code}))},{timeout:3000});
  job.promise.then(res=>{
    if(!live) return;
    if(res.status==='done'&&res.exprs) res.exprs.forEach(x=>{ results[x.id]=x; });
    else q('tbl').insertAdjacentHTML('afterbegin',`<p class="viz-note warn">${esc(res.message||'Could not run the examples.')}</p>`);
    if(res.status==='done') drawTable();
  });
  drawFlow();
  return {destroy(){ live=false; job.cancel(); }};
}

/* ---------- 6. Equality matrix ---------- */
function explainPair(a,b,ra){
  const ta=a.type,tb=b.type;
  if(a.label==='NaN'||b.label==='NaN') return '<code>NaN</code> is the only value that is not equal to itself, so every comparison with it is false with <code>==</code> and <code>===</code>. <code>Object.is(NaN, NaN)</code> is the exception: true. Use <code>Number.isNaN()</code>.';
  if(ta==='object'&&tb==='object'&&ta!=='null') return 'Two objects (arrays are objects) are equal only if they are the <b>same object in memory</b>. Every literal creates a new one, so even <code>[] == []</code> is false.';
  if((a.label==='null'&&b.label==='undefined')||(a.label==='undefined'&&b.label==='null')) return '<code>null == undefined</code> is a special rule: true. They are different types, so <code>===</code> is false.';
  if(a.label==='null'||b.label==='null'||a.label==='undefined'||b.label==='undefined') return '<code>null</code> and <code>undefined</code> loosely equal only each other, nothing else (not even 0 or <code>false</code>).';
  if(ta===tb) return 'Same type: <code>==</code> and <code>===</code> compare exactly the same way, so they agree.';
  if(ta==='boolean'||tb==='boolean') return 'With <code>==</code>, a boolean is first converted to a number (<code>true</code> → 1, <code>false</code> → 0) and the comparison starts again. With <code>===</code> the types differ, so it is false.';
  if((ta==='number'&&tb==='string')||(ta==='string'&&tb==='number')) return 'With <code>==</code>, the string is converted to a number (<code>"0"</code> → 0, <code>""</code> → 0) before comparing. With <code>===</code> the types differ, so it is false.';
  if(ta==='object'||tb==='object') return 'With <code>==</code>, an object is converted to a primitive first (<code>[]</code> → <code>""</code>, <code>[0]</code> → <code>"0"</code>, <code>{}</code> → <code>"[object Object]"</code>) and the comparison starts again. <code>===</code> never converts.';
  return 'Different types: <code>===</code> is false; <code>==</code> tries converting them first.';
}
function vizEquality(host,L){
  const N=EQ_VALUES.length, OPS=['==','===','Object.is'];
  const meta=EQ_VALUES.map((src,i)=>({src:src,label:EQ_LABELS[i],type:EQ_LABELS[i]==='null'?'null':EQ_LABELS[i]==='undefined'?'undefined':/^'/.test(EQ_LABELS[i])?'string':/^(true|false)$/.test(EQ_LABELS[i])?'boolean':/^[\[{]/.test(EQ_LABELS[i])?'object':'number'}));
  let op='==',A=0,B=2,grid=null,live=true,pairJob=null,pairSeq=0;
  const cell=(i,j,o)=>o==='Object.is'?`Object.is((${EQ_VALUES[i]}), (${EQ_VALUES[j]}))`:`(${EQ_VALUES[i]}) ${o} (${EQ_VALUES[j]})`;
  host.innerHTML=`<p class="viz-note">Click a cell (or pick two values below). Every result is computed live by evaluating the real expression in the sandbox.</p>
    <div class="row" style="margin-bottom:10px"><span class="hint" id="eq-op-l">Operator:</span><div class="seg" role="group" aria-labelledby="eq-op-l" data-r="ops"></div><span class="spinner" data-r="spin"></span></div>
    <div class="mxwrap" data-r="mx" role="region" aria-label="Equality matrix. Use the arrow keys to move between cells."></div>
    <div class="row" style="margin-top:12px"><span class="hint" id="eq-a-l">Value A:</span><div class="vals" role="group" aria-labelledby="eq-a-l" data-r="va"></div></div>
    <div class="row" style="margin-top:8px"><span class="hint" id="eq-b-l">Value B:</span><div class="vals" role="group" aria-labelledby="eq-b-l" data-r="vb"></div></div>
    <div data-r="detail"></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  function drawOps(){ q('ops').innerHTML=OPS.map(o=>`<button data-op="${esc(o)}" aria-pressed="${o===op}">${esc(o)}</button>`).join(''); }
  function drawVals(){
    const mk=(sel,k)=>meta.map((m,i)=>`<button data-${k}="${i}" aria-pressed="${sel===i}">${esc(m.label)}</button>`).join('');
    q('va').innerHTML=mk(A,'a'); q('vb').innerHTML=mk(B,'b');
  }
  function drawMatrix(){
    if(!grid){ q('mx').innerHTML='<p class="viz-note" style="padding:10px">Computing…</p>'; return; }
    let h=`<table class="mx"><caption class="sr-only">Result of A ${esc(op)} B for each pair of values. Rows are A, columns are B.</caption><thead><tr><th class="corner" scope="col">A ${esc(op)} B</th>${meta.map(m=>`<th scope="col">${esc(m.label)}</th>`).join('')}</tr></thead><tbody>`;
    for(let i=0;i<N;i++){
      h+=`<tr><th class="rh" scope="row">${esc(meta[i].label)}</th>`;
      for(let j=0;j<N;j++){
        const r=grid[op+'|'+i+'|'+j];
        const t=r&&r.ok?r.raw===true:null;
        h+=`<td><button class="${t===null?'':t?'t':'f'}${A===i&&B===j?' sel':''}" tabindex="${A===i&&B===j?0:-1}" data-i="${i}" data-j="${j}" aria-label="${esc(meta[i].label)} ${esc(op)} ${esc(meta[j].label)}: ${t===null?'error':t}" title="${esc(meta[i].label)} ${esc(op)} ${esc(meta[j].label)} is ${t}">${t===null?'!':t?'✓':'✗'}</button></td>`;
      }
      h+='</tr>';
    }
    q('mx').innerHTML=h+'</tbody></table>';
  }
  function drawDetail(res){
    const a=meta[A],b=meta[B];
    if(!res){ q('detail').innerHTML='<p class="viz-note"><span class="spinner"></span> Evaluating…</p>'; return; }
    const g=id=>{ const r=res[id]; return r?(r.ok?r.value:r.error):'?'; };
    const tf=id=>res[id]&&res[id].raw===true;
    const tile=(l,id)=>`<div><div class="l">${l}</div><div class="r ${tf(id)?'t':'f'}">${tf(id)?'✓ true':'✗ false'}</div></div>`;
    q('detail').innerHTML=`<div class="pair">${tile(`${esc(a.label)} == ${esc(b.label)}`,'eq')}${tile(`${esc(a.label)} === ${esc(b.label)}`,'seq')}${tile(`Object.is(${esc(a.label)}, ${esc(b.label)})`,'is')}</div>
      <div class="tblwrap"><table class="tbl"><thead><tr><th scope="col">Value</th><th scope="col">typeof</th><th scope="col">Number()</th><th scope="col">String()</th><th scope="col">Boolean()</th></tr></thead><tbody>
      ${['a','b'].map(k=>`<tr><td><code>${esc(meta[k==='a'?A:B].label)}</code></td><td>${esc(g(k+'t'))}</td><td>${esc(g(k+'n'))}</td><td>${esc(g(k+'s'))}</td><td>${esc(g(k+'b'))}</td></tr>`).join('')}</tbody></table></div>
      <div class="why" style="margin-top:10px"><b>Why:</b> ${explainPair(a,b)}</div>`;
    announce(`${a.label} == ${b.label} is ${tf('eq')}. ${a.label} === ${b.label} is ${tf('seq')}.`);
  }
  function computePair(){
    const seq=++pairSeq; if(pairJob) pairJob.cancel();
    drawDetail(null);
    const a=EQ_VALUES[A],b=EQ_VALUES[B], items=[
      {id:'eq',code:`(${a}) == (${b})`},{id:'seq',code:`(${a}) === (${b})`},{id:'is',code:`Object.is(${a}, ${b})`}];
    [['a',a],['b',b]].forEach(([k,v])=>{ items.push({id:k+'t',code:`typeof (${v})`},{id:k+'n',code:`Number(${v})`},{id:k+'s',code:`String(${v})`},{id:k+'b',code:`Boolean(${v})`}); });
    pairJob=startWorker({mode:'exprs',items:items},{timeout:3000});
    pairJob.promise.then(res=>{
      if(!live||seq!==pairSeq) return;
      if(res.status==='done'&&res.exprs){ const m={}; res.exprs.forEach(x=>{ m[x.id]=x; }); drawDetail(m); }
      else q('detail').innerHTML=`<p class="viz-note warn">${esc(res.message||'Could not evaluate.')}</p>`;
    });
  }
  host.addEventListener('click',e=>{
    const o=e.target.closest('[data-op]');
    if(o){ op=o.dataset.op; drawOps(); drawMatrix(); return; }
    const c=e.target.closest('[data-i]');
    if(c){ A=+c.dataset.i; B=+c.dataset.j; drawVals(); drawMatrix(); computePair(); const s=q('mx').querySelector('button.sel'); if(s) s.focus({preventScroll:true}); return; }
    const a=e.target.closest('[data-a]'); if(a){ A=+a.dataset.a; drawVals(); drawMatrix(); computePair(); return; }
    const b=e.target.closest('[data-b]'); if(b){ B=+b.dataset.b; drawVals(); drawMatrix(); computePair(); }
  });
  q('mx').addEventListener('keydown',e=>{
    const c=e.target.closest&&e.target.closest('button[data-i]'); if(!c) return;
    let i=+c.dataset.i,j=+c.dataset.j;
    if(e.key==='ArrowRight') j=Math.min(N-1,j+1); else if(e.key==='ArrowLeft') j=Math.max(0,j-1);
    else if(e.key==='ArrowDown') i=Math.min(N-1,i+1); else if(e.key==='ArrowUp') i=Math.max(0,i-1);
    else if(e.key==='Home') j=0; else if(e.key==='End') j=N-1; else return;
    e.preventDefault();
    const n=q('mx').querySelector(`button[data-i="${i}"][data-j="${j}"]`);
    if(n){ q('mx').querySelectorAll('button[tabindex="0"]').forEach(b=>b.setAttribute('tabindex','-1')); n.setAttribute('tabindex','0'); n.focus(); }
  });
  drawOps(); drawVals(); drawMatrix();
  const items=[];
  for(let i=0;i<N;i++) for(let j=0;j<N;j++) OPS.forEach(o=>items.push({id:o+'|'+i+'|'+j,code:cell(i,j,o)}));
  const job=startWorker({mode:'exprs',items:items},{timeout:3500});
  job.promise.then(res=>{
    if(!live) return;
    q('spin').hidden=true;
    if(res.status==='done'&&res.exprs){ grid={}; res.exprs.forEach(x=>{ grid[x.id]=x; }); drawMatrix(); computePair(); }
    else { q('mx').innerHTML=`<p class="viz-note warn" style="padding:10px">${esc(res.message||'Could not compute the matrix.')}</p>`; }
  });
  return {destroy(){ live=false; job.cancel(); pairJob&&pairJob.cancel(); }};
}

function vizGenerators(host,L){
  let sess=null,hist=[],line=null,status='idle',msg='',logs=[],defCode='',busy=false,off=false;
  host.innerHTML=`${NOTE('A live session: a worker keeps the generator object alive between your clicks. Everything above the <code>// demo</code> line is loaded; the demo lines are not run here. The highlighted line is where the generator is <b>paused</b> right now.')}

      <input class="input" id="gen-expr" style="max-width:240px" spellcheck="false" autocomplete="off">
      <button type="button" class="btn sm primary" data-a="start">${ic('play',13)}<span>Start session</span></button>
      <button type="button" class="btn sm ghost" data-a="kill">${ic('reset',13)}<span>Kill session</span></button></div>
    <div class="split"><pre class="codeview" data-r="code" aria-label="Generator code"></pre>
      <div><div class="row" role="group" aria-label="Drive the generator">
        <button type="button" class="btn sm" data-op="next" data-noarg="1">next()</button>
        <button type="button" class="btn sm" data-op="next">next(value)</button>
        <button type="button" class="btn sm" data-op="return">return(value)</button>
        <button type="button" class="btn sm" data-op="throw">throw(value)</button></div>
        <div class="row" style="margin-top:8px"><label class="hint" for="gen-arg">value (a JavaScript expression)</label><input class="input" id="gen-arg" style="max-width:180px" value="5" spellcheck="false" autocomplete="off"></div>
        <div class="narr" data-r="status" role="status"></div></div></div>
    <div class="tblwrap" style="margin-top:10px"><table class="tbl"><caption class="sr-only">Calls made to the generator and what came back</caption><thead><tr><th scope="col">#</th><th scope="col">Call</th><th scope="col">Result</th><th scope="col">Console output</th></tr></thead><tbody data-r="hist"></tbody></table></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  const expr=()=>host.querySelector('#gen-expr');
  function draw(){
    const code=L.getCode();
    q('code').innerHTML=codeLines(genDefPart(sess?defCode:code),status==='paused'?line:0);
    const same=!sess||defCode===genDefPart(L.getCode());
    q('edited').innerHTML=same?'':WARN('You edited the code after this session started. Kill it and start a new session to use the new code.');
    const alive=!!sess&&sess.alive&&status!=='dead'&&status!=='error';
    host.querySelectorAll('[data-op]').forEach(b=>{ b.disabled=!alive||busy; });
    host.querySelector('[data-a="kill"]').disabled=!sess;
    q('status').innerHTML=status==='idle'?'No session yet. Press <b>Start session</b>.'
      :status==='ready'?'<b>Suspended at the start.</b> The body has not run yet: the first <code>next()</code> starts it.'
      :status==='paused'?`<b>Paused${line?` at line ${line}`:''}.</b> The generator is waiting for the next call.`
      :status==='finished'?'<b>Finished</b> (<code>done: true</code>). Further calls just return <code>{ value: undefined, done: true }</code>.'
      :`<b>Session ended.</b> ${esc(msg)}`;
    q('hist').innerHTML=hist.length?hist.map((h,i)=>`<tr><td>${i+1}</td><td><code>${esc(h.call)}</code></td><td>${h.err?`<span class="tdz">threw ${esc(h.err)}</span>`:`<code>{ value: ${esc(h.value)}, done: ${h.done} }</code>`}</td><td>${h.logs.length?h.logs.map(l=>`<div><code>${esc(l)}</code></div>`).join(''):'<span class="muted">none</span>'}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">No calls yet.</td></tr>';
  }
  function kill(why){
    if(sess){ try{ sess.close(); }catch(e){} }
    sess=null; hist=[]; line=null; logs=[]; busy=false;
    status=why?'dead':'idle'; msg=why||'';
  }
  async function start(){
    kill();
    defCode=genDefPart(L.getCode());
    const s=openSession(l=>logs.push(l.text));
    sess=s; status='idle'; busy=true; draw();
    const r=await s.request({mode:'gen-init',code:defCode,expr:expr().value.trim()||L.variant.genExpr});
    if(off||sess!==s) return;
    busy=false;
    if(!r.ok){ status=r.dead?'dead':'error'; msg=r.error||'Could not create the generator.'; if(status==='error'){ s.close(); } }
    else { status='ready'; line=null; announce('Generator session started.'); }
    draw();
  }
  async function op(name,noarg){
    if(!sess||busy) return;
    const s=sess; let arg=noarg?'':host.querySelector('#gen-arg').value.trim();
    if(name==='throw'&&!arg) arg="new Error('boom')";
    busy=true; logs=[]; draw();
    const r=await s.request({mode:'gen-op',op:name,arg:arg});
    if(off||sess!==s) return;
    busy=false;
    const call=name+'('+(noarg?'':arg)+')';
    if(r.dead){ status='dead'; msg=r.error||'The session ended.'; sess=null; hist.push({call:call,err:'(session ended)',logs:logs.slice()}); }
    else if(!r.ok){ hist.push({call:call,err:r.error,logs:logs.slice()}); }
    else if(r.threw){ hist.push({call:call,err:r.error,logs:logs.slice()}); status='finished'; line=null; }
    else { hist.push({call:call,value:r.value,done:r.done,logs:logs.slice()}); line=r.line; status=r.done?'finished':'paused'; }
    const last=hist[hist.length-1];
    announce(status==='dead'?'Session ended.':last.err?`${call} threw ${last.err}.`:`${call} gave value ${last.value}, done ${last.done}.`);
    draw();
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||off) return;
    if(b.dataset.a==='start') start();
    else if(b.dataset.a==='kill'){ kill(); draw(); announce('Session killed.'); }
    else if(b.dataset.op) op(b.dataset.op,!!b.dataset.noarg);
  });
  const setExpr=()=>{ expr().value=L.variant.genExpr||''; };
  L.hooks.variant.push(()=>{ kill(); setExpr(); draw(); });
  L.hooks.reset.push(()=>{ kill(); draw(); });
  L.hooks.edit.push(()=>draw());
  setExpr(); draw();
  return {destroy(){ off=true; if(sess) try{ sess.close(); }catch(e){} }};
}

/* ---------- event propagation: a sandboxed iframe with real listeners ---------- */
function themeVars(){
  const cs=getComputedStyle(document.documentElement), o={};
  ['--bg','--panel','--panel-2','--border','--text','--muted','--accent','--good','--warn'].forEach(k=>{ o[k]=cs.getPropertyValue(k).trim(); });
  return o;
}
function vizEvents(host,L){
  const nonce=newNonce();
  let demo='prop',cfg={grandparent:{mode:'both',stop:'none'},parent:{mode:'both',stop:'none'},child:{mode:'both',stop:'none'},btn:{mode:'both',stop:'none'}};
  let dmode='delegated',prevent=true,frames=[],idx=0,timer=null,playing=false,off=false,ready=false,lastInfo=null;
  const LEVELS=[['grandparent','grandparent'],['parent','parent'],['child','child'],['btn','button']];
  const optM=v=>['none','capture','bubble','both'].map(x=>`<option value="${x}"${x===v?' selected':''}>${x==='none'?'no listener':x==='both'?'capture + bubble':x}</option>`).join('');
  const optS=v=>[['none','never stop'],['stop','stopPropagation()'],['immediate','stopImmediatePropagation()']].map(x=>`<option value="${x[0]}"${x[0]===v?' selected':''}>${x[1]}</option>`).join('');
  host.innerHTML=`${NOTE('The boxes on the right live in a <b>sandboxed frame</b> (its scripts cannot touch this page). Set listeners, then <b>click any box or the button</b> inside the frame: the real dispatch order is recorded by real listeners and replayed here. Every level with a listener registers two listeners (#1 and #2) so you can see what <code>stopImmediatePropagation()</code> skips.')}
    <div class="row" style="margin-bottom:10px"><div class="seg" role="group" aria-label="Demo" data-r="tabs"></div></div>
    <div class="split"><div data-r="controls"></div><div><iframe data-r="frame" title="Sandboxed event demo. Click the boxes inside." sandbox="allow-scripts" style="width:100%;height:260px;border:1px solid var(--border);border-radius:10px;background:var(--panel)"></iframe></div></div>
    <div data-r="result" style="margin-top:12px"></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  const frame=q('frame');
  const post=o=>{ try{ frame.contentWindow.postMessage(Object.assign({lab:nonce},o),'*'); }catch(e){} };
  function drawTabs(){ q('tabs').innerHTML=[['prop','Propagation'],['deleg','Delegation'],['prevent','preventDefault']].map(t=>`<button type="button" data-tab="${t[0]}" aria-pressed="${demo===t[0]}">${t[1]}</button>`).join(''); }
  function drawControls(){
    const c=q('controls');
    if(demo==='prop') c.innerHTML=`<table class="tbl"><caption class="sr-only">Listener settings per level</caption><thead><tr><th scope="col">Level</th><th scope="col">Listens on</th><th scope="col">Stop</th></tr></thead><tbody>${LEVELS.map(l=>`<tr><th scope="row" style="font-weight:600;text-align:left">${l[1]}</th><td><select class="select" data-lv="${l[0]}" data-k="mode" aria-label="${l[1]}: listens on" style="min-height:30px">${optM(cfg[l[0]].mode)}</select></td><td><select class="select" data-lv="${l[0]}" data-k="stop" aria-label="${l[1]}: stop" style="min-height:30px">${optS(cfg[l[0]].stop)}</select></td></tr>`).join('')}</tbody></table><p class="hint">“Stop” is called in the first listener of that level’s first phase.</p>`;
    else if(demo==='deleg') c.innerHTML=`<div class="row"><span class="hint" id="dm-l">Where is the listener?</span><div class="seg" role="group" aria-labelledby="dm-l"><button type="button" data-dm="delegated" aria-pressed="${dmode==='delegated'}">One on the &lt;ul&gt; (delegation)</button><button type="button" data-dm="direct" aria-pressed="${dmode==='direct'}">One on each &lt;li&gt;</button></div></div><div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-add="1">Add an item</button><span class="hint">then click the items in the frame</span></div>`;
    else c.innerHTML=`<label class="opt" style="max-width:340px"><input type="checkbox" data-prevent="1"${prevent?' checked':''}><span>Call <code>event.preventDefault()</code> in the click listener</span></label><p class="hint">Click the link and the checkbox inside the frame.</p>`;
  }
  function sendCfg(){
    if(!ready) return;
    post({cmd:'show',demo:demo});
    if(demo==='prop') post({cmd:'cfg-prop',cfg:cfg}); else if(demo==='deleg') post({cmd:'cfg-deleg',mode:dmode}); else post({cmd:'cfg-prevent',prevent:prevent});
  }
  function clearResult(){ stopPlay(); frames=[]; idx=0; lastInfo=null; q('result').innerHTML='<div class="narr">Click something inside the frame.</div>'; }
  /* --- playback of a recorded propagation path --- */
  function stopPlay(){ playing=false; clearInterval(timer); timer=null; }
  function mirror(f,notReached){
    const dirTxt={down:'↓ capturing (going down)',target:'● at the target',up:'↑ bubbling (going up)'};
    const box=(id,inner)=>{ const l=LEVELS.find(x=>x[0]===id); const on=f&&f.level===id; const nr=notReached.indexOf(id)>=0;
      return `<div class="scope d${LEVELS.findIndex(x=>x[0]===id)>2?2:LEVELS.findIndex(x=>x[0]===id)}" style="${on?'outline:3px solid var(--accent);':''}${nr?'opacity:.55;border-style:dashed;':''}"><div class="scope-h"><b>${l[1]}</b>${on?`<span>${dirTxt[f.dir]}</span>`:''}${nr?'<span>not reached</span>':''}</div>${inner}</div>`; };
    return box('grandparent',box('parent',box('child',box('btn',''))));
  }
  function drawProp(info){
    const listening=LEVELS.filter(l=>cfg[l[0]].mode!=='none').map(l=>l[0]);
    const r=buildEventFrames(info.entries,info.clicked,listening);
    frames=r.frames; idx=0;
    const stopped=info.entries.filter(e=>e.stopped).map(e=>`${e.name} #${e.idx} called ${e.stopped}()`);
    q('result').innerHTML=`<div class="split"><div><h4 style="margin:0 0 6px;font-size:13px">Recorded order (${frames.length} listener call${frames.length===1?'':'s'})</h4><ol data-r="olist" style="margin:0;padding-left:22px;font-size:13px">${frames.map((f,i)=>`<li data-i="${i}">${esc(f.text.replace(/^\d+\.\s*/,''))}</li>`).join('')||'<li class="muted">No listener ran. Give a level a listener first.</li>'}</ol>
      ${r.notReached.length?`<p class="hint">Never reached (propagation was stopped before them): ${r.notReached.join(', ')}.</p>`:''}${stopped.length?`<p class="hint">${esc(stopped.join('; '))}.</p>`:''}</div>
      <div><div class="stepper" role="group" aria-label="Replay controls"><button type="button" class="btn sm primary" data-pl="play">${ic('play',13)}<span>Play</span></button><button type="button" class="btn sm" data-pl="back">${ic('back',13)}<span>Back</span></button><button type="button" class="btn sm" data-pl="next">${ic('step',13)}<span>Step</span></button><button type="button" class="btn sm ghost" data-pl="reset">${ic('reset',13)}<span>Reset</span></button></div><div data-r="mirror"></div></div></div>`;
    lastInfo={notReached:r.notReached};
    drawFrame(false);
  }
  function drawFrame(say){
    const m=host.querySelector('[data-r="mirror"]'); if(!m) return;
    const f=frames[idx]||null;
    m.innerHTML=mirror(f,lastInfo?lastInfo.notReached:[])+`<div class="narr" style="margin-top:8px">${f?esc(f.text):'Press Step or Play to walk through the path.'}</div>`;
    host.querySelectorAll('[data-r="olist"] li').forEach((li,i)=>{ li.style.fontWeight=(f&&i===f.entry)?'700':''; li.style.color=(f&&i===f.entry)?'var(--accent)':''; });
    const back=host.querySelector('[data-pl="back"]'), next=host.querySelector('[data-pl="next"]');
    if(back) back.disabled=idx===0; if(next) next.disabled=idx>=frames.length-1;
    if(say&&f) announce(f.text);
  }
  function play(){
    if(!frames.length) return;
    if(idx>=frames.length-1) idx=0;
    playing=true; drawFrame(true);
    clearInterval(timer); timer=setInterval(()=>{ if(idx>=frames.length-1){ stopPlay(); return; } idx++; drawFrame(true); if(idx>=frames.length-1) stopPlay(); },900);
  }
  /* --- messages from the frame: only from OUR frame window and with OUR nonce --- */
  function handle(e){
    if(off||e.source!==frame.contentWindow) return;
    const d=e.data; if(!d||typeof d!=='object'||d.lab!==nonce) return;
    if(d.type==='ready'){ ready=true; post({cmd:'theme',vars:themeVars()}); sendCfg(); return; }
    if(d.type!=='events'||d.demo!==demo) return;
    if(demo==='prop'){ drawProp(d); if(!reduceMotion()&&frames.length) play(); }
    else if(demo==='deleg'){
      const it=d.entries[0];
      q('result').innerHTML=it?`<div class="pair"><div><div class="l">event.target</div><div class="r" style="font-size:14px">${esc(it.target)}</div></div><div><div class="l">event.currentTarget</div><div class="r" style="font-size:14px">${esc(it.currentTarget)}</div></div></div><p class="hint">${dmode==='delegated'?'The single listener on the &lt;ul&gt; handled a click that started on an &lt;li&gt;.':'This &lt;li&gt; has its own listener.'}</p>`
        :`<div class="narr"><b>Nothing happened</b> when “${esc(d.clickedText||d.clicked)}” was clicked: no listener is attached to it. ${dmode==='direct'?'Items added after the listeners were attached are not covered. That is the problem delegation solves.':''}</div>`;
      announce(it?'The listener ran.':'No listener handled that click.');
    } else {
      const pr=d.entries.length&&d.entries[0].prevented;
      const chk=d.clicked==='chk';
      q('result').innerHTML=`<div class="pair"><div><div class="l">defaultPrevented</div><div class="r ${d.defaultPrevented?'t':'f'}">${d.defaultPrevented?'✓ true':'✗ false'}</div></div>${chk?`<div><div class="l">checkbox is now</div><div class="r">${d.checked?'☑ checked':'☐ unchecked'}</div></div>`:`<div><div class="l">browser follows the link?</div><div class="r">${d.defaultPrevented?'✗ no':'✓ yes (#demo)'}</div></div>`}</div><p class="hint">${pr?'The default action was cancelled, but the event still bubbled normally.':'Nothing cancelled the default action, so the browser did its normal thing.'}</p>`;
      announce(d.defaultPrevented?'Default action prevented.':'Default action happened.');
    }
  }
  const onMsg=e=>handle(e);
  window.addEventListener('message',onMsg);
  host.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab]');
    if(t){ demo=t.dataset.tab; drawTabs(); drawControls(); clearResult(); sendCfg(); return; }
    const dm=e.target.closest('[data-dm]');
    if(dm){ dmode=dm.dataset.dm; drawControls(); clearResult(); sendCfg(); return; }
    if(e.target.closest('[data-add]')){ post({cmd:'add-item'}); return; }
    const pl=e.target.closest('[data-pl]');
    if(pl){
      const a=pl.dataset.pl;
      if(a==='play'){ if(playing) stopPlay(); else play(); const pb=host.querySelector('[data-pl="play"]'); if(pb) pb.querySelector('span').textContent=playing?'Pause':'Play'; return; }
      stopPlay();
      if(a==='next'&&idx<frames.length-1) idx++; else if(a==='back'&&idx>0) idx--; else if(a==='reset') idx=0;
      drawFrame(true);
    }
  });
  host.addEventListener('change',e=>{
    const s=e.target.closest('select[data-lv]');
    if(s){ cfg[s.dataset.lv][s.dataset.k]=s.value; clearResult(); sendCfg(); return; }
    if(e.target.matches('[data-prevent]')){ prevent=e.target.checked; clearResult(); sendCfg(); }
  });
  const th=()=>post({cmd:'theme',vars:themeVars()});
  themeHooks.push(th);
  frame.srcdoc=buildEvDoc(nonce);
  drawTabs(); drawControls(); clearResult();
  window.__JSLAB__.evViz={frame:frame,nonce:nonce,handle:handle,state:()=>({demo:demo,frames:frames.length,ready:ready})};
  return {destroy(){ off=true; stopPlay(); window.removeEventListener('message',onMsg); const i=themeHooks.indexOf(th); if(i>=0) themeHooks.splice(i,1); try{ frame.remove(); }catch(e){} }};
}

/* ---------- blobs: byte viewer ---------- */
function readBytes(blob){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(new Uint8Array(r.result)); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(blob); });
}
function hexTable(bytes){
  const rows=hexdump(bytes,16);
  if(!rows.length) return '<p class="hint">0 bytes: nothing to show.</p>';
  return `<div class="tblwrap"><table class="tbl mono" style="min-width:0"><caption class="sr-only">Hex dump: offset, bytes in hexadecimal, ASCII</caption><thead><tr><th scope="col">Offset</th><th scope="col">Hex</th><th scope="col">ASCII</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.offset}</td><td style="white-space:pre">${esc(r.hex.join(' '))}</td><td style="white-space:pre">${esc(r.ascii)}</td></tr>`).join('')}</tbody></table></div>`;
}

          ${parts.length&&parts.length<=24?`<div class="tblwrap" style="margin-bottom:8px"><table class="tbl" style="min-width:0"><thead><tr><th scope="col">Character</th><th scope="col">Code point</th><th scope="col">UTF-8 bytes</th></tr></thead><tbody>${parts.map(p=>`<tr><td>${esc(p.ch)}</td><td>${p.cp}</td><td class="mono">${p.bytes.map(hex2).join(' ')} <span class="muted">(${p.bytes.length})</span></td></tr>`).join('')}</tbody></table></div>`:''}`;

      } else if(tab==='blob'){

        const b=new Blob([body],{type:mime});
        const s=parseInt(host.querySelector('#bl-s').value,10), e=parseInt(host.querySelector('#bl-e').value,10);
        const sl=b.slice(Number.isNaN(s)?0:s,Number.isNaN(e)?undefined:e);
        bytes=await readBytes(sl);
        info=`<div class="kvgrid" style="margin:8px 0"><div><b>${b.size}</b><span>blob.size</span></div><div><b>${esc(b.type||'(empty)')}</b><span>blob.type (lower-cased)</span></div><div><b>${sl.size}</b><span>slice size</span></div></div><p class="hint">The dump shows the bytes of the <b>slice</b>.</p>`;
      } else {
        if(!file){ q('info').innerHTML=''; q('dump').innerHTML='<p class="hint">No file chosen yet.</p>'; return; }
        bytes=await readBytes(file.slice(0,64));
        info=`<div class="kvgrid" style="margin:8px 0"><div><b>${esc(file.name)}</b><span>file.name</span></div><div><b>${file.size}</b><span>file.size (bytes)</span></div><div><b>${esc(file.type||'(unknown)')}</b><span>file.type (guessed from the extension)</span></div><div><b>${bytes.length}</b><span>bytes shown</span></div></div>`;
      }
    }catch(err){ if(my===seq){ q('info').innerHTML=WARN(esc(err.message||err)); q('dump').innerHTML=''; } return; }
    if(my!==seq||off) return;
    q('info').innerHTML=info; q('dump').innerHTML=hexTable(bytes);
  }
  function download(){
    const body=host.querySelector('#bl-body').value, mime=host.querySelector('#bl-mime').value||'text/plain', name=host.querySelector('#bl-fn').value||'download.txt';
    const url=URL.createObjectURL(new Blob([body],{type:mime}));
    const a=document.createElement('a'); a.href=url; a.download=name; a.hidden=true; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} },1500);
    toast('Download started; the object URL is revoked afterwards');
  }
  host.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab]');
    if(t){ tab=t.dataset.tab; drawTabs(); drawIn(); update(); return; }
    const en=e.target.closest('[data-end]');
    if(en){ host.querySelectorAll('[data-end]').forEach(b=>b.setAttribute('aria-pressed',String(b===en))); update(); return; }
    if(e.target.closest('[data-dl]')) download();
  });
  host.addEventListener('input',e=>{ if(e.target.matches('input:not([type=file]),textarea,select')) update(); });
  host.addEventListener('change',e=>{ if(e.target.id==='bl-file'){ file=e.target.files&&e.target.files[0]||null; update(); } else if(e.target.tagName==='SELECT') update(); });
  drawTabs(); drawIn(); update();
  return {destroy(){ off=true; }};
}

/* ---------- prototypes: chain diagram from a REAL run ---------- */
function vizPrototypes(host,L){
  let off=false,seq=0,job=null;
  host.innerHTML=`${NOTE('The chains below are read from the real objects: the lab runs your code in the worker and walks <code>Object.getPrototypeOf</code> from the objects named in each heading. Each box lists the <b>own</b> properties of that object.')}
    <div data-r="edited"></div><div class="row" style="margin-bottom:8px"><button type="button" class="btn sm primary" data-a="inspect">${ic('reset',13)}<span>Inspect again</span></button><span class="hint" data-r="st"></span></div><div data-r="chains" class="lanes" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  const node=(n,i,last)=>`<div class="chip ${n.kind==='end'?'':n.kind==='instance'?'run':'micro'}" style="margin-bottom:2px"><span class="k">${esc(n.kind==='instance'?'the object':n.kind==='proto'?'prototype object':n.kind==='function'?'function object':n.kind==='end'?'end of the chain':'object')}</span><b>${esc(n.label)}</b>${n.keys.length?`<div style="margin-top:2px;color:var(--muted)">own: ${esc(n.keys.join(', '))}${n.more?` <em>+${n.more} more</em>`:''}</div>`:n.kind==='end'?'':'<div style="margin-top:2px;color:var(--muted)">no own properties</div>'}</div>${last?'':'<div class="fc-arrow" aria-hidden="true" title="[[Prototype]]">↓ <span class="hint">[[Prototype]]</span></div>'}`;
  async function inspect(){
    const my=++seq; if(job) job.cancel();
    q('st').innerHTML='<span class="spinner"></span> Reading the chains…';
    q('edited').innerHTML=editedNote(L);
    job=startWorker({mode:'chain',code:L.getCode(),exprs:L.variant.chains},{timeout:3000});
    const r=await job.promise;
    if(off||my!==seq||r.status==='cancelled') return;
    q('st').textContent='';
    if(r.status!=='done'||!r.data){ q('chains').innerHTML=WARN(esc(r.message||'Could not read the chains.')); return; }

    q('chains').innerHTML=r.data.chains.map(c=>`<div class="lane"><h4>${esc(c.title)}</h4>${c.error?WARN(esc(c.error)):c.nodes.map((n,i)=>node(n,i,i===c.nodes.length-1)).join('')}</div>`).join('');
    announce('Prototype chains updated.');
  }
  host.addEventListener('click',e=>{ if(e.target.closest('[data-a="inspect"]')) inspect(); });
  L.hooks.variant.push(()=>inspect());
  L.hooks.run.push(res=>{ if(res.status==='done') inspect(); });
  L.hooks.edit.push(()=>{ q('edited').innerHTML=editedNote(L); });
  inspect();
  return {destroy(){ off=true; if(job) job.cancel(); }};
}

/* ---------- higher-order functions: pipeline explorer (runs in the worker) ---------- */
const HOF_PRESETS={
  numbers:{src:'[1, 2, 3, 4, 5, 6]',stages:[{k:'filter',fn:'x => x % 2 === 0',init:''},{k:'map',fn:'x => x * x',init:''},{k:'reduce',fn:'(sum, x) => sum + x',init:'0'}]},
  prices:{src:'[12, 5, 20, 8, 15]',stages:[{k:'filter',fn:'x => x > 6',init:''},{k:'map',fn:'x => x * 1.5',init:''},{k:'reduce',fn:'(max, x) => Math.max(max, x)',init:'0'}]},
  words:{src:"['pear', 'fig', 'banana', 'kiwi', 'apple']",stages:[{k:'filter',fn:'w => w.length > 3',init:''},{k:'map',fn:'w => w.toUpperCase()',init:''},{k:'sort',fn:'(a, b) => a.localeCompare(b)',init:''}]}
};
function hofCode(src,stages,k){
  const body=stages.slice(0,k).map(s=>s.k==='map'?`d = d.map(${s.fn});`:s.k==='filter'?`d = d.filter(${s.fn});`:s.k==='sort'?`d = d.slice().sort(${s.fn});`:`d = d.reduce(${s.fn}${s.init.trim()?', '+s.init:''});`).join(' ');
  return {body:body,src:src};
}
function vizHof(host,L){
  let stages=JSON.parse(JSON.stringify(HOF_PRESETS.numbers.stages)),off=false,seq=0,job=null;
  host.innerHTML=`${NOTE('Build a pipeline of <code>map</code>, <code>filter</code>, <code>sort</code> and <code>reduce</code> stages and watch the data flow. Every stage is really executed in the sandbox worker; <code>reduce</code> also shows each step of the accumulator.')}
    <div class="row" style="margin-bottom:8px"><label class="hint" for="hof-src">Start with</label><input class="input" id="hof-src" style="max-width:340px" value="${esc(HOF_PRESETS.numbers.src)}" spellcheck="false" autocomplete="off">
      <label class="hint" for="hof-pre">Example</label><select class="select" id="hof-pre" style="width:auto"><option value="numbers">even squares, summed</option><option value="prices">prices, biggest</option><option value="words">words, sorted</option></select></div>
    <div data-r="stages"></div>
    <div class="row" style="margin:8px 0"><button type="button" class="btn sm" data-a="add">Add a stage</button><button type="button" class="btn sm primary" data-a="run">${ic('play',13)}<span>Run pipeline</span></button></div>
    <div data-r="out"></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  function drawStages(){
    q('stages').innerHTML=stages.map((s,i)=>`<div class="row" style="margin-bottom:6px" data-i="${i}"><span class="hint">${i+1}.</span><select class="select" data-f="k" aria-label="Stage ${i+1} kind" style="width:auto;min-height:30px">${['map','filter','sort','reduce'].map(k=>`<option${k===s.k?' selected':''}>${k}</option>`).join('')}</select>
      <input class="input" data-f="fn" aria-label="Stage ${i+1} function" style="max-width:300px;min-height:30px" value="${esc(s.fn)}" spellcheck="false" autocomplete="off">
      ${s.k==='reduce'?`<label class="hint">start value</label><input class="input" data-f="init" aria-label="Stage ${i+1} start value" style="width:80px;min-height:30px" value="${esc(s.init)}" spellcheck="false">`:''}
      <button type="button" class="btn sm ghost" data-rm="${i}" aria-label="Remove stage ${i+1}">${ic('x',12)}</button></div>`).join('')||'<p class="hint">No stages yet: add one.</p>';
  }
  async function run(){
    const my=++seq; if(job) job.cancel();
    const src=host.querySelector('#hof-src').value.trim()||'[]';
    q('out').innerHTML='<p class="viz-note"><span class="spinner"></span> Running…</p>';
    const items=[];
    for(let k=0;k<=stages.length;k++) items.push({id:'s'+k,code:`(() => { let d = (${src}); ${hofCode(src,stages,k).body} return d; })()`});
    stages.forEach((s,i)=>{ if(s.k==='reduce') items.push({id:'r'+i,code:`(() => { let d = (${src}); ${hofCode(src,stages,i).body} const f = (${s.fn}); const steps = []; d.reduce((acc, x, i) => { const r = f(acc, x, i); steps.push([acc, x, r]); return r; }${s.init.trim()?', '+s.init:''}); return JSON.stringify(steps); })()`}); });
    job=startWorker({mode:'exprs',items:items},{timeout:3000});
    const r=await job.promise;
    if(off||my!==seq||r.status==='cancelled') return;
    if(r.status!=='done'||!r.exprs){ q('out').innerHTML=WARN(esc(r.message||'Could not run.')); return; }
    const m={}; r.exprs.forEach(x=>{ m[x.id]=x; });
    const cell=(x)=>x?(x.ok?`<code>${esc(x.value)}</code>`:`<span class="tdz">${esc(x.error)}</span>`):'';
    let h=`<div class="row" style="align-items:stretch;gap:6px">`;
    h+=`<div class="fc-node" style="flex:1 1 130px"><div class="hint">start</div>${cell(m.s0)}</div>`;
    stages.forEach((s,i)=>{ h+=`<div class="fc-arrow" style="align-self:center" aria-hidden="true">→</div><div class="fc-node ${m['s'+(i+1)]&&m['s'+(i+1)].ok?'done':'q'}" style="flex:1 1 150px"><div class="hint">${i+1}. <b>${esc(s.k)}</b></div><div class="mono" style="font-size:11px;color:var(--muted)">${esc(s.fn)}</div>${cell(m['s'+(i+1)])}</div>`; });
    h+='</div>';
    stages.forEach((s,i)=>{
      if(s.k!=='reduce'||!m['r'+i]) return;
      const x=m['r'+i]; let rows='';
      if(x.ok&&typeof x.raw==='string'){ try{ rows=JSON.parse(x.raw).map((st,j)=>`<tr><td>${j+1}</td><td><code>${esc(JSON.stringify(st[0]))}</code></td><td><code>${esc(JSON.stringify(st[1]))}</code></td><td><code>${esc(JSON.stringify(st[2]))}</code></td></tr>`).join(''); }catch(e){} }
      h+=`<h4 style="margin:12px 0 6px;font-size:13px">Stage ${i+1}: reduce, step by step</h4>${x.ok?`<div class="tblwrap"><table class="tbl" style="min-width:0"><thead><tr><th scope="col">Step</th><th scope="col">accumulator in</th><th scope="col">item</th><th scope="col">accumulator out</th></tr></thead><tbody>${rows||'<tr><td colspan="4" class="muted">no items</td></tr>'}</tbody></table></div>`:WARN(esc(x.error))}`;
    });
    q('out').innerHTML=h;
    announce('Pipeline finished.');
  }
  host.addEventListener('click',e=>{
    const a=e.target.closest('[data-a]'), rm=e.target.closest('[data-rm]');
    if(rm){ stages.splice(+rm.dataset.rm,1); drawStages(); run(); return; }
    if(!a) return;
    if(a.dataset.a==='add'){ if(stages.length<5){ stages.push({k:'map',fn:'x => x',init:''}); drawStages(); } }
    else run();
  });
  host.addEventListener('input',e=>{ const row=e.target.closest('[data-i]'); if(row&&e.target.dataset.f) stages[+row.dataset.i][e.target.dataset.f]=e.target.value; });
  host.addEventListener('change',e=>{
    const row=e.target.closest('[data-i]');
    if(row&&e.target.dataset.f==='k'){ stages[+row.dataset.i].k=e.target.value; drawStages(); run(); return; }
    if(e.target.id==='hof-pre'){ const p=HOF_PRESETS[e.target.value]; stages=JSON.parse(JSON.stringify(p.stages)); host.querySelector('#hof-src').value=p.src; drawStages(); run(); }
  });
  drawStages(); run();
  return {destroy(){ off=true; if(job) job.cancel(); }};
}

/* ---------- debounce / throttle / memoization: real timers ---------- */
const TIMING_PATTERNS={burst:{label:'Typing burst',t:[0,80,160,240,320,400,480]},stream:{label:'Steady stream',t:[0,100,200,300,400,500,600,700,800,900,1000,1100,1200,1300,1400]},two:{label:'Two bursts',t:[0,60,120,180,900,960,1020,1080]}};
function vizTiming(host,L){
  let pat='burst',delay=250,off=false,jobT=null,jobM=null,mkind='fib',seqT=0,seqM=0;
  host.innerHTML=`${NOTE('<b>Debounce and throttle.</b> A real burst of calls is fired with real timers in the worker; the rows show when the raw calls happened and when the debounced (trailing) and throttled (leading edge) functions actually ran. It takes a couple of seconds.')}
    <div class="row" style="margin-bottom:8px"><div class="seg" role="group" aria-label="Call pattern" data-r="pat"></div>
      <label class="hint" for="tm-delay">Delay / interval</label><input type="range" id="tm-delay" min="50" max="500" step="50" value="250" style="max-width:180px"><output id="tm-out" for="tm-delay" class="mono">250 ms</output>
      <button type="button" class="btn sm primary" data-a="run">${ic('play',13)}<span>Run</span></button></div>
    <div data-r="tl"></div>
    <hr style="border:0;border-top:1px solid var(--border);margin:16px 0">
    ${NOTE('<b>Memoization.</b> Count how many times a function really runs with and without a cache.')}
    <div class="row" style="margin-bottom:8px"><div class="seg" role="group" aria-label="Function" data-r="mk"></div><span data-r="mctl"></span><button type="button" class="btn sm primary" data-a="memo">${ic('play',13)}<span>Compare</span></button></div>
    <div data-r="memo"></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  function drawPat(){ q('pat').innerHTML=Object.keys(TIMING_PATTERNS).map(k=>`<button type="button" data-p="${k}" aria-pressed="${k===pat}">${TIMING_PATTERNS[k].label}</button>`).join(''); }
  function drawMk(){
    q('mk').innerHTML=[['fib','fib(n), recursive'],['args','repeated arguments']].map(k=>`<button type="button" data-mk="${k[0]}" aria-pressed="${k[0]===mkind}">${k[1]}</button>`).join('');
    q('mctl').innerHTML=mkind==='fib'?`<label class="hint" for="mm-n">n</label> <input class="input" id="mm-n" type="number" min="1" max="35" value="30" style="width:80px;min-height:30px">`:`<label class="hint" for="mm-a">arguments</label> <input class="input" id="mm-a" value="3, 4, 3, 3, 4, 5, 3" style="max-width:220px;min-height:30px" spellcheck="false">`;
  }
  async function runT(){
    const my=++seqT; if(jobT) jobT.cancel();
    const p=TIMING_PATTERNS[pat].t;
    q('tl').innerHTML='<p class="viz-note"><span class="spinner"></span> Running with real timers…</p>';
    jobT=startWorker({mode:'timing',pattern:p,delay:delay},{timeout:4000});
    const r=await jobT.promise;
    if(off||my!==seqT||r.status==='cancelled') return;
    if(r.status!=='done'||!r.data){ q('tl').innerHTML=WARN(esc(r.message||'Could not run.')); return; }
    const d=r.data, axis=Math.max(500,Math.ceil((d.end)/100)*100), pc=v=>(Math.max(0,Math.min(v,axis))/axis*100).toFixed(2);
    const row=(name,arr,cls)=>`<div class="tl-row"><div class="tl-name">${name}</div><div class="tl-track" style="--tick:${(100/axis*100).toFixed(3)}%">${arr.map(t=>`<div class="tl-bar ${cls}" style="left:${pc(t)}%;width:6px;padding:0" title="${name} at ${Math.round(t)} ms"></div>`).join('')}</div></div>`;
    const ticks=[]; for(let t=0;t<=axis;t+=100) ticks.push(`<span style="left:${pc(t)}%">${t}</span>`);
    q('tl').innerHTML=`<div class="tl">${row('raw calls',d.raw,'')}${row('debounced',d.deb,'')}${row('throttled',d.thr,'')}<div class="tl-axis"><div class="hint" style="text-align:right">ms</div><div class="tl-ticks" aria-hidden="true">${ticks.join('')}</div></div></div>
      <div class="kvgrid" style="margin-top:8px"><div><b>${d.raw.length}</b><span>raw calls</span></div><div><b>${d.deb.length}</b><span>debounced runs (after ${d.delay} ms of quiet)</span></div><div><b>${d.thr.length}</b><span>throttled runs (at most one per ${d.delay} ms)</span></div></div>
      <p class="hint">Debounce runs after each burst ends (${d.deb.map(t=>Math.round(t)+' ms').join(', ')||'never'}). Throttle runs at ${d.thr.map(t=>Math.round(t)+' ms').join(', ')||'never'}, during the burst.</p>`;
    announce(`${d.raw.length} raw calls, ${d.deb.length} debounced runs, ${d.thr.length} throttled runs.`);
  }
  async function runM(){
    const my=++seqM; if(jobM) jobM.cancel();
    q('memo').innerHTML='<p class="viz-note"><span class="spinner"></span> Counting…</p>';
    const msg=mkind==='fib'?{mode:'memo',kind:'fib',n:+host.querySelector('#mm-n').value||30}:{mode:'memo',kind:'args',args:host.querySelector('#mm-a').value.split(',').map(x=>x.trim()).filter(x=>x!=='').map(Number).filter(x=>!Number.isNaN(x)).slice(0,40)};
    jobM=startWorker(msg,{timeout:4000});
    const r=await jobM.promise;
    if(off||my!==seqM||r.status==='cancelled') return;
    if(r.status!=='done'||!r.data){ q('memo').innerHTML=WARN(esc(r.message||'Could not run.')); return; }
    const d=r.data;
    if(d.kind==='fib') q('memo').innerHTML=`<div class="kvgrid"><div><b>${d.naive.calls.toLocaleString('en')}</b><span>calls without a cache · ${d.naive.ms.toFixed(1)} ms</span></div><div><b>${d.memo.miss}</b><span>real calls with a cache (misses) · ${d.memo.ms.toFixed(2)} ms</span></div><div><b>${d.memo.hits}</b><span>cache hits during that run</span></div><div><b>${d.again.hits}</b><span>hits when asked again (the answer is stored)</span></div></div><p class="hint">fib(${d.n}) = ${d.result}. Without a cache the same subproblems are solved again and again; with one, each n is computed once.</p>`;
    else q('memo').innerHTML=`<div class="kvgrid"><div><b>${d.total}</b><span>calls</span></div><div><b>${d.miss}</b><span>cache misses (real work)</span></div><div><b>${d.hits}</b><span>cache hits (instant)</span></div></div><div class="vals" style="margin-top:8px" aria-label="Sequence of calls">${d.seq.map(s=>`<span class="pill ${s.hit?'easy':'hard'}" title="${s.hit?'hit':'miss'}">${s.arg}: ${s.hit?'hit ✓':'miss ✗'}</span>`).join(' ')}</div>`;
    announce('Memoization comparison ready.');
  }
  host.addEventListener('click',e=>{
    const p=e.target.closest('[data-p]'); if(p){ pat=p.dataset.p; drawPat(); return; }
    const mk=e.target.closest('[data-mk]'); if(mk){ mkind=mk.dataset.mk; drawMk(); q('memo').innerHTML=''; return; }
    const a=e.target.closest('[data-a]'); if(!a) return;
    if(a.dataset.a==='run') runT(); else runM();
  });
  host.querySelector('#tm-delay').addEventListener('input',e=>{ delay=+e.target.value; host.querySelector('#tm-out').textContent=delay+' ms'; });
  drawPat(); drawMk();
  q('tl').innerHTML='<div class="narr">Press <b>Run</b> to fire the call pattern with real timers.</div>';
  return {destroy(){ off=true; if(jobT) jobT.cancel(); if(jobM) jobM.cancel(); }};
}

/* ---------- copying: which parts are shared? (references compared for real) ---------- */
const COPY_SAMPLES={
  typical:"{ name: 'Ada', tags: ['a', 'b'], address: { city: 'Oslo', geo: { lat: 59.9 } }, born: new Date(0), meta: new Map([['k', 1]]), note: undefined, score: NaN }",

};
const COPY_BADGE={shared:['⛓','shared reference','bad'],copied:['⧉','independent copy','ok'],value:['•','copied by value','ok'],changed:['≠','value changed','warn'],converted:['⇄','type changed','warn'],dropped:['∅','dropped','warn']};
function vizCopying(host,L){
  let off=false,seq=0,job=null;
  host.innerHTML=`${NOTE('Each copy method is applied for real to the object below (edit it if you like), then every property of the original is compared with the copy by <b>reference</b> (<code>===</code>). <b>Shared</b> means changing it through the copy changes the original too.')}
    <div class="row" style="margin-bottom:6px"><label class="hint" for="cp-pre">Sample</label><select class="select" id="cp-pre" style="width:auto"><option value="typical">typical data</option><option value="fn">with a function</option><option value="frozen">Object.freeze</option></select><button type="button" class="btn sm primary" data-a="run">${ic('play',13)}<span>Compare copy methods</span></button></div>
    <label class="hint" for="cp-src">Object literal to copy</label><textarea class="textarea mono" id="cp-src" rows="3" spellcheck="false" style="font:12.5px var(--mono)"></textarea>
    <div data-r="out" style="margin-top:10px"></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  const src=()=>host.querySelector('#cp-src');
  async function run(){
    const my=++seq; if(job) job.cancel();
    q('out').innerHTML='<p class="viz-note"><span class="spinner"></span> Copying…</p>';
    job=startWorker({mode:'copy',sample:src().value},{timeout:3000});
    const r=await job.promise;
    if(off||my!==seq||r.status==='cancelled') return;
    if(r.status!=='done'||!r.data){ q('out').innerHTML=WARN(esc(r.message||'Could not run.')); return; }
    if(r.data.error){ q('out').innerHTML=WARN(esc(r.data.error)); return; }

/* ---------- destructuring lab + ?? / || table ---------- */
function vizDestructuring(host,L){
  let off=false,seq=0,job=null,job2=null;
  const PRE={
    a:{p:'{ name, age = 30, address: { city }, ...rest }',v:"{ id: 7, name: 'Ann', address: { city: 'Oslo' }, tags: ['x'] }"},
    b:{p:'[first, , third = 0, ...others]',v:'[10, 20, undefined, 40, 50]'},
    c:{p:'{ a, b: { c = 5 } = {}, d: [e, f] = [1, 2] }',v:'{ a: 1 }'}
  };
  host.innerHTML=`${NOTE('<b>Destructuring lab.</b> The pattern and value are really evaluated in the sandbox worker, and every variable the pattern creates is listed with its final value.')}
    <div class="row" style="margin-bottom:6px"><label class="hint" for="ds-pre">Example</label><select class="select" id="ds-pre" style="width:auto"><option value="a">object with defaults + rest</option><option value="b">array with holes</option><option value="c">nested defaults</option></select></div>
    <div class="row"><span class="mono">const</span><input class="input" id="ds-pat" aria-label="Destructuring pattern" style="max-width:420px" spellcheck="false" autocomplete="off"><span class="mono">=</span><input class="input" id="ds-val" aria-label="Value to destructure" style="max-width:420px" spellcheck="false" autocomplete="off"><button type="button" class="btn sm primary" data-a="run">${ic('play',13)}<span>Destructure</span></button></div>
    <div data-r="out" style="margin:10px 0"></div>
    <hr style="border:0;border-top:1px solid var(--border);margin:16px 0">
    ${NOTE('<b><code>??</code> versus <code>||</code>.</b> Computed live for each value:')}<div data-r="tbl"></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  async function run(){
    const my=++seq; if(job) job.cancel();
    q('out').innerHTML='<p class="viz-note"><span class="spinner"></span> Evaluating…</p>';
    job=startWorker({mode:'destruct',pattern:host.querySelector('#ds-pat').value,value:host.querySelector('#ds-val').value},{timeout:3000});
    const r=await job.promise;
    if(off||my!==seq||r.status==='cancelled') return;
    if(r.status!=='done'||!r.data){ q('out').innerHTML=WARN(esc(r.message||'Could not run.')); return; }
    if(r.data.error){ q('out').innerHTML=WARN('<b>Error:</b> '+esc(r.data.error)); return; }
    q('out').innerHTML=`<div class="tblwrap"><table class="tbl" style="min-width:0"><caption class="sr-only">Variables created by the pattern</caption><thead><tr><th scope="col">Variable</th><th scope="col">Value</th><th scope="col">typeof</th></tr></thead><tbody>${r.data.bindings.map(b=>`<tr><td><code>${esc(b.name)}</code></td><td><code>${esc(b.value)}</code></td><td>${esc(b.type)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No variables.</td></tr>'}</tbody></table></div>`;
    announce(r.data.bindings.length+' variables created.');
  }
  const VALS=['0',"''",'false','null','undefined','NaN',"'0'",'[]'];
  async function table(){
    const items=[]; VALS.forEach((v,i)=>{ [['??',`((v) => v ?? 'fallback')(${v})`],['||',`((v) => v || 'fallback')(${v})`],['?.length',`((v) => v?.length)(${v})`]].forEach(c=>items.push({id:i+'|'+c[0],code:c[1]})); });
    job2=startWorker({mode:'exprs',items:items},{timeout:3000});
    const r=await job2.promise;
    if(off||r.status==='cancelled') return;
    if(r.status!=='done'||!r.exprs){ q('tbl').innerHTML=WARN(esc(r.message||'Could not compute.')); return; }
    const g=(i,k)=>{ const x=r.exprs.find(e=>e.id===i+'|'+k); return x?(x.ok?x.value:x.error):'?'; };
    q('tbl').innerHTML=`<div class="tblwrap"><table class="tbl" style="min-width:0"><caption class="sr-only">Results of ??, || and ?.length for different values</caption><thead><tr><th scope="col">value</th><th scope="col"><code>v ?? 'fallback'</code></th><th scope="col"><code>v || 'fallback'</code></th><th scope="col"><code>v?.length</code></th></tr></thead><tbody>${VALS.map((v,i)=>{ const same=g(i,'??')===g(i,'||'); return `<tr><td><code>${esc(v)}</code></td><td><code>${esc(g(i,'??'))}</code></td><td><code>${esc(g(i,'||'))}</code>${same?'':' <span class="chg">differs</span>'}</td><td><code>${esc(g(i,'?.length'))}</code></td></tr>`; }).join('')}</tbody></table></div>`;
  }
  const setPre=k=>{ host.querySelector('#ds-pat').value=PRE[k].p; host.querySelector('#ds-val').value=PRE[k].v; };
  host.addEventListener('change',e=>{ if(e.target.id==='ds-pre'){ setPre(e.target.value); run(); } });
  host.addEventListener('click',e=>{ if(e.target.closest('[data-a="run"]')) run(); });
  setPre('a'); run(); table();
  return {destroy(){ off=true; if(job) job.cancel(); if(job2) job2.cancel(); }};
}

/* ---------- collections: key identity table ---------- */
const COLL_ROWS=[
  {t:'Object key order',code:"Object.keys({ b: 1, 2: 1, a: 1, 1: 1 })",why:'Integer-like keys come first, ascending; other keys keep insertion order.'},
  {t:'Map key order',code:"[...new Map([['b', 1], [2, 1], ['a', 1], [1, 1]]).keys()]",why:'A Map iterates in pure insertion order.'},
  {t:'1 and "1" as object keys',code:"(() => { const o = {}; o[1] = 'a'; o['1'] = 'b'; return Object.keys(o).length; })()",why:'Every object key becomes a string, so both are the same key.'},
  {t:'1 and "1" as Map keys',code:"(() => { const m = new Map(); m.set(1, 'a'); m.set('1', 'b'); return m.size; })()",why:'A Map keeps the type: two different keys.'},
  {t:'Objects as object keys',code:"(() => { const o = {}; o[{}] = 1; o[{}] = 2; return Object.keys(o); })()",why:'Both objects become the string "[object Object]".'},
  {t:'Objects as Map keys',code:"(() => { const a = {}, b = {}; return new Map([[a, 1], [b, 2]]).size; })()",why:'Keys are compared by identity: two different objects.'},
  {t:'NaN as a Map key',code:"new Map([[NaN, 'found']]).get(NaN)",why:'SameValueZero treats NaN as equal to NaN.'},
  {t:'Inherited keys',code:"['constructor' in {}, new Map().has('constructor')]",why:'Plain objects inherit keys such as constructor; a Map starts empty.'},
  {t:'Set de-duplication',code:"[...new Set([1, '1', 1, NaN, NaN, 0, -0])]",why:'1 and "1" differ; NaN counts once; 0 and -0 are the same.'},
  {t:'WeakMap keys',code:"(() => { try { new WeakMap().set('str', 1); } catch (e) { return e.name; } })()",why:'Only objects (and non-registered symbols) can be WeakMap keys.'},
  {t:'Symbols',code:"[Symbol('a') === Symbol('a'), Symbol.for('a') === Symbol.for('a')]",why:'Every Symbol() is unique; Symbol.for shares one per name.'}
];
function vizCollections(host,L){
  let off=false;
  host.innerHTML=`${NOTE('Each row is a real expression evaluated in the sandbox worker. Compare how objects, Maps, Sets, WeakMaps and Symbols treat keys.')}<div data-r="tbl"><p class="viz-note"><span class="spinner"></span> Running…</p></div>`;
  const job=startWorker({mode:'exprs',items:COLL_ROWS.map((r,i)=>({id:'r'+i,code:r.code}))},{timeout:3000});
  job.promise.then(res=>{
    if(off||res.status==='cancelled') return;
    const t=host.querySelector('[data-r="tbl"]');
    if(res.status!=='done'||!res.exprs){ t.innerHTML=WARN(esc(res.message||'Could not run.')); return; }
    t.innerHTML=`<div class="tblwrap"><table class="tbl"><caption class="sr-only">Key identity experiments</caption><thead><tr><th scope="col">Experiment</th><th scope="col">Expression</th><th scope="col">Result</th><th scope="col">Why</th></tr></thead><tbody>${COLL_ROWS.map((r,i)=>{ const x=res.exprs.find(e=>e.id==='r'+i); return `<tr><td><b>${esc(r.t)}</b></td><td><pre>${esc(r.code)}</pre></td><td>${x&&x.ok?`<code>${esc(x.value)}</code>`:`<span class="tdz">${esc(x?x.error:'?')}</span>`}</td><td>${esc(r.why)}</td></tr>`; }).join('')}</tbody></table></div>`;
  });
  return {destroy(){ off=true; job.cancel(); }};
}

/* ---------- proxy: trap log recorded for real ---------- */
function vizProxy(host,L){
  host.innerHTML=`${NOTE('Every operation that reaches a <code>new Proxy(...)</code> is recorded while your code runs. “default” means you wrote no trap for it, so it went straight to the target.')}<div data-r="log"><div class="narr">Press <b>Run</b> in the example above to record a trap log.</div></div>`;
  const box=()=>host.querySelector('[data-r="log"]');
  L.hooks.run.push(res=>{
    if(res.status!=='done'&&!res.traps.length){ box().innerHTML='<div class="narr">The run did not finish, so there is no trap log.</div>'; return; }
    if(!res.traps.length){ box().innerHTML='<div class="narr">No proxy operations were recorded. Does the code create a <code>new Proxy(...)</code> and use it?</div>'; return; }
    box().innerHTML=`<div class="tblwrap"><table class="tbl" style="min-width:0"><caption class="sr-only">Operations performed on proxies, in order</caption><thead><tr><th scope="col">#</th><th scope="col">Operation</th><th scope="col">Property / arguments</th><th scope="col">Handled by</th><th scope="col">At</th></tr></thead><tbody>${res.traps.map((t,i)=>`<tr><td>${i+1}</td><td><code>${esc(t.op)}</code></td><td><code>${esc(t.detail)}</code></td><td>${t.handled?'<b>your trap</b>':'<span class="muted">default (target)</span>'}</td><td class="muted">${Math.round(t.ms)} ms</td></tr>`).join('')}</tbody></table></div><p class="hint">${res.traps.length>=400?'Only the first 400 operations are shown. ':''}${res.traps.filter(t=>t.handled).length} of ${res.traps.length} operations ran one of your traps.</p>`;
    announce(res.traps.length+' proxy operations recorded.');
  });
  L.hooks.variant.push(()=>{ box().innerHTML='<div class="narr">Press <b>Run</b> in the example above to record a trap log.</div>'; });
  return {destroy(){}};
}

function runExample(L){
  if(L.job){ L.job.cancel(); return; }
  const ta=$('#code'), cout=$('#cout'), st=$('#cstatus');
  const code=ta.value;
  cout.innerHTML=''; let nLogs=0;
  st.innerHTML='<span class="spinner"></span> Running…';
  setRunBtn(L,true);
  const showTs=L.topic.id==='promises';
  const t0=performance.now();
  const msg={mode:'run',trace:L.topic.id==='eventloop',code:code,helpers:L.topic.id==='promises',proxyLog:L.topic.id==='proxy'};
  const opts={
    onLog:l=>{ nLogs++; cout.insertAdjacentHTML('beforeend',logHTML(l,showTs)); cout.scrollTop=cout.scrollHeight; },
    onNote:n=>{ cout.insertAdjacentHTML('beforeend',`<div class="log log-meta"><pre>${esc(n)}</pre></div>`); }
  };
  const job=L.topic.runner==='iframe'?startIframeRun(code,opts):startWorker(msg,opts);
  L.job=job;
  job.promise.then(res=>{
    if(L.job!==job||LESSON!==L) return;
    L.job=null; res.code=code;
    setRunBtn(L,false);
    const extra=(cls,text)=>cout.insertAdjacentHTML('beforeend',`<div class="log log-${cls}"><span class="lv">${cls==='error'?'error':cls==='warn'?'stopped':''}</span><pre>${esc(text)}</pre></div>`);
    if(res.status==='timeout') extra('warn',res.message);
    else if(res.status==='error'||res.status==='unavailable') extra('error',res.message);
    else if(res.status==='cancelled') extra('meta','Stopped.');
    else if(!nLogs) cout.innerHTML='<div class="empty">The code ran and printed nothing. Add a <code>console.log(...)</code>.</div>';
    const ms=Math.round(performance.now()-t0);
    const label=res.status==='done'?`Finished in ${ms} ms · ${nLogs} line${nLogs===1?'':'s'}`:res.status==='timeout'?'Timed out':res.status==='cancelled'?'Stopped':'Could not run';
    st.textContent=label;
    announce('Run finished. '+label+'.');
    L.hooks.run.forEach(f=>{ try{ f(res); }catch(err){ console.error(err); } });
  });
}

function wireExample(L){
  const ta=$('#code');
  const fit=()=>{ ta.rows=Math.max(7,Math.min(26,ta.value.split('\n').length+1)); };
  const load=v=>{ L.variant=v; ta.value=v.code; fit(); $('#cout').innerHTML='<div class="empty">Press Run to see the output.</div>'; $('#cstatus').textContent=''; };
  load(L.variant);
  setRunBtn(L,false);
  $('#variants').addEventListener('click',e=>{
    const b=e.target.closest('button[data-v]'); if(!b) return;
    if(L.job){ const j=L.job; L.job=null; j.cancel(); setRunBtn(L,false); }
    const v=L.topic.variants.find(x=>x.id===b.dataset.v);
    $$('#variants button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
    load(v);
    L.hooks.variant.forEach(f=>f(v));
    announce('Example loaded: '+v.label);
  });
  $('#run').addEventListener('click',()=>runExample(L));
  $('#reset-code').addEventListener('click',()=>{ ta.value=L.variant.code; fit(); L.hooks.reset.forEach(f=>f()); L.hooks.edit.forEach(f=>f()); toast('Code reset'); });
  $('#clear-out').addEventListener('click',()=>{ $('#cout').innerHTML='<div class="empty">Console cleared.</div>'; $('#cstatus').textContent=''; });
  ta.addEventListener('input',()=>{ fit(); L.hooks.edit.forEach(f=>f()); });
  ta.addEventListener('blur',()=>{ L.tabFree=false; });
  ta.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); runExample(L); return; }
    if(e.key==='Escape'){ L.tabFree=true; return; }
    if(e.key==='Tab'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey&&!e.altKey){
      if(L.tabFree){ L.tabFree=false; return; }
      e.preventDefault();
      ta.setRangeText('  ',ta.selectionStart,ta.selectionEnd,'end');
      ta.dispatchEvent(new Event('input',{bubbles:true}));
      return;
    }
    L.tabFree=false;
  });
}

  host.addEventListener('click',e=>{
    const b=e.target.closest('button[data-a]'); if(!b) return;
    const card=b.closest('.qcard'), q=t.quiz.find(x=>x.id===card.dataset.q);
    if(b.dataset.a==='copy'){
      const ta=$('#code'); ta.value=q.code+'\n'; ta.dispatchEvent(new Event('input',{bubbles:true}));
      toast('Snippet copied to the editor'); try{ ta.scrollIntoView({block:'center',behavior:reduceMotion()?'auto':'smooth'}); ta.focus({preventScroll:true}); }catch(x){}
      return;
    }
    if(b.dataset.a==='retry'){
      card.querySelectorAll('input[type=radio]').forEach(r=>{ r.checked=false; }); card.querySelector('.typed').hidden=true;
      card.querySelector('[data-r="result"]').innerHTML=''; card.classList.remove('fail');
      const bd=card.querySelector('[data-r="badge"]'); bd.className='badge todo'; bd.textContent='Not answered';
      return;
    }
    const chosen=card.querySelector('input[type=radio]:checked');
    if(!chosen){ toast('Pick an answer first',true); return; }
    let mine;
    if(chosen.value==='typed'){ mine=card.querySelector('.typed textarea').value; if(!mine.trim()){ toast('Type your predicted output first',true); return; } }
    else mine=q.options[+chosen.value];
    const resBox=card.querySelector('[data-r="result"]');
    resBox.innerHTML='<p class="viz-note"><span class="spinner"></span> Running the snippet in the sandbox…</p>';
    b.disabled=true;
    const job=t.runner==='iframe'?startIframeRun(q.code):startWorker({mode:'run',trace:false,code:q.code});
    L.quizJobs.push(job);
    job.promise.then(res=>{
      b.disabled=false;
      if(LESSON!==L) return;
      if(res.status!=='done'){ resBox.innerHTML=`<p class="viz-note warn">${esc(res.message||'The snippet did not finish.')}</p>`; return; }
      const actual=outputOf(res), ok=normOut(mine)===normOut(actual);
      const bd=card.querySelector('[data-r="badge"]');
      card.classList.toggle('pass',ok); card.classList.toggle('fail',!ok);
      if(ok){ bd.className='badge pass'; bd.textContent='✓ Correct'; markDone(t,q.id); updateQuizCount(L); }
      else { bd.className='badge fail'; bd.textContent='✗ Not quite'; }
      resBox.innerHTML=`<div class="cmp"><div class="${ok?'ok':'no'}"><h4>${ok?'✓ Your answer (matches)':'✗ Your answer'}</h4><pre>${esc(mine.replace(/\s+$/,''))||' '}</pre></div><div class="ok"><h4>Real output</h4><pre>${esc(actual)||'(nothing printed)'}</pre></div></div>
        <div class="why"><b>Why:</b> ${q.why}</div>${ok?'':'<div class="row" style="margin-top:8px"><button type="button" class="btn sm" data-a="retry">Try again</button></div>'}`;
      announce(ok?'Correct. The real output matches your answer.':'Not quite. The real output is shown next to your answer.');
    });
  });
}

/* ---------- topic selection ---------- */
function selectTopic(id,opts){
  opts=opts||{};
  const t=TOPICS.find(x=>x.id===id)||TOPICS[0];
  destroyLesson();
  PR.topic=t.id; saveProgress();
  const L={topic:t,variant:t.variants[0],hooks:{variant:[],run:[],edit:[],reset:[]},job:null,quizJobs:[],viz:null,tabFree:false,getCode:()=>($('#code')||{value:''}).value};
  LESSON=L;
  $('#lesson').innerHTML=lessonHTML(t);
  document.title=t.title+' · JS Concepts Lab · Levelup';
  wireExample(L);
  L.viz=VIZ[t.id]($('#viz'),L);
  wireQuiz(L);
  renderSidebar();
  try{ if(opts.hash!==false&&history.replaceState) history.replaceState(null,'','#'+t.id); }catch(e){}
  if(opts.focus){ const h=$('#lesson-title'); try{ h.focus({preventScroll:true}); window.scrollTo(0,0); }catch(e){} }
  announce('Lesson: '+t.title);
}

function renderSidebar(){
  const total=TOPICS.reduce((a,t)=>a+t.quiz.length,0);
  const done=TOPICS.reduce((a,t)=>a+t.quiz.filter(q=>isDone(t,q.id)).length,0);
  $('#progress').innerHTML=`<div class="progress-row"><span>Overall progress</span><span>${done} of ${total} predictions</span></div>
    <div class="bar" role="progressbar" aria-label="Overall progress" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}"><i style="width:${total?done/total*100:0}%"></i></div>`;
  const item=(t,i)=>{
    const d=t.quiz.filter(q=>isDone(t,q.id)).length, all=d===t.quiz.length, active=PR.topic===t.id;
    return `<button type="button" class="qitem${active?' active':''}" data-t="${t.id}"${active?' aria-current="true"':''}>
      <span class="qstatus${all?' pass':''}" aria-hidden="true">${ic('check',12)}</span>
      <span class="qmain"><span class="qtitle">${i+1}. ${esc(t.title)}</span><span class="qmeta"><span class="pips" aria-hidden="true">${t.quiz.map(q=>isDone(t,q.id)?'<span class="on">✓</span>':'·').join('')}</span>${d}/${t.quiz.length} correct${all?' · complete':''}</span></span></button>`;
  };
  $('#topics').innerHTML=GROUPS.map((g,gi)=>{
    const ts=TOPICS.filter(t=>t.group===g);
    const gd=ts.reduce((a,t)=>a+t.quiz.filter(q=>isDone(t,q.id)).length,0), gt=ts.reduce((a,t)=>a+t.quiz.length,0);
    return `<div class="grp" role="group" aria-labelledby="grp-${gi}"><div class="grp-h" id="grp-${gi}"><span>${esc(g)}</span><span class="n">${gd}/${gt}</span></div>${ts.map(t=>item(t,TOPICS.indexOf(t))).join('')}</div>`;
  }).join('');
}

/* ---------- wire up ---------- */
function init(){
  $('#logo').innerHTML=ic('code',18);
  loadProgress();
  applyTheme();
  $('#theme-btn').addEventListener('click',()=>{ themeState=isDark()?'light':'dark'; setTheme(themeState); applyTheme(); });
  try{ const mq=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)'); if(mq&&mq.addEventListener) mq.addEventListener('change',()=>{ if(!themeState) applyTheme(); }); }catch(e){}
  $('#topics').addEventListener('click',e=>{ const b=e.target.closest('button[data-t]'); if(b) selectTopic(b.dataset.t,{focus:true}); });
  $('#reset-progress').addEventListener('click',()=>{
    let ok=true; try{ if(typeof window.confirm==='function') ok=window.confirm('Clear your saved progress for all lessons?'); }catch(e){}
    if(!ok) return;
    PR.done={}; saveProgress(); renderSidebar(); selectTopic(PR.topic,{hash:false}); toast('Progress cleared');
  });
  const h=(location.hash||'').replace('#','');
  selectTopic(TOPICS.some(t=>t.id===h)?h:PR.topic,{focus:false});
}
window.__JSLAB__={WORKER_SRC,TOPICS,CLOSURE_SCENES,HOIST_SCENES,ERROR_SCENES,THIS_ROWS,EQ_VALUES,HOF_PRESETS,hexdump,typedBytes,utf8Info,buildEventFrames,buildEvDoc,openSession,startIframeRun,normalizeEvents,buildFrames,normOut,startWorker,PKEY,KEY,selectTopic,PR:()=>PR,GROUPS,ready:false};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>{ init(); window.__JSLAB__.ready=true; });
else { init(); window.__JSLAB__.ready=true; }
</script>
