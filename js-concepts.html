const NEW_TOPICS=[
{
  id:'generators',group:'Async',title:'Generators & iterators',tag:'Functions that pause and resume',
  explain:[
    'A <b>generator function</b> (<code>function*</code>) can pause in the middle and be resumed later. Calling it does not run the body: it returns a generator object, and each <code>next()</code> runs the code up to the next <code>yield</code>, which hands a value out and pauses.',
    'The result of <code>next()</code> is always an object <code>{ value, done }</code>. Because the body runs only on demand, generators can describe lazy or even infinite sequences.',
    '<code>yield</code> can also receive a value: what you pass to <code>next(value)</code> becomes the result of the <code>yield</code> expression, and <code>return()</code> / <code>throw()</code> end or interrupt the generator from outside. Generators are iterators, so <code>for...of</code>, spread and destructuring work on them.'
  ],
  analogy:'A generator is a <b>book with a bookmark</b>: <code>next()</code> reads until the next bookmark and stops, and the book remembers exactly where you were. Nobody has to read the whole book at once.',
  variants:[
    {id:'basic',label:'yield and next()',genExpr:'countTo(3)',code:"function* countTo(n) {\n  console.log('start');\n  for (let i = 1; i <= n; i++) {\n    yield i;\n  }\n  console.log('end');\n  return 'done';\n}\n// demo\nconst g = countTo(3);\nconsole.log(g.next());\nconsole.log(g.next());\nconsole.log([...countTo(2)]);\n",expect:"start\n{value: 1, done: false}\n{value: 2, done: false}\nstart\nend\n[1, 2]"},
    {id:'twoway',label:'Two-way next(value)',genExpr:'accumulator()',code:"function* accumulator() {\n  let total = 0;\n  while (true) {\n    const n = yield total;\n    total += n;\n  }\n}\n// demo\nconst acc = accumulator();\nacc.next(); // runs to the first yield\nconsole.log(acc.next(5).value);\nconsole.log(acc.next(10).value);\nconsole.log(acc.return(99));\nconsole.log(acc.next());\n",expect:"5\n15\n{value: 99, done: true}\n{value: undefined, done: true}"},
    {id:'lazy',label:'Lazy & iterable',genExpr:'naturals()',code:"function* naturals() {\n  let n = 1;\n  while (true) yield n++;\n}\nfunction* take(it, n) {\n  let i = 0;\n  for (const x of it) {\n    if (i++ >= n) return;\n    yield x;\n  }\n}\nconst evens = {\n  *[Symbol.iterator]() {\n    for (const x of naturals()) if (x % 2 === 0) yield x;\n  }\n};\n// demo\nconsole.log([...take(evens, 4)]);\nconst manual = [10, 20][Symbol.iterator]();\nconsole.log(manual.next(), manual.next(), manual.next());\n",expect:"[2, 4, 6, 8]\n{value: 10, done: false} {value: 20, done: false} {value: undefined, done: true}"},
    {id:'async',label:'Async generator',genExpr:'ticker(3)',code:"async function* ticker(n) {\n  for (let i = 1; i <= n; i++) {\n    await new Promise(r => setTimeout(r, 20));\n    yield 'tick ' + i;\n  }\n}\n// demo\n(async () => {\n  for await (const t of ticker(3)) console.log(t);\n  console.log('finished');\n})();\n",expect:"tick 1\ntick 2\ntick 3\nfinished"}
  ],
  quiz:[
    {id:'g1',code:"function* g() {\n  const x = yield 1;\n  console.log('got', x);\n  yield x * 2;\n}\nconst it = g();\nconsole.log(it.next('ignored').value);\nconsole.log(it.next(21).value);",options:['1\ngot 21\n42','1\ngot ignored\nNaN','got 21\n1\n42','1\n42\ngot 21'],why:'The first <code>next()</code> only starts the generator, so its argument is thrown away. The second <code>next(21)</code> makes <code>yield 1</code> evaluate to 21, which is then printed and doubled.'},
    {id:'g2',code:"function* g() {\n  yield 1;\n  return 2;\n}\nconst it = g();\nconsole.log(JSON.stringify(it.next()), JSON.stringify(it.next()), JSON.stringify(it.next()));\nconsole.log([...g()].join());",options:['{"value":1,"done":false} {"value":2,"done":true} {"done":true}\n1','{"value":1,"done":false} {"value":2,"done":false} {"done":true}\n1,2','{"value":1,"done":false} {"value":2,"done":true} {"done":true}\n1,2','{"value":1,"done":false} {"done":true} {"done":true}\n1'],why:'A <code>return</code> value is delivered once with <code>done: true</code>. After that <code>value</code> is <code>undefined</code>, which <code>JSON.stringify</code> leaves out. Spread ignores the return value, so only 1 is collected.'},
    {id:'g3',code:"function* nums() {\n  console.log('a');\n  yield 1;\n  console.log('b');\n  yield 2;\n}\nconst it = nums();\nconsole.log('created');\nfor (const n of it) {\n  console.log(n);\n  break;\n}\nconsole.log(it.next().done);",options:['a\ncreated\n1\ntrue','created\na\n1\nfalse','created\na\n1\ntrue','created\na\n1\nb\ntrue'],why:'Nothing runs until the first <code>next()</code>, so <code>created</code> comes first. <code>break</code> makes <code>for...of</code> call <code>return()</code> on the generator, which finishes it, so the later <code>next()</code> reports <code>done: true</code> and <code>b</code> is never printed.'},
    {id:'g4',code:"function* g() {\n  try { yield 1; yield 2; }\n  catch (e) { console.log('caught', e); yield 'recovered'; }\n  finally { console.log('cleanup'); }\n}\nconst it = g();\nit.next();\nconsole.log(it.throw('boom').value);\nconsole.log(it.next().done);",options:['caught boom\nrecovered\ncleanup\ntrue','caught boom\nrecovered\ntrue','recovered\ncaught boom\ncleanup\ntrue','caught boom\ncleanup\nrecovered\ntrue'],why:'<code>throw()</code> raises the error at the paused <code>yield</code>, inside the generator, so its own <code>catch</code> handles it and yields <code>recovered</code>. The next <code>next()</code> leaves the catch block, runs <code>finally</code> (<code>cleanup</code>) and finishes.'}
  ],
  cheat:{
    keys:['<code>function*</code> returns a generator object; the body runs only when you call <code>next()</code>.','<code>next()</code> gives <code>{ value, done }</code>; the value after a <code>return</code> arrives once with <code>done: true</code>.','<code>next(x)</code> makes the paused <code>yield</code> evaluate to <code>x</code> (the first call\'s argument is ignored).','<code>return(v)</code> finishes early (running <code>finally</code>); <code>throw(e)</code> raises <code>e</code> at the paused <code>yield</code>.','Async generators (<code>async function*</code>) are consumed with <code>for await...of</code>.'],
    mistakes:['Expecting code to run when the generator is created: nothing runs until the first <code>next()</code>.','Spreading or looping over an infinite generator without a stopping condition (<code>[...naturals()]</code> never ends).']
  }
},
{
  id:'events',group:'Browser APIs',runner:'iframe',title:'Event propagation',tag:'How a click travels through the page',
  explain:[
    'When you click a button, the browser does not just tell the button: the event travels through the whole tree of nested elements. It first goes <b>down</b> from the window to the target (the <b>capturing</b> phase), reaches the target itself, then goes back <b>up</b> (the <b>bubbling</b> phase).',
    'A listener runs in the bubbling phase by default; pass <code>true</code> or <code>{ capture: true }</code> to listen while the event is going down. <code>stopPropagation()</code> stops the event from moving on to other elements, <code>stopImmediatePropagation()</code> also skips the remaining listeners on the same element, and <code>preventDefault()</code> cancels the browser\'s own action (following a link, ticking a checkbox) without stopping the propagation.',
    'Because events bubble, one listener on a parent can handle all its children, even ones added later. That is <b>event delegation</b>: <code>event.target</code> is the element that was clicked and <code>event.currentTarget</code> is the element holding the listener.'
  ],
  analogy:'Think of a <b>parcel delivered through a building</b>: it passes each floor on the way down (capture), reaches the flat (target), and the receipt travels back up through the same floors (bubble). A caretaker on any floor can keep it there (<code>stopPropagation</code>).',
  variants:[
    {id:'order',label:'Capture vs bubble',code:"const gp = document.getElementById('grandparent');\nconst parent = document.getElementById('parent');\nconst child = document.getElementById('child');\nconst btn = document.getElementById('btn');\nfor (const [name, el] of [['grandparent', gp], ['parent', parent], ['child', child], ['button', btn]]) {\n  el.addEventListener('click', () => console.log(name + ' (capture)'), true);\n  el.addEventListener('click', () => console.log(name + ' (bubble)'));\n}\nbtn.click();\n",expect:"grandparent (capture)\nparent (capture)\nchild (capture)\nbutton (capture)\nbutton (bubble)\nchild (bubble)\nparent (bubble)\ngrandparent (bubble)"},
    {id:'stop',label:'Stopping propagation',code:"const gp = document.getElementById('grandparent');\nconst parent = document.getElementById('parent');\nconst child = document.getElementById('child');\nconst btn = document.getElementById('btn');\ngp.addEventListener('click', () => console.log('grandparent (never reached)'));\nparent.addEventListener('click', e => { console.log('parent: stopPropagation'); e.stopPropagation(); });\nparent.addEventListener('click', () => console.log('parent: second listener (still runs)'));\nchild.addEventListener('click', e => { console.log('child: stopImmediatePropagation'); e.stopImmediatePropagation(); });\nchild.addEventListener('click', () => console.log('child: second listener (skipped)'));\nconsole.log('--- parent.click()');\nparent.click();\nconsole.log('--- btn.click()');\nbtn.click();\n",expect:"--- parent.click()\nparent: stopPropagation\nparent: second listener (still runs)\n--- btn.click()\nchild: stopImmediatePropagation"},
    {id:'deleg',label:'Event delegation',code:"const list = document.getElementById('list');\nlist.addEventListener('click', e => {\n  const li = e.target.closest('li');\n  if (!li) return;\n  console.log('clicked', li.textContent, '| target:', e.target.tagName, '| currentTarget:', e.currentTarget.tagName);\n});\nconst added = document.createElement('li');\nadded.textContent = 'Added later';\nlist.appendChild(added);\nlist.children[0].click();\nadded.click();\n",expect:"clicked Item 1 | target: LI | currentTarget: UL\nclicked Added later | target: LI | currentTarget: UL"},
    {id:'default',label:'preventDefault & once',code:"const box = document.getElementById('chk');\nbox.addEventListener('click', e => {\n  console.log('default prevented?', e.defaultPrevented);\n  e.preventDefault();\n  console.log('now?', e.defaultPrevented);\n});\nbox.click();\nconsole.log('checked:', box.checked);\nconst btn = document.getElementById('btn');\nbtn.addEventListener('click', () => console.log('once!'), { once: true });\nbtn.click();\nbtn.click();\n",expect:"default prevented? false\nnow? true\nchecked: false\nonce!"}
  ],
  quiz:[
    {id:'v1',code:"const gp = document.getElementById('grandparent');\nconst parent = document.getElementById('parent');\nconst child = document.getElementById('child');\ngp.addEventListener('click', () => console.log('A'));\nparent.addEventListener('click', () => console.log('B'), true);\nchild.addEventListener('click', () => console.log('C'));\ndocument.getElementById('btn').click();",options:['A\nB\nC','B\nC\nA','C\nB\nA','B\nA\nC'],why:'The event goes down first: only <code>parent</code> listens in the capture phase, so B comes first. On the way back up the bubbling listeners run from the inside out: child (C), then grandparent (A).'},
    {id:'v2',code:"const gp = document.getElementById('grandparent');\nconst parent = document.getElementById('parent');\nconst child = document.getElementById('child');\ngp.addEventListener('click', () => console.log('gp capture'), true);\nparent.addEventListener('click', e => { console.log('parent capture'); e.stopPropagation(); }, true);\nchild.addEventListener('click', () => console.log('child'));\ngp.addEventListener('click', () => console.log('gp bubble'));\ndocument.getElementById('btn').click();",options:['gp capture\nparent capture','gp capture\nparent capture\nchild\ngp bubble','parent capture','gp capture\nparent capture\ngp bubble'],why:'<code>stopPropagation()</code> in a capturing listener stops the event right there: it never reaches the child, and it never bubbles back up either.'},
    {id:'v3',code:"const list = document.getElementById('list');\nlist.children[1].id = 'second';\nlist.addEventListener('click', e => console.log(e.target.id, e.currentTarget.id));\nlist.children[1].click();",options:['list second','second list','second second','list list'],why:'<code>e.target</code> is the element that was clicked (the second <code>li</code>) and <code>e.currentTarget</code> is the element whose listener is running (the <code>ul</code> with id <code>list</code>).'},
    {id:'v4',code:"let n = 0;\nconst btn = document.getElementById('btn');\nbtn.addEventListener('click', () => n++, { once: true });\nbtn.click();\nbtn.click();\nbtn.click();\nconst chk = document.getElementById('chk');\nchk.addEventListener('click', e => e.preventDefault(), { passive: true });\nchk.click();\nconsole.log(n, chk.checked);",options:['3 false','1 false','1 true','3 true'],why:'<code>{ once: true }</code> removes the listener after its first call, so <code>n</code> is 1. A <b>passive</b> listener promises not to cancel the event, so its <code>preventDefault()</code> is ignored and the checkbox does get ticked.'}
  ],
  cheat:{
    keys:['Order: capture (window down to the target), target, then bubble (back up).','<code>addEventListener(type, fn, true)</code> or <code>{ capture: true }</code> listens while the event travels down.','<code>stopPropagation()</code> blocks other elements; <code>stopImmediatePropagation()</code> also blocks the remaining listeners on the same element.','<code>preventDefault()</code> cancels the default action only; it does not stop propagation.','Delegation: one listener on a parent plus <code>event.target.closest(selector)</code> handles children added later.'],
    mistakes:['Using <code>stopPropagation()</code> to cancel a link or form submit: that is <code>preventDefault()</code>. Stopping propagation also breaks analytics and other handlers higher up.','Adding a listener to every list item, then wondering why items added later do nothing: delegate instead.']
  }
},
{
  id:'blobs',group:'Browser APIs',title:'Blobs, files & binary data',tag:'Bytes, buffers and files',
  explain:[
    'Computers store everything as <b>bytes</b> (numbers from 0 to 255): text, images and files are just bytes plus an agreement about how to read them. An <code>ArrayBuffer</code> is a fixed block of raw bytes, and you look at it through a <b>view</b>: a typed array such as <code>Uint8Array</code> or <code>Float32Array</code>, or a <code>DataView</code> when you need to choose the byte order (endianness).',
    '<code>TextEncoder</code> and <code>TextDecoder</code> convert between strings and UTF-8 bytes, where one character can take 1 to 4 bytes. A <code>Blob</code> is an immutable chunk of bytes with a size and a MIME <code>type</code>, and a <code>File</code> is a Blob with a name.',
    'You read a Blob with <code>blob.text()</code>, <code>blob.arrayBuffer()</code> or <code>FileReader</code>, cut it with <code>slice()</code>, and turn it into a downloadable link with <code>URL.createObjectURL()</code>, which you should <code>revokeObjectURL()</code> afterwards.'
  ],
  analogy:'A Blob is a <b>sealed envelope with a label</b>: you can see its weight (size) and what it claims to contain (type), but you must open it to see the bytes. An ArrayBuffer is a strip of numbered mailboxes, and typed arrays are different ways of grouping those mailboxes.',
  variants:[
    {id:'utf8',label:'Text to bytes (UTF-8)',code:"const enc = new TextEncoder();\nconst bytes = enc.encode('héllo €');\nconsole.log(bytes.length, 'bytes for', 'héllo €'.length, 'characters');\nconsole.log(Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join(' '));\nconsole.log(new TextDecoder().decode(bytes));\nconsole.log(enc.encode('😀').length);\n",expect:"10 bytes for 7 characters\n68 c3 a9 6c 6c 6f 20 e2 82 ac\nhéllo €\n4"},
    {id:'typed',label:'Typed arrays & endianness',code:"const buf = new ArrayBuffer(8);\nconst view = new DataView(buf);\nview.setUint16(0, 0x1234);        // big-endian by default\nview.setUint16(2, 0x1234, true);  // little-endian\nview.setFloat32(4, 1.5);\nconsole.log(Array.from(new Uint8Array(buf)).join(' '));\nconsole.log(new Uint8Array([255, 256, 257]).join(','));\nconsole.log(new Int8Array([200, -129]).join(','));\nconsole.log(new Uint16Array(buf, 0, 2).join(',')); // uses the machine's byte order (little-endian on most)\n",expect:"18 52 52 18 63 192 0 0\n255,0,1\n-56,127\n13330,4660"},
    {id:'blob',label:'Blob, File & slice',code:"const blob = new Blob(['Hello, ', 'Blob!'], { type: 'text/plain' });\nconsole.log(blob.size, blob.type);\nconst part = blob.slice(7, 11);\nconst file = new File(['a,b\\n1,2'], 'data.csv', { type: 'text/csv' });\nconsole.log(file.name, file.size, file.type, file instanceof Blob);\nconst url = URL.createObjectURL(blob);\nconsole.log(url.startsWith('blob:'));\nURL.revokeObjectURL(url);\n(async () => {\n  console.log('slice:', await part.text(), part.size);\n  const ab = await blob.arrayBuffer();\n  console.log('bytes:', ab.byteLength, new Uint8Array(ab)[0]);\n})();\n",expect:"12 text/plain\ndata.csv 7 text/csv true\ntrue\nslice: Blob 4\nbytes: 12 72"},
    {id:'download',label:'Generate a download',code:"const rows = [['name', 'score'], ['Ada', 10], ['Bo', 7]];\nconst csv = rows.map(r => r.join(',')).join('\\n');\nconst blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });\nconsole.log(blob.size, blob.type);\nconst url = URL.createObjectURL(blob);\nconsole.log('would download:', url.startsWith('blob:'));\n// On a real page (not in a worker, which has no DOM):\n//   const a = document.createElement('a');\n//   a.href = url; a.download = 'scores.csv'; a.click();\nURL.revokeObjectURL(url); // free the memory when you are done\n",expect:"22 text/csv;charset=utf-8\nwould download: true"}
  ],
  quiz:[
    {id:'b1',code:"console.log(new TextEncoder().encode('é€😀').length, 'é€😀'.length);",options:['3 3','9 4','4 4','9 3'],why:'UTF-8 uses 2 bytes for <code>é</code>, 3 for <code>€</code> and 4 for the emoji: 9 bytes. In JavaScript strings the emoji is two UTF-16 units, so the string length is 1 + 1 + 2 = 4.'},
    {id:'b2',code:"console.log(new Uint8Array([255, 256, -1]).join());\nconsole.log(new Uint8ClampedArray([300, -5, 1.4]).join());",options:['255,256,-1\n255,0,1','255,0,255\n255,0,1','255,0,255\n300,-5,1.4','255,0,255\n255,0,2'],why:'A <code>Uint8Array</code> wraps values around modulo 256 (256 becomes 0, -1 becomes 255). A <code>Uint8ClampedArray</code> clamps to 0-255 and rounds, so 300 becomes 255, -5 becomes 0 and 1.4 becomes 1.'},
    {id:'b3',code:"const b = new ArrayBuffer(4);\nconst v = new DataView(b);\nv.setUint16(0, 258);\nv.setUint16(2, 258, true);\nconsole.log(Array.from(new Uint8Array(b)).join(' '));\nconsole.log(v.getUint16(0, true));",options:['1 2 1 2\n258','1 2 2 1\n513','2 1 1 2\n513','1 2 2 1\n258'],why:'258 is <code>0x0102</code>. Big-endian (the default) stores the bytes as 1 2, little-endian as 2 1. Reading the first two bytes (1, 2) as little-endian gives <code>0x0201</code> = 513.'},
    {id:'b4',code:"const blob = new Blob(['ab', new Uint8Array([99, 100]), 'é'], { type: 'Text/Plain' });\nconsole.log(blob.size, blob.type, blob.slice(1, 3).size);\nblob.slice(2, 4).text().then(t => console.log(t));",options:['5 Text/Plain 2\ncd','6 text/plain 2\ncd','6 text/plain 2\nbc','6 Text/Plain 3\ncd'],why:'The parts are 2 + 2 + 2 bytes (<code>é</code> takes 2 bytes in UTF-8) = 6. The type is lower-cased. <code>slice(1, 3)</code> is 2 bytes, and bytes 2 and 3 are <code>99, 100</code>, which spell <code>cd</code>.'}
  ],
  cheat:{
    keys:['Bytes are numbers 0-255; a typed array or <code>DataView</code> is a <em>view</em> onto an <code>ArrayBuffer</code>, not a copy.','UTF-8: one character is 1-4 bytes, so <code>string.length</code> is not the byte length; use <code>TextEncoder</code>.','Typed arrays wrap around (<code>Uint8Array</code>) or clamp (<code>Uint8ClampedArray</code>) out-of-range numbers.','A <code>Blob</code> is immutable bytes + MIME type; a <code>File</code> adds a name. Read with <code>text()</code>, <code>arrayBuffer()</code> or <code>FileReader</code>.','<code>URL.createObjectURL(blob)</code> makes a temporary link; call <code>URL.revokeObjectURL(url)</code> when finished.'],
    mistakes:['Trusting <code>file.type</code>: it comes from the file extension, not from the content.','Forgetting endianness when reading binary formats with a <code>DataView</code>, or never revoking object URLs (a memory leak).']
  }
},
{
  id:'prototypes',group:'Objects and data',title:'Prototypes & classes',tag:'How objects inherit',
  explain:[
    'Every JavaScript object has a hidden link to another object called its <b>prototype</b>. When you read <code>obj.x</code> and <code>obj</code> has no own <code>x</code>, the engine follows the link and looks there, then at the prototype\'s prototype, and so on until it reaches <code>null</code>: this is the <b>prototype chain</b>.',
    'Writing a property always happens on the object itself, so a shared method lives once on the prototype while each instance keeps its own data. <code>class</code> is friendlier syntax over the same mechanism: methods go on <code>Class.prototype</code>, <code>extends</code> links the prototypes, and <code>super</code> calls up the chain.',
    'Private <code>#fields</code> are truly hidden and never show up on the chain, and a method written as an arrow-function property is created per instance instead of being shared.'
  ],
  analogy:'Like asking a colleague a question: if they do not know, they ask their manager, who asks the department head, until someone answers or nobody is left (<code>undefined</code>).',
  variants:[
    {id:'ctor',label:'Constructor & prototype',chains:[{id:'a',title:'rex',expr:'rex'},{id:'b',title:'Animal (the constructor function)',expr:'Animal'}],code:"function Animal(name) { this.name = name; }\nAnimal.prototype.speak = function () { return this.name + ' makes a sound'; };\nconst rex = new Animal('Rex');\nconsole.log(rex.speak());\nconsole.log(Object.getPrototypeOf(rex) === Animal.prototype);\nconsole.log(rex.hasOwnProperty('speak'), 'speak' in rex);\nconsole.log(rex.toString === Object.prototype.toString);\n",expect:"Rex makes a sound\ntrue\nfalse true\ntrue"},
    {id:'create',label:'Object.create',chains:[{id:'a',title:'ann',expr:'ann'},{id:'b',title:'bare',expr:'bare'}],code:"const base = { greet() { return 'hi ' + this.name; } };\nconst ann = Object.create(base);\nann.name = 'Ann';\nconsole.log(ann.greet());\nconsole.log(Object.getPrototypeOf(ann) === base, Object.keys(ann));\nconst bare = Object.create(null);\nconsole.log(typeof bare.toString);\n",expect:"hi Ann\ntrue ['name']\nundefined"},
    {id:'class',label:'class, extends, super',chains:[{id:'a',title:'d',expr:'d'},{id:'b',title:'Dog (static inheritance)',expr:'Dog'}],code:"class Animal {\n  #secret = 42;\n  static count = 0;\n  constructor(name) { this.name = name; Animal.count++; }\n  get shout() { return this.name.toUpperCase(); }\n  speak() { return `${this.name} makes a sound`; }\n  reveal() { return this.#secret; }\n}\nclass Dog extends Animal {\n  speak() { return super.speak() + ' (woof)'; }\n}\nconst d = new Dog('Rex');\nconsole.log(d.speak(), d.shout, d.reveal());\nconsole.log(d instanceof Dog, d instanceof Animal, Animal.count);\nconsole.log(typeof Animal, Object.getPrototypeOf(Dog) === Animal);\n",expect:"Rex makes a sound (woof) REX 42\ntrue true 1\nfunction true"},
    {id:'arrow',label:'Method vs arrow property',chains:[{id:'a',title:'c',expr:'c'}],code:"class Counter {\n  count = 0;\n  inc() { this.count++; }\n  incArrow = () => { this.count++; };\n}\nconst c = new Counter();\nconst { inc, incArrow } = c;\nincArrow();\nconsole.log(c.count, Object.keys(c).join(), 'inc' in c, c.hasOwnProperty('inc'));\ntry { inc(); } catch (e) { console.log(e.name); }\n",expect:"1 count,incArrow true false\nTypeError"}
  ],
  quiz:[
    {id:'pr1',code:"function A() {}\nA.prototype.x = 1;\nconst a = new A();\na.x = 2;\ndelete a.x;\nconsole.log(a.x);\ndelete A.prototype.x;\nconsole.log(a.x);",options:['undefined\nundefined','2\n1','1\nundefined','1\n1'],why:'<code>a.x = 2</code> creates an own property that hides the prototype\'s <code>x</code>. Deleting it uncovers the prototype value 1. Deleting the prototype\'s property leaves nothing to find.'},
    {id:'pr2',code:"class P { constructor() { this.a = 1; } m() {} }\nconst p = new P();\nconsole.log(Object.keys(p).join(), 'm' in p, p.hasOwnProperty('m'), Object.getPrototypeOf(p) === P.prototype);",options:['a,m true true true','a false false true','a true false true','a,m true false false'],why:'Class methods live on <code>P.prototype</code>, not on the instance: <code>in</code> finds it through the chain, but <code>hasOwnProperty</code> and <code>Object.keys</code> do not.'},
    {id:'pr3',code:"const o = { greet() { return 'A'; } };\nconst c = Object.create(o);\no.greet = function () { return 'B'; };\nconsole.log(c.greet());\nc.greet = () => 'C';\nconsole.log(c.greet(), o.greet());",options:['A\nC B','B\nC B','B\nC C','A\nA A'],why:'<code>c</code> does not copy from <code>o</code>, it looks it up each time, so it sees the replaced method (B). Assigning <code>c.greet</code> creates an own property on <code>c</code> only.'},
    {id:'pr4',code:"class A { who() { return 'A'; } }\nclass B extends A { who() { return super.who() + 'B'; } }\nclass C extends B { who() { return super.who() + 'C'; } }\nconsole.log(new C().who(), new C() instanceof A, typeof C.prototype.who);",options:['C true function','ABC false function','ABC true function','ABC true undefined'],why:'Each <code>super.who()</code> calls the method one step up the chain, building A, then B, then C. <code>instanceof A</code> is true because <code>A.prototype</code> is on the chain.'}
  ],
  cheat:{
    keys:['Property lookup walks the chain: own properties first, then the prototype, then its prototype, up to <code>null</code>.','<code>Object.getPrototypeOf(obj)</code> reads the link; <code>Object.create(proto)</code> sets it.','<code>class</code> puts methods on <code>Class.prototype</code>; <code>extends</code> links the two prototypes (and the constructors, for statics).','<code>hasOwnProperty</code> / <code>Object.keys</code> see only own properties; <code>in</code> sees the whole chain.','Arrow-function properties are per instance (and keep <code>this</code>); prototype methods are shared.'],
    mistakes:['Passing a class method as a callback (<code>setTimeout(obj.method)</code>) and losing <code>this</code>.','Putting shared mutable data (an array or object) on the prototype: every instance shares and changes the same one.']
  }
},
{
  id:'hof',group:'Core',title:'Higher-order functions in practice',tag:'Functions that take and return functions',
  explain:[
    'In JavaScript functions are values: you can store them in variables, pass them as arguments and return them from other functions. A function that takes or returns a function is a <b>higher-order function</b>, and <code>map</code>, <code>filter</code> and <code>reduce</code> are the everyday examples.',
    '<code>map</code> transforms every item, <code>filter</code> keeps some items, and <code>reduce</code> folds a whole list into one value. Returning functions gives you <b>currying</b> (one argument at a time), <b>partial application</b> (fix some arguments now) and <b>composition</b> (feed the output of one function into the next).',
    'These small building blocks are easy to test because they do not change their input.'
  ],
  analogy:'Like a <b>conveyor belt in a kitchen</b>: each station (function) does one small job on the item passing by, and you can rearrange the stations or build a new station out of existing ones.',
  variants:[
    {id:'mfr',label:'map / filter / reduce',code:"const people = [{ name: 'Ann', age: 31 }, { name: 'Bo', age: 17 }, { name: 'Cy', age: 45 }];\nconst adultNames = people.filter(p => p.age >= 18).map(p => p.name);\nconst totalAge = people.reduce((sum, p) => sum + p.age, 0);\nconsole.log(adultNames.join(), totalAge);\nconst byInitial = people.reduce((acc, p) => ({ ...acc, [p.name[0]]: p.age }), {});\nconsole.log(byInitial);\n",expect:"Ann,Cy 93\n{A: 31, B: 17, C: 45}"},
    {id:'values',label:'Functions as values',code:"const times = n => x => x * n;\nconst double = times(2);\nconsole.log([1, 2, 3].map(double).join());\nfunction applyTwice(f, x) { return f(f(x)); }\nconsole.log(applyTwice(double, 5), applyTwice(s => s + '!', 'hey'));\nconsole.log(['1', '2', '3'].map(Number).join(), ['1', '2', '3'].map(parseInt).join());\n",expect:"2,4,6\n20 hey!!\n1,2,3 1,NaN,NaN"},
    {id:'curry',label:'Currying & partial',code:"const curry = fn => function curried(...args) {\n  return args.length >= fn.length ? fn(...args) : (...more) => curried(...args, ...more);\n};\nconst add3 = curry((a, b, c) => a + b + c);\nconsole.log(add3(1)(2)(3), add3(1, 2)(3), add3(1)(2, 3));\nconst partial = (fn, ...preset) => (...rest) => fn(...preset, ...rest);\nconst greet = (greeting, name) => `${greeting}, ${name}!`;\nconsole.log(partial(greet, 'Hello')('Ann'));\n",expect:"6 6 6\nHello, Ann!"},
    {id:'compose',label:'compose & pipe',code:"const pipe = (...fns) => x => fns.reduce((v, f) => f(v), x);\nconst compose = (...fns) => x => fns.reduceRight((v, f) => f(v), x);\nconst trim = s => s.trim(), upper = s => s.toUpperCase(), exclaim = s => s + '!';\nconsole.log(pipe(trim, upper, exclaim)('  hi '));\nconsole.log(compose(trim, upper, exclaim)('  hi '));\n",expect:"HI!\nHI !"}
  ],
  quiz:[
    {id:'hf1',code:"console.log([1, 2, 3, 4].reduce((a, x) => a + x * x, 0), ['a', 'b'].map((x, i) => x + i).join());",options:['10 a0,b1','30 a0,b1','30 ab','30 a1,b2'],why:'<code>reduce</code> adds the squares: 1+4+9+16 = 30. <code>map</code> passes the index as the second argument, so the results are <code>a0</code> and <code>b1</code>.'},
    {id:'hf2',code:"console.log(['10', '10', '10'].map(parseInt).join());",options:['10,10,10','10,NaN,2','10,1,2','NaN,NaN,NaN'],why:'<code>map</code> calls <code>parseInt(item, index, array)</code>, so the index becomes the radix: base 0 (default) gives 10, base 1 is invalid (<code>NaN</code>), base 2 reads "10" as 2.'},
    {id:'hf3',code:"const f = a => b => c => a * b + c;\nconsole.log(f(2)(3)(4), typeof f(1), f.length);",options:['10 function 3','14 function 1','10 function 1','10 number 1'],why:'2*3+4 = 10. <code>f(1)</code> returns a function. <code>f.length</code> counts only the declared parameters of the outer function, which is 1.'},
    {id:'hf4',code:"console.log([5].reduce((a, b) => a + b));\ntry { [].reduce((a, b) => a + b); } catch (e) { console.log(e.name); }\nconsole.log([].reduce((a, b) => a + b, 'init'));",options:['5\nTypeError\ninit','5\nundefined\ninit','0\nTypeError\ninit','5\nTypeError\nundefined'],why:'With no initial value <code>reduce</code> uses the first item as the accumulator, so a one-item array just returns it without calling the function. An empty array with no initial value throws a <code>TypeError</code>; with an initial value it returns that value.'}
  ],
  cheat:{
    keys:['Functions are values: assign them, pass them, return them.','<code>map</code> (same length, transformed), <code>filter</code> (fewer items), <code>reduce</code> (one result).','Callbacks get <code>(item, index, array)</code>: passing a function that takes more parameters, like <code>parseInt</code>, can surprise you.','Currying = one argument at a time; partial application = fix some arguments now.','<code>pipe(f, g, h)(x)</code> = <code>h(g(f(x)))</code>; <code>compose</code> applies them in the opposite order.'],
    mistakes:['Mutating the accumulator or the original array inside <code>map</code>/<code>reduce</code> callbacks and creating hidden side effects.','Calling <code>reduce</code> on a possibly empty array without an initial value.']
  }
},
{
  id:'timing',group:'Async',title:'Debounce, throttle & memoization',tag:'Do less work, do it smartly',
  explain:[
    'Some events fire far more often than you want to do work: every keystroke, every scroll pixel, every resize. <b>Debounce</b> waits until the calls stop for a while and then runs once with the last call, whereas <b>throttle</b> lets a call through at most once per interval. Both are closures around a timer or a timestamp.',
    '<b>Memoization</b> is a different kind of saving: remember the result of a pure function for each input, so a repeated call returns instantly instead of recomputing.',
    'It needs a good cache key (a <code>Map</code> for primitives, <code>JSON.stringify(args)</code> for several arguments) and only works for functions that always return the same result for the same input.'
  ],
  analogy:'Debounce is a <b>lift that waits for people to stop arriving</b> before closing its doors; throttle is a turnstile that lets one person through per second; memoization is a cheat sheet where you write down answers so you never solve the same sum twice.',
  variants:[
    {id:'debounce',label:'Debounce',code:"function debounce(fn, ms) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), ms);\n  };\n}\nconst search = debounce(q => console.log('search for', q), 100);\nfor (const q of ['j', 'ja', 'jav', 'java']) search(q); // typing fast\nconsole.log('typed everything');\n",expect:"typed everything\nsearch for java"},
    {id:'throttle',label:'Throttle',code:"function throttle(fn, ms) {\n  let last = -Infinity;\n  return (...args) => {\n    const now = Date.now();\n    if (now - last >= ms) {\n      last = now;\n      fn(...args);\n    }\n  };\n}\nconst onScroll = throttle(y => console.log('scroll handled at', y), 100);\nfor (let y = 0; y < 5; y++) onScroll(y * 10); // all in the same instant\nsetTimeout(() => onScroll(999), 150);\n",expect:"scroll handled at 0\nscroll handled at 999"},
    {id:'memo',label:'Memoize',code:"function memoize(fn) {\n  const cache = new Map();\n  return n => {\n    if (cache.has(n)) return cache.get(n);\n    const v = fn(n);\n    cache.set(n, v);\n    return v;\n  };\n}\nlet calls = 0;\nconst slowSquare = memoize(n => { calls++; return n * n; });\nconsole.log(slowSquare(4), slowSquare(4), slowSquare(5), 'calls:', calls);\nconst fib = memoize(n => (n < 2 ? n : fib(n - 1) + fib(n - 2)));\nconsole.log(fib(50));\n",expect:"16 16 25 calls: 2\n12586269025"},
    {id:'keys',label:'Cache keys',code:"function memoizeJSON(fn) {\n  const cache = new Map();\n  return (...args) => {\n    const key = JSON.stringify(args);\n    if (!cache.has(key)) cache.set(key, fn(...args));\n    return cache.get(key);\n  };\n}\nlet runs = 0;\nconst add = memoizeJSON((a, b) => { runs++; return a + b; });\nadd(1, 2); add(1, 2); add(2, 1);\nconsole.log('runs:', runs);\nconst byRef = new Map();\nconst o1 = { id: 1 };\nbyRef.set(o1, 'x');\nconsole.log(byRef.get(o1), byRef.get({ id: 1 }));\n",expect:"runs: 2\nx undefined"}
  ],
  quiz:[
    {id:'tm1',code:"function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }\nconst log = debounce(x => console.log('log', x), 50);\nlog(1);\nlog(2);\nsetTimeout(() => log(3), 20);\nsetTimeout(() => log(4), 200);",options:['log 1\nlog 2\nlog 3\nlog 4','log 2\nlog 3\nlog 4','log 3\nlog 4','log 3'],why:'Every call cancels the previous timer. <code>log(1)</code> and <code>log(2)</code> are replaced by the call at 20 ms, which fires at 70 ms with 3. The call at 200 ms is far enough away to run alone.'},
    {id:'tm2',code:"function throttle(fn, ms, clock) { let last = -Infinity; return x => { const t = clock(); if (t - last >= ms) { last = t; fn(x); } }; }\nlet time = 0;\nconst t = throttle(x => console.log('ran', x), 100, () => time);\nfor (const step of [0, 50, 100, 120, 250]) { time = step; t(step); }",options:['ran 0\nran 100\nran 250','ran 0\nran 50\nran 100\nran 120\nran 250','ran 0\nran 120\nran 250','ran 50\nran 120'],why:'A call runs only if at least 100 ms passed since the last run: at 0 (first), 100 (100 ms later), and 250 (150 ms later). The calls at 50 and 120 are dropped.'},
    {id:'tm3',code:"const cache = new Map();\nlet calls = 0;\nconst f = k => { if (!cache.has(k)) { calls++; cache.set(k, k); } return cache.get(k); };\nf(NaN); f(NaN); f(0); f(-0); f('0'); f(0);\nconsole.log(calls, cache.size);",options:['3 3','4 4','5 4','2 2'],why:'A <code>Map</code> compares keys with SameValueZero: <code>NaN</code> equals <code>NaN</code>, and <code>0</code> equals <code>-0</code>, but the string <code>"0"</code> is a different key. So there are 3 distinct keys.'},
    {id:'tm4',code:"const id = setTimeout(() => console.log('never'), 10);\nclearTimeout(id);\nconst id2 = setTimeout(() => console.log('runs'), 10);\nsetTimeout(() => { clearTimeout(id2); console.log('too late?'); }, 30);",options:['runs\ntoo late?','too late?','never\nruns\ntoo late?','runs'],why:'<code>clearTimeout</code> works only before the timer fires. The first timer is cancelled, the second fires at 10 ms, and clearing it at 30 ms does nothing.'}
  ],
  cheat:{
    keys:['Debounce: run after the calls stop (search-as-you-type, resize end). Throttle: at most once per interval (scroll, drag).','Both keep state in a closure: a timer id (debounce) or a last-run timestamp (throttle).','Memoize only pure functions; the cache key must identify the arguments (Map for primitives, <code>JSON.stringify</code> for lists).','A memoized recursive function (fib) turns exponential time into linear time.','A cache that never forgets is a memory leak: bound it or use a <code>WeakMap</code> for object keys.'],
    mistakes:['Creating the debounced function inside a component or handler on every call, so each call gets a new timer and nothing is debounced.','Memoizing a function that depends on hidden state (time, random, mutated data): the cache returns stale answers.']
  }
},
{
  id:'copying',group:'Objects and data',title:'Copying data',tag:'Value, reference, shallow and deep',
  explain:[
    'Primitives (numbers, strings, booleans) are copied by value, but objects and arrays are handled by <b>reference</b>: <code>b = a</code> gives you a second name for the same object. Spread (<code>{ ...a }</code>) and <code>Object.assign</code> make a <b>shallow</b> copy: the top level is new, but nested objects are still shared.',
    '<code>structuredClone</code> makes a real deep copy (dates, maps, sets, cycles), but it cannot clone functions. The old <code>JSON.parse(JSON.stringify(x))</code> trick silently drops <code>undefined</code> and functions, turns dates into strings and maps into <code>{}</code>.',
    '<code>Object.freeze</code> is shallow too, so the usual way to stay safe is immutable updates: build new objects with spread instead of changing old ones.'
  ],
  analogy:'A shared document versus a photocopy: sending the link (a reference) means edits show up for everyone. A shallow copy is a photocopy of the cover page that still points to the same appendix, and a deep copy photocopies every page.',
  variants:[
    {id:'ref',label:'Reference vs copy',code:"const a = { n: 1, tags: ['x'] };\nconst b = a;\nb.n = 2;\nconsole.log(a.n, a === b);\nconst c = { ...a };\nc.n = 3;\nc.tags.push('y');\nconsole.log(a.n, a.tags.join(), a.tags === c.tags);\n",expect:"2 true\n2 x,y true"},
    {id:'json',label:'JSON round-trip pitfalls',code:"const src = { d: new Date(0), u: undefined, f() {}, m: new Map([[1, 2]]), n: NaN, s: 'ok' };\nconst copy = JSON.parse(JSON.stringify(src));\nconsole.log(Object.keys(copy).join());\nconsole.log(typeof copy.d, JSON.stringify(copy.m), copy.n);\n",expect:"d,m,n,s\nstring {} null"},
    {id:'structured',label:'structuredClone',code:"const src = { d: new Date(0), m: new Map([[1, { deep: true }]]), list: [1, [2, 3]], self: null };\nsrc.self = src;\nconst copy = structuredClone(src);\nconsole.log(copy.d instanceof Date, copy.m.get(1) !== src.m.get(1), copy.self === copy);\ntry { structuredClone({ f() {} }); } catch (e) { console.log(e.name); }\n",expect:"true true true\nDataCloneError"},
    {id:'freeze',label:'freeze & immutable updates',code:"const cfg = Object.freeze({ port: 80, opts: { debug: false } });\ncfg.port = 90;          // ignored (throws in strict mode)\ncfg.opts.debug = true;  // allowed: freeze is shallow\nconsole.log(cfg.port, cfg.opts.debug, Object.isFrozen(cfg), Object.isFrozen(cfg.opts));\nconst next = { ...cfg, port: 8080, opts: { ...cfg.opts, debug: false } };\nconsole.log(next.port, next.opts.debug, cfg.opts.debug);\n",expect:"80 true true false\n8080 false true"}
  ],
  quiz:[
    {id:'cp1',code:"const o = { a: { b: 1 } };\nconst c = { ...o };\nc.a.b = 2;\nconsole.log(o.a.b);\nconst d = structuredClone(o);\nd.a.b = 99;\nconsole.log(o.a.b, d.a.b);",options:['1\n2 99','2\n2 99','2\n99 99','1\n1 99'],why:'The spread copy shares the nested <code>a</code> object, so changing <code>c.a.b</code> changes <code>o.a.b</code> (2). <code>structuredClone</code> copies deeply, so changing <code>d</code> leaves <code>o</code> alone.'},
    {id:'cp2',code:"console.log(JSON.stringify(JSON.parse(JSON.stringify({ a: undefined, b: [undefined], c: () => 1, d: Infinity }))));",options:['{"b":[null],"d":null}','{"a":null,"b":[null],"c":null,"d":null}','{"b":[],"d":Infinity}','{"b":[null],"c":null,"d":null}'],why:'JSON drops object properties whose value is <code>undefined</code> or a function, writes <code>undefined</code> inside arrays as <code>null</code>, and turns <code>Infinity</code> and <code>NaN</code> into <code>null</code>.'},
    {id:'cp3',code:"const a = [[1], [2]];\nconst b = a.slice();\nb[0].push(9);\nb[1] = [7];\nconsole.log(JSON.stringify(a), a.length === b.length);",options:['[[1],[2]] true','[[1,9],[7]] true','[[1,9],[2]] true','[[1,9],[2]] false'],why:'<code>slice()</code> is a shallow copy: the inner arrays are shared, so pushing into <code>b[0]</code> shows up in <code>a</code>. Replacing <code>b[1]</code> only changes <code>b</code>.'},
    {id:'cp4',code:"(function () {\n  'use strict';\n  const o = Object.freeze({ list: [1] });\n  o.list.push(2);\n  try { o.x = 1; } catch (e) { console.log(e.name); }\n  console.log(o.list.length, Object.isFrozen(o.list));\n})();",options:['TypeError\n1 true','TypeError\n2 false','undefined\n2 false','TypeError\n2 true'],why:'In strict mode, adding a property to a frozen object throws a <code>TypeError</code>. Freezing is shallow: the nested array was not frozen, so <code>push</code> worked (length 2).'}
  ],
  cheat:{
    keys:['Objects and arrays are references: assignment copies the reference, not the object.','Spread, <code>Object.assign</code>, <code>slice()</code> and <code>Array.from</code> are shallow: nested objects stay shared.','<code>structuredClone</code> is the built-in deep copy (no functions, no class prototypes).','JSON round-trip loses <code>undefined</code>, functions and symbols and stringifies dates and maps.','<code>Object.freeze</code> is shallow; prefer immutable updates with spread.'],
    mistakes:['Assuming <code>{ ...state }</code> is safe to mutate at depth 2: <code>copy.list.push(x)</code> changes the original.','Using the JSON trick on data containing dates, maps, sets or <code>undefined</code>.']
  }
},
{
  id:'destructuring',group:'Core',title:'Destructuring, spread & optional chaining',tag:'Unpack and default with less code',
  explain:[
    '<b>Destructuring</b> unpacks values from objects and arrays into variables in one line, with optional <b>defaults</b> (<code>{ a = 1 }</code>), <b>renaming</b> (<code>{ a: b }</code>) and nesting. The <b>rest</b> syntax (<code>...rest</code>) collects what is left, and the <b>spread</b> syntax (<code>...x</code>) does the opposite: it expands an array or object in place.',
    'Optional chaining <code>a?.b</code> stops and returns <code>undefined</code> instead of throwing when <code>a</code> is <code>null</code> or <code>undefined</code>.',
    'Nullish coalescing <code>a ?? b</code> falls back only for <code>null</code> and <code>undefined</code>, whereas <code>a || b</code> falls back for every falsy value, including <code>0</code> and <code>""</code>.'
  ],
  analogy:'Like <b>unpacking a suitcase onto labelled shelves</b>: you say which item goes on which shelf (and what to use if something is missing) instead of pulling things out one at a time.',
  variants:[
    {id:'basic',label:'Object & array patterns',code:"const user = { id: 7, name: 'Ann', address: { city: 'Oslo', zip: '0150' }, tags: ['a', 'b', 'c'] };\nconst { name, age = 30, address: { city }, ...rest } = user;\nconsole.log(name, age, city, Object.keys(rest).join());\nconst [first, , third = 'none', ...others] = user.tags;\nconsole.log(first, third, others.length);\nlet x = 1, y = 2;\n[x, y] = [y, x];\nconsole.log(x, y);\n",expect:"Ann 30 Oslo id,tags\na c 0\n2 1"},
    {id:'params',label:'Parameters & renaming',code:"function connect({ host = 'localhost', port = 80, secure: isSecure = false } = {}) {\n  return `${isSecure ? 'https' : 'http'}://${host}:${port}`;\n}\nconsole.log(connect());\nconsole.log(connect({ host: 'example.com', secure: true }));\nconst [a, b = a * 2] = [5];\nconsole.log(a, b);\nconst { length } = 'hello';\nconsole.log(length);\n",expect:"http://localhost:80\nhttps://example.com:80\n5 10\n5"},
    {id:'spread',label:'Spread & rest',code:"const nums = [3, 1, 2];\nconsole.log(Math.max(...nums), [...nums, 4].join(), [...'abc'].length);\nconst defaults = { theme: 'light', size: 12 };\nconst merged = { ...defaults, size: 14, extra: true };\nconsole.log(merged);\nfunction sum(first, ...more) { return first + more.reduce((a, b) => a + b, 0); }\nconsole.log(sum(1, 2, 3, 4));\n",expect:"3 3,1,2,4 3\n{theme: 'light', size: 14, extra: true}\n10"},
    {id:'optional',label:'?. and ??',code:"const cfg = { retries: 0, name: '', nested: null, list: [] };\nconsole.log(cfg.retries || 5, cfg.retries ?? 5);\nconsole.log(cfg.name || 'anon', JSON.stringify(cfg.name ?? 'anon'));\nconsole.log(cfg.nested?.deep?.value, cfg.missing?.[0], cfg.method?.());\nconsole.log(cfg.nested && cfg.nested.deep, cfg.list?.length);\nlet count; count ??= 10;\nlet flag = 0; flag ||= 7;\nconsole.log(count, flag);\n",expect:"5 0\nanon \"\"\nundefined undefined undefined\nnull 0\n10 7"}
  ],
  quiz:[
    {id:'d1',code:"const { a, b: { c = 5 } = {} } = { a: 1 };\nconsole.log(a, c);",options:['1 undefined','1 5','undefined 5','TypeError'],why:'<code>b</code> is missing, so its default <code>{}</code> is used, and then <code>c</code> is missing in that object, so <code>c</code> gets its own default 5.'},
    {id:'d2',code:"const [x, y = x + 1, z = y * 2] = [10, undefined, null];\nconsole.log(x, y, z);",options:['10 11 22','10 undefined null','10 11 null','10 11 undefined'],why:'Defaults apply only to <code>undefined</code>. <code>y</code> is <code>undefined</code>, so it becomes 11, but <code>z</code> is <code>null</code>, which is a real value, so it stays <code>null</code>.'},
    {id:'d3',code:"console.log(0 ?? 'a', 0 || 'a', null ?? 'b', JSON.stringify('' ?? 'c'), undefined?.x);",options:['a 0 b "" undefined','0 a b "" undefined','0 a b "c" undefined','0 0 b "" TypeError'],why:'<code>??</code> only replaces <code>null</code>/<code>undefined</code>, so <code>0 ?? "a"</code> stays 0 and <code>"" ?? "c"</code> stays empty. <code>||</code> replaces every falsy value, so <code>0 || "a"</code> is <code>"a"</code>. <code>undefined?.x</code> is just <code>undefined</code>.'},
    {id:'d4',code:"const { a, ...r } = { a: 1, b: 2, c: 3 };\nconst arr = [...'hi', ...[1, 2]];\nconsole.log(Object.keys(r).join(), arr.join('-'));",options:['a,b,c h-i-1-2','b,c hi-1-2','b,c h-i-1-2','b,c h,i,1,2'],why:'Rest collects the remaining properties (<code>b</code> and <code>c</code>). Spreading a string produces its characters, so the array is <code>["h","i",1,2]</code>.'}
  ],
  cheat:{
    keys:['<code>const { a, b: renamed, c = 1 } = obj</code>: pick, rename and default in one pattern.','<code>const [first, , third, ...rest] = arr</code>: skip items with a comma, collect the rest.','Defaults apply only to <code>undefined</code>, not to <code>null</code>, <code>0</code> or <code>""</code>.','<code>a?.b</code> and <code>a?.[i]</code> and <code>fn?.()</code> return <code>undefined</code> if the left side is nullish.','Use <code>??</code> when 0, "" and false are valid values; <code>||</code> treats them as missing.'],
    mistakes:['Destructuring a value that may be <code>null</code> or <code>undefined</code> without a default (<code>const { a } = null</code> throws).','Using <code>||</code> for defaults and silently replacing a legitimate <code>0</code> or empty string.']
  }
},
{
  id:'collections',group:'Objects and data',title:'Map, Set, WeakMap & Symbol',tag:'Choosing the right collection',
  explain:[
    'Plain objects turn every key into a string (or symbol), sort integer-like keys first, and inherit extra keys such as <code>toString</code>. A <b>Map</b> keeps any value as a key by identity (objects, <code>NaN</code>, numbers versus strings), remembers insertion order, and has a real <code>size</code>; a <b>Set</b> stores each value once.',
    '<b>WeakMap</b> and <b>WeakSet</b> hold their keys weakly: only objects are allowed, they cannot be iterated, and an entry disappears when nothing else references the key, so they suit private data and caches.',
    'A <b>Symbol</b> is a unique value used for hidden property keys and for protocols such as <code>Symbol.iterator</code> and <code>Symbol.toPrimitive</code>.'
  ],
  analogy:'An object is a <b>filing cabinet whose drawers are labelled with text only</b>. A Map is a cloakroom where anything can be the ticket, and a WeakMap is a cloakroom that throws the coat away as soon as its owner has left the building.',
  variants:[
    {id:'map',label:'Map vs object keys',code:"const obj = {};\nobj[1] = 'number'; obj['1'] = 'string'; obj[{}] = 'object';\nconsole.log(Object.keys(obj).join(' | '));\nconst map = new Map();\nmap.set(1, 'number').set('1', 'string');\nconst k = {};\nmap.set(k, 'object').set(NaN, 'nan');\nconsole.log(map.size, map.get(1), map.get('1'), map.get({}), map.get(k), map.get(NaN));\nconsole.log([...map.keys()].map(String).join(' | '));\n",expect:"1 | [object Object]\n4 number string undefined object nan\n1 | 1 | [object Object] | NaN"},
    {id:'set',label:'Set operations',code:"const nums = [3, 1, 3, 2, 1];\nconst unique = [...new Set(nums)];\nconsole.log(unique.join());\nconst a = new Set([1, 2, 3]), b = new Set([2, 3, 4]);\nconsole.log([...a].filter(x => b.has(x)).join(), [...new Set([...a, ...b])].join(), [...a].filter(x => !b.has(x)).join());\nconst s = new Set();\ns.add({}).add({});\nconsole.log(s.size, new Set('hello').size);\n",expect:"3,1,2\n2,3 1,2,3,4 1\n2 4"},
    {id:'weak',label:'WeakMap private data',code:"const priv = new WeakMap();\nclass Account {\n  constructor(balance) { priv.set(this, { balance }); }\n  get balance() { return priv.get(this).balance; }\n  deposit(n) { priv.get(this).balance += n; }\n}\nconst acc = new Account(10);\nacc.deposit(5);\nconsole.log(acc.balance, Object.keys(acc).length, priv.has(acc));\ntry { priv.set('str', 1); } catch (e) { console.log(e.name); }\nconsole.log(typeof WeakMap.prototype.forEach, typeof priv.size);\n",expect:"15 0 true\nTypeError\nundefined undefined"},
    {id:'symbol',label:'Symbol',code:"const id = Symbol('id');\nconst user = { name: 'Ann', [id]: 123 };\nconsole.log(Object.keys(user).join(), user[id], Object.getOwnPropertySymbols(user).length);\nconsole.log(Symbol('x') === Symbol('x'), Symbol.for('x') === Symbol.for('x'), id.description);\nconst range = {\n  from: 1, to: 3,\n  [Symbol.iterator]() {\n    let n = this.from, to = this.to;\n    return { next: () => (n <= to ? { value: n++, done: false } : { value: undefined, done: true }) };\n  }\n};\nconsole.log([...range].join());\nconst money = { [Symbol.toPrimitive](hint) { return hint === 'number' ? 42 : 'forty-two'; } };\nconsole.log(+money, `${money}`, money + '');\n",expect:"name 123 1\nfalse true id\n1,2,3\n42 forty-two forty-two"}
  ],
  quiz:[
    {id:'m1',code:"const m = new Map([[1, 'a']]);\nm.set('1', 'b');\nconst o = { 1: 'a' };\no['1'] = 'b';\nconsole.log(m.size, Object.keys(o).length);",options:['1 1','2 2','2 1','1 2'],why:'A Map keeps <code>1</code> and <code>"1"</code> as two different keys. An object converts both to the string <code>"1"</code>, so the second assignment overwrites the first.'},
    {id:'m2',code:"console.log([...new Set([NaN, NaN, 0, -0, '0'])].length, new Set('aab').size);",options:['5 2','3 2','4 2','3 3'],why:'A Set treats <code>NaN</code> as equal to itself and <code>0</code> as equal to <code>-0</code>, but the string <code>"0"</code> is different: 3 values. <code>"aab"</code> has 2 distinct characters.'},
    {id:'m3',code:"const o = { b: 1, 2: 1, a: 1, 1: 1 };\nconst m = new Map([['b', 1], [2, 1], ['a', 1], [1, 1]]);\nconsole.log(Object.keys(o).join(), [...m.keys()].join());",options:['b,2,a,1 b,2,a,1','1,2,b,a b,2,a,1','1,2,b,a 1,2,b,a','b,2,a,1 1,2,b,a'],why:'Objects list integer-like keys first in ascending order, then the other keys in insertion order. A Map always iterates in pure insertion order.'},
    {id:'m4',code:"const s = Symbol('s');\nconst o = { [s]: 1, x: 2 };\nconsole.log(JSON.stringify(o), Object.keys(o).length, s in o, typeof s.toString());",options:['{"x":2} 1 true string','{"x":2,"s":1} 2 true string','{"x":2} 1 true symbol','{"x":2} 1 false string'],why:'Symbol-keyed properties are skipped by <code>JSON.stringify</code> and <code>Object.keys</code>, but <code>in</code> still finds them. <code>s.toString()</code> gives the string <code>"Symbol(s)"</code>.'}
  ],
  cheat:{
    keys:['Object: string/symbol keys, integer-like keys sorted first, inherits extras. Map: any key by identity, insertion order, <code>.size</code>.','Map and Set use SameValueZero: <code>NaN</code> equals <code>NaN</code>, <code>0</code> equals <code>-0</code>, <code>1</code> differs from <code>"1"</code>.','Set removes duplicates: <code>[...new Set(arr)]</code>.','WeakMap/WeakSet: object keys only, not iterable, no <code>size</code>; entries vanish when the key is garbage collected.','Symbols are unique keys (<code>Symbol.for</code> shares one by name) and power protocols like <code>Symbol.iterator</code>.'],
    mistakes:['Using an object as a dictionary for user-supplied keys (<code>"__proto__"</code>, <code>"toString"</code>): use a Map.','Expecting a WeakMap to be enumerable or to show a size: it is deliberately opaque.']
  }
},
{
  id:'proxy',group:'Objects and data',title:'Proxy & Reflect',tag:'Intercept what happens to an object',
  explain:[
    'A <b>Proxy</b> wraps an object and lets you intercept operations on it, such as reading a property (<code>get</code>), writing one (<code>set</code>), <code>in</code> (<code>has</code>), <code>delete</code>, or calling a function (<code>apply</code>). Each intercepted operation is handled by a function in a handler object called a <b>trap</b>, and operations without a trap go straight to the target.',
    '<code>Reflect</code> has one method for every trap and does the default behaviour, so inside a trap you usually finish with <code>Reflect.get(...)</code> or <code>Reflect.set(...)</code>.',
    'Typical uses are validation, logging, default values, read-only views and reactive frameworks that re-render when data changes. The visualisation records every operation that reaches a proxy, whether or not you wrote a trap for it.'
  ],
  analogy:'A proxy is a <b>receptionist in front of an office</b>: visitors talk to the receptionist, who can answer, refuse, write the visit in a log, or pass the request on to the person inside.',
  variants:[
    {id:'getset',label:'get, set & defaults',code:"const target = { name: 'Ann' };\nconst p = new Proxy(target, {\n  get(t, prop, receiver) {\n    return prop in t ? Reflect.get(t, prop, receiver) : `no ${String(prop)}`;\n  },\n  set(t, prop, value) {\n    console.log('set', prop, value);\n    return Reflect.set(t, prop, value);\n  }\n});\nconsole.log(p.name, p.age);\np.age = 30;\nconsole.log(p.age, 'age' in p, Object.keys(p).join());\n",expect:"Ann no age\nset age 30\n30 true name,age"},

{
  id:'errors',group:'Core',title:'Errors & custom errors',tag:'Throwing, catching and cleaning up',
  explain:[
    'When something goes wrong JavaScript <b>throws</b> an error, and the code stops running normally until a <code>catch</code> handles it. <code>finally</code> always runs afterwards, whether the block succeeded, threw or returned, and a <code>return</code> inside <code>finally</code> overrides everything before it, even a thrown error.',
    'You can throw anything, but throw <code>Error</code> objects (or your own subclasses with a good <code>name</code>) because they carry a <code>message</code> and a stack trace, and <code>new Error(msg, { cause })</code> keeps the original error.',
    'In async code, <code>await</code> inside <code>try/catch</code> turns a rejected promise into a normal catch, while a promise rejection that nobody handles becomes an "unhandled rejection".'
  ],
  analogy:'Like a <b>safety net at a circus</b>: the act (<code>try</code>) may fall, the net (<code>catch</code>) catches the performer, and the crew (<code>finally</code>) always tidies up afterwards, even when the act went perfectly.',
  variants:[
    {id:'order',label:'try / catch / finally order',scenes:'order',code:"function demo() {\n  try {\n    console.log('try');\n    throw new Error('oops');\n  } catch (e) {\n    console.log('catch', e.message);\n    return 'from catch';\n  } finally {\n    console.log('finally');\n  }\n  console.log('never');\n}\nconsole.log(demo());\n",expect:"try\ncatch oops\nfinally\nfrom catch"},
    {id:'finallywins',label:'finally overrides return',scenes:'finallywins',code:"function f() { try { return 'try'; } finally { console.log('cleanup'); } }\nfunction g() { try { return 'try'; } finally { return 'finally wins'; } }\nfunction h() { try { throw new Error('lost'); } finally { return 'swallowed'; } }\nconsole.log(f(), g(), h());\n",expect:"cleanup\ntry finally wins swallowed"},
    {id:'custom',label:'Custom errors & cause',scenes:'custom',code:"class ValidationError extends Error {\n  constructor(field, message, options) {\n    super(message, options);\n    this.name = 'ValidationError';\n    this.field = field;\n  }\n}\nfunction parseAge(s) {\n  try { return JSON.parse(s).age; }\n  catch (err) { throw new ValidationError('age', 'Bad input', { cause: err }); }\n}\ntry { parseAge('{oops'); }\ncatch (e) {\n  console.log(e.name, e.field, e.message, e instanceof ValidationError, e instanceof Error);\n  console.log(e.cause.name, String(e), Object.prototype.toString.call(e));\n}\n",expect:"ValidationError age Bad input true true\nSyntaxError ValidationError: Bad input [object Error]"},
    {id:'async',label:'Async errors',scenes:'asyncerr',code:"async function load(ok) {\n  if (!ok) throw new Error('network down');\n  return 'data';\n}\nasync function main() {\n  try { console.log(await load(true)); await load(false); }\n  catch (e) { console.log('caught', e.message); }\n  finally { console.log('done'); }\n  await load(false).catch(e => console.log('.catch', e.message));\n}\nmain();\n",expect:"data\ncaught network down\ndone\n.catch network down"}

    {id:'r1',code:"try { console.log(1); null.x; console.log(2); } catch (e) { console.log(3, e.name); } finally { console.log(4); }\nconsole.log(5);",options:['1\n2\n3 TypeError\n4\n5','1\n3 TypeError\n4\n5','1\n3 TypeError\n5','1\n4\n3 TypeError\n5'],why:'Reading a property of <code>null</code> throws a <code>TypeError</code>, so line 2 is skipped. The catch block prints 3, <code>finally</code> prints 4, and the script continues with 5.'},

    {id:'r3',code:"const f = () => { try { throw new Error('x'); } catch (e) { return 'catch'; } finally { console.log('finally'); } };\nconsole.log(f());\nconst g = () => { try { return 'try'; } finally { return 'finally'; } };\nconsole.log(g());",options:['catch\nfinally\nfinally','finally\ncatch\ntry','finally\ncatch\nfinally','catch\nfinally\ntry'],why:'In <code>f</code>, <code>finally</code> runs before the function actually returns <code>"catch"</code>. In <code>g</code>, the <code>return</code> inside <code>finally</code> replaces the earlier return value.'},

/* ==========================================================================
   Visualisations. Each factory gets (host element, lesson context L) and
   returns { destroy() }. L.hooks.{variant,run,edit} let a viz react to the example.
   ========================================================================== */
function logHTML(l,ts){
  const lv=(l.level==='warn'||l.level==='error')?`<span class="lv">${l.level}</span>`:'';
  return `<div class="log log-${l.level==='warn'||l.level==='error'?l.level:'log'}">${lv}<pre>${esc(l.text)}</pre>${ts&&l.ms!==undefined?`<span class="ts">+${Math.round(l.ms)} ms</span>`:''}</div>`;
}
function stepperHTML(id){
  return `<div class="stepper" role="group" aria-label="Step controls">
    <button class="btn sm" data-a="back" id="${id}-back">${ic('back',13)}<span>Back</span></button>
    <button class="btn sm primary" data-a="next" id="${id}-next">${ic('step',13)}<span>Step</span></button>
    <button class="btn sm ghost" data-a="reset" id="${id}-reset">${ic('reset',13)}<span>Reset</span></button>
    <span class="count" data-r="count"></span></div>`;
}
function codeLines(code,on){
  return code.replace(/\n$/,'').split('\n').map((l,i)=>`<span class="ln${on===i+1?' on':''}"${on===i+1?' aria-current="step"':''}>${esc(l)||' '}</span>`).join('');
}
function editedNote(L){
  const same=L.getCode().replace(/\s+$/,'')===L.variant.code.replace(/\s+$/,'');
  return same?'':'<p class="viz-note warn">You edited the code. This diagram always shows the shipped example; press <b>Reset code</b> to see it match again.</p>';
}

/* ---------- generic step-through wrapper used by closures + hoisting ---------- */
function stepViz(host,L,cfg){
  let step=0,off=false;
  const uid='sv'+Math.random().toString(36).slice(2,7);
  host.innerHTML=`<p class="viz-note" data-r="title"></p><div data-r="edited"></div>${stepperHTML(uid)}
    <div class="split"><pre class="codeview" data-r="code" aria-label="Example code"></pre><div data-r="scene"></div></div>
    <div class="narr" data-r="narr"></div>
    <div class="console consolebox"><div class="console-h">Output so far</div><div class="console-b" data-r="out"></div></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  function draw(announceIt){
    const steps=cfg.steps(L.variant);
    if(!steps){ host.innerHTML='<p class="viz-note">No diagram for this example.</p>'; return; }
    if(step>=steps.length) step=steps.length-1;
    if(step<0) step=0;
    const s=steps[step];
    q('title').innerHTML=cfg.title(L.variant);
    q('edited').innerHTML=editedNote(L);
    q('code').innerHTML=codeLines(L.variant.code,s.line);
    q('scene').innerHTML=cfg.scene(s,step,steps);
    q('narr').innerHTML=cfg.narr(s,step,steps);
    const outs=[]; for(let i=0;i<=step;i++) (steps[i].out||[]).forEach(o=>outs.push(o));
    q('out').innerHTML=outs.length?outs.map(o=>logHTML({level:'log',text:o})).join(''):'<div class="empty">Nothing printed yet.</div>';
    q('count').textContent=cfg.count(step,steps.length);
    host.querySelector('[data-a="back"]').disabled=step===0;
    host.querySelector('[data-a="next"]').disabled=step===steps.length-1;
    if(announceIt) announce(cfg.plain(s,step,steps));
  }
  host.addEventListener('click',e=>{
    const b=e.target.closest('button[data-a]'); if(!b||off) return;
    const a=b.dataset.a;
    if(a==='next') step++; else if(a==='back') step--; else step=0;
    draw(true);
  });
  const hv=()=>{ step=0; draw(false); };
  L.hooks.variant.push(hv); L.hooks.edit.push(()=>{ q('edited')&&(q('edited').innerHTML=editedNote(L)); });
  draw(false);
  return {destroy(){ off=true; }};
}
const plainText=h=>String(h).replace(/<[^>]+>/g,'');

/* ---------- 1. Closures: scope chain ---------- */
function scopeHTML(sc,depth){
  const vars=sc.vars.length?`<div class="vars">${sc.vars.map(v=>`<span class="n">${esc(v.n)}</span><span class="v">${esc(v.v)}${v.ch?'<span class="chg">changed</span>':''}</span>`).join('')}</div>`:'<div class="novars">no variables of its own</div>';
  const fns=sc.funcs.map(f=>`<div class="fnbox">ƒ <code>${esc(f.name)}</code> (held by <code>${esc(f.holder)}</code>) remembers <code>${esc(f.uses)}</code> from this scope</div>`).join('');
  const kids=sc.kids.map(k=>scopeHTML(k,depth+1)).join('');
  return `<div class="scope d${Math.min(depth,2)}"><div class="scope-h"><b>${esc(sc.title)}</b><span>${esc(sc.tag)}</span></div>${vars}${fns}${kids}</div>`;
}
function vizClosures(host,L){
  return stepViz(host,L,{
    steps:v=>CLOSURE_SCENES[v.scenes],
    title:v=>`Scope chain for <b>${esc(v.label)}</b>. Inner boxes can see the variables of the boxes around them.`,
    scene:s=>scopeHTML(s.scopes,0),
    narr:(s,i,all)=>`<b>Step ${i+1}:</b> ${s.note}`,
    count:(i,n)=>`Step ${i+1} of ${n}`,
    plain:(s,i)=>`Step ${i+1}. ${plainText(s.note)}`
  });
}

/* ---------- 5. Hoisting: creation vs execution ---------- */
function memTables(mem){
  return mem.map(m=>`<div class="scope d${m.scope==='Global'?0:1}"><div class="scope-h"><b>${esc(m.scope)}</b><span>memory</span></div>
    <table class="memtable"><thead><tr><th scope="col">Name</th><th scope="col">Value</th></tr></thead><tbody>${m.rows.map(r=>`<tr class="${r[2]?'chg-row':''}"><td>${esc(r[0])}</td><td>${r[1].indexOf('TDZ')>=0?`<span class="tdz">${esc(r[1])}</span>`:esc(r[1])}${r[2]?'<span class="chg">changed</span>':''}</td></tr>`).join('')}</tbody></table></div>`).join('');
}
function vizHoisting(host,L){
  const cfg={
    steps:v=>{ const sc=HOIST_SCENES[v.scenes]; if(!sc) return null; return [{creation:true,line:0,out:[],creationRows:sc.creation,note:'Before a single line runs, the engine scans the scope and registers every declaration. This is the creation phase.'}].concat(sc.steps); },
    title:v=>`Two phases for <b>${esc(v.label)}</b>: first the engine sets up memory, then it runs the code line by line.`,
    scene:s=>s.creation
      ?`<span class="phase">Phase 1 · Creation</span>${s.creationRows.map(m=>`<div class="scope d0"><div class="scope-h"><b>${esc(m.scope)}</b><span>memory after creation</span></div><table class="memtable"><thead><tr><th scope="col">Name</th><th scope="col">Declared with</th><th scope="col">Starts as</th></tr></thead><tbody>${m.rows.map(r=>`<tr><td>${esc(r[0])}</td><td class="kind">${esc(r[1])}</td><td>${r[2].indexOf('TDZ')>=0?`<span class="tdz">${esc(r[2])}</span>`:esc(r[2])}<div class="hint">${esc(r[3])}</div></td></tr>`).join('')}</tbody></table></div>`).join('')}`
      :`<span class="phase exec">Phase 2 · Execution</span>${memTables(s.mem)}`,
    narr:(s,i)=>s.creation?`<b>Creation phase:</b> ${s.note}`:`<b>Line ${s.line}:</b> ${s.note}`,
    count:(i,n)=>i===0?`Creation phase (1 of ${n})`:`Execution step ${i} of ${n-1}`,
    plain:(s,i)=>(s.creation?'Creation phase. ':'Line '+s.line+'. ')+plainText(s.note)
  };
  return stepViz(host,L,cfg);
}

/* ---------- 2. Event loop ---------- */
function laneItems(items,cls,focusId,empty){
  if(!items.length) return `<div class="lane-empty">${empty}</div>`;
  return items.map(c=>`<div class="chip ${cls}${c.id&&c.id===focusId?' new':''}"><span class="k">${esc(c.kind==='setTimeout'||c.kind==='setInterval'?c.kind+' · '+c.delay+' ms':c.kind)}</span> ${esc(c.code)}</div>`).join('');
}
function vizEventLoop(host,L){
  let frames=[],idx=0,timer=null,playing=false,speed=1000,result=null;
  host.innerHTML=`<div data-r="note"></div>
    <div class="stepper" role="group" aria-label="Playback controls">
      <button class="btn sm primary" data-a="play" id="el-play"></button>
      <button class="btn sm" data-a="back">${ic('back',13)}<span>Back</span></button>
      <button class="btn sm" data-a="next">${ic('step',13)}<span>Step</span></button>
      <button class="btn sm ghost" data-a="reset">${ic('reset',13)}<span>Reset</span></button>
      <label class="hint" for="el-speed">Speed</label>
      <select class="select" id="el-speed" style="width:auto;min-height:28px;padding:2px 8px"><option value="1600">Slow</option><option value="1000" selected>Normal</option><option value="450">Fast</option></select>
      <span class="count" data-r="count"></span>
    </div>
    <div class="narr" data-r="narr"></div>
    <div class="lanes">
      <div class="lane stack"><h4>Call stack <span>runs now</span></h4><div class="lane-items" data-r="stack" aria-label="Call stack"></div></div>
      <div class="lane"><h4>Microtask queue <span>promises, await</span></h4><div class="lane-items" data-r="micro" aria-label="Microtask queue"></div>
        <div class="waitbox" data-r="waitbox"><h5>Waiting for a promise to settle</h5><div data-r="wait"></div></div></div>
      <div class="lane"><h4>Task queue <span>timers</span></h4><div class="lane-items" data-r="macro" aria-label="Task queue"></div></div>
    </div>
    <div class="console consolebox"><div class="console-h">Console</div><div class="console-b" data-r="out"></div></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  const playBtn=host.querySelector('[data-a="play"]');
  function setPlayLabel(){ playBtn.innerHTML=playing?`${ic('pause',13)}<span>Pause</span>`:`${ic('play',13)}<span>Play</span>`; playBtn.setAttribute('aria-label',playing?'Pause animation':'Play animation'); }
  function stop(){ playing=false; clearInterval(timer); timer=null; setPlayLabel(); }
  function draw(say){
    const has=frames.length>0;
    ['back','next','reset','play'].forEach(a=>{ host.querySelector(`[data-a="${a}"]`).disabled=!has; });
    if(!has){
      q('stack').innerHTML=q('micro').innerHTML=q('macro').innerHTML=q('wait').innerHTML='';
      q('waitbox').hidden=true;
      q('narr').innerHTML='Press <b>Run</b> in the example above. The lab records what really happened in your code, then replays it here.';
      q('out').innerHTML='<div class="empty">No trace yet.</div>'; q('count').textContent=''; return;
    }
    const f=frames[idx], fid=f.focus&&f.focus.id;
    q('stack').innerHTML=f.stack.length?f.stack.map((s,i)=>`<div class="chip ${s.kind==='log'?'':'run running'}${i===f.stack.length-1&&f.focus&&f.focus.lane==='stack'?' new':''}"><span class="k">${s.kind==='main'?'script':s.kind==='macro'?'task':s.kind==='log'?'call':s.kind==='await'?'microtask · async fn resumes':'microtask'}</span> ${esc(s.label)}</div>`).join(''):'<div class="lane-empty">empty</div>';
    q('micro').innerHTML=laneItems(f.micro,'micro',fid,'empty');
    q('macro').innerHTML=laneItems(f.macro,'macro',fid,'empty');
    q('wait').innerHTML=laneItems(f.wait,'micro wait',fid,'none');
    q('waitbox').hidden=!f.wait.length;
    q('narr').innerHTML=`<b>${idx+1}/${frames.length}.</b> ${esc(f.msg)}`;
    q('out').innerHTML=f.out.length?f.out.map(o=>logHTML(o)).join(''):'<div class="empty">Nothing printed yet.</div>';
    q('count').textContent=`Frame ${idx+1} of ${frames.length}`;
    host.querySelector('[data-a="back"]').disabled=idx===0;
    host.querySelector('[data-a="next"]').disabled=idx===frames.length-1;
    if(say) announce(f.msg);
  }
  function tick(){
    if(idx>=frames.length-1){ stop(); draw(false); return; }
    idx++; draw(true);
    if(idx>=frames.length-1) stop();
  }
  function play(){
    if(!frames.length) return;
    if(idx>=frames.length-1) idx=0;
    playing=true; setPlayLabel(); draw(true);
    clearInterval(timer); timer=setInterval(tick,speed);

  host.addEventListener('click',e=>{
    const b=e.target.closest('button[data-a]'); if(!b) return;
    const a=b.dataset.a;
    if(a==='play'){ if(playing) stop(); else play(); return; }
    stop();
    if(a==='next'&&idx<frames.length-1) idx++;
    else if(a==='back'&&idx>0) idx--;
    else if(a==='reset') idx=0;
    draw(true);
  });
  host.querySelector('#el-speed').addEventListener('change',e=>{ speed=+e.target.value; if(playing){ clearInterval(timer); timer=setInterval(tick,speed); } });
  function showNote(){
    const n=q('note'); if(!result){ n.innerHTML=''; return; }
    let h='';
    if(result.approx) h+='<p class="viz-note warn"><b>Approximate animation.</b> This code uses something the lab cannot trace exactly (for example <code>fetch</code>, <code>for await</code>, or an unusual await). The console order is still real; the queues shown are a best guess.</p>';
    if(result.capped) h+='<p class="viz-note warn">The trace was long, so it was cut off after a few hundred events.</p>';
    if(L.getCode().replace(/\s+$/,'')!==result.code.replace(/\s+$/,'')) h+='<p class="viz-note warn">You edited the code after this trace was recorded. Press <b>Run</b> to record it again.</p>';
    n.innerHTML=h;
  }
  L.hooks.run.push(res=>{
    stop(); result=null; frames=[]; idx=0;
    if(res.events&&res.status==='done'){
      result={approx:res.approx,capped:res.capped,code:res.code};

  });

  L.hooks.edit.push(showNote);
  setPlayLabel(); draw(false);
  return {destroy(){ stop(); }};
}

/* ---------- 3. Promises: timeline of measured timestamps ---------- */
function vizPromises(host,L){
  host.innerHTML=`<p class="viz-note">Bars show when each <code>task()</code> started and settled, measured with <code>performance.now()</code> during your last run. Compare the total with the sum of the bars.</p><div data-r="tl"></div>`;
  const tl=host.querySelector('[data-r="tl"]');
  const empty=()=>{ tl.innerHTML='<div class="narr">Press <b>Run</b> in the example above to measure a real timeline.</div>'; };
  function draw(res){
    if(!res||!res.spans.length){ tl.innerHTML=`<div class="narr">${res&&res.status!=='done'?'The run did not finish, so there is nothing to draw.':'This code did not call <code>task()</code>, so there are no bars to draw.'}</div>`; return; }
    const spans=res.spans.slice().sort((a,b)=>a.start-b.start);
    const logs=res.logs.filter(l=>l.level!=='error'||true);
    const endT=Math.max.apply(null,spans.map(s=>s.end).concat(logs.map(l=>l.ms||0)));
    const tick=endT>900?200:100;
    const axis=Math.max(400,Math.ceil((endT+10)/tick)*tick);
    const pct=v=>(Math.max(0,Math.min(v,axis))/axis*100).toFixed(2);
    const ticks=[]; for(let t=0;t<=axis;t+=tick) ticks.push(`<span style="left:${pct(t)}%">${t}</span>`);
    const rows=spans.map(s=>{
      const d=Math.round(s.end-s.start);
      return `<div class="tl-row"><div class="tl-name" title="${esc(s.name)}">${esc(s.name)}</div><div class="tl-track" style="--tick:${(tick/axis*100).toFixed(3)}%"><div class="tl-bar${s.fail?' fail':''}" style="left:${pct(s.start)}%;width:${(Math.max(0.6,(s.end-s.start)/axis*100)).toFixed(2)}%" title="${esc(s.name)}: ${Math.round(s.start)} to ${Math.round(s.end)} ms">${s.fail?'✗ rejected':'✓ fulfilled'} · ${d} ms</div></div></div>`;
    }).join('');
    const marks=logs.map(l=>`<div class="tl-mark" style="left:${pct(l.ms||0)}%" title="${esc(l.text)}"></div>`).join('');
    const sum=spans.reduce((a,s)=>a+(s.end-s.start),0);
    const span0=Math.min.apply(null,spans.map(s=>s.start)), last=Math.max.apply(null,spans.map(s=>s.end));
    const wall=last-span0, saved=sum-wall;
    let verdict;
    if(spans.length<2) verdict='Only one task ran.';
    else if(saved>sum*0.2) verdict=`The bars <b>overlap</b>: the tasks ran in parallel, saving about ${Math.round(saved)} ms compared with running them one after another.`;
    else verdict='The bars follow each other: the tasks ran <b>one after another</b>, so the total is about the sum of their durations.';
    tl.innerHTML=`<div class="tl">${rows}
      <div class="tl-row"><div class="tl-name">console</div><div class="tl-track" style="--tick:${(tick/axis*100).toFixed(3)}%">${marks}</div></div>
      <div class="tl-axis"><div class="hint" style="text-align:right">ms</div><div class="tl-ticks" aria-hidden="true">${ticks.join('')}</div></div></div>
      <p class="tl-total"><b>Wall-clock time: ${Math.round(wall)} ms</b> (sum of task durations: ${Math.round(sum)} ms). ${verdict}</p>
      <ul class="tl-logs">${logs.map(l=>`<li><span class="t">+${Math.round(l.ms||0)} ms</span><span>${esc(l.text)}</span></li>`).join('')}</ul>
      <p class="hint">Orange lines mark console output. Times vary by a few milliseconds from run to run. <span class="sr-only">Axis in milliseconds.</span></p>`;
  }
  L.hooks.run.push(draw);
  L.hooks.variant.push(empty);
  empty();
  return {destroy(){}};
}

/* ---------- 4. this binding ---------- */
const THIS_Q=[
  {id:'q1',q:'Is the function an <b>arrow function</b> (<code>() =&gt; …</code>)?',yes:'arrow',no:'q2'},
  {id:'q2',q:'Is it called with <b><code>new</code></b> (<code>new Foo()</code>)?',yes:'new',no:'q3'},
  {id:'q3',q:'Is it called with <b><code>call</code>, <code>apply</code> or <code>bind</code></b>, or is it a bound function?',yes:'explicit',no:'q4'},
  {id:'q4',q:'Is there an <b>object before the dot</b> at the call site, like <code>obj.method()</code>?',yes:'implicit',no:'default'}
];
function vizThis(host,L){
  let path=[],target=null,live=true;
  const results={};
  host.innerHTML=`<h3 style="margin:0 0 6px;font-size:13px">What is <code>this</code> here? Answer about the <em>call</em>.</h3>
    <p class="viz-note">Walk the questions in order. Optionally pick an example row in the table below to check your reasoning against it.</p>
    <div class="fc" data-r="fc"></div>

    <div data-r="tbl"><p class="viz-note"><span class="spinner"></span> Running the examples…</p></div>`;
  const q=n=>host.querySelector(`[data-r="${n}"]`);
  function drawFlow(){
    let h='';
    const cur=path.length?path[path.length-1]:null;
    const answered=path.map((p,i)=>`<div class="fc-node q"><div>${THIS_Q[p.i].q}</div><div class="picked">Your answer: ${p.yes?'Yes':'No'}</div></div><div class="fc-arrow" aria-hidden="true">↓</div>`).join('');
    h+=answered;
