<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JS Lab - Levelup</title>
<style>
:root{
  color-scheme: light;
  --bg:#f4f5f8; --panel:#ffffff; --panel-2:#f1f3f7; --border:#e1e4ea; --text:#1a1e27; --muted:#667085;
  --accent:#4f46e5; --accent-h:#4338ca; --accent-soft:#eceeff; --on-accent:#ffffff;
  --good:#137a4b; --good-bg:#e5f6ed; --bad:#c0362c; --bad-bg:#fdecea; --warn:#9a5b06; --warn-bg:#fff3de;
  --code-bg:#fbfbfd; --gutter:#f1f3f7; --shadow:0 1px 2px rgba(16,24,40,.06),0 6px 16px rgba(16,24,40,.06);
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
    --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
    --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
    --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0d1117; --panel:#161b22; --panel-2:#1c232c; --border:#2a323d; --text:#e6e9ee; --muted:#93a0b0;
  --accent:#8b8ff8; --accent-h:#a3a6fa; --accent-soft:#23264a; --on-accent:#0d1117;
  --good:#4cc38a; --good-bg:#12291f; --bad:#f0857c; --bad-bg:#33191a; --warn:#f0b35a; --warn-bg:#33270f;
  --code-bg:#12171e; --gutter:#171d25; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
code{font-family:var(--mono);font-size:.9em;background:var(--panel-2);border:1px solid var(--border);border-radius:5px;padding:1px 5px}

.app{display:grid;grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--on-accent)}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand-sub{color:var(--muted);font-size:12px;padding-left:10px;border-left:1px solid var(--border);white-space:nowrap}
.nav{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;margin-left:8px}
.nav a{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap}
.nav a:hover{background:var(--panel-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.spacer{flex:1}

.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-weight:600;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s}
.btn:hover:not(:disabled){background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.success{background:var(--good);border-color:var(--good);color:#fff}
.btn.success:hover:not(:disabled){filter:brightness(1.08);background:var(--good)}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover:not(:disabled){background:var(--panel-2)}
.icon-btn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);transition:background .15s,color .15s}
.icon-btn:hover{background:var(--panel-2);color:var(--text)}
.only-mobile{display:none}

.body{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:0}
.sidebar{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--border)}
.side-top{padding:14px 14px 10px;display:grid;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.input,.select,.textarea{width:100%;border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:7px 10px;min-height:34px;transition:border-color .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .input{padding-left:32px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.select{padding-right:6px}
.progress{padding:0 14px 10px}
.progress-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.bar{height:6px;background:var(--panel-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.qlist{flex:1;overflow:auto;padding:4px 8px 12px;display:grid;align-content:start;gap:2px}
.qitem{position:relative;display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border:1px solid transparent;border-radius:9px;background:transparent;transition:background .12s}
.qitem:hover{background:var(--panel-2)}
.qitem.active{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.qstatus{flex:none;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--border);color:transparent}
.qstatus.pass{background:var(--good);border-color:var(--good);color:#fff}
.qstatus.fail{border-color:var(--bad);color:var(--bad)}
.qmain{display:grid;gap:3px;min-width:0}
.qtitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qmeta{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;height:18px;padding:0 7px;border-radius:99px;font-size:11px;font-weight:600;background:var(--panel-2);color:var(--muted)}
.pill.easy{background:var(--good-bg);color:var(--good)}
.pill.medium{background:var(--warn-bg);color:var(--warn)}
.pill.hard{background:var(--bad-bg);color:var(--bad)}
.pill.react{background:var(--accent-soft);color:var(--accent)}
.pill.custom{border:1px dashed var(--border);background:transparent}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);margin-bottom:4px}

.main{display:grid;grid-template-columns:minmax(300px,34%) minmax(0,1fr);gap:12px;padding:12px;min-height:0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.problem{overflow:auto;padding:20px 22px;min-height:0}
.problem h1{font-size:20px;line-height:1.3;margin:0 0 10px;letter-spacing:-.01em}
.problem .tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.problem p{margin:0 0 12px}
.problem ul{margin:0 0 12px;padding-left:20px}
.problem li{margin:3px 0}
.problem h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.ex{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:10px;background:var(--panel)}
.ex-h{padding:5px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--panel-2);border-bottom:1px solid var(--border)}
.ex-b{padding:8px 12px;display:grid;gap:6px}
.ex-row{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px;align-items:baseline;font-size:13px}
.ex-row>span{color:var(--muted);font-weight:600;font-size:12px}
.ex-row code{white-space:pre-wrap;word-break:break-word;background:none;border:0;padding:0;font-size:12.5px}
.ex-note{margin:0;padding-top:6px;border-top:1px dashed var(--border);font-size:12.5px;color:var(--muted)}
.tabs .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.an{display:grid;gap:12px}
.an-verdict{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--panel-2)}
.an-verdict.ok{background:var(--good-bg);color:var(--good)}
.an-verdict.warn{background:var(--warn-bg);color:var(--warn)}
.an-verdict.bad{background:var(--bad-bg);color:var(--bad)}
.an-verdict strong{display:block;font-size:14px}
.an-verdict span{color:var(--text);font-size:13px}
.an-verdict>svg{flex:none;margin-top:2px}
.an-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:var(--panel)}
.tile-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile-v{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.tile-s{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.an-sec h4{margin:0 0 8px;font-size:13px}
.an-sec ul{margin:0;padding-left:18px;font-size:13px}
.an-sec li{margin:3px 0}
.an-sec .lead{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.mrow{display:grid;grid-template-columns:76px minmax(0,1fr) 84px;gap:10px;align-items:center;font-size:12.5px;margin:4px 0}
.mrow .mbar{height:8px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.mrow .mbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.mrow code{background:none;border:0;padding:0}
.mrow em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.kvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kvgrid div{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--panel)}
.kvgrid b{display:block;font-size:16px}
.kvgrid span{font-size:12px;color:var(--muted)}
.hint-item{display:flex;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel-2);font-size:13px;margin-bottom:6px}
.hint-item.warn{background:var(--warn-bg)}
.small-note{font-size:12px;color:var(--muted)}
.codeblock{margin:0;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--code-bg);font:12.5px/1.6 var(--mono);overflow:auto;white-space:pre;tab-size:2;max-height:320px}
.ans-meta{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.ans-h{margin:16px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hint-box{border:1px solid var(--border);background:var(--panel-2);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted)}
.hint-box b{color:var(--text)}
.problem-actions{margin-top:20px;display:flex;gap:8px}

.workspace{display:grid;grid-template-rows:var(--editor-h,58%) 10px minmax(0,1fr);min-height:0;min-width:0}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden}
.pane-h{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--border);background:var(--panel);min-height:48px;flex-wrap:wrap}
.file{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.file svg{color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap}
.tools .sep{width:1px;height:20px;background:var(--border);margin:0 4px}
.kbd{font-family:var(--mono);font-size:10px;opacity:.75;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:2px}

.editor{--fs:13px;flex:1;display:flex;min-height:0;background:var(--code-bg);overflow:hidden;font:var(--fs)/1.6 var(--mono)}
.gutter{margin:0;flex:none;min-width:46px;padding:12px 10px 24px 8px;text-align:right;color:var(--muted);background:var(--gutter);border-right:1px solid var(--border);overflow:hidden;user-select:none;font:inherit;opacity:.85}
.code{flex:1;min-width:0;border:0;outline:none;resize:none;background:transparent;color:var(--text);padding:12px 14px;white-space:pre;overflow:auto;tab-size:2;font:inherit}

.splitter{cursor:row-resize;display:grid;place-items:center;touch-action:none}
.splitter::after{content:"";width:44px;height:4px;border-radius:99px;background:var(--border);transition:background .15s}
.splitter:hover::after,.splitter:focus-visible::after{background:var(--accent)}

.tabs{display:flex;gap:2px}
.tab{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:600;font-size:13px}
.tab:hover{background:var(--panel-2);color:var(--text)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .count{font-size:11px;background:var(--panel-2);color:var(--muted);border-radius:99px;padding:0 6px}
.tab[aria-selected="true"] .count{background:var(--panel);color:var(--accent)}
.status{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}
.rbody{flex:1;min-height:0;position:relative;background:var(--panel)}
.panel{position:absolute;inset:0;overflow:auto;padding:12px 14px}
.panel[hidden]{display:none}
.panel.flush{padding:0}

.log{display:flex;gap:8px;padding:6px 10px;border-radius:8px;font:12.5px/1.5 var(--mono);border:1px solid transparent;margin-bottom:4px}
.log pre{margin:0;white-space:pre-wrap;word-break:break-word;font:inherit}
.log-log,.log-info,.log-debug{background:var(--panel-2)}
.log-warn{background:var(--warn-bg);color:var(--warn)}
.log-error{background:var(--bad-bg);color:var(--bad)}
.log-result{background:var(--accent-soft);color:var(--accent);font-weight:600}
.log-meta{color:var(--muted);padding-left:2px}

.summary{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;margin-bottom:12px;border:1px solid var(--border);background:var(--panel-2)}
.summary.ok{background:var(--good-bg);border-color:transparent;color:var(--good)}
.summary.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
.summary strong{font-size:14px;white-space:nowrap}
.summary .bar{flex:1;background:rgba(127,127,127,.2)}
.summary.bad .bar>i{background:var(--bad)}
.tcase{border:1px solid var(--border);border-radius:10px;padding:10px 12px 12px;margin-bottom:10px;background:var(--panel);transition:border-color .15s}
.tcase.pass{border-left:4px solid var(--good)}
.tcase.fail{border-left:4px solid var(--bad)}
.tcase.running{border-left:4px solid var(--accent)}
.tcase-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tnum{font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tbadge{font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px}
.tbadge.pass{background:var(--good-bg);color:var(--good)}
.tbadge.fail{background:var(--bad-bg);color:var(--bad)}
.tbadge.running{background:var(--accent-soft);color:var(--accent)}
.tcase-h .icon-btn{margin-left:auto;width:28px;height:28px}
.fld{display:grid;gap:4px;margin-bottom:8px}
.fld>span{font-size:12px;font-weight:600;color:var(--muted)}
.fld>span em{font-weight:400;font-style:normal}
.fld .textarea{font-family:var(--mono);font-size:12.5px;resize:none;overflow:hidden;line-height:1.5;padding:6px 10px;min-height:34px}
.fld [aria-invalid="true"]{border-color:var(--bad)}
.ferr{color:var(--bad);font-size:12px}
.ferr[hidden]{display:none}
.kv{display:grid;grid-template-columns:70px 1fr;gap:8px;font-size:12.5px;padding:6px 0 0;align-items:start}
.kv>span{color:var(--muted);font-weight:600}
.kv code{background:none;border:0;padding:0;white-space:pre-wrap;word-break:break-word;font-size:12.5px}
.kv.err code{color:var(--bad)}
.kv.ok code{color:var(--good)}
.tname{font-weight:600;border:1px solid transparent;background:transparent;border-radius:6px;padding:2px 6px;min-width:0;flex:1;max-width:280px}
.tname:hover,.tname:focus{border-color:var(--border);background:var(--panel);outline:none}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.spinner{width:12px;height:12px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.placeholder{display:grid;place-items:center;height:100%;text-align:center;color:var(--muted);padding:24px}
.placeholder strong{display:block;color:var(--text);margin-bottom:4px}
#preview-host,#preview-host iframe{width:100%;height:100%;border:0;display:block;background:#fff}
#preview-empty{position:absolute;inset:0;background:var(--panel)}

.backdrop{display:none}
.overlay{position:fixed;inset:0;background:rgba(10,12,18,.55);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(720px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden}
.dialog.narrow{width:min(420px,100%)}
.dialog-h{display:flex;align-items:center;padding:14px 16px 14px 20px;border-bottom:1px solid var(--border)}
.dialog-h h2{margin:0;font-size:16px}
.dialog-h .icon-btn{margin-left:auto}
.dialog-b{padding:16px 20px;overflow:auto}
.dialog-f{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px;border-top:1px solid var(--border);background:var(--panel-2)}
.dialog-f .form-error{margin-right:auto;color:var(--bad);font-size:12.5px;max-width:60%;white-space:pre-line}
.seg{display:inline-flex;padding:3px;border-radius:9px;background:var(--panel-2);border:1px solid var(--border);gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 14px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--accent);box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:1fr 160px;gap:12px}
.dialog .fld{margin-bottom:12px}
.dialog .fld .textarea.mono{font-size:12.5px}
.dialog .textarea{resize:vertical}
.rows-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}
.rows-h b{font-size:12px;font-weight:600;color:var(--muted)}
.trow{display:grid;grid-template-columns:1fr 1fr 32px;gap:8px;margin-bottom:8px;align-items:start}
.trow.react{grid-template-columns:150px 1fr 32px}
.trow .textarea{font-family:var(--mono);font-size:12.5px;min-height:34px;resize:vertical}
.small{font-size:12px;color:var(--muted)}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:60}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);font-weight:600;font-size:13px;animation:fade .2s;max-width:340px}
.toast.bad{background:var(--bad);color:#fff}

@media (max-width:960px){
  .only-mobile{display:inline-grid}
  .brand-sub{display:none}
  .body{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;z-index:40;top:56px;bottom:0;left:0;width:min(320px,88vw);transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow)}
  body.nav-open .sidebar{transform:none}
  body.nav-open .backdrop{display:block;position:fixed;inset:56px 0 0 0;background:rgba(10,12,18,.45);z-index:30}
  .main{display:flex;flex-direction:column;overflow:auto}
  .problem{flex:none;max-height:none;overflow:visible}
  .workspace{flex:none;height:680px}
  .grid2{grid-template-columns:1fr}
  .trow,.trow.react{grid-template-columns:1fr 32px}
  .trow>:nth-child(2){grid-column:1}
}
@media (max-width:700px){
  .brand-name{display:none}
}

<script>

/* ==========================================================================

function workerMain(){

function toast(msg,bad){
  const t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.textContent=msg;
  $('#toasts').appendChild(t); setTimeout(()=>t.remove(),3200);
}
function fmtDesc(t){
  const inline=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const out=[]; let list=null, para=[];
  const fp=()=>{ if(para.length){ out.push('<p>'+para.join('<br>')+'</p>'); para=[]; } };
  const fl=()=>{ if(list){ out.push('<ul>'+list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'); list=null; } };
  for(const line of String(t||'').split('\n')){
    if(/^\s*[-*]\s+/.test(line)){ fp(); (list=list||[]).push(inline(line.replace(/^\s*[-*]\s+/,''))); }
    else if(!line.trim()){ fp(); fl(); }
    else { fl(); para.push(inline(line)); }
  }
  fp(); fl();
  return out.join('')||'<p class="muted">No description.</p>';
}

  const list=qs.filter(q=>(!filters.type||q.type===filters.type)&&(!filters.diff||q.difficulty===filters.diff)&&(!term||q.title.toLowerCase().includes(term)));
  $('#qlist').innerHTML=list.length?list.map(q=>{
    const st=S.status[q.id];
    return `<button class="qitem${q.id===S.current?' active':''}" data-id="${esc(q.id)}" ${q.id===S.current?'aria-current="true"':''}>

function examplesFor(q){
  if(Array.isArray(q.examples)&&q.examples.length) return q.examples;
  if(isReact(q)) return [];
  return getTests(q).slice(0,2).map(t=>{
    try{ const a=JSON.parse(t.input); if(!Array.isArray(a)) return null; return {input:a.map(x=>JSON.stringify(x)).join(', '),output:JSON.stringify(JSON.parse(t.expected)),call:q.fn}; }
    catch(e){ return null; }
  }).filter(Boolean);
}
function examplesHTML(q){
  const list=examplesFor(q); if(!list.length) return '';

/* --- editor key handling (indent, auto-close, auto-indent) --- */
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
const has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function insertText(ta,text){
  ta.focus();
  if(!document.execCommand('insertText',false,text)){ ta.setRangeText(text,ta.selectionStart,ta.selectionEnd,'end'); ta.dispatchEvent(new Event('input',{bubbles:true})); }
}
function deleteSel(ta){
  if(!document.execCommand('delete')){ ta.setRangeText('',ta.selectionStart,ta.selectionEnd,'end'); ta.dispatchEvent(new Event('input',{bubbles:true})); }
}
function lineStart(v,i){ return i===0?0:v.lastIndexOf('\n',i-1)+1; }
function onEditorKey(e){
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing) return;
  const ta=e.target, s=ta.selectionStart, en=ta.selectionEnd, v=ta.value, k=e.key;
  if(k==='Tab'){
    e.preventDefault();
    if(s===en&&!e.shiftKey){ insertText(ta,'  '); return; }
    const ls=lineStart(v,s); let le=v.indexOf('\n',en); if(le<0) le=v.length;
    const block=v.slice(ls,le);
    const out=e.shiftKey?block.replace(/^( {1,2}|\t)/gm,''):block.replace(/^/gm,'  ');
    ta.setSelectionRange(ls,le); insertText(ta,out); ta.setSelectionRange(ls,ls+out.length);
    return;
  }
  if(k==='Enter'&&!e.shiftKey){
    e.preventDefault();
    const indent=v.slice(lineStart(v,s),s).match(/^\s*/)[0], before=v[s-1], after=v[en];
    const opener=before&&'{[('.includes(before);
    if(opener&&after&&PAIRS[before]===after){ insertText(ta,'\n'+indent+'  \n'+indent); const p=s+1+indent.length+2; ta.setSelectionRange(p,p); }
    else if(opener) insertText(ta,'\n'+indent+'  ');
    else insertText(ta,'\n'+indent);
    return;
  }
  if(k==='Backspace'&&s===en&&s>0&&has(PAIRS,v[s-1])&&PAIRS[v[s-1]]===v[s]){
    e.preventDefault(); ta.setSelectionRange(s-1,s+1); deleteSel(ta); return;
  }
  if(k.length!==1) return;
  const isCloser=')]}"\'`'.includes(k);
  if(isCloser&&s===en&&v[s]===k){ e.preventDefault(); ta.setSelectionRange(s+1,s+1); return; }
  if(has(PAIRS,k)){
    const close=PAIRS[k];
    if(s!==en){ e.preventDefault(); insertText(ta,k+v.slice(s,en)+close); ta.setSelectionRange(s+1,en+1); return; }
    if(k===close&&s>0&&/[\w$]/.test(v[s-1])) return;
    if(v[s]&&/[\w$]/.test(v[s])) return;
    e.preventDefault(); insertText(ta,k+close); ta.setSelectionRange(s+1,s+1);
  }
}

const FR={el:null,ready:null,resolve:null,reject:null,timer:null,on:null};
function killFrame(){
  clearTimeout(FR.timer);
  if(FR.el){ FR.el.remove(); }
  FR.el=FR.ready=FR.resolve=FR.reject=FR.on=null;
  $('#preview-empty').hidden=false;
}
function ensureFrame(){
  if(FR.el&&FR.ready) return FR.ready;
  const f=document.createElement('iframe');
  f.setAttribute('sandbox','allow-scripts'); f.title='Component preview'; f.srcdoc=FRAME_SRC;
  FR.el=f;
  FR.ready=new Promise((res,rej)=>{ FR.resolve=res; FR.reject=rej; });
  FR.ready.catch(()=>{});
  FR.timer=setTimeout(()=>{ const rej=FR.reject; killFrame(); rej&&rej(new Error('Timed out loading React from the CDN. Check your internet connection.')); },20000);
  $('#preview-host').appendChild(f);
  return FR.ready;
}
window.addEventListener('message',e=>{
  if(!FR.el||e.source!==FR.el.contentWindow) return;
  const m=e.data||{};
  if(m.t==='ready'){ clearTimeout(FR.timer); FR.resolve&&FR.resolve(); return; }
  if(m.t==='loadfail'){ const rej=FR.reject; killFrame(); rej&&rej(new Error('Could not load React/Babel from cdnjs.cloudflare.com. React questions need an internet connection.')); return; }
  if(FR.on) FR.on(m);
});

function checkJsTest(t){
  let a;
  try{ a=JSON.parse(t.input); }catch(e){ return 'Input is not valid JSON.'; }
  if(!Array.isArray(a)) return 'Input must be a JSON array of arguments, e.g. [1, 2].';
  try{ JSON.parse(t.expected); }catch(e){ return 'Expected output is not valid JSON.'; }
  return null;
}
function execJs(q,mode,h){
  const tests=getTests(q);
  let map=[], sendable=[];
  if(mode==='test'){
    tests.forEach((t,i)=>{ const err=checkJsTest(t); if(err) h.result({i,pass:false,error:err,ms:0}); else { map.push(i); sendable.push(t); } });
    if(!sendable.length){ h.end({}); return ()=>{}; }
  }
  let w,url,timer,cur=null,ended=false;
  const dispose=()=>{ clearTimeout(timer); try{ w.terminate(); }catch(e){} try{ URL.revokeObjectURL(url); }catch(e){} };
  const end=info=>{ if(ended) return; ended=true; dispose(); h.end(info); };
  const arm=()=>{ clearTimeout(timer); timer=setTimeout(()=>end({timeout:true,index:cur}),TIMEOUT); };
  try{ url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})); w=new Worker(url); }
  catch(err){ h.end({fatal:'Could not start the sandbox worker: '+err.message}); return ()=>{}; }
  w.onmessage=e=>{
    const m=e.data;
    if(m.t==='log') h.log(m.level,m.text);
    else if(m.t==='start'){ cur=map[m.i]; h.start(cur); arm(); }
    else if(m.t==='result'){ h.result(Object.assign({},m,{i:map[m.i]})); arm(); }
    else if(m.t==='fatal') end({fatal:m.message});
    else if(m.t==='done') end({});
  };
  w.onerror=e=>{ e.preventDefault(); end({fatal:e.message||'The worker crashed.'}); };
  arm();
  w.postMessage({mode,code:getCode(q),fn:q.fn,tests:mode==='test'?sendable:tests.slice(0,1)});
  return ()=>{ if(!ended){ ended=true; dispose(); } };
}
function execReact(q,mode,h){
  let ended=false,timer,cur=null;
  const end=info=>{ if(ended) return; ended=true; clearTimeout(timer); FR.on=null; h.end(info); };
  const arm=()=>{ clearTimeout(timer); timer=setTimeout(()=>{ killFrame(); end({timeout:true,index:cur}); },TIMEOUT); };
  ensureFrame().then(()=>{
    if(ended) return;
    FR.on=m=>{
      if(m.t==='log') h.log(m.level,m.text);
      else if(m.t==='start'){ cur=m.i; h.start(m.i); arm(); }
      else if(m.t==='result'){ h.result(m); arm(); }
      else if(m.t==='rendered'||m.t==='done') end({});
      else if(m.t==='error'||m.t==='fatal') end({fatal:m.message});
    };
    arm();
    $('#preview-empty').hidden=true;
    FR.el.contentWindow.postMessage(mode==='run'?{t:'run',code:getCode(q),name:q.fn}:{t:'test',code:getCode(q),name:q.fn,tests:getTests(q)},'*');
  }).catch(err=>end({fatal:err.message}));
  return ()=>{ if(!ended){ ended=true; clearTimeout(timer); killFrame(); } };
}
function cancelRun(){
  if(R.stop){ try{ R.stop(); }catch(e){} }
  R.stop=null; R.running=null;
}
function startRun(mode){
  const q=cur();
  if(R.running) return;
  cancelRun();
  R.running=mode; R.logs=[]; R.status='Running…'; R.analysis=null;
  if(mode==='test') R.results={};
  const t0=performance.now();
  const h={
    log:(level,text)=>{ R.logs.push({level,text}); renderConsole(); },
    start:i=>{ R.results[i]={running:true}; renderTests(); },
    result:r=>{ R.results[r.i]=r; renderTests(); },
    end:info=>{
      R.running=null; R.stop=null;
      const ms=Math.round(performance.now()-t0);
      const limit='Time limit exceeded (5 s). Check for an infinite loop.';
      if(info.fatal) R.logs.push({level:'error',text:info.fatal});
      if(info.timeout){
        if(info.index!=null&&mode==='test') R.results[info.index]={pass:false,timeout:true,error:limit};
        else R.logs.push({level:'error',text:limit});
      }
      if(mode==='test'){
        const total=getTests(q).length, rs=Object.values(R.results);
        const ok=!info.fatal&&!info.timeout&&total>0&&rs.length===total&&rs.every(r=>r.pass);
        S.status[q.id]=ok?'pass':(rs.length||info.fatal||info.timeout)?'fail':S.status[q.id];
        if(!S.status[q.id]) delete S.status[q.id];
        save(); renderSidebar();
        R.status=info.fatal?'Could not run tests':ok?`All tests passed · ${ms} ms`:`Finished · ${ms} ms`;
      }else{
        if(!info.fatal&&!info.timeout&&!R.logs.length) R.logs.push({level:'meta',text:isReact(q)?'Rendered with no console output.':'Ran with no console output.'});
        else if(!info.fatal&&!info.timeout) R.logs.push({level:'meta',text:`Finished in ${ms} ms`});
        R.status=info.fatal?'Error':info.timeout?'Timed out':`Finished · ${ms} ms`;
      }
      R.analysis=makeAnalysis(q,mode,ms);
      R.analysisNew=true;
      renderResults();
      maybeProfile(q,mode);
    }
  };
  setTab(mode==='test'?'tests':isReact(q)?'preview':'console');
  renderResults();
  R.stop=(isReact(q)?execReact:execJs)(q,mode,h);
}
function stopRun(){
  if(!R.running) return;
  cancelRun(); R.status='Stopped';
  R.logs.push({level:'warn',text:'Run stopped.'});
  Object.keys(R.results).forEach(k=>{ if(R.results[k].running) delete R.results[k]; });
  renderResults();
}

const RANKS={'o(1)':0,'o(logn)':1,'o(n)':2,'o(nlogn)':3,'o(n²)':4,'o(n^2)':4,'o(n²logn)':5,'o(n³)':6,'o(n^3)':6,'o(2ⁿ)':100,'o(2^n)':100};

/* blank out comments, strings and regex literals but keep positions */

    if(c==='/'&&d==='*'){ let j=src.indexOf('*/',i+2); j=j<0?n:j+2; out+=blank(i,j); i=j; continue; }

      if(src[j]==='/'){ j++; while(/[a-z]/i.test(src[j]||'')) j++; out+=blank(i,j); i=j; prev='x'; continue; }
    }

}

const LINEAR_CALLS=['indexOf','lastIndexOf','includes','slice','splice','concat','join','reverse','split','shift','unshift','substring','substr','padStart','padEnd','repeat','trim','toLowerCase','toUpperCase','replace','replaceAll','flat','fill','copyWithin','startsWith','endsWith'];

      else{ bodyStart=k; bodyEnd=stmtEnd(t,k); }
    }
    const body=t.slice(bodyStart,bodyEnd);
    let constant=false;
    if(kw==='for'&&!/\b(of|in)\b/.test(header)){ const ids=header.replace(/\b(let|var|const)\b/g,'').match(/[A-Za-z_$][\w$]*/g)||[]; constant=new Set(ids).size<=1&&/\d/.test(header); }
    const log=!constant&&(LOG_LOOP.test(kw==='for'?header+' '+body:body+' '+header));
    loops.push({kw,start:bodyStart,end:bodyEnd,log,constant,line:t.slice(0,m.index).split('\n').length});
  }
  /* iteration callbacks: .map( ... ) etc */
  const ire=new RegExp('\\.\\s*('+ITER_CALLS.join('|')+')\\s*\\(','g');
  while((m=ire.exec(t))){
    const po=m.index+m[0].length-1, pc=matchClose(t,po);
    loops.push({kw:'.'+m[1]+'()',start:po+1,end:pc,log:false,constant:false,line:t.slice(0,m.index).split('\n').length,method:true});
  }
  const real=loops.filter(l=>!l.constant);
  const chainAt=pos=>real.filter(l=>pos>=l.start&&pos<l.end);
  const degOf=ch=>({deg:ch.filter(l=>!l.log).length,l:ch.filter(l=>l.log).length});
  /* loop events (each loop's own chain) */
  real.forEach(l=>{
    const ch=real.filter(o=>l.start>=o.start&&l.end<=o.end);
    const c=degOf(ch); events.push({deg:c.deg,l:c.l,why:null,loop:l,depth:ch.length});
  });
  /* hidden linear/sort work */
  const lre=new RegExp('\\.\\s*('+LINEAR_CALLS.join('|')+'|sort)\\s*\\(','g'), spread=/\[\s*\.\.\.|\(\s*\.\.\./g;
  const extras=[];
  while((m=lre.exec(t))){ extras.push({pos:m.index,name:m[1],sort:m[1]==='sort'}); }
  while((m=spread.exec(t))){ extras.push({pos:m.index,name:'spread (...)',sort:false}); }
  const extraRe=/\b(Array\.from|Object\.(keys|values|entries)|JSON\.stringify|JSON\.parse)\b/g;
  while((m=extraRe.exec(t))){ extras.push({pos:m.index,name:m[0],sort:false}); }
  extras.forEach(x=>{
    const c=degOf(chainAt(x.pos));
    if(x.name==='reverse'||x.name==='trim'||x.name==='toLowerCase'||x.name==='toUpperCase'||x.name==='replace'||x.name==='join'||x.name==='split'||x.name==='repeat'||x.name==='startsWith'||x.name==='endsWith'||x.name==='padStart'||x.name==='padEnd'||true){
      events.push({deg:c.deg+1,l:c.l+(x.sort?1:0),why:null,extra:x,inLoop:chainAt(x.pos).length});
    }
  });
  /* recursion */
  const fnName=q&&q.fn;
  let recursive=false, branching=false;
  const defs=[...t.matchAll(/function\s+([A-Za-z_$][\w$]*)\s*\(/g)].map(x=>x[1]).concat([...t.matchAll(/(?:const|let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:async\s*)?(?:function|\([^)]*\)\s*=>|[\w$]+\s*=>)/g)].map(x=>x[1]));
  defs.forEach(name=>{
    const dm=new RegExp('(?:function\\s+'+name.replace(/\$/g,'\\$')+'\\s*\\(|(?:const|let|var)\\s+'+name.replace(/\$/g,'\\$')+'\\s*=)').exec(t);
    if(!dm) return;
    let bodyTxt='';
    const po=t.indexOf('(',dm.index), isFn=/^function/.test(dm[0]);
    if(isFn&&po>=0){ const b=t.indexOf('{',matchClose(t,po)); if(b>=0) bodyTxt=t.slice(b,matchClose(t,b)+1); }
    else{ const ar=t.indexOf('=>',dm.index); if(ar>=0){ let k=ar+2; while(/\s/.test(t[k]||'')) k++; bodyTxt=t[k]==='{'?t.slice(k,matchClose(t,k)+1):t.slice(k,stmtEnd(t,k)); } }
    const calls=(bodyTxt.match(new RegExp('(?<![\\w$.])'+name.replace(/\$/g,'\\$')+'\\s*\\(','g'))||[]).length;
    if(calls>0){ recursive=true; if(calls>=2&&!/\.(has|get)\s*\(|\b\w+\s*\[[^\]]+\]\s*=[^=]|\b(memo|cache|dp)\b/i.test(bodyTxt)) branching=true; }
  });
  /* time result */
  let best={deg:0,l:0};
  const better=(a,b)=>cRank(a.deg,a.l)>cRank(b.deg,b.l);
  events.forEach(e=>{ if(better(e,best)) best={deg:e.deg,l:e.l}; });
  if(recursive&&!branching&&best.deg<1) best={deg:1,l:0};
  let timeLabel=cLabel(best.deg,best.l), timeRank=cRank(best.deg,best.l);
  if(branching){ timeLabel='O(2ⁿ)'; timeRank=100; }
  const maxDepth=real.reduce((mx,l)=>Math.max(mx,real.filter(o=>l.start>=o.start&&l.end<=o.end).length),0);
  /* reasons */
  const nloops=real.filter(l=>!l.method).length, ncb=real.filter(l=>l.method).length;
  if(branching) reasons.push('A recursive function calls itself more than once per call without caching results, which usually grows exponentially.');
  else if(recursive) reasons.push('The code is recursive. Each call adds work, so the cost grows with the recursion depth.');
  if(maxDepth>=2) reasons.push('Loops are nested '+maxDepth+' levels deep (including array callbacks like map/filter), so the work multiplies.');
  else if(maxDepth===1) reasons.push('There is one loop that goes over the input once.');
  if(real.some(l=>l.log)) reasons.push('A loop halves the search range each step (binary-search style), which is O(log n).');
  const seenMsg=new Set();
  extras.forEach(x=>{
    const nest=chainAt(x.pos).length;
    if(x.sort&&!seenMsg.has('sort')){ seenMsg.add('sort'); reasons.push('`sort` takes O(n log n)'+(nest?' and it is called inside a loop, which multiplies the cost':'')+'.'); }
    else if(!x.sort&&nest>0&&!seenMsg.has(x.name)&&['indexOf','lastIndexOf','includes','slice','splice','concat','shift','unshift','join','reverse','split','spread (...)'].includes(x.name)){
      seenMsg.add(x.name); reasons.push('`'+x.name+'` inside a loop scans or copies the data each time, so it adds another O(n) level.');
    }
  });
  if(!reasons.length&&!events.length) reasons.push('No loops, recursion or whole-input operations were found, so the work does not grow with the input.');
  /* space */
  let sp=0; const setSp=(r,why)=>{ if(r>sp) sp=r; spaceReasons.push(why); };
  const strVars=[...t.matchAll(/(?:let|var)\s+([A-Za-z_$][\w$]*)\s*=\s*(?:''|""|``)/g)].map(x=>x[1]);
  const growth=/\.\s*(push|unshift|add|set)\s*\(|\]\s*=[^=]/;
  const alloc=/\bnew\s+(Map|Set|Array|WeakMap)\b|\bArray\s*\(|\bArray\.from\b|\.\s*(slice|concat|split|map|filter|flatMap|flat|substring|substr|repeat|padStart|padEnd|replace|replaceAll|toLowerCase|toUpperCase|trim|join)\s*\(|\[\s*\.\.\./;
  if(recursive) setSp(2,'Recursion keeps one stack frame per call, so memory grows with the recursion depth.');
  if(/\bnew\s+(Map|Set)\b/.test(t)&&growth.test(t)) setSp(2,'A Map/Set is filled from the input, so it can hold up to n items.');
  else if(growth.test(t)&&/(?:let|const|var)\s+[\w$]+\s*=\s*(\[\s*\]|\{\s*\})/.test(t)&&real.length) setSp(2,'An array/object is filled while looping, so it can grow with the input.');
  if(strVars.some(v=>new RegExp('\\b'+v+'\\s*\\+=').test(t))&&real.length) setSp(2,'A string is built up character by character, so its size grows with the input.');
  const allocOnce=t.match(alloc);
  if(allocOnce&&!spaceReasons.length) setSp(2,'A new array/string/collection is created from the input (`'+allocOnce[0].replace(/\s+/g,'')+'`), so it takes O(n) space.');
  else if(allocOnce&&sp<2) setSp(2,'A new array/string/collection is created from the input.');
  if(/\bArray\b[^;]*?(?:fill|from|map)[^;]*?(?:new\s+Array|Array\s*\(|\[\s*\])/.test(t)&&/\[[^\]]+\]\s*\[[^\]]+\]/.test(t)){ setSp(4,'A 2-dimensional table is created (an array of arrays), which takes O(n²) space.'); }
  if(!spaceReasons.length) spaceReasons.push('Only a fixed number of variables are used, so extra memory does not grow with the input.');
  const spaceRank=sp;
  const spaceLabel={0:'O(1)',2:'O(n)',4:'O(n²)'}[sp]||'O(n)';
  /* metrics */
  const codeLines=code.split('\n').filter(l=>l.trim()&&!/^\s*(\/\/|\/\*|\*)/.test(l)).length;
  const structs=[]; ['Map','Set','Array','Object'].forEach(k=>{ if(new RegExp('\\bnew\\s+'+k+'\\b|\\b'+k+'\\.').test(t)) structs.push(k); });
  if(/(?:const|let|var)\s+[\w$]+\s*=\s*\[/.test(t)&&!structs.includes('Array')) structs.push('Array');
  if(/(?:const|let|var)\s+[\w$]+\s*=\s*\{/.test(t)&&!structs.includes('Object')) structs.push('Object');
  /* quality hints */
  const hints=[];
  if(/\bvar\b/.test(t)) hints.push({w:1,text:'Use `let` or `const` instead of `var`. They are safer because they stay inside their block.'});
  if(/[^=!<>]==[^=]|!=[^=]/.test(t)) hints.push({w:1,text:'Prefer `===` and `!==` over `==` and `!=`. They avoid surprising type conversions.'});
  if(/console\.(log|debug)\s*\(/.test(t)) hints.push({w:0,text:'There is a `console.log` left in the code. Remove debug output once it works.'});
  if(codeLines>40) hints.push({w:0,text:'This solution is long ('+codeLines+' lines). Consider splitting it into small helper functions.'});
  return {time:{label:timeLabel,rank:timeRank,reasons},space:{label:spaceLabel,rank:spaceRank,reasons:[...new Set(spaceReasons)]},
    metrics:{lines:codeLines,loops:nloops,callbacks:ncb,maxDepth,recursive,structs},hints};
}
function analyzeReact(code){
  const t=stripCode(code), hints=[];
  const hooks=[...new Set([...t.matchAll(/\b(use[A-Z]\w*)\s*\(/g)].map(x=>x[1]))];
  const comps=[...t.matchAll(/(?:function\s+|(?:const|let)\s+)([A-Z][\w$]*)/g)].map(x=>x[1]);
  const jsx=(t.match(/<[A-Za-z][\w.]*(?=[\s/>])/g)||[]).length;
  const raw=code;
  if(/\.map\s*\(/.test(t)&&/<[A-Za-z]/.test(t)&&!/\bkey\s*=/.test(raw)) hints.push({w:1,text:'A list is rendered with `.map()` but no `key` prop was found. Give each item a stable, unique `key`.'});
  if(/\bkey\s*=\s*\{\s*(i|idx|index|j)\s*\}/.test(raw)) hints.push({w:1,text:'The array index is used as a `key`. That breaks when items are added, removed or reordered. Prefer a unique id.'});
  [...t.matchAll(/useEffect\s*\(/g)].forEach(m=>{
    const po=m.index+m[0].length-1, pc=matchClose(t,po), inner=t.slice(po+1,pc).trim();
    if(!/\[[^\]]*\]\s*$/.test(inner)) hints.push({w:1,text:'A `useEffect` has no dependency array, so it runs after every render. Add `[]` or the values it depends on.'});
  });
  [...t.matchAll(/const\s*\[\s*([\w$]+)\s*,\s*set\w+\s*\]\s*=\s*useState/g)].forEach(m=>{
    if(new RegExp('\\b'+m[1]+'\\s*\\.\\s*(push|pop|splice|shift|unshift|sort|reverse)\\s*\\(|\\b'+m[1]+'\\s*\\[[^\\]]+\\]\\s*=[^=]').test(t)) hints.push({w:1,text:'State variable `'+m[1]+'` is changed directly. Create a new array/object and pass it to the setter instead.'});
  });
  if(/\bdocument\s*\./.test(t)) hints.push({w:1,text:'Avoid reading or changing the DOM directly with `document`. Let React render from state.'});
  if(/console\.(log|debug)\s*\(/.test(t)) hints.push({w:0,text:'There is a `console.log` left in the code. Remove debug output once it works.'});
  const lines=code.split('\n').filter(l=>l.trim()&&!/^\s*(\/\/|\/\*|\*)/.test(l)).length;
  return {metrics:{lines,hooks,components:comps.length,jsx},hints};
}

function makeAnalysis(q,mode,ms){
  let stat=null;
  try{ stat=isReact(q)?analyzeReact(getCode(q)):analyzeCode(getCode(q),q); }catch(e){ stat=null; }
  const tests=getTests(q), rs=Object.values(R.results).filter(r=>!r.running);
  const times=rs.map(r=>r.ms||0);
  return {mode,ms,stat,react:isReact(q),
    tests:mode==='test'?{total:tests.length,ran:rs.length,passed:rs.filter(r=>r.pass).length,avg:times.length?times.reduce((a,b)=>a+b,0)/times.length:0,max:times.length?Math.max(...times):0,slowest:times.length?times.indexOf(Math.max(...times))+1:0}:null,
    measured:null};
}
function slopeOf(pts){
  const xs=pts.map(p=>Math.log(p.n)), ys=pts.map(p=>Math.log(Math.max(p.ms,1e-4)));
  const mx=xs.reduce((a,b)=>a+b,0)/xs.length, my=ys.reduce((a,b)=>a+b,0)/ys.length;
  let num=0,den=0; xs.forEach((x,i)=>{ num+=(x-mx)*(ys[i]-my); den+=(x-mx)*(x-mx); });
  return den?num/den:0;
}
function trendLabel(sl){
  if(sl<0.15) return {label:'O(1)',rank:0};
  if(sl<0.45) return {label:'O(log n)',rank:1};
  if(sl<1.2) return {label:'O(n)',rank:2};
  if(sl<1.5) return {label:'O(n log n)',rank:3};
  if(sl<2.5) return {label:'O(n²)',rank:4};
  if(sl<3.5) return {label:'O(n³)',rank:6};
  return {label:'exponential or worse',rank:100};
}
function maybeProfile(q,mode){
  const a=R.analysis;
  if(!a||mode!=='test'||isReact(q)||!q.gen||!Array.isArray(q.sizes)) return;
  const allPass=a.tests&&a.tests.total>0&&a.tests.passed===a.tests.total;
  if(!allPass){ a.measured={skipped:true}; renderAnalysis(); return; }
  a.measured={pending:true}; R.running='profile'; R.status='Measuring how the speed scales…';
  renderResults();
  let w,url,timer,ended=false;
  const finish=res=>{
    if(ended) return; ended=true; clearTimeout(timer);
    try{ w.terminate(); }catch(e){} try{ URL.revokeObjectURL(url); }catch(e){}
    if(R.analysis!==a) return;
    a.measured=res; R.running=null; R.stop=null;
    R.status=R.status.startsWith('Measuring')?`All tests passed`:R.status;
    renderResults();
  };
  try{ url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})); w=new Worker(url); }
  catch(e){ a.measured={error:'Could not start the measurement worker.'}; R.running=null; renderResults(); return; }
  timer=setTimeout(()=>finish({error:'Measuring took too long (over 12 s), so it was stopped. The code is probably slow for large inputs.'}),12000);
  w.onmessage=e=>{
    const m=e.data;
    if(m.t==='profile'){
      const pts=m.points;
      if(pts.length<2) return finish({error:'The code was too slow to measure at larger sizes.'});
      const sl=slopeOf(pts); const tr=trendLabel(sl);
      finish({points:pts,slope:sl,label:tr.label,rank:tr.rank,cut:pts.length<q.sizes.length});
    }else if(m.t==='fatal') finish({error:'Could not measure: '+m.message});
  };
  w.onerror=e=>{ e.preventDefault&&e.preventDefault(); finish({error:'The measurement crashed: '+(e.message||'unknown error')}); };
  w.postMessage({mode:'profile',code:getCode(q),fn:q.fn,gen:q.gen,sizes:q.sizes,tests:[]});
  R.stop=()=>finish({error:'Stopped.'});
}

function fmtMs(x){ return x<0.01?'<0.01 ms':x<1?x.toFixed(2)+' ms':x<100?x.toFixed(1)+' ms':Math.round(x)+' ms'; }
function verdictOf(rank,ref){
  if(ref==null||rank==null) return null;
  return rank<ref?'better':rank===ref?'same':'worse';
}
function renderAnalysis(){
  const el=$('#panel-analysis'), q=cur(), a=R.analysis;
  if(!a){
    el.innerHTML=`<div class="placeholder"><div><strong>Analysis appears here</strong>Press <b>Run</b> or <b>Run tests</b> to see ${isReact(q)?'code checks and how your tests performed':'the time and space complexity of your code, how it scales, and tips'}.</div></div>`;
    return;
  }
  const st=a.stat, t=a.tests;
  let html='<div class="an">';
  /* verdict */
  if(a.mode==='test'&&t){
    const all=t.total>0&&t.passed===t.total;
    html+=`<div class="an-verdict ${all?'ok':'bad'}">${ic(all?'check':'x',18)}<div><strong>${all?'Correct: all '+t.total+' tests passed':`${t.passed} of ${t.total} tests passed`}</strong><span>${all?'Now let\'s look at how efficient your solution is.':'Fix the failing tests first, then come back for the efficiency analysis. The complexity below is already an estimate of your current code.'}</span></div></div>`;
  }else{
    html+=`<div class="an-verdict">${ic('flask',18)}<div><strong>Quick analysis</strong><span>Press <b>Run tests</b> to also check correctness and measure how your code scales.</span></div></div>`;
  }
  if(!st){ html+='<p class="small-note">The code could not be analyzed.</p></div>'; el.innerHTML=html; return; }

  if(!a.react){
    const tr=rankOf(q.time), sr=rankOf(q.space);
    const tv=verdictOf(st.time.rank,tr), sv=verdictOf(st.space.rank,sr);
    const badge=(v,ref)=>v==='worse'?`<span class="pill hard">Above the reference</span>`:v==='better'?`<span class="pill easy">Better than the reference</span>`:v==='same'?`<span class="pill easy">Matches the reference</span>`:'';
    html+=`<div class="an-tiles">
      <div class="tile"><div class="tile-l">Time complexity</div><div class="tile-v">${esc(st.time.label)}</div><div class="tile-s">estimated from your code ${badge(tv)}${q.time?`<span>Reference: ${esc(q.time)}</span>`:''}</div></div>
      <div class="tile"><div class="tile-l">Space complexity</div><div class="tile-v">${esc(st.space.label)}</div><div class="tile-s">estimated from your code ${badge(sv)}${q.space?`<span>Reference: ${esc(q.space)}</span>`:''}</div></div></div>`;
    html+=`<div class="an-sec"><h4>Why we estimate this</h4><ul>${st.time.reasons.map(r=>`<li><b>Time:</b> ${escCode(r)}</li>`).join('')}${st.space.reasons.map(r=>`<li><b>Space:</b> ${escCode(r)}</li>`).join('')}</ul>
      <p class="small-note" style="margin-top:8px">n means the size of the input. Space counts the extra memory your code allocates, including the value it returns.</p></div>`;
    if(tv==='worse'&&q.tip) html+=`<div class="an-sec"><div class="hint-item warn">${ic('flask',15)}<span><b>How to improve:</b> ${escCode(q.tip)}</span></div></div>`;
    /* measured */
    const ms=a.measured;
    if(q.gen){
      html+=`<div class="an-sec"><h4>Measured scaling</h4>`;
      if(!ms) html+=`<p class="lead">Run the tests and pass them all to unlock this. We call your function with bigger and bigger inputs and time it.</p>`;
      else if(ms.pending) html+=`<p class="lead"><span class="spinner"></span> Timing your function with inputs of growing size…</p>`;
      else if(ms.skipped) html+=`<p class="lead">Pass all the tests to unlock this. Timing only makes sense for correct code.</p>`;
      else if(ms.error) html+=`<p class="lead" style="color:var(--bad)">${esc(ms.error)}</p>`;
      else{
        const mx=Math.max(...ms.points.map(p=>p.ms));
        const agree=ms.rank===st.time.rank?'This agrees with the estimate above.':ms.rank>st.time.rank?'The measurement grows faster than the code estimate. Look for hidden work, such as a built-in call inside a loop.':'The measurement grows slower than the code estimate. That is fine, the estimate assumes the worst case.';
        html+=`<p class="lead">Time for one call as the input size n doubles. Measured trend: <b>${esc(ms.label)}</b> (growth exponent ${ms.slope.toFixed(2)}). ${agree}</p>`
          +ms.points.map(p=>`<div class="mrow"><code>n = ${p.n.toLocaleString()}</code><div class="mbar"><i style="width:${Math.max(2,p.ms/mx*100)}%"></i></div><em>${fmtMs(p.ms)}</em></div>`).join('')
          +`<p class="small-note" style="margin-top:6px">${ms.cut?'Stopped early because the code got slow. ':''}Timings vary a little between runs. Look at the trend, not exact numbers.</p>`;
      }
      html+='</div>';
    }
  }
  /* test performance */
  if(t&&t.ran){
    html+=`<div class="an-sec"><h4>Test performance</h4><div class="kvgrid"><div><b>${fmtMs(t.avg)}</b><span>average per test</span></div><div><b>${fmtMs(t.max)}</b><span>slowest test${t.slowest?' (case '+t.slowest+')':''}</span></div><div><b>${fmtMs(a.ms)}</b><span>total run time</span></div></div></div>`;
  }else if(a.mode==='run'){
    html+=`<div class="an-sec"><h4>Run time</h4><div class="kvgrid"><div><b>${fmtMs(a.ms)}</b><span>${a.react?'to render':'for this run'}</span></div></div></div>`;
  }
  /* code metrics */
  const m=st.metrics;
  html+=`<div class="an-sec"><h4>About your code</h4><div class="kvgrid">
    <div><b>${m.lines}</b><span>lines of code</span></div>`
    +(a.react?`<div><b>${m.components}</b><span>component${m.components===1?'':'s'}</span></div><div><b>${m.jsx}</b><span>JSX elements</span></div><div><b>${m.hooks.length?esc(m.hooks.join(', ')):'none'}</b><span>hooks used</span></div>`
      :`<div><b>${m.loops}</b><span>loop${m.loops===1?'':'s'}</span></div><div><b>${m.callbacks}</b><span>array callback${m.callbacks===1?'':'s'} (map, filter…)</span></div><div><b>${m.maxDepth}</b><span>deepest loop nesting</span></div><div><b>${m.recursive?'yes':'no'}</b><span>uses recursion</span></div><div><b>${m.structs.length?esc(m.structs.join(', ')):'none'}</b><span>data structures</span></div>`)
    +`</div></div>`;
  /* hints */
  html+=`<div class="an-sec"><h4>Tips</h4>`+(st.hints.length?st.hints.map(h=>`<div class="hint-item ${h.w?'warn':''}">${ic('flask',15)}<span>${escCode(h.text)}</span></div>`).join(''):`<div class="hint-item">${ic('check',15)}<span>No common issues found. Nice and clean.</span></div>`)+'</div>';
  html+=`<p class="small-note">Complexity is estimated by reading the structure of your code (loops, recursion, built-in calls), so treat it as a guide, not a proof.</p></div>`;
  el.innerHTML=html;
}
const escCode=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');

async function showAnswer(){
  const q=cur(); if(!q.solution) return;
  if(S.status[q.id]!=='pass'){
    const ok=await confirmDialog('Show the answer?','Try a little longer first. Getting stuck is how you learn. If you are ready, open the reference solution and compare it with yours.','Show answer');
    if(!ok) return;
  }
  const meta=[q.time&&`<span class="pill">Time ${esc(q.time)}</span>`,q.space&&`<span class="pill">Space ${esc(q.space)}</span>`].filter(Boolean).join('');

function modal(html,{narrow=false}={}){
  const ov=document.createElement('div'); ov.className='overlay';
  ov.innerHTML=`<div class="dialog${narrow?' narrow':''}" role="dialog" aria-modal="true">${html}</div>`;
  const prev=document.activeElement;
  const close=()=>{ ov.remove(); document.removeEventListener('keydown',onKey,true); if(prev&&prev.focus) prev.focus(); };
  const onKey=e=>{ if(e.key==='Escape'){ e.stopPropagation(); close(); } };
  document.addEventListener('keydown',onKey,true);
  ov.addEventListener('mousedown',e=>{ if(e.target===ov) close(); });
  ov.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) close(); });
  $('#modal-root').appendChild(ov);
  const first=$('input,textarea,select,button.btn.primary',ov); if(first) first.focus();
  return {el:ov,close};
}
const modalOpen=()=>!!$('#modal-root .overlay');
function confirmDialog(title,message,okLabel='Delete'){
  return new Promise(res=>{
    const m=modal(`<div class="dialog-h"><h2>${esc(title)}</h2></div><div class="dialog-b"><p style="margin:0">${esc(message)}</p></div>
      <div class="dialog-f"><button class="btn" data-close>Cancel</button><button class="btn primary" id="ok-btn">${esc(okLabel)}</button></div>`,{narrow:true});
    let done=false;
    $('#ok-btn',m.el).addEventListener('click',()=>{ done=true; m.close(); res(true); });
    const obs=new MutationObserver(()=>{ if(!document.body.contains(m.el)){ obs.disconnect(); if(!done) res(false); } });
    obs.observe($('#modal-root'),{childList:true});
  });
}

/* --- question validation (shared by the form and JSON import) --- */
const IDENT=/^[A-Za-z_$][\w$]*$/;
function defaultStarter(type,name){
  return type==='react'
    ?`function ${name}() {\n  return (\n    <div>\n      {/* your component */}\n    </div>\n  );\n}\n`
    :`function ${name}(/* args */) {\n  // your code here\n}\n`;
}
function normalizeQuestion(o){
  const errs=[];
  if(!o||typeof o!=='object'||Array.isArray(o)) return {errs:['Each question must be a JSON object.']};
  const type=o.type==='react'?'react':'js';
  const title=String(o.title||'').trim();
  if(!title) errs.push('Title is required.');
  else if(title.length>80) errs.push('Title must be 80 characters or fewer.');
  const dm={easy:'Easy',medium:'Medium',hard:'Hard'};
  const difficulty=dm[String(o.difficulty||'easy').toLowerCase()];
  if(!difficulty) errs.push('Difficulty must be Easy, Medium or Hard.');
  const name=String((type==='react'?(o.componentName||o.fn||o.functionName):(o.functionName||o.fn||o.componentName))||'').trim();
  const label=type==='react'?'Component name':'Function name';
  if(!name) errs.push(label+' is required.');
  else if(!IDENT.test(name)) errs.push(label+' must be a valid identifier (letters, digits, _ or $).');
  else if(type==='react'&&!/^[A-Z]/.test(name)) errs.push('Component name must start with a capital letter.');
  const tests=[];
  const list=Array.isArray(o.tests)?o.tests:[];
  if(o.tests!==undefined&&!Array.isArray(o.tests)) errs.push('"tests" must be an array.');
  list.forEach((t,i)=>{
    const n='Test '+(i+1)+': ';
    if(!t||typeof t!=='object'){ errs.push(n+'must be an object.'); return; }
    if(type==='react'){
      const script=String(t.script||'').trim();
      if(!script){ errs.push(n+'script is required.'); return; }
      try{ new Function('return async function(screen,fireEvent,userType,waitFor,expect,container,React){'+script+'\n}'); }
      catch(e){ errs.push(n+'script has a syntax error ('+e.message+').'); return; }
      tests.push({name:String(t.name||'Test '+(i+1)).trim(),script:t.script});
    }else{
      if(!Array.isArray(t.input)){ errs.push(n+'input must be an array of arguments, e.g. [[1,2], 3].'); return; }
      if(!('expected' in t)){ errs.push(n+'expected is required.'); return; }
      tests.push({input:JSON.stringify(t.input),expected:JSON.stringify(t.expected)});
    }
  });
  const solution=o.solution===undefined?'':String(o.solution);
  if(solution.trim()&&type==='js'){ try{ new Function(solution); }catch(e){ errs.push('Solution has a syntax error ('+e.message+').'); } }
  const examples=[];
  if(o.examples!==undefined&&!Array.isArray(o.examples)) errs.push('"examples" must be an array.');
  (Array.isArray(o.examples)?o.examples:[]).forEach((x,i)=>{
    if(!x||typeof x!=='object'||x.input===undefined||x.output===undefined){ errs.push('Example '+(i+1)+': needs "input" and "output".'); return; }
    const str=v=>typeof v==='string'?v:JSON.stringify(v);
    examples.push({input:str(x.input),output:str(x.output),note:String(x.note||x.explanation||'')});
  });
  if(errs.length) return {errs};
  return {errs,q:{
    id:'custom-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    custom:true,type,title,difficulty,fn:name,
    description:String(o.description||''),
    examples,
    solution:solution.trim()?solution:'',
    explanation:String(o.explanation||''),
    time:String(o.timeComplexity||o.time||'').trim(),
    space:String(o.spaceComplexity||o.space||'').trim(),
    starter:String(o.starterCode||o.starter||'').trim()?String(o.starterCode||o.starter):defaultStarter(type,name),
    tests
  }};
}
function addQuestions(objs){
  const errs=[], made=[];
  objs.forEach((o,i)=>{
    const r=normalizeQuestion(o);
    r.errs.forEach(e=>errs.push(objs.length>1?`Question ${i+1}: ${e}`:e));
    if(r.q) made.push(r.q);
  });
  if(errs.length) return {errs};
  S.custom.push(...made); save();
  filters={q:'',type:'',diff:''}; $('#search').value=''; $('#f-type').value=''; $('#f-diff').value='';
  selectQuestion(made[made.length-1].id);
  return {errs:[],count:made.length};
}

function onTestInput(e){
  const t=e.target, card=t.closest('.tcase'); if(!card||!t.dataset.k) return;
  const q=cur(), i=+card.dataset.i, tests=ownTests(q);
  tests[i][t.dataset.k]=t.value; save();
  if(t.classList.contains('autosize')) autosize(t);
  if(t.dataset.k==='input'||t.dataset.k==='expected') checkField(t);
  if(R.results[i]&&!R.running){
    delete R.results[i];
    card.classList.remove('pass','fail','running');
    $('.tbadge',card)&&$('.tbadge',card).remove();
    $('.tres',card).innerHTML='';
  }
}
async function onTestsClick(e){
  const b=e.target.closest('[data-act]'); if(!b) return;
  const q=cur(), act=b.dataset.act;
  if(act==='view-analysis') return setTab('analysis');
  if(R.running) return toast('Wait for the current run to finish (or press Stop).',true);
  if(act==='add-test'){
    ownTests(q).push(isReact(q)?{name:'New test',script:"// screen, fireEvent, userType, waitFor and expect are available\n"}:{input:'',expected:''});
    save(); renderTests();
    const cards=$$('.tcase',$('#panel-tests')); const last=cards[cards.length-1];
    if(last){ last.scrollIntoView({block:'nearest'}); const f=$('textarea',last); if(f) f.focus(); }
  }else if(act==='del-test'){
    const i=+b.closest('.tcase').dataset.i;
    ownTests(q).splice(i,1); R.results={}; save(); renderTests();
  }else if(act==='reset-tests'){
    if(await confirmDialog('Restore original tests?','Your edits to this question\'s test cases will be discarded.','Restore')){
      delete S.tests[q.id]; R.results={}; save(); renderTests();
    }
  }
}

   Export
   ========================================================================== */
function exportQuestions(){
  if(!S.custom.length) return toast('You have not added any questions yet.',true);
  const questions=S.custom.map(q=>{
    const tests=getTests(q).map(t=>{
      if(isReact(q)) return {name:t.name,script:t.script};
      try{ return {input:JSON.parse(t.input),expected:JSON.parse(t.expected)}; }catch(e){ return null; }
    }).filter(Boolean);
    return {type:q.type,title:q.title,difficulty:q.difficulty,description:q.description,examples:q.examples||[],solution:q.solution||'',explanation:q.explanation||'',timeComplexity:q.time||'',spaceComplexity:q.space||'',[isReact(q)?'componentName':'functionName']:q.fn,starterCode:q.starter,tests};
  });
  const blob=new Blob([JSON.stringify({version:1,questions},null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='code-playground-questions.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast(`Exported ${questions.length} question${questions.length>1?'s':''}`);
}

    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!modalOpen()){ e.preventDefault(); startRun(e.shiftKey?'test':'run'); }
  });

  const ws=$('#workspace'), sp=$('#splitter');
  sp.addEventListener('pointerdown',e=>{
    e.preventDefault(); sp.setPointerCapture(e.pointerId);
    const rect=ws.getBoundingClientRect();
    const move=ev=>{ ws.style.setProperty('--editor-h',Math.min(Math.max(ev.clientY-rect.top-5,150),rect.height-160)+'px'); };
    const up=()=>{ sp.removeEventListener('pointermove',move); sp.removeEventListener('pointerup',up); sp.removeEventListener('pointercancel',up); };
    sp.addEventListener('pointermove',move); sp.addEventListener('pointerup',up); sp.addEventListener('pointercancel',up);
  });
  sp.addEventListener('keydown',e=>{
    if(e.key!=='ArrowUp'&&e.key!=='ArrowDown') return;
    e.preventDefault();
    const top=ws.firstElementChild.getBoundingClientRect().height+(e.key==='ArrowUp'?-24:24);
    ws.style.setProperty('--editor-h',Math.min(Math.max(top,150),ws.getBoundingClientRect().height-160)+'px');
  });

  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(!S.theme) applyTheme(); });
  window.addEventListener('resize',()=>$$('#panel-tests .autosize').forEach(autosize));
  selectQuestion(S.current);
}
init();
</script>
<script src="levelup-nav.js"></script>
</body>
</html>
